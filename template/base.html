      <span aria-hidden="true">←</span>

    <button class="brand" id="brand">

<main id="conteudo">

    <div class="wrap">

      <div class="stats" id="stats"></div>

      <div class="busca-wrap">

      </div>
    </div>
  </section>

  <!-- ============ MATÉRIA ============ -->

    <div class="wrap">
      <div class="mat-head">

      </div>
      <nav class="tabs" id="m-tabs" aria-label="Seções da matéria"></nav>
      <div class="pane" id="pane-resumo"></div>
      <div class="pane" id="pane-cards"></div>
      <div class="pane" id="pane-quiz"></div>
      <div class="pane" id="pane-simulado"></div>
      <div class="pane" id="pane-disc"></div>
      <div class="pane" id="pane-colas"></div>
      <div class="pane" id="pane-material"></div>
    </div>
  </section>
