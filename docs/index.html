ontexto; escuta ativa<\/li><li><b>Influência<\/b> — compartilhar poder, liderar pelo exemplo, explicar decisões, manter estilo flexível para obter cooperação<\/li><li><b>Processo decisório<\/b> — resolver problemas, avaliar alternativas, planejar ações e analisar resultados<\/li><li><b>Negociação<\/b>, <b>coaching<\/b>, <b>construção de confiança<\/b>, <b>gestão de conflitos<\/b> e <b>conhecimento político e cultural<\/b><\/li><\/ul><p><b>Atenção:<\/b> programação de sistemas, domínio de ferramentas de gestão e conhecimento técnico <b>não<\/b> são habilidades interpessoais — são hard skills.<\/p><p><b>As cinco etapas do processo decisório:<\/b><\/p><ol><li><b>Definição do problema<\/b> — explorar, esclarecer e definir com precisão<\/li><li><b>Criação da solução<\/b> — prolongar a geração de ideias (brainstorming), evitando decisões prematuras<\/li><li><b>Ideias para ação<\/b> — definir critérios de avaliação, pesar prós e contras e escolher a melhor solução<\/li><li><b>Planejamento da ação<\/b> — envolver os participantes para ganhar aceitação e compromisso<\/li><li><b>Avaliação do resultado<\/b> — analisar o que aconteceu e registrar lições aprendidas<\/li><\/ol><p><b>Fatores que afetam o estilo de decisão:<\/b> tempo disponível, qualidade exigida, confiança da equipe e aceitação necessária.<\/p>"},{"tema":"Liderança em Contextos Organizacionais","html":"<p><b>Liderança<\/b> em projetos é concentrar os esforços de um grupo na direção de um objetivo comum, habilitando a equipe a trabalhar de forma colaborativa e executando por meio de outros — não fazendo tudo sozinho nem apenas delegando sem acompanhar.<\/p><p><b>As três dimensões de competência do gerente de projetos eficaz:<\/b><\/p><ul><li><b>Técnicas<\/b> — conhecimentos específicos do domínio do projeto<\/li><li><b>Interpessoais<\/b> — comunicação, motivação, negociação, liderança<\/li><li><b>Conceituais<\/b> — visão estratégica, análise de situações, visão do todo<\/li><\/ul><p>O gerente eficaz <b>equilibra as três<\/b>. Só a técnica não sustenta um projeto; só a interpessoal não resolve os problemas do domínio.<\/p><p><b>Desenvolvimento de equipe<\/b> envolve: estabelecer objetivos claros, definir e negociar papéis e responsabilidades, obter apoio da alta administração, oferecer recompensas e reconhecimento, e construir confiança e comunicação aberta.<\/p><p><b>Estilos de liderança:<\/b><\/p><ul><li><b>Autoritária / autocrática<\/b> — o líder decide sozinho e comunica. Rápida, útil em crise, mas desmotiva no longo prazo.<\/li><li><b>Democrática / participativa<\/b> — decide com a equipe. Mais lenta, gera comprometimento e melhores decisões.<\/li><li><b>Liberal / laissez-faire<\/b> — delega amplamente e intervém pouco. Funciona com equipes maduras; vira omissão com equipes inexperientes.<\/li><li><b>Situacional<\/b> — adapta o estilo ao nível de <b>maturidade e competência<\/b> de cada liderado para cada tarefa. Não existe estilo certo universal.<\/li><\/ul><p><b>Liderança carismática<\/b> (Alexandre Dorna) — baseada na força pessoal, na visão e na capacidade de mobilizar emocionalmente. Poderosa, mas dependente da presença do líder. <b>Liderança autêntica<\/b> — apoiada em autoconhecimento, transparência relacional, processamento equilibrado da informação e perspectiva moral internalizada; é a construção contemporânea mais estudada.<\/p><p><b>Influência<\/b> significa compartilhar poder e estimular a cooperação para atingir objetivos — liderar pelo exemplo e explicar as decisões, e não impor regras sem explicação.<\/p><p><b>Inteligência emocional<\/b> (Daniel Goleman) — autoconsciência, autorregulação, motivação, <b>empatia<\/b> e habilidades sociais. É o que permite ao líder perceber o clima da equipe e ajustar sua atuação antes que o conflito escale.<\/p>"},{"tema":"Ética Profissional e Data Storytelling","html":"<p><b>Ética do profissional de informática:<\/b> a área lida com dados sensíveis, sistemas críticos e assimetria de conhecimento em relação ao usuário — o que amplia a responsabilidade.<\/p><p><b>Princípios centrais:<\/b> privacidade e proteção de dados (LGPD), confidencialidade, integridade profissional, honestidade sobre limites e riscos técnicos, respeito à propriedade intelectual, não causar dano, transparência sobre o funcionamento dos sistemas e responsabilidade social pelo impacto do que se constrói.<\/p><p><b>Dilemas típicos:<\/b> usar dados coletados para uma finalidade em outra; entregar um sistema sabidamente inseguro por pressão de prazo; ocultar uma vulnerabilidade descoberta; desenvolver algoritmos que reproduzem vieses discriminatórios; monitorar usuários além do necessário.<\/p><p><b>Ética empresarial<\/b> vai além do cumprimento da lei: envolve códigos de conduta, canais de denúncia, governança, compliance e a coerência entre o discurso e a prática da organização.<\/p><p><b>Data Storytelling<\/b> — a arte de comunicar dados por meio de uma narrativa, para que a informação seja compreendida e gere ação. Combina <b>três elementos<\/b>:<\/p><ul><li><b>Dados<\/b> — a base analítica confiável<\/li><li><b>Visualização<\/b> — gráficos e recursos visuais que revelam o padrão<\/li><li><b>Narrativa<\/b> — o fio condutor que dá contexto, explica o porquê e leva a uma conclusão<\/li><\/ul><p><b>Por que importa:<\/b> dados sozinhos não convencem nem são lembrados; a narrativa é o que dá sentido e memória à informação. Um bom data storytelling tem <b>público definido<\/b>, uma <b>mensagem central<\/b> clara, contexto (com o que se compara?), o gráfico adequado ao tipo de dado e uma <b>chamada à ação<\/b>.<\/p><p><b>Erros comuns:<\/b> excesso de informação na mesma tela, gráfico inadequado ao dado, escalas distorcidas que exageram diferenças, ausência de contexto e conclusões que os dados não sustentam.<\/p>"}],"flashcards":[{"tema":"Semiótica: Linguagem Verbal e Não Verbal","p":"O que estuda a Semiótica?","r":"É a ciência dos signos e dos sistemas de comunicação: estuda a linguagem verbal e a não verbal, sendo a base para compreender a comunicação humana. A Linguística, por sua vez, ocupa-se especificamente da linguagem verbal."},{"tema":"Semiótica: Linguagem Verbal e Não Verbal","p":"Qual a principal diferença entre linguagem verbal e não verbal?","r":"A verbal utiliza palavras; a não verbal não utiliza palavras, comunicando por signos visuais, gestuais e corporais."},{"tema":"Semiótica: Linguagem Verbal e Não Verbal","p":"Segundo Saussure, de que é composto o signo linguístico?","r":"De significante (a forma, a imagem acústica) e significado (o conceito). A relação entre os dois é arbitrária."},{"tema":"Semiótica: Linguagem Verbal e Não Verbal","p":"Quais são os três tipos de signo na tricotomia de Peirce?","r":"Ícone (semelhança com o objeto — uma foto), índice (relação de causa e efeito ou contiguidade — fumaça indica fogo) e símbolo (convenção arbitrária — a bandeira, a palavra)."},{"tema":"Semiótica: Linguagem Verbal e Não Verbal","p":"O que caracteriza a Libras?","r":"É uma linguagem gestual normativa, com sinais e gramática própria — uma língua completa, e não mímica ou um sistema de símbolos inventados."},{"tema":"Semiótica: Linguagem Verbal e Não Verbal","p":"O que são onomatopeias?","r":"Palavras que imitam sons — tic-tac, buáá, plim. Fazem parte da linguagem verbal escrita ou falada."},{"tema":"Semiótica: Linguagem Verbal e Não Verbal","p":"O que é linguagem sincrética?","r":"A que mistura linguagem verbal e não verbal no mesmo enunciado. O cinema é o exemplo clássico, combinando imagem, som, música, diálogo e texto; quadrinhos e publicidade também."},{"tema":"Semiótica: Linguagem Verbal e Não Verbal","p":"Qual invenção contribuiu para a popularização da escrita e a disseminação da informação?","r":"A imprensa de Gutenberg, com os tipos móveis, que tornou possível reproduzir textos em massa."},{"tema":"Semiótica: Linguagem Verbal e Não Verbal","p":"Segundo Dondis, qual o princípio básico da linguagem visual?","r":"A percepção ocorre primeiro globalmente e depois nas partes — capta-se o todo antes de decompor nos detalhes."},{"tema":"Semiótica: Linguagem Verbal e Não Verbal","p":"Cite exemplos de linguagens digitais e o que elas combinam.","r":"Emojis (ícones com significado), hipertextos (escrita não linear, com links) e redes sociais, que combinam elementos verbais e não verbais no mesmo espaço."},{"tema":"Comunicação Interpessoal","p":"O que é comunicação interpessoal?","r":"A troca de informações entre duas ou mais pessoas, com interação e feedback. Mensagem enviada sem resposta ou palestra unidirecional não configuram comunicação interpessoal."},{"tema":"Comunicação Interpessoal","p":"Quais são os fundamentos da comunicação interpessoal?","r":"Clareza (mensagem sem ambiguidades), escuta ativa (atenção, compreensão e interpretação), feedback (confirmação de entendimento) e contexto (ambiente, cultura e situação)."},{"tema":"Comunicação Interpessoal","p":"O que caracteriza a comunicação assertiva?","r":"Expressar pensamentos, sentimentos e necessidades de forma clara e respeitosa — sem a omissão da postura passiva nem a imposição da agressiva."},{"tema":"Comunicação Interpessoal","p":"Para que contribui a comunicação assertiva?","r":"Para a resolução de conflitos, a clareza de objetivos e o fortalecimento dos relacionamentos — e, em projetos, para o engajamento da equipe."},{"tema":"Comunicação Interpessoal","p":"O que significa diversidade linguística?","r":"Reconhecer e valorizar diferentes formas de expressão verbal e não verbal — variedades regionais, dialetos, gírias e registros. Não significa exigir apenas a norma padrão."},{"tema":"Comunicação Interpessoal","p":"Como a diversidade linguística influencia a comunicação em equipes?","r":"Permite compreender diferentes culturas, contextos e formas de expressão, impactando diretamente a compreensão mútua e a inclusão — especialmente em equipes multiculturais."},{"tema":"Comunicação Interpessoal","p":"Quais são os quatro componentes da Comunicação Não Violenta?","r":"Observação (descrever o fato sem julgamento), sentimento (nomear o que se sente), necessidade (identificar a necessidade por trás) e pedido (formular um pedido claro e realizável, não uma exigência)."},{"tema":"Comunicação Interpessoal","p":"Em que a comunicação não verbal pesa no ambiente de trabalho?","r":"Postura, contato visual, expressões faciais, tom de voz e uso do espaço comunicam muitas vezes mais que as palavras — e havendo contradição entre verbal e não verbal, as pessoas tendem a acreditar no não verbal."},{"tema":"Habilidades Interpessoais no PMBOK","p":"O que são habilidades interpessoais segundo o PMBOK?","r":"Características que facilitam o relacionamento entre pessoas para gerar resultados eficazes — as chamadas soft skills, aprendizados subjetivos ligados ao comportamento humano."},{"tema":"Habilidades Interpessoais no PMBOK","p":"Qual a diferença entre soft skills e hard skills?","r":"Soft skills são aprendizados subjetivos ligados ao comportamento humano (comunicação, liderança, empatia). Hard skills são competências técnicas mensuráveis (programação, uso de ferramentas, domínio de normas)."},{"tema":"Habilidades Interpessoais no PMBOK","p":"Cite as principais habilidades interpessoais listadas no PMBOK.","r":"Liderança, desenvolvimento de equipe, motivação, comunicação, influência, processo decisório, negociação, coaching, construção de confiança, gestão de conflitos e conhecimento político e cultural."},{"tema":"Habilidades Interpessoais no PMBOK","p":"O que caracteriza a liderança em projetos?","r":"Concentrar os esforços do grupo na direção de um objetivo comum, motivando e habilitando a equipe — executando por meio de outros, e não trabalhando sozinho nem delegando sem acompanhar."},{"tema":"Habilidades Interpessoais no PMBOK","p":"Qual a função principal do desenvolvimento de equipe?","r":"Ajudar o grupo a trabalhar junto: estabelecer objetivos, definir e negociar papéis e procedimentos, e promover a colaboração."},{"tema":"Habilidades Interpessoais no PMBOK","p":"De qual habilidade interpessoal o sucesso geral do projeto depende diretamente?","r":"Da motivação da equipe — é o comprometimento das pessoas que sustenta a entrega. Fatores valorizados: satisfação, desafios, realização, crescimento e compensação."},{"tema":"Habilidades Interpessoais no PMBOK","p":"A que o gerente deve estar atento para uma comunicação eficaz?","r":"A estilos de comunicação, questões culturais, relacionamentos, personalidades e contexto — não apenas às instruções escritas ou ao cronograma."},{"tema":"Habilidades Interpessoais no PMBOK","p":"Quais são as cinco etapas do processo decisório?","r":"Definição do problema, criação da solução, ideias para ação, planejamento da ação e avaliação do resultado."},{"tema":"Habilidades Interpessoais no PMBOK","p":"Quais fatores afetam o estilo de decisão em projetos?","r":"Tempo disponível, qualidade exigida, confiança da equipe e nível de aceitação necessário para a decisão."},{"tema":"Habilidades Interpessoais no PMBOK","p":"O que significa influência no contexto da liderança?","r":"Compartilhar poder e estimular a cooperação para atingir objetivos, liderando pelo exemplo e explicando as decisões — e não impondo regras sem explicação."},{"tema":"Liderança em Contextos Organizacionais","p":"Quais são as três dimensões de competência de um gerente de projetos eficaz?","r":"Técnicas (conhecimento do domínio), interpessoais (comunicação, motivação, negociação, liderança) e conceituais (visão estratégica e análise de situações) — equilibradas."},{"tema":"Liderança em Contextos Organizacionais","p":"O que envolve o desenvolvimento de equipe?","r":"Estabelecer objetivos claros, definir e negociar papéis e responsabilidades, obter apoio da alta administração, oferecer recompensas e reconhecimento, e construir confiança e comunicação aberta."},{"tema":"Liderança em Contextos Organizacionais","p":"Diferencie liderança autoritária, democrática e liberal.","r":"Autoritária: o líder decide sozinho — rápida, útil em crise, desmotiva no longo prazo. Democrática: decide com a equipe — mais lenta, gera comprometimento. Liberal (laissez-faire): delega amplamente — funciona com equipes maduras, vira omissão com inexperientes."},{"tema":"Liderança em Contextos Organizacionais","p":"O que caracteriza a liderança situacional?","r":"O líder adapta seu estilo ao nível de maturidade e competência de cada liderado para cada tarefa específica — não existe estilo certo universal."},{"tema":"Liderança em Contextos Organizacionais","p":"O que é liderança autêntica?","r":"A que se apoia em autoconhecimento, transparência relacional, processamento equilibrado da informação e perspectiva moral internalizada. É a construção contemporânea mais estudada na literatura de liderança."},{"tema":"Liderança em Contextos Organizacionais","p":"Quais são os componentes da inteligência emocional segundo Goleman?","r":"Autoconsciência, autorregulação, motivação, empatia e habilidades sociais. São eles que permitem ao líder perceber o clima da equipe e agir antes que o conflito escale."},{"tema":"Ética Profissional e Data Storytelling","p":"Por que a responsabilidade ética do profissional de informática é ampliada?","r":"Porque ele lida com dados sensíveis, sistemas críticos e uma forte assimetria de conhecimento em relação ao usuário — que não tem como avaliar sozinho os riscos do que usa."},{"tema":"Ética Profissional e Data Storytelling","p":"Cite dilemas éticos típicos da área de tecnologia.","r":"Usar dados coletados para uma finalidade em outra; entregar sistema sabidamente inseguro por pressão de prazo; ocultar vulnerabilidade descoberta; construir algoritmos que reproduzem vieses; monitorar usuários além do necessário."},{"tema":"Ética Profissional e Data Storytelling","p":"O que é Data Storytelling?","r":"A comunicação de dados por meio de uma narrativa, para que a informação seja compreendida e gere ação. Combina três elementos: dados, visualização e narrativa."},{"tema":"Ética Profissional e Data Storytelling","p":"Por que a narrativa é essencial no Data Storytelling?","r":"Porque dados sozinhos não convencem nem são lembrados. A narrativa dá contexto, explica o porquê, conduz a uma conclusão e torna a informação memorável."},{"tema":"Ética Profissional e Data Storytelling","p":"O que caracteriza um bom Data Storytelling?","r":"Público definido, uma mensagem central clara, contexto para comparação, o gráfico adequado ao tipo de dado e uma chamada à ação."},{"tema":"Ética Profissional e Data Storytelling","p":"Quais são os erros mais comuns em Data Storytelling?","r":"Excesso de informação na mesma tela, gráfico inadequado ao dado, escalas distorcidas que exageram diferenças, ausência de contexto e conclusões que os dados não sustentam."}],"questoes":[{"tema":"Semiótica: Linguagem Verbal e Não Verbal","q":"Qual é a principal diferença entre linguagem verbal e não verbal?","op":["A verbal utiliza palavras; a não verbal não utiliza palavras","A verbal é apenas oral; a não verbal é apenas escrita","A verbal não possui regras; a não verbal possui normas rígidas","A verbal é exclusiva da escrita; a não verbal é exclusiva da fala"],"r":0,"exp":"O critério é a presença ou ausência da palavra. A linguagem verbal tem duas formas — oral e escrita — e ambas usam palavras."},{"tema":"Semiótica: Linguagem Verbal e Não Verbal","q":"De acordo com Saussure, o signo linguístico é composto por:","op":["Significado e significante","Significado e referência","Significante e significação","Signo e símbolo"],"r":0,"exp":"Saussure define o signo como a união do significante (a forma, a imagem acústica) com o significado (o conceito), numa relação arbitrária."},{"tema":"Semiótica: Linguagem Verbal e Não Verbal","q":"A linguagem não verbal pode incluir todas as formas a seguir, EXCETO:","op":["Escrita textual","Expressões faciais","Gestos e mímicas","Linguagem visual (fotografia, pintura, cinema)"],"r":0,"exp":"A escrita textual utiliza palavras e é, portanto, linguagem VERBAL — na sua forma escrita. É a pegadinha clássica dessa questão."},{"tema":"Semiótica: Linguagem Verbal e Não Verbal","q":"O que caracteriza a Libras (Língua Brasileira de Sinais)?","op":["É uma linguagem visual sem regras","É uma linguagem gestual normativa, com sinais e gramática","É apenas uma forma de mímica para surdos","É um sistema de símbolos inventados"],"r":1,"exp":"Libras é uma língua completa, com léxico e gramática próprios — não é mímica nem transcrição gestual do português."},{"tema":"Semiótica: Linguagem Verbal e Não Verbal","q":"Qual invenção contribuiu para a popularização da escrita e a disseminação de informações?","op":["Computador","Telefone","Imprensa de Gutenberg","Cinema mudo"],"r":2,"exp":"Os tipos móveis de Gutenberg permitiram a reprodução em massa de textos, transformando o acesso à informação escrita."},{"tema":"Semiótica: Linguagem Verbal e Não Verbal","q":"O cinema mudo é considerado uma linguagem:","op":["Apenas verbal","Apenas visual","Exclusivamente oral","Sincrética (mistura de verbal e não verbal)"],"r":3,"exp":"Mesmo sem som, o cinema mudo combina imagem em movimento, expressão corporal e cartelas de texto — misturando verbal e não verbal."},{"tema":"Semiótica: Linguagem Verbal e Não Verbal","q":"Qual é o princípio básico da linguagem visual, segundo Dondis?","op":["Utiliza palavras para comunicar","Sempre segue uma sequência linear","A percepção ocorre primeiro globalmente e depois nas partes","Não tem função comunicativa"],"r":2,"exp":"O olhar capta primeiro o conjunto e só então decompõe nos elementos — por isso a composição geral pesa mais que o detalhe isolado."},{"tema":"Semiótica: Linguagem Verbal e Não Verbal","q":"O que são onomatopeias?","op":["Palavras que imitam sons","Símbolos não verbais","Ideogramas chineses","Elementos exclusivos da linguagem escrita"],"r":0,"exp":"Tic-tac, buáá, plim — são palavras que reproduzem sons, e integram a linguagem verbal."},{"tema":"Semiótica: Linguagem Verbal e Não Verbal","q":"Na tricotomia de Peirce, a fumaça que indica fogo é um exemplo de:","op":["Ícone","Índice","Símbolo","Significante"],"r":1,"exp":"O índice mantém relação de causa e efeito ou contiguidade com o objeto. O ícone se baseia em semelhança (foto); o símbolo, em convenção (bandeira)."},{"tema":"Comunicação Interpessoal","q":"O que é comunicação interpessoal?","op":["Comunicação apenas entre computadores","Troca de informações entre duas ou mais pessoas, com interação e feedback","Mensagens enviadas por e-mail sem resposta","Somente palestras e apresentações públicas"],"r":1,"exp":"A interação e o feedback são o que distinguem a comunicação interpessoal da transmissão unidirecional de mensagens."},{"tema":"Comunicação Interpessoal","q":"A comunicação assertiva é caracterizada por:","op":["Ignorar a opinião dos outros","Evitar conflitos a qualquer custo","Ser passivo diante de críticas","Expressar pensamentos, sentimentos e necessidades de forma clara e respeitosa"],"r":3,"exp":"A assertividade fica entre a passividade (que se cala) e a agressividade (que atropela): ela se posiciona com clareza sem desrespeitar o outro."},{"tema":"Comunicação Interpessoal","q":"Diversidade linguística significa:","op":["Reconhecer e valorizar diferentes formas de expressão verbal e não verbal","Usar somente a língua padrão","Traduzir textos técnicos automaticamente","Ensinar apenas uma forma de escrita correta"],"r":0,"exp":"Envolve variedades regionais, dialetos, gírias, registros e linguagem não verbal — o que impacta compreensão mútua e inclusão."},{"tema":"Comunicação Interpessoal","q":"Um dos fundamentos da comunicação interpessoal é:","op":["Monólogo constante do emissor","Uso exclusivo de linguagem escrita","Comunicação sem considerar o contexto","Feedback entre emissor e receptor"],"r":3,"exp":"Sem feedback não há confirmação de entendimento — e a comunicação permanece incompleta. Os demais fundamentos são clareza, escuta ativa e contexto."},{"tema":"Comunicação Interpessoal","q":"Quais habilidades fortalecem a comunicação interpessoal?","op":["Escuta ativa, empatia e clareza","Somente conhecimento técnico","Autoridade e imposição","Uso de jargões complexos"],"r":0,"exp":"Escuta ativa é atenção, compreensão e interpretação — não apenas esperar a vez de falar. Jargão e imposição, ao contrário, criam barreiras."},{"tema":"Comunicação Interpessoal","q":"A comunicação assertiva contribui para:","op":["Evitar responsabilidades","Manter silêncio em reuniões","Reduzir o trabalho em equipe","Resolução de conflitos, clareza de objetivos e fortalecimento de relacionamentos"],"r":3,"exp":"Ao permitir que divergências sejam explicitadas com respeito, a assertividade resolve o conflito em vez de deixá-lo apodrecer."},{"tema":"Comunicação Interpessoal","q":"Os quatro componentes da Comunicação Não Violenta são:","op":["Escuta, silêncio, resposta e acordo","Empatia, autoridade, clareza e firmeza","Observação, sentimento, necessidade e pedido","Emissor, receptor, mensagem e canal"],"r":2,"exp":"O modelo de Marshall Rosenberg: descrever o fato sem julgamento, nomear o sentimento, identificar a necessidade e formular um pedido claro — não uma exigência."},{"tema":"Habilidades Interpessoais no PMBOK","q":"O que são habilidades interpessoais no contexto do PMBOK?","op":["Competências técnicas específicas de cada área","Apenas o conhecimento sobre ferramentas de gestão","Habilidades relacionadas exclusivamente à liderança","Características que facilitam o relacionamento entre pessoas para gerar resultados eficazes"],"r":3,"exp":"São as soft skills. Elas não se restringem à liderança: incluem comunicação, negociação, motivação, gestão de conflitos e outras."},{"tema":"Habilidades Interpessoais no PMBOK","q":"Soft skills podem ser definidas como:","op":["Habilidades técnicas e operacionais","Aprendizados subjetivos relacionados ao comportamento humano","Regras formais de processos","Ferramentas de controle de projetos"],"r":1,"exp":"As técnicas e operacionais são as hard skills, mensuráveis e certificáveis. As soft skills são subjetivas e ligadas ao comportamento."},{"tema":"Habilidades Interpessoais no PMBOK","q":"Qual destas NÃO é considerada uma habilidade interpessoal essencial ao gerente de projetos segundo o PMBOK?","op":["Liderança","Comunicação","Programação de sistemas","Gerenciamento de conflitos"],"r":2,"exp":"Programação é hard skill — competência técnica. As demais são habilidades interpessoais listadas no PMBOK."},{"tema":"Habilidades Interpessoais no PMBOK","q":"O que caracteriza a liderança em projetos?","op":["Delegar tarefas sem acompanhar a equipe","Trabalhar sozinho para garantir a execução das atividades","Estabelecer regras rígidas sem flexibilidade","Concentrar os esforços do grupo na direção de um objetivo comum, motivando e habilitando a equipe"],"r":3,"exp":"Liderar é executar por meio de outros: dar direção, motivar e capacitar — nem fazer tudo sozinho, nem largar a equipe sem acompanhamento."},{"tema":"Habilidades Interpessoais no PMBOK","q":"Qual é a principal função do desenvolvimento de equipe?","op":["Organizar os documentos do projeto","Ajudar o grupo a trabalhar junto, estabelecendo objetivos e definindo papéis","Criar gráficos de controle","Focar apenas na execução individual das tarefas"],"r":1,"exp":"Desenvolvimento de equipe é sobre fazer o grupo funcionar como grupo: objetivos comuns, papéis negociados e procedimentos acordados."},{"tema":"Habilidades Interpessoais no PMBOK","q":"O sucesso geral de um projeto depende diretamente de qual habilidade interpessoal?","op":["Conhecimento técnico","Ferramentas de software","Motivação da equipe","Controle de custos"],"r":2,"exp":"É o comprometimento das pessoas que sustenta a entrega. Fatores valorizados pela equipe: satisfação, desafios, realização, crescimento e compensação."},{"tema":"Habilidades Interpessoais no PMBOK","q":"Para uma comunicação eficaz, o gerente de projeto deve estar atento a:","op":["Apenas às instruções escritas","Somente ao cronograma e aos prazos","Estilos de comunicação, questões culturais, relacionamentos, personalidades e contexto","Ferramentas de comunicação digitais"],"r":2,"exp":"A eficácia da comunicação depende de adequar a mensagem ao interlocutor e à situação — a ferramenta é apenas o canal."},{"tema":"Habilidades Interpessoais no PMBOK","q":"Quais são os fatores que afetam o estilo de decisão em projetos?","op":["Apenas recursos financeiros","Tempo, qualidade, confiança e aceitação","Apenas pressão da alta administração","Ferramentas técnicas de planejamento"],"r":1,"exp":"Uma decisão urgente admite estilo mais diretivo; uma que exige adesão da equipe pede participação. Confiança e qualidade exigida completam o quadro."},{"tema":"Habilidades Interpessoais no PMBOK","q":"Na etapa de criação da solução do processo decisório, o que se deve evitar?","op":["Envolver a equipe na geração de ideias","Tomar decisões prematuras antes de gerar alternativas suficientes","Utilizar brainstorming","Registrar todas as ideias levantadas"],"r":1,"exp":"A etapa existe justamente para prolongar a geração de alternativas. Decidir cedo demais fecha o leque antes que a melhor solução apareça."},{"tema":"Liderança em Contextos Organizacionais","q":"O que caracteriza um gerente de projetos eficaz?","op":["Ter conhecimento técnico apenas","Ser autoritário e centralizador","Delegar todas as decisões sem acompanhamento","Equilibrar habilidades técnicas, interpessoais e conceituais"],"r":3,"exp":"Só a técnica não sustenta um projeto, e só a habilidade interpessoal não resolve os problemas do domínio. As conceituais dão a visão do todo."},{"tema":"Liderança em Contextos Organizacionais","q":"A liderança em projetos envolve principalmente:","op":["Controle rígido de tarefas e prazos","Evitar o contato com a equipe","Concentração dos esforços de um grupo na direção de um objetivo comum","Comunicação apenas por relatórios"],"r":2,"exp":"Liderança é direção e mobilização, não controle. O controle é uma função de gestão, complementar mas distinta."},{"tema":"Liderança em Contextos Organizacionais","q":"O desenvolvimento da equipe envolve:","op":["Substituir membros que não entregam tarefas","Controlar rigidamente os horários de todos","Evitar interações com a liderança","Estabelecer objetivos, definir papéis e negociar procedimentos"],"r":3,"exp":"Inclui ainda apoio da alta administração, recompensas e reconhecimento, e a construção de confiança e comunicação aberta."},{"tema":"Liderança em Contextos Organizacionais","q":"O que significa influência do líder sobre a equipe?","op":["Compartilhar poder e estimular a cooperação para atingir objetivos","Imposição de regras sem explicação","Ignorar a opinião dos membros da equipe","Focar somente em resultados financeiros"],"r":0,"exp":"Influenciar é liderar pelo exemplo, explicar decisões e manter estilo flexível — o oposto de impor pela autoridade formal."},{"tema":"Liderança em Contextos Organizacionais","q":"O que caracteriza a liderança situacional?","op":["Manter sempre o mesmo estilo, por coerência","Decidir sempre por votação da equipe","Delegar integralmente e não acompanhar","Adaptar o estilo ao nível de maturidade e competência de cada liderado"],"r":3,"exp":"Com um liderado novato o líder é mais diretivo; com um experiente, mais delegador. Não existe estilo certo universal."},{"tema":"Liderança em Contextos Organizacionais","q":"Segundo Goleman, quais são os componentes da inteligência emocional?","op":["Planejamento, execução, controle, avaliação e encerramento","Técnica, tática, estratégia e operação","Autoconsciência, autorregulação, motivação, empatia e habilidades sociais","Autoridade, hierarquia, disciplina e ordem"],"r":2,"exp":"São eles que permitem ao líder perceber o próprio estado e o clima da equipe, ajustando sua atuação antes que o conflito escale."},{"tema":"Ética Profissional e Data Storytelling","q":"Por que a responsabilidade ética do profissional de informática é considerada ampliada?","op":["Porque a profissão é regulamentada por conselho próprio","Porque lida com dados sensíveis, sistemas críticos e assimetria de conhecimento em relação ao usuário","Porque os salários da área são mais altos","Porque a tecnologia muda rapidamente"],"r":1,"exp":"O usuário não tem como avaliar sozinho os riscos do sistema que usa — essa assimetria transfere ao profissional um dever maior de cuidado."},{"tema":"Ética Profissional e Data Storytelling","q":"Qual destas situações caracteriza um dilema ético na área de tecnologia?","op":["Escolher entre duas linguagens de programação","Optar por metodologia ágil em vez de cascata","Usar dados coletados para uma finalidade em outra, sem consentimento","Definir a arquitetura do banco de dados"],"r":2,"exp":"O desvio de finalidade viola o consentimento dado pelo titular e é vedado pela LGPD. As demais são decisões técnicas, não éticas."},{"tema":"Ética Profissional e Data Storytelling","q":"O Data Storytelling combina quais três elementos?","op":["Dados, visualização e narrativa","Estatística, matemática e programação","Coleta, armazenamento e processamento","Gráficos, tabelas e planilhas"],"r":0,"exp":"Dados dão a base analítica, a visualização revela o padrão e a narrativa dá contexto e conduz à conclusão. Faltando um dos três, a comunicação não convence."},{"tema":"Ética Profissional e Data Storytelling","q":"Por que a narrativa é considerada essencial na comunicação de dados?","op":["Porque substitui a necessidade de análise estatística","Porque dados sozinhos não convencem nem são lembrados — a narrativa dá sentido e memória","Porque torna a apresentação mais longa e detalhada","Porque elimina a necessidade de gráficos"],"r":1,"exp":"A narrativa fornece o contexto e o porquê, transformando números em uma conclusão acionável e memorável."},{"tema":"Ética Profissional e Data Storytelling","q":"Qual destes é um erro comum em Data Storytelling?","op":["Usar escalas distorcidas que exageram diferenças","Definir claramente o público-alvo","Incluir uma chamada à ação","Escolher o gráfico adequado ao tipo de dado"],"r":0,"exp":"Distorcer a escala induz a conclusões que os dados não sustentam — é uma falha técnica e também ética. Os demais itens são boas práticas."}],"discursivas":[{"tema":"Semiótica: Linguagem Verbal e Não Verbal","q":"Descreva a relação entre signos, linguagem verbal e não verbal, e explique como a Semiótica auxilia na compreensão da comunicação humana.","r":"O signo é a unidade básica de qualquer processo de significação: algo que está no lugar de outra coisa para alguém. Saussure descreveu o signo linguístico como a união de um significante — a forma, a imagem acústica ou visual — com um significado, o conceito evocado, numa relação arbitrária estabelecida por convenção social. Peirce ampliou essa noção para além da língua, propondo a tricotomia entre ícone, que significa por semelhança com o objeto, como uma fotografia; índice, que significa por relação de causa e efeito ou contiguidade, como a fumaça que indica fogo ou a pegada que indica quem passou; e símbolo, que significa por convenção arbitrária, como a bandeira, a palavra ou o sinal de trânsito. A linguagem verbal é o sistema de signos que utiliza palavras, manifestando-se na forma oral, apoiada na entonação e no ritmo, e na escrita, permanente e planejada. A linguagem não verbal comunica sem palavras, por signos gestuais, visuais e corporais — gestos, mímica, expressões faciais, Libras, fotografia, pintura, placas, mapas, dança e cinema mudo. As duas raramente aparecem isoladas: quando se combinam num mesmo enunciado, temos a linguagem sincrética, cujo exemplo mais completo é o cinema, que articula imagem, som, música, diálogo e texto. A Semiótica auxilia a compreender a comunicação humana justamente por não se limitar à palavra: enquanto a Linguística, surgida no século XX, estuda a linguagem verbal, a Semiótica oferece um instrumental para analisar signos em qualquer linguagem, permitindo entender por que uma imagem publicitária persuade, como um gesto contradiz uma fala, por que emojis funcionam como ícones no ambiente digital e como o hipertexto reorganiza a leitura de forma não linear. Ela dá, em suma, as ferramentas para ler criticamente todas as mensagens que nos cercam."},{"tema":"Comunicação Interpessoal","q":"Explique a diferença entre comunicação assertiva, passiva e agressiva, dando exemplos práticos em um ambiente profissional.","r":"Os três estilos se distinguem pela forma como a pessoa lida simultaneamente com os próprios direitos e com os do interlocutor. Na comunicação passiva, o indivíduo deixa de expressar o que pensa, sente ou necessita, geralmente para evitar conflito ou desagradar. Em uma reunião de projeto, seria o desenvolvedor que percebe que o prazo é inviável e mesmo assim concorda em silêncio; o resultado imediato é a preservação da harmonia aparente, mas o custo é o atraso descoberto tarde demais, o acúmulo de ressentimento e a percepção, pela equipe, de que aquela pessoa não tem opinião. Na comunicação agressiva, a pessoa se expressa impondo sua posição e desconsiderando o outro, muitas vezes com ironia, elevação de voz ou ataque pessoal. Seria o gerente que, diante do mesmo prazo, responde que quem não consegue entregar deveria procurar outra área; ele obtém obediência imediata, mas destrói a confiança, inibe futuras informações desconfortáveis e transforma um problema técnico em conflito interpessoal. Na comunicação assertiva, a pessoa expressa pensamentos, sentimentos e necessidades de forma clara e respeitosa, defendendo sua posição sem desqualificar a do outro. Seria o mesmo desenvolvedor dizendo que, com o escopo atual e a equipe disponível, avalia o prazo como inviável, apresentando a estimativa que sustenta essa avaliação e propondo duas alternativas: reduzir o escopo desta entrega ou estender a data em duas semanas. A assertividade é o único dos três estilos que contribui efetivamente para a resolução de conflitos, a clareza de objetivos e o fortalecimento dos relacionamentos, porque coloca o problema real na mesa em tempo de ser resolvido e preserva a relação para as próximas conversas."},{"tema":"Habilidades Interpessoais no PMBOK","q":"Explique a importância da inteligência emocional e da empatia no gerenciamento de projetos, e diferencie soft skills de hard skills.","r":"As hard skills são as competências técnicas e operacionais, objetivamente mensuráveis e geralmente certificáveis: programar em determinada linguagem, modelar um banco de dados, operar uma ferramenta de gestão, dominar uma norma. As soft skills são aprendizados subjetivos relacionados ao comportamento humano — comunicação, liderança, negociação, gestão de conflitos, empatia — e é justamente a elas que o PMBOK se refere ao tratar de habilidades interpessoais, definidas como características que facilitam o relacionamento entre pessoas para gerar resultados eficazes. A distinção importa porque um gerente de projetos eficaz não é aquele que domina apenas o lado técnico, mas o que equilibra três dimensões: técnicas, interpessoais e conceituais. A inteligência emocional, na formulação de Daniel Goleman, compreende autoconsciência, autorregulação, motivação, empatia e habilidades sociais, e é decisiva porque projetos são executados por meio de pessoas, sob pressão de prazo, custo e escopo. A autoconsciência permite ao gerente perceber quando sua própria ansiedade está contaminando a comunicação; a autorregulação evita que a pressão da alta administração seja simplesmente repassada à equipe como cobrança; a empatia permite reconhecer que a queda de produtividade de um membro pode ter causa que não aparece no relatório de status, e tratar a causa em vez do sintoma. Como o sucesso geral do projeto depende diretamente do comprometimento da equipe, e como os fatores mais valorizados pelas pessoas são satisfação, desafios, realização, crescimento e compensação, é a leitura emocional que permite ao líder acionar as alavancas certas com cada pessoa. Além disso, a empatia é o alicerce da escuta ativa e da comunicação assertiva, sem as quais conflitos que poderiam ser resolvidos na origem escalam até comprometer a entrega."}],"colas":[{"titulo":"Saussure x Peirce","mnemonico":"Mnemônico: SAUSSURE tem DOIS (significante + significado). PEIRCE tem TRÊS (ícone, índice, símbolo).","pontos":["Saussure (1857-1913): signo = SIGNIFICANTE (forma) + SIGNIFICADO (conceito).","Peirce (1839-1914): ÍCONE = semelhança (foto). ÍNDICE = causa/efeito (fumaça → fogo).","SÍMBOLO = convenção arbitrária (bandeira, palavra, sinal de trânsito).","Dondis: a percepção visual ocorre primeiro GLOBALMENTE e depois nas partes."]},{"titulo":"Verbal, não verbal e sincrética","mnemonico":"Mnemônico: verbal usa PALAVRA; não verbal NÃO usa; sincrética MISTURA as duas.","pontos":["Verbal: oral (fala, entonação) e escrita (letras, tipografia). Onomatopeia imita som.","Não verbal: gestual (Libras, mímica, expressão facial), visual (foto, placa, mapa), corporal (dança, cinema mudo).","PEGADINHA: escrita textual NÃO é linguagem não verbal.","Libras é língua gestual NORMATIVA, com sinais e GRAMÁTICA — não é mímica.","Sincrética: cinema, quadrinhos, publicidade. Gutenberg popularizou a escrita."]},{"titulo":"Os três estilos de comunicação","mnemonico":"Mnemônico: PASSIVA se cala, AGRESSIVA atropela, ASSERTIVA fala claro e com respeito.","pontos":["Assertiva: expressa pensamentos, sentimentos e necessidades de forma clara e RESPEITOSA.","Assertiva contribui para: resolução de conflitos, clareza de objetivos e relacionamentos fortes.","Fundamentos: clareza, ESCUTA ATIVA, FEEDBACK e contexto.","Sem feedback não há comunicação interpessoal — é monólogo.","CNV (Rosenberg): Observação → Sentimento → Necessidade → Pedido."]},{"titulo":"Soft skills x hard skills (PMBOK)","mnemonico":"Mnemônico: se dá para medir em certificado, é HARD. Se é sobre gente, é SOFT.","pontos":["Soft skills: aprendizados SUBJETIVOS ligados ao comportamento humano.","As do PMBOK: liderança, desenvolvimento de equipe, motivação, comunicação, influência, decisão, negociação, coaching, confiança, gestão de conflitos, conhecimento político e cultural.","PEGADINHA: programação de sistemas NÃO é habilidade interpessoal.","Sucesso do projeto depende diretamente da MOTIVAÇÃO/comprometimento da equipe."]},{"titulo":"Processo decisório em 5 etapas","mnemonico":"Mnemônico: Definir → Criar → Escolher → Planejar → Avaliar.","pontos":["1 Definição do problema: explorar, esclarecer, definir.","2 Criação da solução: brainstorming, EVITAR decisão prematura.","3 Ideias para ação: definir critérios, pesar prós e contras, escolher.","4 Planejamento da ação: envolver participantes para ganhar ACEITAÇÃO e COMPROMISSO.","5 Avaliação: analisar resultados e registrar lições aprendidas.","Fatores do estilo de decisão: tempo, qualidade, confiança e aceitação."]},{"titulo":"As 3 competências do gerente eficaz","mnemonico":"Mnemônico: TÉCNICA + INTERPESSOAL + CONCEITUAL, equilibradas. Só técnica não sustenta projeto.","pontos":["Técnicas: conhecimento do domínio. Interpessoais: comunicação, motivação, negociação.","Conceituais: visão estratégica e análise de situações.","Liderança situacional: adapta o estilo à MATURIDADE de cada liderado.","Influência: compartilhar poder e liderar pelo EXEMPLO — não impor sem explicar.","Goleman: autoconsciência, autorregulação, motivação, EMPATIA e habilidades sociais."]},{"titulo":"Data Storytelling","mnemonico":"Mnemônico: DADO + VISUALIZAÇÃO + NARRATIVA. Falta um dos três e não convence.","pontos":["Dados sozinhos não convencem nem são lembrados — a narrativa dá sentido e memória.","Bom storytelling: público definido, mensagem central, contexto, gráfico adequado e chamada à ação.","Erros: excesso de informação, gráfico errado, escala distorcida, conclusão sem lastro nos dados."]}]},{"id":"engenharia-de-requisitos","nome":"Engenharia de Requisitos","sigla":"ER","cor":"#2563eb","corTexto":"#5c8af0","corFundo":"#2563eb","periodo":2,"pasta":"Engenharia de Requisitos","arquivos":[{"nome":"#032 – A revolução da Validação de Sistemas Computadorizados - Qualicast","ext":"pdf","tam":"1.9 MB","href":"../Engenharia%20de%20Requisitos/%23032%20%E2%80%93%20A%20revolu%C3%A7%C3%A3o%20da%20Valida%C3%A7%C3%A3o%20de%20Sistemas%20Computadorizados%20-%20Qualicast.pdf"},{"nome":"5 ferramentas de automação de testes para projetos digitais _ TI INSIDE Online","ext":"pdf","tam":"163 KB","href":"../Engenharia%20de%20Requisitos/5%20ferramentas%20de%20automa%C3%A7%C3%A3o%20de%20testes%20para%20projetos%20digitais%20_%20TI%20INSIDE%20Online.pdf"},{"nome":"A carreira de teste de software é uma boa escolha_ – TALKING ABOUT TESTING","ext":"pdf","tam":"280 KB","href":"../Engenharia%20de%20Requisitos/A%20carreira%20de%20teste%20de%20software%20%C3%A9%20uma%20boa%20escolha_%20%E2%80%93%20TALKING%20ABOUT%20TESTING.pdf"},{"nome":"A importância do levantamento de requisitos no sucesso dos projetos de software","ext":"pdf","tam":"350 KB","href":"../Engenharia%20de%20Requisitos/A%20import%C3%A2ncia%20do%20levantamento%20de%20requisitos%20no%20sucesso%20dos%20projetos%20de%20software.pdf"},{"nome":"Certificações de Teste de Software, por que ter uma_ _ QualidadeBR","ext":"pdf","tam":"196 KB","href":"../Engenharia%20de%20Requisitos/Certifica%C3%A7%C3%B5es%20de%20Teste%20de%20Software%2C%20por%20que%20ter%20uma_%20_%20QualidadeBR.pdf"},{"nome":"Fórum Temático - Engenharia de Requisitos","ext":"pdf","tam":"167 KB","href":"../Engenharia%20de%20Requisitos/F%C3%B3rum%20Tem%C3%A1tico%20-%20Engenharia%20de%20Requisitos.pdf"},{"nome":"Gerenciar-cadastro-socios","ext":"docx","tam":"16 KB","href":"../Engenharia%20de%20Requisitos/Gerenciar-cadastro-socios.docx"},{"nome":"O que é e como criar a visão e a estratégia do produto_ - Gyaco","ext":"pdf","tam":"1.0 MB","href":"../Engenharia%20de%20Requisitos/O%20que%20%C3%A9%20e%20como%20criar%20a%20vis%C3%A3o%20e%20a%20estrat%C3%A9gia%20do%20produto_%20-%20Gyaco.pdf"},{"nome":"Pasta1","ext":"xlsx","tam":"17 KB","href":"../Engenharia%20de%20Requisitos/Pasta1.xlsx"},{"nome":"Requisitos Funcionais e Não Funcionais","ext":"docx","tam":"15 KB","href":"../Engenharia%20de%20Requisitos/Requisitos%20Funcionais%20e%20N%C3%A3o%20Funcionais.docx"},{"nome":"Topico 2 - UML - Diagrama de Casos de Uso","ext":"pdf","tam":"1.3 MB","href":"../Engenharia%20de%20Requisitos/Topico%202%20-%20UML%20-%20Diagrama%20de%20Casos%20de%20Uso.pdf"},{"nome":"a3","ext":"docx","tam":"22 KB","href":"../Engenharia%20de%20Requisitos/a3.docx"},{"nome":"analise-requisitos","ext":"pdf","tam":"1.1 MB","href":"../Engenharia%20de%20Requisitos/analise-requisitos.pdf"},{"nome":"casos-teste-requisitos-sistema","ext":"pdf","tam":"1.3 MB","href":"../Engenharia%20de%20Requisitos/casos-teste-requisitos-sistema.pdf"},{"nome":"diagrama-atividades","ext":"pdf","tam":"1.7 MB","href":"../Engenharia%20de%20Requisitos/diagrama-atividades.pdf"},{"nome":"diagrama-casos-de-uso","ext":"pdf","tam":"2.5 MB","href":"../Engenharia%20de%20Requisitos/diagrama-casos-de-uso.pdf"},{"nome":"documentar-visao-projeto","ext":"pdf","tam":"1.3 MB","href":"../Engenharia%20de%20Requisitos/documentar-visao-projeto.pdf"},{"nome":"especificação-caso-de-uso","ext":"pdf","tam":"1.8 MB","href":"../Engenharia%20de%20Requisitos/especifica%C3%A7%C3%A3o-caso-de-uso.pdf"},{"nome":"especificação-requisitos-funcionais-casos-de-uso","ext":"pdf","tam":"10.5 MB","href":"../Engenharia%20de%20Requisitos/especifica%C3%A7%C3%A3o-requisitos-funcionais-casos-de-uso.pdf"},{"nome":"especificação-requisitos","ext":"pdf","tam":"2.9 MB","href":"../Engenharia%20de%20Requisitos/especifica%C3%A7%C3%A3o-requisitos.pdf"},{"nome":"fundamentos-engenharia-requisitos","ext":"pdf","tam":"2.0 MB","href":"../Engenharia%20de%20Requisitos/fundamentos-engenharia-requisitos.pdf"},{"nome":"gerenciamento-requisitos","ext":"pdf","tam":"10.3 MB","href":"../Engenharia%20de%20Requisitos/gerenciamento-requisitos.pdf"},{"nome":"imagem_2025-11-20_102633343","ext":"pdf","tam":"36 KB","href":"../Engenharia%20de%20Requisitos/imagem_2025-11-20_102633343.pdf"},{"nome":"mapeamento-bpm","ext":"pdf","tam":"583 KB","href":"../Engenharia%20de%20Requisitos/mapeamento-bpm.pdf"},{"nome":"mapeamento-processos","ext":"pdf","tam":"16.4 MB","href":"../Engenharia%20de%20Requisitos/mapeamento-processos.pdf"},{"nome":"notacao-bpmn","ext":"pdf","tam":"495 KB","href":"../Engenharia%20de%20Requisitos/notacao-bpmn.pdf"},{"nome":"priozando-requisitos","ext":"pdf","tam":"1.9 MB","href":"../Engenharia%20de%20Requisitos/priozando-requisitos.pdf"},{"nome":"regras-de-negocio","ext":"pdf","tam":"1.9 MB","href":"../Engenharia%20de%20Requisitos/regras-de-negocio.pdf"},{"nome":"req-funcional-rnf_v01","ext":"pdf","tam":"205 KB","href":"../Engenharia%20de%20Requisitos/req-funcional-rnf_v01.pdf"},{"nome":"requisito-nao-funcional-projetos-ageis","ext":"pdf","tam":"5.2 MB","href":"../Engenharia%20de%20Requisitos/requisito-nao-funcional-projetos-ageis.pdf"},{"nome":"requisitos-funcionais","ext":"pdf","tam":"4.2 MB","href":"../Engenharia%20de%20Requisitos/requisitos-funcionais.pdf"},{"nome":"requisitos-nao-funcionais","ext":"pdf","tam":"10.4 MB","href":"../Engenharia%20de%20Requisitos/requisitos-nao-funcionais.pdf"},{"nome":"requisitos-software","ext":"pdf","tam":"1.7 MB","href":"../Engenharia%20de%20Requisitos/requisitos-software.pdf"},{"nome":"validação-requisitos","ext":"pdf","tam":"2.7 MB","href":"../Engenharia%20de%20Requisitos/valida%C3%A7%C3%A3o-requisitos.pdf"}],"links":[],"resumos":[{"tema":"Fundamentos da Engenharia de Requisitos","html":"<p><b>Requisito<\/b> é uma condição ou capacidade que o sistema deve possuir para satisfazer uma necessidade do usuário ou atender a um contrato, norma ou especificação.<\/p><p><b>Por que importa:<\/b> erros de requisito são os <b>mais caros<\/b> de todo o ciclo de vida. Corrigir na fase de requisitos custa 1; corrigir em produção custa de 50 a 100 vezes mais. A maioria dos fracassos de projeto de software tem origem em requisitos mal levantados, incompletos ou mal comunicados — não em falha técnica.<\/p><p><b>As 5 atividades da engenharia de requisitos:<\/b><\/p><ol><li><b>Elicitação / levantamento<\/b> — descobrir as necessidades junto às partes interessadas<\/li><li><b>Análise e negociação<\/b> — entender, classificar, resolver conflitos e priorizar<\/li><li><b>Especificação / documentação<\/b> — registrar de forma clara e verificável<\/li><li><b>Validação<\/b> — confirmar com o cliente que o que foi escrito é o que ele precisa<\/li><li><b>Gerenciamento<\/b> — controlar mudanças e rastreabilidade ao longo do projeto<\/li><\/ol><p><b>Técnicas de elicitação:<\/b> entrevista (estruturada, semiestruturada ou aberta), questionário (alcança muita gente, mas não permite aprofundar), <b>observação/etnografia<\/b> (acompanhar o trabalho real — revela o que as pessoas fazem, não o que dizem que fazem), workshop/JAD, brainstorming, prototipagem, análise de documentos e sistemas legados, e <b>storytelling<\/b>.<\/p><p><b>Dificuldades clássicas:<\/b> o usuário não sabe exatamente o que quer; especialistas usam jargão próprio; stakeholders diferentes querem coisas conflitantes; requisitos mudam durante o projeto; e há muito <b>conhecimento tácito<\/b> — o que é óbvio demais para ser dito.<\/p>"},{"tema":"Requisitos Funcionais e Não Funcionais","html":"<p><b>Requisito funcional (RF)<\/b> — <b>o que<\/b> o sistema deve <b>fazer<\/b>: as funções, serviços e comportamentos. Costuma ser escrito com verbo de ação: \"o sistema deve permitir o cadastro de sócios\", \"o sistema deve emitir o boleto mensal\".<\/p><p><b>Requisito não funcional (RNF)<\/b> — <b>como<\/b> o sistema deve se comportar: as qualidades e restrições. Não descreve uma função, mas um atributo dela ou do sistema todo.<\/p><p><b>Categorias de RNF:<\/b><\/p><ul><li><b>Desempenho<\/b> — tempo de resposta, vazão. \"A consulta deve responder em até 2 segundos.\"<\/li><li><b>Segurança<\/b> — autenticação, criptografia, controle de acesso, auditoria<\/li><li><b>Usabilidade<\/b> — facilidade de aprendizado e de uso<\/li><li><b>Confiabilidade / disponibilidade<\/b> — \"disponível 99,9% do tempo\"<\/li><li><b>Manutenibilidade<\/b>, <b>portabilidade<\/b>, <b>escalabilidade<\/b>, <b>interoperabilidade<\/b><\/li><li><b>Legais e de conformidade<\/b> — LGPD, normas do setor<\/li><\/ul><p><b>Cuidado clássico de prova:<\/b> os RNFs são frequentemente <b>mais críticos<\/b> que os funcionais. Um sistema que faz tudo o que deveria, mas leva cinco minutos para responder ou vaza dados, é inaceitável — o RNF pode inviabilizar o produto inteiro.<\/p><p><b>Regra de negócio<\/b> — uma política, restrição ou condição do <b>negócio<\/b>, que existe independentemente do software. \"O desconto de idoso é de 50%\", \"um sócio inadimplente há 3 meses é bloqueado.\" A regra de negócio <b>origina<\/b> requisitos, mas não se confunde com eles: ela vale mesmo que o processo seja feito em papel.<\/p><p><b>Qualidades de um bom requisito:<\/b> <b>completo<\/b>, <b>consistente<\/b> (não contradiz outro), <b>não ambíguo<\/b> (uma única interpretação possível), <b>verificável/testável<\/b> (dá para provar objetivamente que foi atendido), <b>rastreável<\/b> (sabe-se de onde veio e onde foi implementado), <b>viável<\/b> e <b>necessário<\/b>. Escrever \"o sistema deve ser rápido\" é ruim porque não é verificável; \"deve responder em até 2 segundos para 95% das requisições\" é bom.<\/p>"},{"tema":"Priorização e Gerenciamento de Requisitos","html":"<p>Nem tudo cabe na primeira versão. Priorizar é decidir <b>o que entra agora<\/b> e o que espera.<\/p><p><b>MoSCoW<\/b> — a técnica mais conhecida:<\/p><ul><li><b>M<\/b>ust have — obrigatório; sem ele a entrega não tem valor<\/li><li><b>S<\/b>hould have — importante, mas há alternativa temporária<\/li><li><b>C<\/b>ould have — desejável; entra se sobrar tempo<\/li><li><b>W<\/b>on't have (this time) — fica explicitamente fora desta entrega<\/li><\/ul><p><b>Outras técnicas:<\/b> matriz <b>valor x esforço<\/b> (ganhos rápidos primeiro), <b>Kano<\/b> (classifica em básicos — cuja ausência frustra mas cuja presença não encanta; de desempenho — quanto mais melhor; e de encantamento — surpreendem), <b>análise de valor<\/b>, votação com pontos (dot voting) e o método de <b>hierarquia analítica (AHP)<\/b>, que compara requisitos par a par.<\/p><p><b>Gerenciamento de requisitos<\/b> é o controle das mudanças ao longo do projeto. Requisitos mudam — isso é normal e esperado; o problema é mudarem <b>sem controle<\/b>.<\/p><p><b>Processo de mudança:<\/b> solicitação formal → análise de impacto (prazo, custo, riscos, outros requisitos) → decisão do comitê de controle de mudanças (CCB) → atualização da documentação e da linha de base → comunicação a todos os envolvidos.<\/p><p><b>Rastreabilidade<\/b> — a capacidade de seguir a vida de um requisito em ambas as direções: <b>para trás<\/b>, até a necessidade e o stakeholder que o originou; <b>para frente<\/b>, até o design, o código e os casos de teste que o verificam. A <b>matriz de rastreabilidade<\/b> é o instrumento que documenta esses vínculos, e é ela que permite responder \"se eu mudar este requisito, o que quebra?\".<\/p><p><b>Baseline (linha de base)<\/b> — a versão aprovada e congelada do conjunto de requisitos, a partir da qual toda mudança passa a ser controlada.<\/p>"},{"tema":"Casos de Uso e Especificação","html":"<p><b>Caso de uso<\/b> descreve uma <b>interação<\/b> entre um ator e o sistema que produz um <b>resultado de valor observável<\/b> para esse ator. É a técnica mais usada para especificar requisitos funcionais de forma legível ao cliente.<\/p><p><b>Elementos do diagrama de casos de uso (UML):<\/b><\/p><ul><li><b>Ator<\/b> (boneco palito) — quem interage com o sistema: pessoa, outro sistema ou dispositivo. É sempre <b>externo<\/b> ao sistema, e representa um <b>papel<\/b>, não um indivíduo.<\/li><li><b>Caso de uso<\/b> (elipse) — nomeado com verbo no infinitivo + objeto: \"Cadastrar sócio\", \"Emitir boleto\".<\/li><li><b>Fronteira do sistema<\/b> (retângulo) — separa o que é o sistema do que está fora.<\/li><li><b>Associação<\/b> (linha) — liga ator e caso de uso.<\/li><\/ul><p><b>Relacionamentos — o ponto mais cobrado:<\/b><\/p><ul><li><b>&lt;&lt;include&gt;&gt;<\/b> — o comportamento é <b>obrigatório<\/b> e sempre executado; usado para fatorar trecho comum a vários casos de uso. A seta aponta <b>do caso base para o incluído<\/b>. Ex.: \"Emitir boleto\" <i>include<\/i> \"Autenticar usuário\".<\/li><li><b>&lt;&lt;extend&gt;&gt;<\/b> — o comportamento é <b>opcional/condicional<\/b>, ocorrendo só em determinada situação. A seta aponta <b>do caso estendido para o caso base<\/b> (o contrário do include). Ex.: \"Aplicar desconto de idoso\" <i>extend<\/i> \"Emitir boleto\".<\/li><li><b>Generalização<\/b> — herança entre atores ou entre casos de uso.<\/li><\/ul><p><b>Especificação (descrição textual)<\/b> de um caso de uso: nome, ator principal, <b>pré-condições<\/b>, <b>pós-condições<\/b>, <b>fluxo principal<\/b> (o caminho feliz, passo a passo), <b>fluxos alternativos<\/b> (outros caminhos válidos) e <b>fluxos de exceção<\/b> (o que fazer quando algo dá errado).<\/p><p><b>História de usuário (ágil)<\/b> — a alternativa enxuta: <i>Como &lt;papel&gt;, quero &lt;ação&gt;, para &lt;benefício&gt;<\/i>, acompanhada de <b>critérios de aceitação<\/b>. O <b>INVEST<\/b> avalia sua qualidade: Independente, Negociável, Valiosa, Estimável, Small (pequena) e Testável.<\/p><p><b>Diagrama de atividades<\/b> — modela o <b>fluxo de trabalho<\/b>: nó inicial (círculo cheio), ações (retângulos arredondados), <b>decisão/mesclagem<\/b> (losango, com condições de guarda entre colchetes), <b>bifurcação/junção<\/b> (barra grossa, para paralelismo), <b>raias (swimlanes)<\/b> indicando quem executa cada ação, e nó final (círculo com anel).<\/p>"},{"tema":"Modelagem de Processos e BPMN","html":"<p><b>BPM<\/b> (Business Process Management) é a disciplina de gerir processos de negócio de ponta a ponta. O <b>mapeamento de processos<\/b> é o retrato de como o trabalho acontece hoje (<b>AS-IS<\/b>) e de como deveria acontecer (<b>TO-BE<\/b>).<\/p><p><b>Por que mapear antes de especificar o sistema:<\/b> automatizar um processo ruim só faz o erro acontecer mais rápido. O mapeamento revela gargalos, retrabalho, esperas e atividades que não agregam valor.<\/p><p><b>BPMN<\/b> (Business Process Model and Notation) é a notação padrão, mantida pela OMG. Elementos principais:<\/p><ul><li><b>Eventos<\/b> (círculos): <b>início<\/b> (linha fina), <b>intermediário<\/b> (linha dupla) e <b>fim<\/b> (linha grossa)<\/li><li><b>Atividades<\/b> (retângulos arredondados): tarefa ou subprocesso (com um + no rodapé)<\/li><li><b>Gateways<\/b> (losangos) — controlam o fluxo:<ul><li><b>Exclusivo (XOR, com X)<\/b> — só um caminho é seguido<\/li><li><b>Paralelo (AND, com +)<\/b> — todos os caminhos seguem simultaneamente<\/li><li><b>Inclusivo (OR, com O)<\/b> — um ou mais caminhos, conforme as condições<\/li><\/ul><\/li><li><b>Fluxo de sequência<\/b> (seta cheia) — dentro do mesmo pool; <b>fluxo de mensagem<\/b> (seta tracejada) — entre pools diferentes<\/li><li><b>Pool<\/b> — um participante do processo; <b>Lane<\/b> — uma divisão interna do pool, indicando papel ou setor<\/li><li><b>Artefatos<\/b> — objeto de dados, anotação, agrupamento<\/li><\/ul><p><b>Regra prática:<\/b> um fluxo de sequência nunca atravessa a fronteira de um pool — a comunicação entre pools é sempre por fluxo de mensagem.<\/p><p><b>Documento de Visão<\/b> — apresenta o problema, a oportunidade, os objetivos, os stakeholders, as premissas e restrições, o escopo em alto nível e os critérios de sucesso do projeto. É a base para alinhar expectativas antes do detalhamento.<\/p>"},{"tema":"Validação, Verificação e Casos de Teste","html":"<p><b>A distinção fundamental:<\/b><\/p><ul><li><b>Verificação<\/b> — \"Estamos construindo o produto <b>certo<\/b>?\" Não: \"estamos construindo o produto <b>corretamente<\/b>?\" É a conferência interna contra a especificação.<\/li><li><b>Validação<\/b> — \"Estamos construindo o produto <b>certo<\/b>?\" É confirmar com o cliente que o especificado é o que ele realmente precisa.<\/li><\/ul><p>Em resumo: <b>verificação<\/b> confere o produto contra o documento; <b>validação<\/b> confere o documento (e o produto) contra a necessidade real.<\/p><p><b>Técnicas de validação de requisitos:<\/b> revisões e <b>inspeções formais<\/b> (leitura sistemática por pares), <b>walkthrough<\/b>, prototipagem (o usuário vê antes de existir), <b>checklists<\/b> de qualidade, geração de <b>casos de teste<\/b> a partir dos requisitos e validação de modelos.<\/p><p><b>Caso de teste<\/b> — conjunto de condições sob as quais se determina se um requisito foi atendido. Estrutura: identificador, requisito relacionado (rastreabilidade), <b>pré-condições<\/b>, <b>passos<\/b>, <b>dados de entrada<\/b>, <b>resultado esperado<\/b> e resultado obtido.<\/p><p><b>Ponto-chave:<\/b> se não é possível escrever um caso de teste para um requisito, ele <b>não é verificável<\/b> — e portanto está mal escrito. É por isso que \"o sistema deve ser amigável\" é um requisito ruim e \"um usuário sem treinamento deve concluir o cadastro em até 3 minutos, com no máximo 1 erro\" é um requisito bom.<\/p><p><b>Níveis de teste:<\/b> unidade (a menor parte, isolada), integração (a conversa entre módulos), sistema (o todo, contra os requisitos) e <b>aceitação<\/b> (feito pelo cliente, valida o valor de negócio). <b>Teste de regressão<\/b> reexecuta o que já funcionava para garantir que a mudança não quebrou nada.<\/p><p><b>Caixa-preta x caixa-branca:<\/b> na caixa-preta testa-se pelas entradas e saídas, sem conhecer o código (partição de equivalência, análise de valor-limite); na caixa-branca conhece-se a estrutura interna e busca-se cobertura de comandos, decisões e caminhos.<\/p>"}],"flashcards":[{"tema":"Fundamentos da Engenharia de Requisitos","p":"O que é um requisito?","r":"Uma condição ou capacidade que o sistema deve possuir para satisfazer uma necessidade do usuário ou atender a um contrato, norma ou especificação."},{"tema":"Fundamentos da Engenharia de Requisitos","p":"Por que erros de requisito são os mais caros do ciclo de vida?","r":"Porque o custo de correção cresce exponencialmente: corrigir na fase de requisitos custa 1; em produção, de 50 a 100 vezes mais — já que o erro se propagou para o design, o código e os testes."},{"tema":"Fundamentos da Engenharia de Requisitos","p":"Quais são as cinco atividades da engenharia de requisitos?","r":"Elicitação (levantamento), análise e negociação, especificação (documentação), validação e gerenciamento (controle de mudanças e rastreabilidade)."},{"tema":"Fundamentos da Engenharia de Requisitos","p":"Qual técnica de elicitação revela o que as pessoas realmente fazem, e não o que dizem fazer?","r":"A observação (ou etnografia): acompanhar o trabalho real no ambiente do usuário. Ela captura o conhecimento tácito e os desvios do processo oficial que ninguém menciona em entrevista."},{"tema":"Fundamentos da Engenharia de Requisitos","p":"O que é conhecimento tácito e por que ele dificulta o levantamento?","r":"É o conhecimento que o especialista tem mas não verbaliza, por ser óbvio demais para ele. Dificulta porque não aparece em entrevista — só na observação do trabalho real."},{"tema":"Requisitos Funcionais e Não Funcionais","p":"Qual a diferença entre requisito funcional e não funcional?","r":"O funcional descreve O QUE o sistema deve fazer — suas funções e serviços. O não funcional descreve COMO ele deve se comportar — desempenho, segurança, usabilidade, confiabilidade e outras qualidades e restrições."},{"tema":"Requisitos Funcionais e Não Funcionais","p":"'A consulta deve responder em até 2 segundos' é qual tipo de requisito?","r":"Não funcional, da categoria desempenho. Ele não descreve uma função nova, mas um atributo de qualidade de uma função existente."},{"tema":"Requisitos Funcionais e Não Funcionais","p":"Por que os requisitos não funcionais podem ser mais críticos que os funcionais?","r":"Porque um sistema que faz tudo o que deveria, mas leva minutos para responder ou vaza dados, é inaceitável. Um RNF não atendido pode inviabilizar o produto inteiro, enquanto um RF ausente costuma inviabilizar apenas uma função."},{"tema":"Requisitos Funcionais e Não Funcionais","p":"O que é uma regra de negócio e como ela se distingue de um requisito?","r":"É uma política, restrição ou condição do negócio que existe independentemente do software — 'idoso tem 50% de desconto' vale mesmo se o processo for feito em papel. A regra de negócio origina requisitos, mas não se confunde com eles."},{"tema":"Requisitos Funcionais e Não Funcionais","p":"Quais são as qualidades de um bom requisito?","r":"Completo, consistente, não ambíguo, verificável (testável), rastreável, viável e necessário."},{"tema":"Requisitos Funcionais e Não Funcionais","p":"Por que 'o sistema deve ser rápido' é um requisito mal escrito?","r":"Porque não é verificável nem inequívoco: não há como provar objetivamente se foi atendido. A versão correta seria 'deve responder em até 2 segundos para 95% das requisições'."},{"tema":"Priorização e Gerenciamento de Requisitos","p":"O que significa cada letra do MoSCoW?","r":"Must have (obrigatório, sem ele a entrega não tem valor), Should have (importante, mas com alternativa temporária), Could have (desejável, se sobrar tempo) e Won't have (explicitamente fora desta entrega)."},{"tema":"Priorização e Gerenciamento de Requisitos","p":"Como o modelo Kano classifica os requisitos?","r":"Básicos (sua ausência frustra, mas sua presença não encanta — são pressupostos), de desempenho (quanto mais, melhor a satisfação) e de encantamento (o cliente não esperava e se surpreende positivamente)."},{"tema":"Priorização e Gerenciamento de Requisitos","p":"O que é rastreabilidade de requisitos?","r":"A capacidade de seguir a vida de um requisito nas duas direções: para trás, até a necessidade e o stakeholder que o originou; para frente, até o design, o código e os casos de teste que o verificam."},{"tema":"Priorização e Gerenciamento de Requisitos","p":"Para que serve a matriz de rastreabilidade?","r":"Para documentar os vínculos entre requisitos, artefatos de projeto e testes — permitindo responder 'se eu mudar este requisito, o que mais é afetado?' e verificar se todo requisito foi implementado e testado."},{"tema":"Priorização e Gerenciamento de Requisitos","p":"Quais são as etapas do processo de mudança de requisitos?","r":"Solicitação formal → análise de impacto (prazo, custo, riscos, outros requisitos) → decisão do comitê de controle de mudanças → atualização da documentação e da linha de base → comunicação aos envolvidos."},{"tema":"Priorização e Gerenciamento de Requisitos","p":"O que é a linha de base (baseline) de requisitos?","r":"A versão aprovada e formalmente congelada do conjunto de requisitos, a partir da qual toda alteração passa a exigir controle de mudanças."},{"tema":"Casos de Uso e Especificação","p":"O que é um caso de uso?","r":"A descrição de uma interação entre um ator e o sistema que produz um resultado de valor observável para esse ator. É nomeado com verbo no infinitivo mais objeto: 'Cadastrar sócio'."},{"tema":"Casos de Uso e Especificação","p":"O que é um ator em um diagrama de casos de uso?","r":"Quem interage com o sistema — pessoa, outro sistema ou dispositivo. É sempre EXTERNO ao sistema e representa um PAPEL, não um indivíduo específico."},{"tema":"Casos de Uso e Especificação","p":"Qual a diferença entre <<include>> e <<extend>>?","r":"<<include>> é obrigatório e sempre executado, fatorando comportamento comum; a seta vai do caso base para o incluído. <<extend>> é opcional/condicional; a seta vai do caso que estende para o caso base — o sentido é invertido."},{"tema":"Casos de Uso e Especificação","p":"Dê um exemplo de <<include>> e um de <<extend>>.","r":"Include: 'Emitir boleto' inclui 'Autenticar usuário' — sempre acontece. Extend: 'Aplicar desconto de idoso' estende 'Emitir boleto' — só ocorre se a condição for satisfeita."},{"tema":"Casos de Uso e Especificação","p":"Quais seções compõem a especificação textual de um caso de uso?","r":"Nome, ator principal, pré-condições, pós-condições, fluxo principal (caminho feliz), fluxos alternativos (outros caminhos válidos) e fluxos de exceção (o que fazer quando algo dá errado)."},{"tema":"Casos de Uso e Especificação","p":"Qual o formato de uma história de usuário?","r":"Como <papel>, quero <ação>, para <benefício> — acompanhada dos critérios de aceitação, que definem objetivamente quando ela está pronta."},{"tema":"Casos de Uso e Especificação","p":"O que significa o acrônimo INVEST?","r":"Independente, Negociável, Valiosa, Estimável, Small (pequena) e Testável — os critérios de qualidade de uma boa história de usuário."},{"tema":"Casos de Uso e Especificação","p":"O que representam o losango e a barra grossa no diagrama de atividades?","r":"O losango é decisão ou mesclagem, com condições de guarda entre colchetes — apenas um caminho segue. A barra grossa é bifurcação ou junção, representando execução em PARALELO."},{"tema":"Casos de Uso e Especificação","p":"Para que servem as raias (swimlanes) em um diagrama de atividades?","r":"Para indicar quem executa cada ação — cada raia representa um ator, papel ou setor responsável, tornando visível a divisão de responsabilidades no fluxo."},{"tema":"Modelagem de Processos e BPMN","p":"Qual a diferença entre AS-IS e TO-BE?","r":"AS-IS é o retrato do processo como ele acontece hoje, com todos os seus problemas. TO-BE é o desenho do processo como ele deveria acontecer depois da melhoria."},{"tema":"Modelagem de Processos e BPMN","p":"Por que mapear o processo antes de especificar o sistema?","r":"Porque automatizar um processo ruim só faz o erro acontecer mais rápido. O mapeamento revela gargalos, retrabalho, esperas e atividades que não agregam valor, que devem ser corrigidos antes da automação."},{"tema":"Modelagem de Processos e BPMN","p":"Quais são os três gateways principais do BPMN?","r":"Exclusivo (XOR, marcado com X) — só um caminho segue. Paralelo (AND, marcado com +) — todos os caminhos seguem ao mesmo tempo. Inclusivo (OR, marcado com O) — um ou mais caminhos, conforme as condições."},{"tema":"Modelagem de Processos e BPMN","p":"Como se distinguem os eventos de início, intermediário e fim no BPMN?","r":"Pela espessura da borda do círculo: início tem linha fina, intermediário tem linha dupla e fim tem linha grossa."},{"tema":"Modelagem de Processos e BPMN","p":"Qual a diferença entre fluxo de sequência e fluxo de mensagem no BPMN?","r":"O fluxo de sequência (seta cheia) liga elementos DENTRO do mesmo pool e nunca cruza sua fronteira. O fluxo de mensagem (seta tracejada) é a única forma de comunicação ENTRE pools diferentes."},{"tema":"Modelagem de Processos e BPMN","p":"Qual a diferença entre pool e lane no BPMN?","r":"O pool representa um participante do processo — uma organização ou entidade. A lane é uma subdivisão interna do pool, indicando papel, setor ou função responsável."},{"tema":"Modelagem de Processos e BPMN","p":"O que contém um Documento de Visão?","r":"O problema e a oportunidade, os objetivos, os stakeholders, as premissas e restrições, o escopo em alto nível e os critérios de sucesso do projeto — servindo para alinhar expectativas antes do detalhamento."},{"tema":"Validação, Verificação e Casos de Teste","p":"Qual a diferença entre verificação e validação?","r":"Verificação confere o produto contra a especificação — 'estamos construindo o produto corretamente?'. Validação confere se o especificado atende à necessidade real do cliente — 'estamos construindo o produto certo?'."},{"tema":"Validação, Verificação e Casos de Teste","p":"Cite técnicas de validação de requisitos.","r":"Revisões e inspeções formais, walkthrough, prototipagem, checklists de qualidade, geração de casos de teste a partir dos requisitos e validação de modelos."},{"tema":"Validação, Verificação e Casos de Teste","p":"Quais elementos compõem um caso de teste?","r":"Identificador, requisito relacionado (rastreabilidade), pré-condições, passos de execução, dados de entrada, resultado esperado e resultado obtido."},{"tema":"Validação, Verificação e Casos de Teste","p":"Qual a relação entre caso de teste e qualidade do requisito?","r":"Se não é possível escrever um caso de teste para um requisito, ele não é verificável — e portanto está mal escrito. Escrever o teste é a forma mais rápida de descobrir ambiguidade."},{"tema":"Validação, Verificação e Casos de Teste","p":"Quais são os níveis de teste?","r":"Unidade (a menor parte, isolada), integração (a comunicação entre módulos), sistema (o produto completo contra os requisitos) e aceitação (feito pelo cliente, valida o valor de negócio)."},{"tema":"Validação, Verificação e Casos de Teste","p":"O que é teste de regressão?","r":"A reexecução de testes já aprovados após uma mudança, para garantir que a alteração não quebrou funcionalidades que antes funcionavam."},{"tema":"Validação, Verificação e Casos de Teste","p":"Qual a diferença entre teste caixa-preta e caixa-branca?","r":"Na caixa-preta testa-se apenas por entradas e saídas, sem conhecer o código — usa partição de equivalência e análise de valor-limite. Na caixa-branca conhece-se a estrutura interna e busca-se cobertura de comandos, decisões e caminhos."}],"questoes":[{"tema":"Fundamentos da Engenharia de Requisitos","q":"Por que erros cometidos na fase de requisitos são os mais caros do ciclo de vida do software?","op":["Porque o custo de correção cresce exponencialmente ao longo das fases, chegando a 50-100 vezes em produção","Porque exigem contratar consultores externos","Porque a fase de requisitos consome mais horas que as demais","Porque as ferramentas de requisitos são as mais caras do mercado"],"r":0,"exp":"Um erro de requisito se propaga para o design, o código e os testes. Corrigi-lo na origem custa 1; em produção, dezenas de vezes mais."},{"tema":"Fundamentos da Engenharia de Requisitos","q":"Qual é a sequência correta das atividades da engenharia de requisitos?","op":["Especificação, elicitação, validação, análise e gerenciamento","Validação, elicitação, especificação, gerenciamento e análise","Elicitação, análise e negociação, especificação, validação e gerenciamento","Análise, especificação, elicitação, gerenciamento e validação"],"r":2,"exp":"Primeiro se descobre (elicitação), depois se entende e negocia, então se documenta, valida com o cliente e finalmente se gerencia a mudança ao longo do projeto."},{"tema":"Fundamentos da Engenharia de Requisitos","q":"Qual técnica de elicitação é mais adequada para revelar o que os usuários REALMENTE fazem, e não o que dizem fazer?","op":["Questionário aplicado por e-mail","Entrevista estruturada","Observação (etnografia) no ambiente de trabalho","Análise de documentos"],"r":2,"exp":"A observação captura o conhecimento tácito e os desvios do processo oficial — coisas que o usuário não menciona em entrevista por considerar óbvias ou por não ter consciência delas."},{"tema":"Fundamentos da Engenharia de Requisitos","q":"O que é conhecimento tácito no contexto do levantamento de requisitos?","op":["O conhecimento documentado nos manuais da empresa","O conhecimento técnico exclusivo da equipe de desenvolvimento","O conhecimento que o especialista possui mas não verbaliza, por parecer óbvio demais","As regras formais definidas em contrato"],"r":2,"exp":"Justamente por ser óbvio para quem executa, esse conhecimento nunca aparece em entrevista — e é uma das principais causas de requisitos incompletos."},{"tema":"Requisitos Funcionais e Não Funcionais","q":"'O sistema deve permitir o cadastro de novos sócios' é um requisito:","op":["Funcional","Não funcional de usabilidade","Regra de negócio","Não funcional de desempenho"],"r":0,"exp":"Descreve uma função que o sistema deve executar — o QUE ele faz. Requisitos funcionais são tipicamente escritos com verbo de ação."},{"tema":"Requisitos Funcionais e Não Funcionais","q":"'O sistema deve estar disponível 99,9% do tempo' é um requisito:","op":["Funcional","Regra de negócio","Caso de uso","Não funcional de confiabilidade/disponibilidade"],"r":3,"exp":"Não descreve uma função nova, e sim um atributo de qualidade do sistema como um todo — classificação típica de requisito não funcional."},{"tema":"Requisitos Funcionais e Não Funcionais","q":"'Sócios inadimplentes há mais de 3 meses têm o acesso bloqueado' é melhor classificado como:","op":["Requisito funcional","Requisito não funcional","Critério de aceitação de teste","Regra de negócio"],"r":3,"exp":"É uma política do negócio que existe independentemente do software — valeria mesmo se o controle fosse feito em papel. Ela ORIGINA requisitos funcionais, mas não se confunde com eles."},{"tema":"Requisitos Funcionais e Não Funcionais","q":"Por que se afirma que requisitos não funcionais podem ser mais críticos que os funcionais?","op":["Porque são mais numerosos","Porque são mais fáceis de testar","Porque um RNF não atendido pode inviabilizar o produto inteiro, enquanto um RF ausente inviabiliza apenas uma função","Porque sempre têm prioridade contratual"],"r":2,"exp":"Um sistema que faz tudo, mas demora minutos para responder ou vaza dados, é inutilizável. O RNF atravessa todo o produto."},{"tema":"Requisitos Funcionais e Não Funcionais","q":"Qual destes requisitos é mal escrito por não ser verificável?","op":["O sistema deve responder em até 2 segundos para 95% das requisições","O sistema deve permitir exportar o relatório em PDF","O sistema deve ser amigável e intuitivo","O sistema deve exigir senha de no mínimo 8 caracteres"],"r":2,"exp":"'Amigável e intuitivo' não permite prova objetiva de atendimento. A versão verificável seria algo como 'um usuário sem treinamento conclui o cadastro em até 3 minutos, com no máximo 1 erro'."},{"tema":"Requisitos Funcionais e Não Funcionais","q":"Quais são características de um bom requisito?","op":["Detalhado, técnico, extenso e escrito em linguagem de programação","Completo, consistente, não ambíguo, verificável e rastreável","Genérico, flexível e sujeito a interpretação da equipe","Definido apenas pelo time técnico, sem participação do cliente"],"r":1,"exp":"Também deve ser viável e necessário. A ambiguidade é o defeito mais comum e mais caro, porque só é descoberta quando o produto já está pronto."},{"tema":"Priorização e Gerenciamento de Requisitos","q":"No MoSCoW, o que significa a categoria 'Won't have'?","op":["Um requisito que nunca será implementado em nenhuma versão","Um requisito que está explicitamente fora do escopo desta entrega","Um requisito de baixa qualidade que foi rejeitado","Um requisito cuja viabilidade técnica é desconhecida"],"r":1,"exp":"'Won't have (this time)' é uma decisão consciente de adiamento — e registrá-la explicitamente evita mal-entendidos com o cliente sobre o escopo acordado."},{"tema":"Priorização e Gerenciamento de Requisitos","q":"No modelo Kano, requisitos cuja ausência frustra mas cuja presença não encanta são classificados como:","op":["De encantamento","Básicos (obrigatórios)","De desempenho","Indiferentes"],"r":1,"exp":"São os pressupostos: ninguém elogia um app por abrir, mas todos reclamam se ele não abre. Os de desempenho seguem a lógica 'quanto mais, melhor'; os de encantamento surpreendem."},{"tema":"Priorização e Gerenciamento de Requisitos","q":"O que é rastreabilidade de requisitos?","op":["A capacidade de seguir o requisito da sua origem até o código e os testes que o verificam","O registro do histórico de versões do documento","O acompanhamento do tempo gasto em cada requisito","A numeração sequencial dos requisitos no documento"],"r":0,"exp":"A rastreabilidade funciona nas duas direções — para trás, até o stakeholder que originou o requisito; para frente, até o design, o código e os casos de teste."},{"tema":"Priorização e Gerenciamento de Requisitos","q":"Qual é a principal utilidade prática da matriz de rastreabilidade?","op":["Estimar o custo total do projeto","Definir a ordem de execução das atividades","Responder o que é afetado quando um requisito muda, e verificar se todo requisito foi implementado e testado","Substituir o documento de especificação"],"r":2,"exp":"É o instrumento da análise de impacto: sem ele, cada mudança vira uma investigação manual pelo código."},{"tema":"Priorização e Gerenciamento de Requisitos","q":"Qual é a etapa que deve seguir imediatamente a solicitação formal de mudança de um requisito?","op":["Implementação imediata pela equipe técnica","Atualização do contrato com o cliente","Cancelamento da linha de base","Análise de impacto em prazo, custo, riscos e outros requisitos"],"r":3,"exp":"Sem análise de impacto não há base para decidir. Só depois dela o comitê de controle de mudanças aprova ou rejeita, e a linha de base é atualizada."},{"tema":"Casos de Uso e Especificação","q":"O que é um ator em um diagrama de casos de uso?","op":["Uma entidade externa que interage com o sistema, representando um papel","Um módulo interno do sistema","O desenvolvedor responsável pela funcionalidade","Um caso de uso de alta prioridade"],"r":0,"exp":"O ator é sempre externo ao sistema e representa um PAPEL — pode ser pessoa, outro sistema ou dispositivo. Uma mesma pessoa pode exercer vários papéis."},{"tema":"Casos de Uso e Especificação","q":"O relacionamento <<include>> em um diagrama de casos de uso indica que:","op":["O comportamento é opcional e ocorre apenas sob certa condição","Um ator herda o comportamento de outro","O caso de uso foi incluído numa versão futura","O comportamento é obrigatório e sempre executado pelo caso base"],"r":3,"exp":"O <<include>> fatora comportamento comum que SEMPRE acontece — como 'Autenticar usuário'. A seta vai do caso base para o incluído."},{"tema":"Casos de Uso e Especificação","q":"Em 'Aplicar desconto de idoso' <<extend>> 'Emitir boleto', o que se afirma?","op":["Que emitir boleto sempre ap
