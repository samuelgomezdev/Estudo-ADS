ionamento%20entre%20entidades_%20_%20IBM.pdf"},{"nome":"Os caminhos da Engenharia de Software_ o que estudar — William Oliveira","ext":"pdf","tam":"754 KB","href":"../Software%20Design/Os%20caminhos%20da%20Engenharia%20de%20Software_%20o%20que%20estudar%20%E2%80%94%20William%20Oliveira.pdf"},{"nome":"Planejamento_Forum_UML","ext":"xlsx","tam":"10 KB","href":"../Software%20Design/Planejamento_Forum_UML.xlsx"},{"nome":"Projetar a solução","ext":"pdf","tam":"598 KB","href":"../Software%20Design/Projetar%20a%20solu%C3%A7%C3%A3o.pdf"},{"nome":"REVISADO_20567_Audiodescricao_Desafio-2025-10-01T09_45_13-03_00","ext":"docx","tam":"28 KB","href":"../Software%20Design/REVISADO_20567_Audiodescricao_Desafio-2025-10-01T09_45_13-03_00.docx"},{"nome":"SQL INSERT(INTO e SELECT)_ inserir linhas em tabelas! – Insights para te ajudar na carreira em tecnologia _ Blog da Trybe","ext":"pdf","tam":"340 KB","href":"../Software%20Design/SQL%20INSERT%28INTO%20e%20SELECT%29_%20inserir%20linhas%20em%20tabelas%21%20%E2%80%93%20Insights%20para%20te%20ajudar%20na%20carreira%20em%20tecnologia%20_%20Blog%20da%20Trybe.pdf"},{"nome":"Uma Proposta de Arquitetura de Software Limpa-microsservicos","ext":"pdf","tam":"512 KB","href":"../Software%20Design/Uma%20Proposta%20de%20Arquitetura%20de%20Software%20Limpa-microsservicos.pdf"},{"nome":"_AULA01_ArquiteturadeSistemas","ext":"pdf","tam":"1.5 MB","href":"../Software%20Design/_AULA01_ArquiteturadeSistemas.pdf"},{"nome":"analise-software-orientada-objetos","ext":"pdf","tam":"1.9 MB","href":"../Software%20Design/analise-software-orientada-objetos.pdf"},{"nome":"arquitetura-baseada-servicos","ext":"pdf","tam":"306 KB","href":"../Software%20Design/arquitetura-baseada-servicos.pdf"},{"nome":"arquitetura-orientada-servico-usp","ext":"pdf","tam":"6.9 MB","href":"../Software%20Design/arquitetura-orientada-servico-usp.pdf"},{"nome":"arquitetura-orientada-servico","ext":"pdf","tam":"2.2 MB","href":"../Software%20Design/arquitetura-orientada-servico.pdf"},{"nome":"banco-de-dados","ext":"pdf","tam":"1.3 MB","href":"../Software%20Design/banco-de-dados.pdf"},{"nome":"decompor-sistemas-monoliticos","ext":"pdf","tam":"525 KB","href":"../Software%20Design/decompor-sistemas-monoliticos.pdf"},{"nome":"der","ext":"pdf","tam":"329 KB","href":"../Software%20Design/der.pdf"},{"nome":"diagrama-classes","ext":"pdf","tam":"1.4 MB","href":"../Software%20Design/diagrama-classes.pdf"},{"nome":"diagrama-entidade-relacionamento","ext":"pdf","tam":"1.7 MB","href":"../Software%20Design/diagrama-entidade-relacionamento.pdf"},{"nome":"diagrama-sequencia","ext":"pdf","tam":"11.1 MB","href":"../Software%20Design/diagrama-sequencia.pdf"},{"nome":"diagrama_sequencia","ext":"docx","tam":"10 KB","href":"../Software%20Design/diagrama_sequencia.docx"},{"nome":"diagramas-componentes","ext":"pdf","tam":"1.4 MB","href":"../Software%20Design/diagramas-componentes.pdf"},{"nome":"modelo-analise-software","ext":"pdf","tam":"1.4 MB","href":"../Software%20Design/modelo-analise-software.pdf"},{"nome":"modelo-entidade-relacionamento","ext":"pdf","tam":"9.4 MB","href":"../Software%20Design/modelo-entidade-relacionamento.pdf"},{"nome":"plataforma-inter-microservico","ext":"pdf","tam":"422 KB","href":"../Software%20Design/plataforma-inter-microservico.pdf"},{"nome":"projeto-servico-web","ext":"pdf","tam":"2.4 MB","href":"../Software%20Design/projeto-servico-web.pdf"},{"nome":"prototipacao-concepcao","ext":"pdf","tam":"11.6 MB","href":"../Software%20Design/prototipacao-concepcao.pdf"},{"nome":"prototipacao-design-games","ext":"pdf","tam":"1.4 MB","href":"../Software%20Design/prototipacao-design-games.pdf"},{"nome":"prototipos-design","ext":"pdf","tam":"11.7 MB","href":"../Software%20Design/prototipos-design.pdf"},{"nome":"soa","ext":"pdf","tam":"3.6 MB","href":"../Software%20Design/soa.pdf"}],"links":[],"resumos":[{"tema":"Arquitetura, SOA e serviços web","html":"<p><b>Arquitetura de software<\/b> é a estrutura fundamental do sistema: as decisões que definem os componentes, como eles se comunicam e os princípios que guiam sua evolução. Invisível ao usuário, mas determina desempenho, custo e segurança. A <b>Primeira Lei da Arquitetura<\/b> (Robert C. Martin): <i>tudo na arquitetura de software é um trade-off<\/i> — não existe arquitetura perfeita, só opções otimizadas por contexto.<\/p><p><b>As 5 características da arquitetura:<\/b><\/p><ul><li>atender aos <b>stakeholders<\/b>;<\/li><li><b>separação de necessidades<\/b> (vistas);<\/li><li><b>orientada pela qualidade<\/b> — os RNFs mandam;<\/li><li><b>estilos recorrentes<\/b> (padrões);<\/li><li><b>integridade conceitual<\/b>, alinhando toda adição à visão geral — papel do arquiteto.<\/li><\/ul><p><b>Estilos.<\/b> O <b>monolítico<\/b> serve a times pequenos, MVPs e domínios indefinidos: simples de desenvolver e testar. <b>Microsserviços<\/b> pedem demanda diferenciada por módulo, times grandes e cloud-native, com alta complexidade operacional. Na arquitetura <b>em camadas<\/b>, do topo para a base: <b>Apresentação → Negócio → Dados<\/b>, cada camada falando só com a adjacente. A <b>orientada a eventos<\/b> é assíncrona via broker (Kafka, RabbitMQ): desacoplamento extremo e absorção de picos, mas rastreabilidade difícil e consistência eventual.<\/p><p><b>SOA<\/b> surgiu nos <b>anos 2000<\/b> para integrar sistemas heterogêneos e expor a lógica de negócio como serviço reutilizável. Seu núcleo é o <b>ESB (Enterprise Service Bus)<\/b>: barramento que roteia mensagens, transforma formatos, aplica segurança e monitora o tráfego, eliminando a integração ponto-a-ponto, que exigiria <code>N×(N-1)<\/code> conexões. Custos: mudança cara nos modelos existentes (redesenho de legados) e sistemas que já funcionam não justificarem o investimento.<\/p><p><b>Serviços web em 4 camadas:<\/b> Cliente → Web (recebe o HTTP) → Negócio (EJB: lógica e orquestração) → EIS (dados e sistemas legados). Verbos HTTP e <code>HTTPServlet<\/code>:<\/p><pre>GET    -&gt; doGet()     leitura\nPOST   -&gt; doPost()    criação\nPUT    -&gt; doPut()     atualização\nDELETE -&gt; doDelete()  remoção\nHEAD   -&gt; doHead()    existência<\/pre>"},{"tema":"Processo de projeto, requisitos e protótipos","html":"<p>O <b>projeto (design)<\/b> recebe o modelo de análise e entrega a especificação técnica da implementação. A <b>saída da fase de Projeto/Modelagem<\/b> são os <b>diagramas UML, a arquitetura técnica e o DER<\/b> — não código nem requisitos do cliente.<\/p><p><b>As 4 atividades do projeto de software:<\/b><\/p><ul><li><b>Projeto Arquitetural<\/b> — estrutura geral: componentes principais, relacionamentos e distribuição;<\/li><li><b>Projeto de Interface<\/b> — comunicação entre os componentes;<\/li><li><b>Projeto de Componente<\/b> — lógica interna de cada módulo;<\/li><li><b>Projeto de Banco de Dados<\/b> — persistência.<\/li><\/ul><p><b>Os 3 tipos de projeto:<\/b> <b>estrutural<\/b> (visão abstrata do sistema), <b>alto nível<\/b> (subsistemas e módulos) e <b>detalhado<\/b> (algoritmos e estruturas de dados).<\/p><p><b>Requisitos Não Funcionais (RNF)<\/b> não descrevem o que o sistema faz, e sim <b>como ele se comporta<\/b>: escalabilidade, segurança, desempenho, manutenibilidade. São o fator principal na escolha da arquitetura.<\/p><p><b>As 7 seções do Plano de Projeto:<\/b> 1) Introdução; 2) Organização do projeto; 3) Análise de riscos; 4) Requisitos de hardware e software; 5) <b>WBS<\/b> — divisão de trabalho; 6) Cronograma; 7) Monitoração e relatórios. A <b>WBS (Work Breakdown Structure)<\/b> parte o projeto em <b>atividades, milestones e entregáveis<\/b>, permitindo estimar tempo e alocar pessoas a cada tarefa.<\/p><p><b>Design conceitual x físico:<\/b> o conceitual define <i>o que<\/i> o sistema faz para o usuário, sem tecnologia; o físico define <i>como<\/i> será implementado — tecnologias, estrutura de telas, acessibilidade.<\/p><p><b>Protótipos<\/b> — três eixos:<\/p><ul><li><b>Horizontal x Vertical<\/b>: o horizontal cobre muitas funções com poucos detalhes em cada; o vertical detalha ao máximo poucas funções, aprofundando um módulo crítico.<\/li><li><b>Descartável x Evolutivo<\/b>: o descartável explora ideias e é descartado depois; o evolutivo é refinado até virar o produto de produção.<\/li><li><b>Fidelidade<\/b>: <b>baixa<\/b> (papel, sem semelhança visual, valida fluxos), <b>média<\/b> (visual parcial) e <b>alta<\/b> (mesmos materiais do produto final e banco de homologação).<\/li><\/ul>"},{"tema":"Modelagem: análise estruturada e UML","html":"<p><b>Análise estruturada — DFD<\/b> (Diagrama de Fluxo de Dados). Os 4 componentes:<\/p><ul><li><b>bolha de processo<\/b> (retângulo arredondado) — transforma dados;<\/li><li><b>fluxo de dados<\/b> — seta nomeada;<\/li><li><b>entidade externa<\/b> (quadrado duplo) — fonte ou destino <b>fora<\/b> do sistema;<\/li><li><b>depósito de dados<\/b> (retângulo aberto) — armazenamento.<\/li><\/ul><p>O <b>Dicionário de Dados<\/b> documenta o significado de cada dado:<\/p><pre>=     é composto por\n+     e (concatenação)\n( )   opcional\n[ | ] alternativas (ou)\n{ }   repetição\n@     chave primária\n\ntipo = [ físico | jurídico ]<\/pre><p><b>Os 4 pilares da OO:<\/b> <b>encapsulamento<\/b> (ocultar o estado interno), <b>herança<\/b> (reutilizar e especializar), <b>polimorfismo<\/b> (o mesmo método com comportamento diferente em cada subclasse) e <b>abstração<\/b> (modelar a essência, ignorando detalhes irrelevantes).<\/p><p><b>Diagrama de Classes.<\/b> Visibilidade: <b>+<\/b> público, <b>-<\/b> privado (só na classe), <b>#<\/b> protegido (classe e subclasses), <b>~<\/b> pacote. Multiplicidades: <b>0..1<\/b> no máximo um, <b>1<\/b> exatamente um, <b>1..*<\/b> um ou mais, <b>*<\/b> zero ou mais. <b>Agregação<\/b> (losango vazio): a parte existe sem o todo — Departamento e Funcionário. <b>Composição<\/b> (losango cheio): a parte não existe sem o todo — Pedido e ItemPedido.<\/p><p><b>Diagrama de Componentes.<\/b> Um componente é um pedaço reutilizável de funcionalidade (retângulo com o estereótipo <code>&lt;&lt;component&gt;&gt;<\/code>). A <b>interface fornecida<\/b> (círculo/bola) são as operações que ele oferece; a <b>requerida<\/b> (semicírculo/soquete), as que ele precisa de outros para funcionar.<\/p><p><b>Diagrama de Sequência.<\/b> Mensagens: <b>síncrona<\/b> (seta sólida cheia, aguarda resposta), <b>assíncrona<\/b> (seta aberta, segue sem esperar), <b>retorno<\/b> (tracejada aberta), <b>self<\/b>, <b>criação<\/b> e <b>destruição<\/b> (seta com X). <b>Fragmentos combinados<\/b> são estruturas de controle: <code>alt<\/code> = if/else, <code>opt<\/code> = if sem else, <code>loop<\/code> = for/while, <code>par<\/code> = paralelo, <code>break<\/code> = saída antecipada, <code>neg<\/code> = sequência inválida.<\/p>"},{"tema":"Banco de dados relacional","html":"<p><b>MER x DER:<\/b> o <b>MER<\/b> (Modelo Entidade-Relacionamento) é abstrato e conceitual, independe de tecnologia e serve para comunicar com o cliente; o <b>DER<\/b> é a representação gráfica em nível lógico/físico, base direta para implementar o banco.<\/p><p><b>Símbolos do DER:<\/b><\/p><ul><li>retângulo = <b>entidade<\/b>;<\/li><li>losango = <b>relacionamento<\/b>;<\/li><li>elipse = atributo; elipse sublinhada = atributo-chave (PK); elipse dupla = atributo multivalorado;<\/li><li>retângulo duplo = <b>entidade fraca<\/b>.<\/li><\/ul><p><b>Cardinalidades:<\/b> <b>1:1<\/b> (pessoa e passaporte), <b>1:N<\/b> (cliente e pedidos) e <b>N:N<\/b> (alunos e disciplinas). Na implementação, 1:N coloca a FK do lado N; já <b>N:N exige uma tabela intermediária (associativa)<\/b> com as FKs das duas entidades, como <code>Matriculas(id_aluno, id_disciplina)<\/code>.<\/p><p><b>Chaves:<\/b> a <b>PRIMARY KEY<\/b> identifica unicamente cada registro — não nula e não duplicada. A <b>FOREIGN KEY<\/b> referencia a PK de outra tabela e garante a <b>integridade referencial<\/b>: um registro filho não pode apontar para uma chave inexistente, o que impede registros órfãos.<\/p><p><b>Constraints essenciais:<\/b> <code>PRIMARY KEY<\/code>, <code>FOREIGN KEY<\/code>, <code>NOT NULL<\/code> (obrigatório), <code>UNIQUE<\/code> (valor único na tabela), <code>DEFAULT<\/code> (valor padrão) e <code>CHECK<\/code> (valida regra de negócio).<\/p><pre>CREATE TABLE produto (\n  id     INT PRIMARY KEY,\n  nome   VARCHAR(100) NOT NULL,\n  sku    VARCHAR(20) UNIQUE,\n  preco  DECIMAL(10,2) NOT NULL CHECK (preco &gt; 0),\n  ativo  BOOLEAN DEFAULT TRUE,\n  id_cat INT REFERENCES categoria(id)\n);<\/pre><p>Para valores monetários use sempre <b><code>DECIMAL(p,s)<\/code><\/b>, que garante precisão exata: <code>FLOAT<\/code> e <code>DOUBLE<\/code> usam ponto flutuante binário e produzem erros de arredondamento.<\/p><p><b>Os 4 JOINs:<\/b> <code>INNER JOIN<\/code> retorna apenas as linhas com correspondência nas <b>duas<\/b> tabelas; <code>LEFT JOIN<\/code> traz todas as da esquerda mais as correspondências; <code>RIGHT JOIN<\/code> faz o simétrico; <code>FULL JOIN<\/code> traz todas as linhas de ambas.<\/p>"}],"flashcards":[{"tema":"Arquitetura, SOA e serviços web","p":"O que é arquitetura de software?","r":"A estrutura fundamental de um sistema — decisões estruturais que definem componentes, como se comunicam e princípios que guiam sua evolução. Invisível ao usuário, mas determina desempenho, custo e segurança."},{"tema":"Arquitetura, SOA e serviços web","p":"Qual é a 'Primeira Lei da Arquitetura' (Robert C. Martin)?","r":"'Tudo na arquitetura de software é um trade-off.' Não existe arquitetura perfeita — existem opções otimizadas para contextos específicos."},{"tema":"Arquitetura, SOA e serviços web","p":"Quando usar arquitetura Monolítica vs Microsserviços?","r":"Monolítica: times pequenos, MVPs, domínios indefinidos. Microsserviços: demanda diferenciada por módulo, times grandes, cloud-native — mas com alta complexidade operacional."},{"tema":"Arquitetura, SOA e serviços web","p":"O que é arquitetura Orientada a Eventos?","r":"Componentes se comunicam de forma assíncrona via broker (Kafka, RabbitMQ). Vantagem: desacoplamento extremo, absorve picos. Desvantagem: rastreabilidade difícil, consistência eventual."},{"tema":"Processo de projeto, requisitos e protótipos","p":"Quais são as 4 atividades do projeto de software?","r":"1) Projeto Arquitetural (estrutura geral), 2) Projeto de Interface (entre componentes), 3) Projeto de Componente (lógica interna), 4) Projeto de Banco de Dados (persistência)."},{"tema":"Processo de projeto, requisitos e protótipos","p":"Qual é a saída (output) da fase de Projeto/Modelagem?","r":"Diagramas UML, arquitetura técnica e DER (Diagrama Entidade-Relacionamento). Entrada: modelo de análise; saída: especificação técnica para implementação."},{"tema":"Processo de projeto, requisitos e protótipos","p":"Quais são as 7 seções do Plano de Projeto?","r":"1) Introdução, 2) Organização do projeto, 3) Análise de riscos, 4) Requisitos de hw/sw, 5) Divisão de trabalho (WBS), 6) Cronograma, 7) Monitoração e relatórios."},{"tema":"Processo de projeto, requisitos e protótipos","p":"O que é WBS (Work Breakdown Structure)?","r":"A partição do projeto em atividades, milestones e entregáveis. Permite estimar tempo e alocar pessoas a cada tarefa. É uma das 7 seções do Plano de Projeto."},{"tema":"Arquitetura, SOA e serviços web","p":"Quais são as 5 características da arquitetura de software?","r":"1) Atender stakeholders, 2) Separação de necessidades (vistas), 3) Orientada pela qualidade (RNFs), 4) Estilos recorrentes (padrões), 5) Integridade conceitual."},{"tema":"Processo de projeto, requisitos e protótipos","p":"Quais são os 3 tipos de projeto de software?","r":"1) Estrutural (alto — visão abstrata do sistema), 2) Alto nível (médio — subsistemas e módulos), 3) Detalhado (baixo — algoritmos e estruturas de dados)."},{"tema":"Arquitetura, SOA e serviços web","p":"O que é ESB (Enterprise Service Bus)?","r":"O barramento central do SOA: roteia mensagens, transforma formatos, aplica segurança (XML Encryption) e monitora o tráfego. Elimina a integração ponto-a-ponto (N×(N-1) conexões)."},{"tema":"Arquitetura, SOA e serviços web","p":"Quais são os dois principais custos de adotar SOA?","r":"1) Mudança cara nos modelos existentes (redesenho de sistemas legados), 2) Sistemas que já funcionam não justificam o investimento — análise custo-benefício é obrigatória."},{"tema":"Arquitetura, SOA e serviços web","p":"Quais são as 4 camadas da arquitetura de serviços web?","r":"1) Cliente (interface/browser), 2) Web/Container Web (recebe HTTP), 3) Negócio/EJB (lógica e orquestração), 4) EIS — Enterprise Information Systems (dados e sistemas legados)."},{"tema":"Arquitetura, SOA e serviços web","p":"Quais verbos HTTP mapeiam para o padrão HTTPServlet?","r":"GET → doGet() (leitura), POST → doPost() (criação), PUT → doPut() (atualização completa), DELETE → doDelete() (remoção), HEAD → doHead() (verificar existência)."},{"tema":"Modelagem: análise estruturada e UML","p":"Quais são os 4 componentes de um DFD?","r":"1) Bolha de Processo (retângulo arredondado — transforma dados), 2) Fluxo de Dados (seta nomeada), 3) Entidade Externa (quadrado duplo — fora do sistema), 4) Depósito de Dados (retângulo aberto — armazenamento)."},{"tema":"Modelagem: análise estruturada e UML","p":"O que é o Dicionário de Dados (DD) e qual símbolo usa?","r":"Documenta o significado de cada dado no sistema. Símbolos: '=' (é composto por), '+' (e), '()' (opcional), '[|]' (alternativas/ou), '{}' (repete), '@' (chave primária)."},{"tema":"Modelagem: análise estruturada e UML","p":"Quais são os 4 pilares da Orientação a Objetos?","r":"1) Encapsulamento (ocultar estado interno), 2) Herança (reutilizar e especializar), 3) Polimorfismo (mesmo método, comportamentos diferentes), 4) Abstração (modelar essência, ignorar detalhes irrelevantes)."},{"tema":"Modelagem: análise estruturada e UML","p":"Qual a diferença entre Agregação e Composição em UML?","r":"Agregação (losango vazio): 'tem um' — parte pode existir sem o todo. Ex: Departamento ◇ Funcionário. Composição (losango cheio): parte depende do todo. Ex: Pedido ◆ ItemPedido."},{"tema":"Processo de projeto, requisitos e protótipos","p":"Qual a diferença entre protótipo Horizontal e Vertical?","r":"Horizontal: grande variedade de funções com poucos detalhes em cada (visão ampla). Vertical: poucas funções, cada uma detalhada ao máximo (aprofundamento de módulo crítico)."},{"tema":"Processo de projeto, requisitos e protótipos","p":"Qual a diferença entre Design Conceitual e Físico?","r":"Design Conceitual: define o que o sistema faz do ponto de vista do usuário, sem tecnologia. Design Físico: define como será implementado — tecnologias, estrutura de telas, acessibilidade."},{"tema":"Processo de projeto, requisitos e protótipos","p":"Quais são os 3 níveis de fidelidade de protótipos?","r":"Baixo: papel/post-its, sem semelhança visual — para validar fluxos. Médio: computadorizado com visual parcial. Alto: materiais reais, banco de homologação — igual ao produto final."},{"tema":"Processo de projeto, requisitos e protótipos","p":"Qual a diferença entre protótipo Descartável e Evolutivo?","r":"Descartável: criado para explorar ideias e descartado após — não vira o sistema final. Evolutivo: refinado iterativamente até se tornar o produto de produção."},{"tema":"Modelagem: análise estruturada e UML","p":"Quais são os símbolos de visibilidade em UML?","r":"+ público (qualquer lugar), - privado (só dentro da classe), # protegido (classe e subclasses), ~ pacote (classes no mesmo pacote)."},{"tema":"Modelagem: análise estruturada e UML","p":"O que significam as multiplicidades 0..1, 1, 1..*, e *?","r":"0..1 = no máximo um (pode ser zero), 1 = exatamente um, 1..* = um ou mais, * = zero ou mais (qualquer quantidade)."},{"tema":"Modelagem: análise estruturada e UML","p":"O que é um componente em UML?","r":"Pedaço reutilizável de funcionalidade do sistema. Possui interfaces fornecidas (o que oferece) e requeridas (o que precisa). Representado por retângulo com estereótipo <<component>>."},{"tema":"Modelagem: análise estruturada e UML","p":"O que é Interface Fornecida vs Interface Requerida?","r":"Fornecida (círculo/bola): operações que o componente implementa e oferece. Requerida (semicírculo/soquete): operações que o componente precisa de outros para funcionar."},{"tema":"Modelagem: análise estruturada e UML","p":"Quais são os tipos de mensagens no Diagrama de Sequência?","r":"Síncrona (seta sólida cheia — aguarda resposta), Assíncrona (seta aberta — não aguarda), Retorno (tracejada aberta), Self (auto-delegação), Criação (tracejada → retângulo), Destruição (seta com X)."},{"tema":"Modelagem: análise estruturada e UML","p":"O que são Fragmentos Combinados no Diagrama de Sequência?","r":"Estruturas de controle: [alt] = if/else, [opt] = if sem else, [loop] = for/while, [par] = paralelo/threads, [break] = retorno antecipado, [neg] = sequência inválida/proibida."},{"tema":"Banco de dados relacional","p":"Quais são os 4 tipos de JOIN no SQL?","r":"INNER JOIN: só com correspondência em ambas as tabelas. LEFT JOIN: todos da esquerda + correspondências. RIGHT JOIN: todos da direita + correspondências. FULL JOIN: todos de ambas."},{"tema":"Banco de dados relacional","p":"Qual a diferença entre Chave Primária (PK) e Chave Estrangeira (FK)?","r":"PK: identificador único de cada registro da tabela — não nulo, não duplicado. FK: referência a uma PK de outra tabela, garantindo integridade referencial (registro não pode ser órfão)."},{"tema":"Banco de dados relacional","p":"Quais são os símbolos básicos do DER?","r":"Retângulo = Entidade, Elipse = Atributo, Elipse sublinhada = Atributo-chave (PK), Elipse dupla = Atributo multivalorado, Losango = Relacionamento, Retângulo duplo = Entidade fraca."},{"tema":"Banco de dados relacional","p":"Quais são as 3 cardinalidades do DER?","r":"1:1 (um para um — ex: pessoa ↔ passaporte), 1:N (um para muitos — ex: cliente ↔ pedidos), N:N (muitos para muitos — ex: alunos ↔ disciplinas — gera tabela intermediária)."},{"tema":"Banco de dados relacional","p":"Quais são as constraints essenciais do MER/SQL?","r":"PRIMARY KEY (unicidade + não nulo), FOREIGN KEY (integridade referencial), NOT NULL (campo obrigatório), UNIQUE (valor único na tabela), DEFAULT (valor padrão), CHECK (validação de regra de negócio)."},{"tema":"Banco de dados relacional","p":"Qual a diferença entre MER e DER?","r":"MER (Modelo): abstrato/conceitual — independe de tecnologia, comunica com cliente. DER (Diagrama): representação gráfica — lógico/físico, base para implementação do banco."}],"questoes":[{"tema":"Arquitetura, SOA e serviços web","q":"Qual estilo arquitetural é mais adequado para um MVP com time pequeno?","op":["Monolítico","Microsserviços com Kubernetes","SOA com ESB","Orientada a Eventos com Kafka"],"r":0,"exp":"A arquitetura Monolítica é recomendada para times pequenos, MVPs e domínios indefinidos: desenvolvimento simples, fácil de testar, baixa barreira de entrada."},{"tema":"Arquitetura, SOA e serviços web","q":"Na arquitetura em Camadas, qual é a ordem correta do topo para a base?","op":["Dados → Negócio → Apresentação","Negócio → Apresentação → Dados","Apresentação → Dados → Negócio","Apresentação → Negócio → Dados"],"r":3,"exp":"Apresentação (interface com usuário) → Negócio (regras) → Dados (persistência). Cada camada comunica apenas com a imediatamente adjacente."},{"tema":"Processo de projeto, requisitos e protótipos","q":"O que são Requisitos Não Funcionais (RNF) e qual seu papel na arquitetura?","op":["Descrevem funcionalidades do usuário — irrelevantes para arquitetura","Não descrevem o que o sistema faz, mas como se comporta — determinam a escolha arquitetural","São apenas requisitos de desempenho isolados","Definem o banco de dados a ser usado"],"r":1,"exp":"RNFs (escalabilidade, segurança, manutenibilidade) definem COMO o sistema se comporta e são o fator principal na escolha da arquitetura."},{"tema":"Processo de projeto, requisitos e protótipos","q":"Qual é a principal saída (output) da fase de Projeto/Modelagem no ciclo de vida do software?","op":["Diagramas UML, arquitetura e DER","Especificação de requisitos do cliente","Código-fonte da aplicação","Produto final validado e testado"],"r":0,"exp":"A fase de Projeto/Modelagem recebe o modelo de análise e produz: Diagramas UML, arquitetura técnica e DER — especificação técnica para a equipe de implementação."},{"tema":"Processo de projeto, requisitos e protótipos","q":"Qual das quatro atividades do projeto define a estrutura geral do sistema?","op":["Projeto de Interface","Projeto de Componente","Projeto Arquitetural","Projeto de Banco de Dados"],"r":2,"exp":"O Projeto Arquitetural identifica os componentes principais (subsistemas/módulos), seus relacionamentos e como são distribuídos — é a visão estrutural de mais alto nível."},{"tema":"Processo de projeto, requisitos e protótipos","q":"Qual seção do Plano de Projeto contém a partição em atividades e milestones?","op":["Análise de riscos","WBS — Divisão de trabalho","Cronograma do projeto","Monitoração e relatórios"],"r":1,"exp":"A WBS (Work Breakdown Structure) é a seção que partição o projeto em atividades, milestones e entregáveis, permitindo estimar tempo e alocar pessoas."},{"tema":"Arquitetura, SOA e serviços web","q":"Qual das 5 características garante que novas adições ao sistema se alinhem com a visão geral?","op":["Integridade conceitual","Separação de necessidades","Orientada pela qualidade","Atender stakeholders"],"r":0,"exp":"A Integridade Conceitual garante que a arquitetura mantém uma visão geral coerente e que todas as adições estejam alinhadas com ela — papel do arquiteto de software."},{"tema":"Arquitetura, SOA e serviços web","q":"O que o ESB (Enterprise Service Bus) resolve no SOA?","op":["Autenticação de usuários no sistema","A integração ponto-a-ponto onde cada serviço se conectaria a todos os outros","O armazenamento centralizado de dados","A transformação de HTML em XML"],"r":1,"exp":"Sem ESB, N serviços precisariam de N×(N-1) conexões diretas. O ESB centraliza: todos falam com o barramento, que roteia, transforma e monitora as mensagens."},{"tema":"Arquitetura, SOA e serviços web","q":"Em qual era/paradigma o SOA surgiu?","op":["Até anos 70 — programação estruturada","Anos 2000 — para integrar sistemas heterogêneos","Anos 80-90 — orientação a objetos","Anos 2010+ — cloud native"],"r":1,"exp":"O SOA surgiu nos anos 2000 para resolver o problema de integrar sistemas heterogêneos e expor lógica de negócio como serviço reutilizável."},{"tema":"Arquitetura, SOA e serviços web","q":"Na arquitetura de serviços web em 4 camadas, qual camada abriga a lógica de negócio?","op":["Camada Cliente","Camada Web (Container Web)","Camada EIS","Camada de Negócio (EJB)"],"r":3,"exp":"A Camada de Negócio (EJB/Business Tier) é responsável pela lógica de negócio, orquestração de serviços e transações. A camada Web recebe o HTTP e delega para ela."},{"tema":"Arquitetura, SOA e serviços web","q":"Qual método HTTPServlet é mapeado para o verbo HTTP DELETE?","op":["doGet()","doPost()","doDelete()","doPut()"],"r":2,"exp":"Mapeamento REST-Servlet: GET→doGet (leitura), POST→doPost (criação), PUT→doPut (atualização), DELETE→doDelete (remoção), HEAD→doHead (verificar existência)."},{"tema":"Modelagem: análise estruturada e UML","q":"No DFD, qual elemento representa uma fonte ou destino de dados FORA do sistema?","op":["Entidade Externa","Bolha de Processo","Fluxo de Dados","Depósito de Dados"],"r":0,"exp":"A Entidade Externa (quadrado duplo) representa fontes ou destinos de dados fora do sistema (usuários, outros sistemas). Não é processada pelo sistema — apenas interage com ele."},{"tema":"Modelagem: análise estruturada e UML","q":"No Dicionário de Dados, o símbolo [ | ] representa:","op":["Alternativas (OU entre opções)","Concatenação de campos","Componente opcional","Campo que se repete"],"r":0,"exp":"[ | ] representa alternativas/seleção: o campo pode assumir um dos valores listados. Ex: tipo = [físico | jurídico]. Já () = opcional, {} = repete, + = e/concatenação."},{"tema":"Modelagem: análise estruturada e UML","q":"O que representa uma Composição (losango cheio) no Diagrama de Classes UML?","op":["Herança — 'é um tipo de'","Agregação — parte pode existir sem o todo","Realização de interface","Composição — parte depende totalmente do todo para existir"],"r":3,"exp":"Composição (losango cheio ◆): parte não pode existir sem o todo. Ex: ItemPedido não existe sem Pedido. Já Agregação (losango vazio ◇): parte pode existir independente (Funcionário sem Departamento)."},{"tema":"Modelagem: análise estruturada e UML","q":"Qual dos 4 pilares OO permite que o mesmo método tenha comportamentos diferentes em subclasses?","op":["Encapsulamento","Herança","Polimorfismo","Abstração"],"r":2,"exp":"Polimorfismo: o mesmo método (ex: calcularSalario()) tem comportamentos diferentes em cada subclasse (FuncionarioCLT, FuncionarioPJ). Permite tratar objetos diferentes de forma uniforme."},{"tema":"Processo de projeto, requisitos e protótipos","q":"Qual é a principal diferença entre protótipo Horizontal e Vertical?","op":["Horizontal tem mais detalhes por função; Vertical tem mais funções","Horizontal tem grande variedade de funções com poucos detalhes; Vertical tem poucas funções com máximo detalhe","Horizontal é em papel; Vertical é digital","Horizontal é descartável; Vertical é evolutivo"],"r":1,"exp":"Horizontal: breadth — muitas funções, poucos detalhes (visão ampla do sistema). Vertical: depth — poucas funções, máximo detalhamento (aprofundamento de módulo crítico)."},{"tema":"Processo de projeto, requisitos e protótipos","q":"Qual nível de prototipação usa os mesmos materiais do produto final e banco de homologação?","op":["Baixo nível","Alto nível","Médio nível","Ultra fidelidade"],"r":1,"exp":"Alto nível: usa os mesmos materiais do produto final com banco de dados de homologação — semelhança idêntica ao produto real. Baixo = papel; Médio = computadorizado parcial."},{"tema":"Processo de projeto, requisitos e protótipos","q":"Qual tipo de protótipo é criado para explorar ideias e NÃO se torna o sistema final?","op":["Descartável","Evolutivo","Vertical","De alto nível"],"r":0,"exp":"Protótipo Descartável: criado para explorar e validar ideias rapidamente, descartado após aprendizagem. Evolutivo: refinado iterativamente até virar o produto de produção."},{"tema":"Modelagem: análise estruturada e UML","q":"Qual símbolo UML representa visibilidade 'private' em um Diagrama de Classes?","op":["+ (mais)","# (cerquilha/hash)","- (menos/hífen)","~ (til)"],"r":2,"exp":"Visibilidade em UML: + = public (qualquer lugar), - = private (só na própria classe), # = protected (classe e subclasses), ~ = package (mesmo pacote)."},{"tema":"Modelagem: análise estruturada e UML","q":"O que significa a multiplicidade '1..*' em um Diagrama de Classes?","op":["Um ou mais (pelo menos um)","No máximo um","Exatamente um","Zero ou mais"],"r":0,"exp":"1..* = um ou mais — pelo menos um é obrigatório. 0..1 = no máximo um. 1 = exatamente um. * ou 0..* = zero ou mais (qualquer quantidade)."},{"tema":"Modelagem: análise estruturada e UML","q":"O que é uma Interface Requerida em um Diagrama de Componentes?","op":["Operações que o componente implementa e oferece a outros","Operações que o componente precisa de outros para funcionar","Dependência entre dois componentes do mesmo pacote","Uma porta de comunicação entre o sistema e o usuário"],"r":1,"exp":"Interface Requerida (semicírculo/soquete): operações que o componente PRECISA de outros para funcionar. Interface Fornecida (círculo/bola): operações que o componente IMPLEMENTA e oferece."},{"tema":"Modelagem: análise estruturada e UML","q":"No Diagrama de Sequência, o fragmento [alt] equivale a qual estrutura de código?","op":["for / while (laço)","try / catch (tratamento de erro)","if / else if / else (condicional)","break / return (saída antecipada)"],"r":2,"exp":"[alt] = alternativa — if/else if/else. [loop] = for/while. [opt] = if sem else. [break] = saída antecipada. [par] = processamento paralelo/threads."},{"tema":"Modelagem: análise estruturada e UML","q":"Qual tipo de mensagem no Diagrama de Sequência NÃO aguarda resposta antes de continuar?","op":["Síncrona","Retorno","Self (auto-delegação)","Assíncrona"],"r":3,"exp":"Mensagem Assíncrona (seta aberta): o objeto continua processando sem aguardar resposta. Síncrona (seta sólida cheia): bloqueia aguardando retorno antes de prosseguir."},{"tema":"Banco de dados relacional","q":"Qual tipo de JOIN retorna APENAS registros com correspondência em AMBAS as tabelas?","op":["LEFT JOIN","RIGHT JOIN","FULL JOIN","INNER JOIN"],"r":3,"exp":"INNER JOIN: só retorna registros que têm correspondência em ambas as tabelas. LEFT/RIGHT JOIN incluem todos de um lado + null do outro. FULL JOIN inclui todos de ambos."},{"tema":"Banco de dados relacional","q":"Qual a função da FOREIGN KEY em um banco relacional?","op":["Identificar unicamente cada registro da tabela","Acelerar as consultas SELECT","Garantir integridade referencial — impede registros órfãos","Definir o campo obrigatório da tabela"],"r":2,"exp":"FOREIGN KEY garante integridade referencial: um registro filho não pode referenciar uma PK que não existe na tabela pai. Impede 'registros órfãos'."},{"tema":"Banco de dados relacional","q":"No DER, qual símbolo representa um Relacionamento entre entidades?","op":["Retângulo","Losango","Elipse","Retângulo duplo"],"r":1,"exp":"Losango = Relacionamento (associação entre entidades). Retângulo = Entidade. Elipse = Atributo. Elipse sublinhada = Atributo-chave (PK). Retângulo duplo = Entidade fraca."},{"tema":"Banco de dados relacional","q":"Uma relação N:N (muitos para muitos) no DER exige o quê na implementação?","op":["Uma FK em uma das tabelas","Duas FKs na tabela de maior cardinalidade","Uma tabela intermediária (associativa) com as FKs de ambas","Apenas um índice composto nas duas tabelas"],"r":2,"exp":"N:N gera uma tabela intermediária/associativa com as FKs de ambas as entidades envolvidas. Ex: Alunos ↔ Disciplinas → tabela Matriculas(id_aluno, id_disciplina)."},{"tema":"Banco de dados relacional","q":"Qual constraint SQL garante que um campo nunca pode ser nulo?","op":["UNIQUE","DEFAULT","CHECK","NOT NULL"],"r":3,"exp":"NOT NULL garante que o campo é obrigatório. UNIQUE = valor único na tabela. DEFAULT = valor padrão quando não informado. CHECK = valida regra de negócio (ex: preco > 0)."},{"tema":"Banco de dados relacional","q":"Qual tipo de dado SQL deve ser usado para valores monetários? Por quê?","op":["FLOAT — precisão de ponto flutuante","INT — arredonda automaticamente","VARCHAR — flexibilidade de formato","DECIMAL(p,s) — precisão exata sem erros de arredondamento"],"r":3,"exp":"DECIMAL(p,s) garante precisão exata. FLOAT e DOUBLE usam ponto flutuante binário, que pode gerar erros de arredondamento em valores monetários (ex: 0.1 + 0.2 ≠ 0.3 em float)."}],"discursivas":[],"colas":[]},{"id":"responsive-web","nome":"Responsive Web Development","sigla":"RWD","cor":"#06b6d4","corTexto":"#06b6d4","corFundo":"#047f93","periodo":3,"pasta":"Responsive Web Development","arquivos":[],"links":[{"nome":"Menu principal","url":"https://samuelgomezdev.github.io/responsive_web_development/","desc":"Índice de todos os exercícios publicados"},{"nome":"Aula 01 — Lobo","url":"https://samuelgomezdev.github.io/responsive_web_development/aula01-lobo/","desc":"HTML básico: estrutura, imagem, parágrafo e link externo"},{"nome":"Aula 02 — Posicionamento Float","url":"https://samuelgomezdev.github.io/responsive_web_development/aula02-float/","desc":"Layout com float: right, clear: both e box-sizing: border-box"},{"nome":"Aula 03 — Seletores CSS","url":"https://samuelgomezdev.github.io/responsive_web_development/aula03-seletores-css/","desc":"Seletores de tag, classe e ID; hover e especificidade"},{"nome":"Fórum Temático — Carta do Leitor","url":"https://samuelgomezdev.github.io/responsive_web_development/forum-tematico/","desc":"Layout editorial responsivo com gradientes e listas semânticas"},{"nome":"Unidade de Aprendizagem — Estados e Cidades","url":"https://github.com/samuelgomezdev/responsive_web_development/tree/main/unidade-aprendizagem","desc":"Select dinâmico com AJAX (XMLHttpRequest) e backend PHP devolvendo JSON"},{"nome":"Calculadora Espacial","url":"https://samuelgomezdev.github.io/responsive_web_development/calculadora/","desc":"JS, CSS e HTML: estrelas animadas, sons e efeitos neon"},{"nome":"Repositório no GitHub","url":"https://github.com/samuelgomezdev/responsive_web_development","desc":"Código-fonte completo dos exercícios"}],"resumos":[{"tema":"HTML5 e formulários","html":"<p><b>&lt;!DOCTYPE html&gt;<\/b> informa ao navegador que o documento é <b>HTML5<\/b>, ativando o modo de renderização correto. Sem ele o browser cai no <b>quirks mode<\/b>, compatibilidade legada de resultado imprevisível.<\/p><pre>&lt;!DOCTYPE html&gt;\n&lt;html lang=\"pt-BR\"&gt;\n&lt;head&gt;\n  &lt;meta charset=\"UTF-8\"&gt;\n  &lt;meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"&gt;\n  &lt;title&gt;Página&lt;/title&gt;\n&lt;/head&gt;\n&lt;body&gt;&lt;/body&gt;\n&lt;/html&gt;<\/pre><p><code>lang<\/code> declara o idioma, <code>charset=\"UTF-8\"<\/code> garante a acentuação e a <b>meta viewport<\/b> permite a adaptação à tela — sem ela o celular renderiza a página como desktop reduzido.<\/p><p>As <b>tags semânticas<\/b> substituem o <code>&lt;div&gt;<\/code> genérico e favorecem SEO e acessibilidade:<\/p><ul><li><b>&lt;header&gt;<\/b> cabeçalho e <b>&lt;footer&gt;<\/b> rodapé;<\/li><li><b>&lt;nav&gt;<\/b> menu de navegação;<\/li><li><b>&lt;main&gt;<\/b> conteúdo principal — <b>único por página<\/b>;<\/li><li><b>&lt;article&gt;<\/b> conteúdo autossuficiente, que faz sentido fora do contexto do site (post, notícia);<\/li><li><b>&lt;section&gt;<\/b> seção temática ligada ao contexto da página;<\/li><li><b>&lt;aside&gt;<\/b> conteúdo lateral.<\/li><\/ul><p>Só <code>&lt;main&gt;<\/code> não se repete; as demais podem aparecer várias vezes.<\/p><p><b>Formulários.<\/b> A tag <code>&lt;form&gt;<\/code> usa <code>name<\/code>, <code>method<\/code> (<b>get<\/b> ou <b>post<\/b>) e <code>action<\/code> (script destino — se omitido, envia para a própria página). <b>GET<\/b> põe os dados na URL: serve a buscas e filtros, mas expõe tudo em histórico e logs. <b>POST<\/b> envia no corpo da requisição e é o método de login e senhas.<\/p><p>O HTML5 trouxe <b>inputs com validação nativa<\/b>, sem JavaScript: <code>email<\/code> (formato nome@dominio), <code>url<\/code>, <code>number<\/code> (<code>min<\/code>, <code>max<\/code>, <code>step<\/code>), <code>range<\/code>, <code>date<\/code>, <code>time<\/code> e <code>color<\/code>.<\/p><pre>&lt;form name=\"contato\" method=\"post\" action=\"salvar.php\"&gt;\n  &lt;input type=\"email\" name=\"email\" required&gt;\n  &lt;input type=\"submit\" value=\"Enviar\"&gt;\n&lt;/form&gt;<\/pre>"},{"tema":"CSS3, layout e design do site","html":"<p><b>Três formas de aplicar CSS:<\/b> <b>externo<\/b>, com <code>&lt;link rel=\"stylesheet\" href=\"style.css\"&gt;<\/code> — padrão profissional, separa estrutura de apresentação; <b>interno<\/b>, no <code>&lt;style&gt;<\/code> do <code>&lt;head&gt;<\/code>, para prototipação; <b>inline<\/b>, no atributo <code>style<\/code>, a evitar.<\/p><p><b>Especificidade<\/b> decide qual regra vence: <b>inline (1000) &gt; ID # (100) &gt; classe, pseudoclasse e atributo (10) &gt; tag (1) &gt; universal * (0)<\/b>. O <code>!important<\/code> sobrepõe tudo; em empate, vence a última regra.<\/p><p><b>Flexbox<\/b> resolve <b>uma dimensão<\/b> (linha OU coluna): menus e alinhamento. <code>justify-content<\/code> alinha no <b>eixo principal<\/b>, <code>align-items<\/code> no <b>eixo cruzado<\/b>. <b>Grid<\/b> resolve <b>duas dimensões<\/b> (linhas E colunas), o esqueleto da página.<\/p><pre>.menu { display: flex; justify-content: space-between; align-items: center; }\n.pagina { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }<\/pre><p><code>repeat(3, 1fr)<\/code> cria <b>3 colunas iguais<\/b>; <code>fr<\/code> é fração do espaço livre.<\/p><p><b>Pilares do responsivo:<\/b> meta viewport; <b>media queries<\/b> (<code>@media (min-width: 768px)<\/code>); unidades relativas <code>%<\/code>, <code>rem<\/code>, <code>vw<\/code>, <code>vh<\/code>; Flexbox e Grid. No <b>Mobile First<\/b>, parte-se do menor breakpoint.<\/p><p>A <b>arquitetura web tem 4 camadas<\/b>: Apresentação (browser) → Processamento da Aplicação (negócio) → Gerenciamento de Dados → Banco de Dados.<\/p><p><b>Cinco categorias de sistemas web:<\/b> site de conteúdo; registro de dados; portal (agrega fontes); <b>aplicação orientada à transação<\/b> — loja virtual, banco, reservas: processa operações com feedback imediato; blog. O <b>site estático<\/b> tem baixa interatividade e atualização manual; a <b>aplicação web<\/b>, alta interatividade e conteúdo dinâmico do banco.<\/p><p><b>Processo de design:<\/b> briefing (<b>personas<\/b>) → arquitetura de informação (<b>sitemap<\/b>, fluxos) → <b>wireframe<\/b>, esboço de <b>baixa fidelidade<\/b> sem visual final → identidade visual → <b>mockup<\/b>/protótipo de alta fidelidade (Figma) → implementação.<\/p>"},{"tema":"JavaScript, AJAX e ambiente local","html":"<p>O <b>DOM (Document Object Model)<\/b> é a representação em árvore do HTML, que o JavaScript lê e altera.<\/p><pre>document.getElementById(\"titulo\").innerHTML = \"Olá\";\ndocument.querySelector(\".card\").classList.add(\"ativo\");<\/pre><p><code>getElementById(\"id\")<\/code> e <code>querySelector(\"#id\")<\/code> selecionam um elemento pelo id: o primeiro é mais eficiente, o segundo aceita <b>qualquer seletor CSS<\/b>.<\/p><p><b>Eventos<\/b> vão em <code>addEventListener()<\/code>: <code>click<\/code>, <code>submit<\/code>, <code>input<\/code>, <code>change<\/code>, <code>keydown<\/code>, <code>mouseover<\/code> e <b><code>DOMContentLoaded<\/code><\/b>. Este dispara assim que o DOM está montado, sem esperar imagens e CSS; <code>window.onload<\/code> só dispara com <b>todos<\/b> os recursos carregados.<\/p><p><b>AJAX<\/b> (Asynchronous JavaScript And XML) atualiza partes da página <b>sem recarregá-la<\/b>: experiência fluida e menos tráfego. Usa <code>XMLHttpRequest<\/code> ou a <b>Fetch API<\/b> (moderna, com Promises). Estados do <code>readyState<\/code>: <b>0<\/b> não inicializado, <b>1<\/b> <code>open()<\/code> chamado, <b>2<\/b> <code>send()<\/code> chamado, <b>3<\/b> recebendo parcialmente, <b>4<\/b> <b>resposta completa<\/b> — só aí, com <code>status<\/code> 200, ela pode ser lida.<\/p><pre>const xhr = new XMLHttpRequest();\nxhr.open(\"GET\", \"cidades.php?uf=SC\", true);\nxhr.onreadystatechange = function () {\n  if (xhr.readyState === 4 &amp;&amp; xhr.status === 200) {\n    const dados = JSON.parse(xhr.responseText);\n  }\n};\nxhr.send();<\/pre><p>Converta a resposta com <b><code>JSON.parse()<\/code><\/b>, nunca com <code>eval()<\/code>: <code>eval()<\/code> executa qualquer expressão JavaScript e permite <b>JS Injection<\/b>; <code>JSON.parse()<\/code> aceita somente JSON válido.<\/p><p><b>XAMPP<\/b> é o ambiente de desenvolvimento local: <b>X<\/b> = Cross-platform (Win/Linux/Mac), <b>A<\/b> = <b>Apache<\/b> (servidor web), <b>M<\/b> = <b>MySQL/MariaDB<\/b> (banco de dados), <b>P<\/b> = <b>PHP<\/b>, <b>P<\/b> = Perl. Roda um servidor web na própria máquina: os arquivos ficam em <code>htdocs<\/code>, acessados por <code>http://localhost<\/code> — abrir um <code>.php<\/code> pelo sistema de arquivos não executa o código.<\/p>"},{"tema":"PHP: sintaxe e formulários","html":"<p>O código PHP fica entre <code>&lt;?php ... ?&gt;<\/code>, roda <b>no servidor<\/b> e devolve HTML ao navegador.<\/p><p><b>Superglobais<\/b> — arrays acessíveis em qualquer escopo:<\/p><ul><li><code>$_GET<\/code> — dados vindos pela URL (<code>?nome=Ana<\/code>);<\/li><li><code>$_POST<\/code> — dados no corpo da requisição (<code>method=\"post\"<\/code>);<\/li><li><code>$_REQUEST<\/code> — reúne <code>$_GET<\/code>, <code>$_POST<\/code> e <code>$_COOKIE<\/code>;<\/li><li><code>$_SESSION<\/code> — sessão do usuário (com <code>session_start()<\/code>);<\/li><li><code>$_COOKIE<\/code>, <code>$_FILES<\/code> (upload) e <code>$_SERVER<\/code>.<\/li><\/ul><p><code>==<\/code> compara só o <b>valor<\/b>, com coerção de tipo; <code>===<\/code> compara <b>valor e tipo<\/b>. Por isso <code>0 == false<\/code> é <b>true<\/b>, mas <code>0 === false<\/code> é <b>false<\/b>. Em validações, prefira <code>===<\/code>.<\/p><p><b>Repetição:<\/b> <code>while<\/code> testa a condição <b>antes<\/b> e pode não executar nenhuma vez; <code>do...while<\/code> testa <b>depois<\/b>, garantindo ao menos uma execução; <code>for<\/code> serve a iterações em número conhecido; <code>foreach<\/code> percorre arrays. <code>break<\/code> sai do laço, <code>continue<\/code> pula a iteração.<\/p><p><b>Arrays<\/b> são <b>indexados<\/b> (<code>[0, 1, 2]<\/code>), <b>associativos<\/b> (<code>chave =&gt; valor<\/code>) ou <b>multidimensionais<\/b>. Funções <b>variádicas<\/b> recebem número variável de argumentos com <code>...$args<\/code>; <b>anônimas<\/b> (closures) não têm nome e vão em variáveis ou como argumento.<\/p><pre>$pessoa = ['nome' =&gt; 'Ana', 'idade' =&gt; 25];\nforeach ($pessoa as $chave =&gt; $valor) { echo \"$chave: $valor\"; }\nfunction soma(...$nums) { return array_sum($nums); }\n$dobro = function ($n) { return $n * 2; };<\/pre><p><b>Nunca confie no dado do formulário.<\/b> <code>filter_var()<\/code> valida e sanitiza com filtros como <code>FILTER_VALIDATE_EMAIL<\/code>, <code>FILTER_VALIDATE_INT<\/code>, <code>FILTER_VALIDATE_URL<\/code> e <code>FILTER_SANITIZE_STRING<\/code> (obsoleto desde o PHP 8.1). Para exibir texto do usuário, use <code>htmlspecialchars()<\/code>.<\/p><pre>$email = filter_var($_POST['email'], FILTER_VALIDATE_EMAIL);<\/pre>"},{"tema":"PHP: banco de dados, MVC e padrões","html":"<p><b>CRUD<\/b> é o ciclo de persistência, cada operação com seu SQL: <b>C<\/b>reate → <code>INSERT INTO<\/code>, <b>R<\/b>ead → <code>SELECT<\/code>, <b>U<\/b>pdate → <code>UPDATE ... SET<\/code>, <b>D<\/b>elete → <code>DELETE FROM<\/code>. Sem <code>WHERE<\/code>, <code>UPDATE<\/code> e <code>DELETE<\/code> atingem a tabela inteira.<\/p><p>Arquivos típicos de um <b>módulo CRUD<\/b> em PHP:<\/p><ul><li><code>inicia.php<\/code> — configurações e conexão;<\/li><li><code>index.php<\/code> — lista os registros (READ);<\/li><li><code>form_inclui.php<\/code> — exibe o formulário;<\/li><li><b><code>inclui.php<\/code> — processa o INSERT<\/b>, valida os campos e redireciona após o sucesso.<\/li><\/ul><p><b>PDO (PHP Data Objects)<\/b> é a camada de abstração de acesso a dados: funciona com vários SGBDs (MySQL, PostgreSQL, SQLite) e usa <b>prepared statements<\/b> com <code>?<\/code> ou <code>:parametro<\/code>, separando comando de dado e <b>prevenindo SQL Injection<\/b>. As funções <code>mysql_*<\/code> foram <b>removidas no PHP 7<\/b>.<\/p><pre>$pdo = new PDO(\"mysql:host=localhost;dbname=loja\", $usuario, $senha);\n$stmt = $pdo-&gt;prepare(\"SELECT * FROM cliente WHERE email = :email\");\n$stmt-&gt;execute([':email' =&gt; $email]);\n$linhas = $stmt-&gt;fetchAll(PDO::FETCH_ASSOC);<\/pre><p><b>MVC (Model-View-Controller)<\/b> separa responsabilidades: o <b>Model<\/b> cuida dos dados, regras de negócio e banco; a <b>View<\/b> apresenta o resultado (HTML/PHP); o <b>Controller<\/b> <b>recebe as requisições<\/b> e coordena Model e View.<\/p><p>O <b>Singleton<\/b> garante <b>uma única instância<\/b> de uma classe: construtor <b>privado<\/b>, atributo <b>estático<\/b> guardando a instância e método estático <code>getInstance()<\/code>, que só cria o objeto se ele ainda não existir — típico de conexão de banco e logger. O <b>Factory<\/b> <b>centraliza a criação de objetos<\/b>: em vez de <code>new<\/code> espalhado, uma fábrica decide qual classe instanciar, desacoplando quem usa de quem cria.<\/p><p>O <b>Composer<\/b> é o <b>gerenciador de dependências do PHP<\/b>, equivalente ao npm: instala e atualiza bibliotecas declaradas no <code>composer.json<\/code> e faz o <b>autoload<\/b> das classes. É a base de Laravel e Symfony.<\/p>"}],"flashcards":[{"tema":"HTML5 e formulários","p":"O que é DOCTYPE e por que importa?","r":"<!DOCTYPE html> informa a versão HTML5 ao navegador, ativando o modo correto de renderização. Sem ele, o browser usa 'quirks mode' (compatibilidade legada), causando comportamentos imprevisíveis."},{"tema":"HTML5 e formulários","p":"Qual a estrutura mínima de um documento HTML5?","r":"<!DOCTYPE html>, <html lang='pt-BR'>, <head> com charset UTF-8 + meta viewport + <title>, e <body>. O charset e o viewport são essenciais para internacionalização e responsividade."},{"tema":"HTML5 e formulários","p":"Quais são as tags semânticas do HTML5?","r":"<header> (cabeçalho), <nav> (menu de navegação), <main> (conteúdo principal — único por página), <article> (conteúdo independente), <section> (seção temática), <aside> (lateral), <footer> (rodapé)."},{"tema":"HTML5 e formulários","p":"Qual a diferença entre <article> e <section>?","r":"<article>: conteúdo autossuficiente que faz sentido fora do contexto da página (post, notícia). <section>: agrupa conteúdo tematicamente relacionado ao contexto da página."},{"tema":"HTML5 e formulários","p":"Quais novos tipos de input o HTML5 adicionou?","r":"email (valida formato), url, number (min/max/step), range (slider), date, time, color (hex picker). Todos com validação nativa no navegador, sem necessidade de JavaScript."},{"tema":"HTML5 e formulários","p":"Qual a diferença entre GET e POST em formulários HTML?","r":"GET: dados visíveis na URL — para buscas e filtros (não sensíveis). POST: dados no corpo da requisição — para cadastros, logins e dados sensíveis. POST é mais seguro."},{"tema":"CSS3, layout e design do site","p":"Quais são as 3 formas de aplicar CSS? Qual é recomendada?","r":"Externo (<link href='style.css'>) — sempre preferido. Interno (<style> no <head>) — prototipação. Inline (style='...' na tag) — evitar. O externo separa estrutura de apresentação."},{"tema":"CSS3, layout e design do site","p":"Qual a ordem de especificidade dos seletores CSS?","r":"Inline style > ID (#) > Classe (.) / pseudoclasse / atributo > Tag. Em valores: inline=1000, ID=100, classe=10, tag=1, universal=0. !important override tudo (usar com cautela)."},{"tema":"CSS3, layout e design do site","p":"Quando usar Flexbox vs CSS Grid?","r":"Flexbox: layouts em 1 dimensão (linha OU coluna) — menus, alinhamento de itens. Grid: layouts em 2 dimensões (linhas E colunas) — layouts de página completos. São complementares."},{"tema":"CSS3, layout e design do site","p":"Quais são os pilares do design responsivo?","r":"1) Meta viewport, 2) Media queries (@media), 3) Unidades relativas (%, rem, vw/vh), 4) Flexbox/Grid para layouts fluidos. Mobile First: começar pelo menor breakpoint."},{"tema":"CSS3, layout e design do site","p":"Quais são as 4 camadas da arquitetura de um sistema web?","r":"1) Apresentação (interface/browser), 2) Processamento da Aplicação (lógica de negócio no servidor), 3) Gerenciamento de Dados (acesso ao banco), 4) Banco de Dados (persistência)."},{"tema":"CSS3, layout e design do site","p":"Quais são as 5 categorias de sistemas web?","r":"Site de conteúdo, Registro de dados (entrada do usuário), Portal (agrega fontes), Aplicação orientada à transação (loja virtual, banco), Blog (publicação cronológica)."},{"tema":"CSS3, layout e design do site","p":"Quais são as etapas do processo de design de um site?","r":"1) Pesquisa/briefing (personas), 2) Arquitetura (sitemap, fluxos), 3) Wireframe (esboço baixa fidelidade), 4) Identidade visual (cores, tipografia), 5) Mockup/Protótipo (Figma), 6) Implementação."},{"tema":"CSS3, layout e design do site","p":"Qual a diferença entre site estático e aplicação web?","r":"Estático: baixa interatividade, atualização manual (editar arquivo), personalização limitada. Aplicação web: alta interatividade, atualização dinâmica (banco de dados), personalização avançada."},{"tema":"JavaScript, AJAX e ambiente local","p":"O que é manipulação do DOM com JavaScript?","r":"O DOM (Document Object Model) é a representação em árvore do HTML. JavaScript acessa e modifica elementos via document.getElementById(), querySelector(), innerHTML, classList, etc."},{"tema":"JavaScript, AJAX e ambiente local","p":"Quais são os eventos JavaScript mais importantes?","r":"click, submit (envio de form), input (digitação), change (blur de select), keydown/keyup, mouseover, DOMContentLoaded (DOM pronto). Adicionados com addEventListener()."},{"tema":"JavaScript, AJAX e ambiente local","p":"O que é AJAX e qual a vantagem?","r":"Asynchronous JavaScript And XML: atualiza partes da página sem recarregar completamente. Vantagem: UX mais fluida, menos tráfego. Implementado com Fetch API (moderno) ou XMLHttpRequest."},{"tema":"JavaScript, AJAX e ambiente local","p":"Por que usar JSON.parse() em vez de eval() para converter JSON?","r":"eval() executa qualquer expressão JS — perigoso, vulnerável a JS Injection. JSON.parse() interpreta SOMENTE JSON válido, rejeitando comandos JS maliciosos. Sempre usar JSON.parse()."},{"tema":"JavaScript, AJAX e ambiente local","p":"O que significa XAMPP?","r":"X = Cross-platform (Win/Linux/Mac), A = Apache (servidor web), M = MySQL/MariaDB (banco de dados), P = PHP (linguagem server-side), P = Perl. Permite rodar servidor web localmente sem internet."},{"tema":"PHP: sintaxe e formulários","p":"Quais são as principais superglobais do PHP?","r":"$_GET (dados via URL), $_POST (corpo da requisição), $_SESSION (sessão do usuário), $_COOKIE, $_FILES (upload), $_SERVER (info do servidor), $_REQUEST ($_GET+$_POST+$_COOKIE)."},{"tema":"PHP: sintaxe e formulários","p":"Qual a diferença entre == e === em PHP?","r":"== (igual de valor): compara apenas o valor, com coerção de tipo. === (idêntico): compara valor E tipo sem coerção. Ex: 0 == false (true), mas 0 === false (false)."},{"tema":"PHP: sintaxe e formulários","p":"Quais são as estruturas de repetição do PHP?","r":"while (condição antes — pode não executar), do...while (condição depois — executa ao menos uma vez), for (número fixo de iterações). continue pula iteração; break sai do laço."},{"tema":"PHP: sintaxe e formulários","p":"Quais são os tipos de array em PHP?","r":"Array indexado (índices numéricos), Array associativo (chaves string como 'nome' => 'Ana'), Array multidimensional (arrays dentro de arrays). Percorridos com foreach."},{"tema":"PHP: sintaxe e formulários","p":"O que são funções variádicas e anônimas em PHP?","r":"Variádicas: recebem número variável de argumentos com ...$args. Anônimas (closures): funções sem nome atribuídas a variáveis ou passadas como argumento. Ex: $soma = function($a, $b) { return $a + $b; };"},{"tema":"PHP: sintaxe e formulários","p":"Quais filtros importantes tem a função filter_var() do PHP?","r":"FILTER_VALIDATE_EMAIL (valida e-mail), FILTER_VALIDATE_INT (valida inteiro), FILTER_VALIDATE_URL (valida URL), FILTER_SANITIZE_STRING (remove tags HTML). Essencial para segurança."},{"tema":"HTML5 e formulários","p":"Quais são os atributos essenciais da tag <form> em HTML?","r":"name (identifica o form), method (get ou post), action (URL do script destino — sem ele, envia para a própria página), submit (botão de envio)."},{"tema":"PHP: banco de dados, MVC e padrões","p":"O que é CRUD e qual SQL corresponde a cada operação?","r":"C = Create → INSERT INTO, R = Read → SELECT, U = Update → UPDATE...SET, D = Delete → DELETE FROM. É o ciclo completo de persistência de dados."},{"tema":"PHP: banco de dados, MVC e padrões","p":"O que é PDO e por que usar em vez de mysql_*?","r":"PDO (PHP Data Objects): abstração de acesso a banco que suporta múltiplos SGBDs (MySQL, PostgreSQL, SQLite). Funções mysql_* foram removidas no PHP 7. PDO usa prepared statements — previne SQL Injection."},{"tema":"PHP: banco de dados, MVC e padrões","p":"O que é o padrão MVC e quais são suas camadas?","r":"Model-View-Controller: Model (dados, regras de negócio, banco), View (apresentação ao usuário — HTML/PHP), Controller (recebe requisições, coordena Model e View). Separa responsabilidades claramente."},{"tema":"PHP: banco de dados, MVC e padrões","p":"O que é o Composer no ecossistema PHP?","r":"Gerenciador de dependências PHP (como npm para JavaScript). Permite instalar, atualizar e autocarregar bibliotecas via composer.json. Base de todos os frameworks PHP modernos (Laravel, Symfony)."},{"tema":"PHP: banco de dados, MVC e padrões","p":"Quais são os 3 Design Patterns abordados na UA16?","r":"1) MVC (Model-View-Controller) — separação de responsabilidades. 2) Singleton — garante uma única instância de uma classe. 3) Factory — centraliza a criação de objetos, desacoplando quem cria de quem usa."},{"tema":"PHP: banco de dados, MVC e padrões","p":"Quais são as regras do padrão Singleton?","r":"1) Construtor privado (ninguém pode instanciar com new), 2) Atributo estático que guarda a instância, 3) Método estático getInstance() que cria a instância apenas se ela ainda não existir."}],"questoes":[{"tema":"HTML5 e formulários","q":"Qual é o propósito do <!DOCTYPE html>?","op":["Definir o idioma da página","Importar estilos CSS externos automaticamente","Informar ao navegador que o documento usa HTML5, ativando o modo de renderização correto","Declarar o título da página"],"r":2,"exp":"<!DOCTYPE html> ativa o modo de renderização HTML5. Sem ele, o browser usa 'quirks mode' — compatibilidade legada que pode causar comportamentos imprevisíveis no layout."},{"tema":"HTML5 e formulários","q":"Qual tag HTML5 é mais adequada para envolver um artigo de blog que faz sentido fora do contexto do site?","op":["<section>","<div>","<aside>","<article>"],"r":3,"exp":"<article> é para conteúdo autossuficiente que pode existir fora do contexto da página. <section> é para seções temáticas relacionadas ao contexto. <aside> é para conteúdo lateral/complementar."},{"tema":"HTML5 e formulários","q":"Qual tag semântica deve ser usada APENAS UMA VEZ por página?","op":["<header>","<main>","<section>","<article>"],"r":1,"exp":"<main> representa o conteúdo principal da página e deve aparecer apenas uma vez. <header>, <footer> e <section> podem aparecer múltiplas vezes (em diferentes seções/articles)."},{"tema":"HTML5 e formulários","q":"Qual input type HTML5 valida automaticamente o formato name@domain?","op":["type='email'","type='text' com atributo pattern","type='url'","type='login'"],"r":0,"exp":"type='email' valida automaticamente o formato de e-mail sem JavaScript. HTML5 adicionou: email, url, number, range, date, time, color — todos com validação nativa."},{"tema":"HTML5 e formulários","q":"Qual método de formulário deve ser usado para enviar dados sensíveis como senhas?","op":["GET — mais eficiente","PUT — padrão REST","POST — dados no corpo da requisição, não visíveis na URL","SEND — método nativo HTML5"],"r":2,"exp":"POST envia dados no corpo da requisição — não visíveis na URL. GET expõe dados na URL (visíveis, armazenados em logs/histórico). Para login/cadastro/dados sensíveis: sempre POST."},{"tema":"CSS3, layout e design do site","q":"Qual é a forma RECOMENDADA de aplicar CSS em um projeto profissional?","op":["Arquivo externo linkado com <link rel='stylesheet'>","CSS inline (style='...' na tag)","Tag <style> dentro do <body>","Atributo class sem arquivo CSS"],"r":0,"exp":"Arquivo externo é o padrão profissional: separa estrutura (HTML) de apresentação (CSS), permite reutilização em múltiplas páginas e facilita manutenção em equipe."},{"tema":"CSS3, layout e design do site","q":"Qual seletor CSS tem MAIOR especificidade?","op":["Seletor de ID (#cabecalho)","Seletor de tag (p, div)","Seletor de classe (.menu)","Seletor universal (*)"],"r":0,"exp":"Hierarquia: inline(1000) > ID(100) > classe(10) > tag(1) > universal(0). O seletor de ID (#) tem especificidade 100, muito maior que classe(10) ou tag(1)."},{"tema":"CSS3, layout e design do site","q":"Qual propriedade CSS controla o alinhamento no eixo PRINCIPAL do Flexbox?","op":["justify-content","align-items","flex-direction","align-content"],"r":0,"exp":"justify-content controla o eixo principal (horizontal por padrão). align-items controla o eixo cruzado (vertical). Valores: flex-start, flex-end, center, space-between, space-around."},{"tema":"CSS3, layout e design do site","q":"O que faz grid-template-columns: repeat(3, 1fr) no CSS Grid?","op":["Cria 1 coluna que repete 3 vezes","Define gap de 3fr entre colunas","Cria 3 linhas de altura igual","Cria 3 colunas de tamanho igual dividindo o espaço disponível"],"r":3,"exp":"repeat(3, 1fr) cria 3 colunas iguais. '1fr' = 1 fração do espaço disponível. Com 900px e gap zero, cada coluna tem 300px. 'fr' distribui proporcionalmente o espaço livre."},{"tema":"CSS3, layout e design do site","q":"Qual das categorias de sistemas web processa operações com feedback imediato (ex: loja virtual)?","op":["Site de conteúdo","Blog","Aplicação orientada à transação","Portal"],"r":2,"exp":"Aplicação orientada à transação: processa operações com feedback imediato — lojas virtuais, sistemas bancários online, reservas. Alta interatividade e personalização avançada."},{"tema":"CSS3, layout e design do site","q":"Qual entregável do processo de design representa o esboço de BAIXA fidelidade da estrutura?","op":["Mockup no Figma","Wireframe","Sitemap","Protótipo navegável"],"r":1,"exp":"Wireframe é o esboço de baixa fidelidade — mostra estrutura e hierarquia sem visual final. Mockup = visual completo (alta fidelidade). Sitemap = mapa de páginas/hierarquia."},{"tema":"JavaScript, AJAX e ambiente local","q":"Qual evento JavaScript é disparado quando o DOM está completamente carregado?","op":["window.onload","document.ready","DOMContentLoaded","pageLoaded"],"r":2,"exp":"DOMContentLoaded dispara quando o DOM está pronto, sem esperar imagens e estilos externos. window.onload espera TODOS os recursos (imagens, CSS). DOMContentLoaded é mais rápido."},{"tema":"JavaScript, AJAX e ambiente local","q":"Qual método JavaScript seleciona um elemento pelo atributo ID?","op":["document.querySelector('#id')","document.getElementById('id')","document.getElement('id')","Ambas A e B estão corretas"],"r":3,"exp":"Ambas funcionam: getElementById('id') retorna o elemento diretamente. querySelector('#id') usa seletor CSS. getElementById é mais eficiente para IDs; querySelector é mais flexível (aceita qualquer seletor CSS)."},{"tema":"JavaScript, AJAX e ambiente local","q":"Por que JSON.parse() é mais seguro que eval() para converter JSON?","op":["JSON.parse() é mais rápido","JSON.parse() interpreta apenas JSON, rejeitando código JS malicioso; eval() executa qualquer expressão","eval() só aceita JSON válido","Não há diferença de segurança"],"r":1,"exp":"eval() executa qualquer código JavaScript — vulnerável a JS Injection. JSON.parse() aceita SOMENTE JSON válido, rejeitando comandos JS. Para dados externos: sempre JSON.parse()."},{"tema":"JavaScript, AJAX e ambiente local","q":"Qual readyState do XMLHttpRequest indica que a resposta foi COMPLETAMENTE recebida?","op":["0 — não inicializado","2 — carregado","3 — interativo","4 — completo"],"r":3,"exp":"readyState 4 = Completo: resposta totalmente recebida. 0=não iniciado, 1=open() chamado, 2=send() chamado/headers disponíveis, 3=recebendo parcialmente, 4=resposta completa."},{"tema":"JavaScript, AJAX e ambiente local","q":"O que significa o 'M' no acrônimo XAMPP?","op":["Mac — suporte ao macOS","Module — módulo de extensão","Media — suporte a multimídia","MySQL/MariaDB — banco de dados"],"r":3,"exp":"XAMPP: X=Cross-platform, A=Apache (servidor web), M=MySQL/MariaDB (banco de dados), P=PHP, P=Perl. O XAMPP é o ambiente de desenvolvimento local mais usado para PHP."},{"tema":"PHP: sintaxe e formulários","q":"Qual superglobal PHP contém os dados enviados via URL (query string)?","op":["$_POST","$_GET","$_SESSION","$_SERVER"],"r":1,"exp":"$_GET: dados na URL (?nome=Ana&email=...). $_POST: dados no corpo da requisição (formulários POST). $_SESSION: dados de sessão do usuário. $_SERVER: informações do servidor."},{"tema":"PHP: sintaxe e formulários","q":"Em PHP, qual é o resultado de: 0 == false?","op":["true — coerção de tipo: 0 e false são iguais em valor","false — tipos diferentes","Erro de tipo","true apenas com ==="],"r":0,"exp":"0 == false retorna TRUE porque == faz coerção de tipo (0 é convertido para false). Já 0 === false retorna FALSE porque === compara tipo também (int ≠ boolean)."},{"tema":"PHP: sintaxe e formulários","q":"Qual estrutura de repetição PHP garante que o bloco executa ao menos uma vez?","op":["while","for","do...while","foreach"],"r":2,"exp":"do...while: o bloco executa primeiro, a condição é verificada depois — garante ao menos uma execução. while verifica a condição ANTES, podendo não executar se falsa de início."},{"tema":"PHP: sintaxe e formulários","q":"Qual é a estrutura correta de um array associativo em PHP?","op":["$arr = [0, 1, 2]","$arr = {nome: 'Ana', idade: 25}","$arr = ['Ana', 25]","$arr = array('nome' => 'Ana', 'idade' => 25)"],"r":3,"exp":"Array associativo PHP usa a sintaxe chave => valor: array('nome' => 'Ana') ou ['nome' => 'Ana']. Diferente de array indexado ([0,1,2]) e de objeto JS ({})."},{"tema":"PHP: sintaxe e formulários","q":"Qual função PHP valida e sanitiza dados de formulário contra injeções?","op":["htmlspecialchars()","filter_var()","validate_input()","check_form()"],"r":1,"exp":"filter_var() com filtros como FILTER_VALIDATE_EMAIL, FILTER_VALIDATE_INT e FILTER_SANITIZE_STRING valida e sanitiza dados. É essencial para segurança em formulários PHP."},{"tema":"PHP: banco de dados, MVC e padrões","q":"Na estrutura de arquivos de um módulo CRUD PHP, qual arquivo processa o INSERT?","op":["index.php","inclui.php","inicia.php","form_inclui.php"],"r":1,"exp":"inclui.php: processa o INSERT, valida campos e redireciona após sucesso. form_inclui.php: exibe o formulário HTML. index.php: lista registros (READ). inicia.php: configurações."},{"tema":"PHP: banco de dados, MVC e padrões","q":"Por que usar PDO em vez das funções mysql_* para conectar ao banco em PHP?","op":["mysql_* foram removidas no PHP 7 e PDO usa prepared statements (previne SQL Injection)","PDO é mais lento mas mais simples","PDO só funciona com MySQL","Não há diferença prática"],"r":0,"exp":"mysql_* foram removidas no PHP 7+. PDO suporta múltiplos SGBDs e usa prepared statements com ? ou :param, prevenindo SQL Injection — fundamental para segurança."},{"tema":"PHP: banco de dados, MVC e padrões","q":"No padrão MVC, qual camada recebe as requisições do usuário e coordena Model e View?","op":["Model","View","Controller","Router"],"r":2,"exp":"Controller: recebe requisições, decide qual Model chamar para dados e qual View renderizar. Model: dados e regras de negócio. View: apresentação (HTML/template)."},{"tema":"PHP: banco de dados, MVC e padrões","q":"O que é o Composer no ecossistema PHP?","op":["Um editor de código PHP","O servidor web embutido do PHP","O gerenciador de dependências PHP (como npm para JavaScript)","Um framework PHP completo"],"r":2,"exp":"Composer é o gerenciador de dependências PHP. Instala, atualiza e autocarrega bibliotecas via composer.json/composer.lock. Base de frameworks modernos como Laravel e Symfony."},{"tema":"PHP: banco de dados, MVC e padrões","q":"Qual Design Pattern garante que uma classe tenha apenas UMA instância em todo o sistema?","op":["Factory","Singleton","MVC","Observer"],"r":1,"exp":"Singleton: construtor privado + atributo estático + getInstance() que cria a instância apenas se ainda não existir. Usado para conexão com banco, logger, config — recursos compartilhados."},{"tema":"PHP: banco de dados, MVC e padrões","q":"Qual é o papel do padrão Factory?","op":["Garantir uma única instância de classe","Separar a interface da implementação","Definir a estrutura MVC da aplicação","Centralizar a criação de objetos, desacoplando quem cria de quem usa"],"r":3,"exp":"Factory centraliza a criação de objetos: em vez de new Classe() espalhado no código, uma fábrica decide qual subclasse instanciar. Desacopla quem usa de quem cria, facilitando extensão."}],"discursivas":[],"colas":[]},{"id":"paradigmas","nome":"Paradigmas de Programação","sigla":"PP","cor":"#a855f7","corTexto":"#b46cf8","corFundo":"#914ad6","periodo":4,"pasta":"Paradigmas de Programação","arquivos":[{"nome":"Curryinpart2","ext":"pdf","tam":"371 KB","href":"../Paradigmas%20de%20Programa%C3%A7%C3%A3o/Curryinpart2.pdf"},{"nome":"Descomplicando_ programação imperativa, declarativa e reativa _ by Alexandre Malavasi _ Medium","ext":"pdf","tam":"3.2 MB","href":"../Paradigmas%20de%20Programa%C3%A7%C3%A3o/Descomplicando_%20programa%C3%A7%C3%A3o%20imperativa%2C%20declarativa%20e%20reativa%20_%20by%20Alexandre%20Malavasi%20_%20Medium.pdf"},{"nome":"Diferença entre as programações Orientação-objetos, Imperativa e Funcional - DevPleno","ext":"pdf","tam":"251 KB","href":"../Paradigmas%20de%20Programa%C3%A7%C3%A3o/Diferen%C3%A7a%20entre%20as%20programa%C3%A7%C3%B5es%20Orienta%C3%A7%C3%A3o-objetos%2C%20Imperativa%20e%20Funcional%20-%20DevPleno.pdf"},{"nome":"Documentação do F# – introdução, tutoriais, referência. - .NET _ Microsoft Learn","ext":"pdf","tam":"397 KB","href":"../Paradigmas%20de%20Programa%C3%A7%C3%A3o/Documenta%C3%A7%C3%A3o%20do%20F%23%20%E2%80%93%20introdu%C3%A7%C3%A3o%2C%20tutoriais%2C%20refer%C3%AAncia.%20-%20.NET%20_%20Microsoft%20Learn.pdf"},{"nome":"Expressões lambda – expressões lambda e funções anônimas - C# reference _ Microsoft Learn","ext":"pdf","tam":"377 KB","href":"../Paradigmas%20de%20Programa%C3%A7%C3%A3o/Express%C3%B5es%20lambda%20%E2%80%93%20express%C3%B5es%20lambda%20e%20fun%C3%A7%C3%B5es%20an%C3%B4nimas%20-%20C%23%20reference%20_%20Microsoft%20Learn.pdf"},{"nome":"Forum_MapFilterReduce","ext":"docx","tam":"24 KB","href":"../Paradigmas%20de%20Programa%C3%A7%C3%A3o/Forum_MapFilterReduce.docx"},{"nome":"Gui 19385992","ext":"txt","tam":"216 B","href":"../Paradigmas%20de%20Programa%C3%A7%C3%A3o/task-receipt-19385992.txt"},{"nome":"task-receipt-19386399","ext":"txt","tam":"216 B","href":"../Paradigmas%20de%20Programa%C3%A7%C3%A3o/task-receipt-19386399.txt"},{"nome":"task-receipt-19433523","ext":"txt","tam":"216 B","href":"../Paradigmas%20de%20Programa%C3%A7%C3%A3o/task-receipt-19433523.txt"},{"nome":"task-receipt-19434275","ext":"txt","tam":"216 B","href":"../Paradigmas%20de%20Programa%C3%A7%C3%A3o/task-receipt-19434275.txt"},{"nome":"tempo-programacao","ext":"pdf","tam":"301 KB","href":"../Paradigmas%20de%20Programa%C3%A7%C3%A3o/tempo-programacao.pdf"}],"links":[],"resumos":[{"tema":"Métodos de Programação e História","html":"<p>Um <b>paradigma<\/b> é um padrão de pensamento que define um modelo para resolver problemas — toda linguagem de programação é construída sobre pelo menos um. Estudar paradigmas dá <b>vocabulário conceitual<\/b>, capacidade de escolher a ferramenta certa e facilidade para aprender novas linguagens (Sebesta).<\/p><p><b>Linha do tempo:<\/b> 1954 Fortran (1ª de alto nível) → 1959 LISP (1ª funcional pura, John McCarthy, MIT) → anos 1960 crise do software → 1968 Dijkstra, <i>A Case against the GO TO Statement<\/i> → anos 1970 estruturado e declarativo (Prolog, SQL) → anos 1980-90 orientação a objetos → anos 2000 SOA → hoje multiparadigma.<\/p><p><b>Classificação clássica (4 tipos):<\/b> imperativo, estruturado, orientado a objetos e declarativo (com os subtipos lógico e funcional). Segundo Tucker e Noonan, linguagens de programação diferem das naturais por terem <b>domínio de expressão mais reduzido<\/b> e propósito específico: expressar ideias computacionais.<\/p><p><b>Duas áreas impulsionaram novos paradigmas:<\/b> a Inteligência Artificial (LISP, Prolog) e a World Wide Web (linguagens de script, declarativas para marcação e consulta).<\/p>"},{"tema":"Paradigma Imperativo","html":"<p>O <b>mais antigo e mais bem-sucedido<\/b> dos paradigmas. Surgiu na década de 1940, quando <b>John von Neumann<\/b> e colaboradores perceberam que programa e dados poderiam <b>compartilhar a memória principal<\/b> — antes disso os programas ficavam fora da memória.<\/p><p>A <b>arquitetura von Neumann-Eckert<\/b> é a base do paradigma: a memória guarda instruções e dados, e no centro está a <b>atribuição<\/b> — alterar o valor de uma posição de memória destruindo o valor anterior. Daí o conceito de <b>estado mutável<\/b>.<\/p><p><b>Todas as linguagens imperativas incluem<\/b> (Tucker e Noonan, p. 277): atribuição, declaração de variáveis, expressões, comandos condicionais, laços e abstração procedural.<\/p><p><b>Como funciona:<\/b> o programa descreve <i>COMO<\/i> chegar ao resultado — uma sequência explícita de comandos. Linguagens: C (a mais usada), Pascal, Fortran, Cobol, Basic, Ada.<\/p><p><b>Vantagens:<\/b> eficiência (espelha o hardware), controle total, modelo mental simples e direto. <b>Desvantagens:<\/b> falta de flexibilidade devido ao caráter sequencial, dificuldade de paralelizar, efeitos colaterais causados pelo estado compartilhado, código mais verboso.<\/p><p>É <b>Turing-completo<\/b>: pode expressar qualquer computação computável.<\/p>"},{"tema":"Paradigma Estruturado","html":"<p><b>Motivação histórica:<\/b> a crise do software dos anos 1960 e o uso excessivo do comando <b>GOTO<\/b>, que permitia saltos arbitrários entre instruções e gerava o chamado \"código espaguete\" — praticamente impossível de entender e manter. Em 1968 <b>Edsger W. Dijkstra<\/b> publica <i>A Case against the GO TO Statement<\/i>.<\/p><p><b>Teorema de Böhm-Jacopini:<\/b> qualquer algoritmo pode ser escrito usando apenas <b>três estruturas de controle<\/b>:<\/p><ul><li><b>Sequência<\/b> — comandos executados um após o outro<\/li><li><b>Seleção / Decisão<\/b> — if, if-else, switch<\/li><li><b>Iteração / Repetição<\/b> — for, while, do-while (executa um bloco várias vezes)<\/li><\/ul><p><b>Formas de representar um algoritmo:<\/b> linguagem natural (descrição narrativa), fluxograma (símbolos gráficos) e pseudocódigo/portugol (texto estruturado).<\/p><p><b>Outros pilares:<\/b> modularização (dividir em sub-rotinas, funções e procedimentos), refinamento sucessivo (top-down) e escopo de variáveis (locais x globais).<\/p><p>Linguagens: Pascal, C, Fortran, Cobol, Algol. Auge nas décadas de 1970 e 1980. O estruturado é um <b>refinamento disciplinado do imperativo<\/b>, não um paradigma oposto a ele.<\/p>"},{"tema":"Paradigma Declarativo","html":"<p>Surgiu na década de 1970. O programador informa <b>O QUE<\/b> quer obter — os objetivos da computação — e não <b>COMO<\/b> obter (Sebesta). O <i>como<\/i> fica a cargo do motor de execução da linguagem.<\/p><p>Um programa é um <b>conjunto de declarações<\/b> (verdade, falso, satisfaz restrição). Consequências: código mais enxuto, mais fácil de aprender que o imperativo, e a <b>ordem das declarações importa menos<\/b>.<\/p><p><b>Dois domínios principais de aplicação<\/b> (os mais cobrados em prova):<\/p><ul><li><b>Inteligência Artificial<\/b> — aplicações baseadas em regras e lógica; destaque para o <b>Prolog<\/b><\/li><li><b>Acesso a informação em banco de dados<\/b> — consulta e manipulação em SGBDs; o expoente é o <b>SQL<\/b><\/li><\/ul><p>Outros exemplos declarativos: HTML e XML (marcação), CSS, Haskell, Prolog, expressões regulares, e Web Services / integração baseada em XML.<\/p><p><b>Subparadigmas:<\/b> lógico (Prolog), funcional (LISP, Haskell, F#) e programação por restrições (domínios booleano e finito).<\/p>"},{"tema":"Paradigma Lógico","html":"<p>Baseado na <b>lógica de primeira ordem<\/b>: o programa é um conjunto de <b>fatos<\/b> e <b>regras<\/b>, e a execução é uma <b>consulta<\/b> que o motor de inferência tenta provar.<\/p><p><b>Prolog<\/b> (PROgrammation en LOGique, 1972, Colmerauer e Kowalski) é a linguagem de referência. Mecanismos: <b>unificação<\/b> (casar termos), <b>backtracking<\/b> (voltar e tentar outra alternativa) e <b>resolução<\/b>.<\/p><pre>progenitor(joao, maria).\nprogenitor(maria, ana).\navo(X, Z) :- progenitor(X, Y), progenitor(Y, Z).\n?- avo(joao, ana).   % true<\/pre><p><b>Características cobradas:<\/b> processamento simbólico (manipula símbolos, não só números), facilidade de modificação (acrescentar um fato não exige reescrever o programa) e adequação a <b>soluções heurísticas<\/b> — problemas em que não se conhece um algoritmo determinístico, apenas regras de busca.<\/p><p>Aplicações: sistemas especialistas, processamento de linguagem natural, prova automática de teoremas, diagnóstico.<\/p>"},{"tema":"POO — Modelagem de Problemas","html":"<p>A POO surgiu para <b>aplicar conceitos da realidade ao contexto da programação<\/b>: o programa é estruturado em torno de <b>objetos<\/b> que emulam entidades do mundo real.<\/p><p><b>Objeto = atributos (estado) + métodos (comportamento).<\/b> A <b>classe<\/b> é a matriz/molde: define o tipo, os atributos e a implementação dos métodos que os objetos daquele tipo terão. O objeto é a <b>instância<\/b> da classe.<\/p><p><b>Diferença de foco:<\/b> no estruturado o foco está nos <b>procedimentos<\/b> que atuam sobre dados separados; na POO os dados e os procedimentos que os manipulam ficam <b>juntos, dentro do objeto<\/b>.<\/p><p>Na POO, etapas de <b>análise e projeto<\/b> que outros paradigmas minimizavam tornam-se requisitos fundamentais. O <b>reúso de código<\/b> é consequência de boa análise e projeto — não apenas do uso de funções e procedimentos.<\/p><p><b>Os 4 pilares:<\/b> Abstração, Encapsulamento, Herança e Polimorfismo.<\/p><p>Linguagens OO: Simula 67 (a primeira), Smalltalk (a primeira puramente OO), C++, Java, C#, Python, Ruby, PHP.<\/p>"},{"tema":"POO — Classes, Relacionamentos e Encapsulamento","html":"<p><b>Encapsulamento:<\/b> apenas os métodos do próprio objeto devem manipular seus atributos. Esconde a implementação interna e expõe uma interface pública controlada (getters/setters), acrescentando uma camada de segurança e permitindo mudar o interior sem quebrar quem usa.<\/p><p><b>Modificadores de visibilidade:<\/b> <code>private<\/code> (só a própria classe), <code>protected<\/code> (classe e subclasses), <code>public<\/code> (qualquer lugar), <code>package/default<\/code> (mesmo pacote).<\/p><p><b>Relacionamentos entre classes:<\/b><\/p><ul><li><b>Associação<\/b> — ligação genérica entre classes<ul><li><b>Agregação<\/b> (losango vazio ◇): todo/parte em que a <b>parte existe independentemente<\/b> do todo. Ex.: Departamento ◇ Funcionário — o funcionário continua existindo se o departamento acabar.<\/li><li><b>Composição<\/b> (losango cheio ◆): todo/parte com <b>dependência de existência<\/b>. Ex.: Pedido ◆ ItemPedido — o item não existe sem o pedido.<\/li><\/ul><\/li><li><b>Herança<\/b> — relação \"é um tipo de\"<ul><li><b>Generalização<\/b>: de baixo para cima — extrair o que há de comum nas subclasses para a superclasse<\/li><li><b>Especialização<\/b>: de cima para baixo — criar subclasses que refinam a superclasse<\/li><\/ul><\/li><li><b>Dependência<\/b> — uma classe usa outra pontualmente (parâmetro, variável local)<\/li><\/ul>"},{"tema":"POO — Herança e Polimorfismo","html":"<p><b>Herança:<\/b> a subclasse herda <b>todos<\/b> os atributos e métodos da superclasse — inclusive os que vierem a ser acrescentados no futuro. Atributos específicos de uma subclasse devem ficar <b>só nela<\/b>, nunca subir para a superclasse.<\/p><p><b>Herança múltipla<\/b> (herdar de mais de uma classe): C++ e Python permitem; <b>Java não permite entre classes<\/b> — resolve o problema com múltiplas interfaces.<\/p><p><b>Polimorfismo:<\/b> \"muitas formas\" — seleção dinâmica de comportamento. O mesmo método assume comportamentos diferentes conforme o tipo real do objeto.<\/p><ul><li><b>Sobrecarga (overload):<\/b> mesma classe, mesmo nome de método, <b>assinaturas diferentes<\/b> (número/tipo de parâmetros). Resolvida em tempo de compilação (polimorfismo estático).<\/li><li><b>Sobreposição / sobrescrita (override):<\/b> e
