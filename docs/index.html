lica o desconto","Que emitir boleto herda de aplicar desconto","Que os dois casos de uso são executados em paralelo","Que aplicar o desconto é um comportamento opcional que estende a emissão do boleto sob certa condição"],"r":3,"exp":"O <<extend>> marca comportamento condicional, e a seta aponta do caso que estende para o caso base — sentido inverso ao do <<include>>."},{"tema":"Casos de Uso e Especificação","q":"Qual seção da especificação de um caso de uso descreve o que precisa ser verdadeiro ANTES de ele iniciar?","op":["Fluxo principal","Pré-condições","Pós-condições","Fluxos de exceção"],"r":1,"exp":"Pré-condições são o estado exigido para o caso de uso começar (ex.: usuário autenticado). Pós-condições descrevem o estado após a conclusão bem-sucedida."},{"tema":"Casos de Uso e Especificação","q":"Qual é o formato correto de uma história de usuário?","op":["Como <papel>, quero <ação>, para <benefício>","O sistema deve permitir que o usuário faça X","Dado <contexto>, quando <ação>, então <resultado>","Se <condição>, então <consequência>"],"r":0,"exp":"O formato Dado-Quando-Então é o dos critérios de aceitação em BDD, que acompanham a história — mas não é a história em si."},{"tema":"Casos de Uso e Especificação","q":"No acrônimo INVEST, o que significa a letra 'T'?","op":["Técnica","Temporal","Transversal","Testável"],"r":3,"exp":"INVEST: Independente, Negociável, Valiosa, Estimável, Small (pequena) e Testável. Sem testabilidade não há como afirmar que a história foi concluída."},{"tema":"Casos de Uso e Especificação","q":"No diagrama de atividades, o que representa a barra grossa (bifurcação/junção)?","op":["A execução de atividades em paralelo","Uma decisão condicional entre caminhos alternativos","O fim do fluxo","A troca de responsável pela atividade"],"r":0,"exp":"A barra grossa representa paralelismo: a bifurcação abre vários fluxos simultâneos e a junção os sincroniza. A decisão condicional é representada pelo losango."},{"tema":"Modelagem de Processos e BPMN","q":"Qual a diferença entre modelagem AS-IS e TO-BE?","op":["AS-IS é o processo futuro; TO-BE é o atual","AS-IS é o processo como ele acontece hoje; TO-BE é como ele deveria acontecer após a melhoria","AS-IS é usado em processos manuais; TO-BE apenas em automatizados","São notações diferentes para o mesmo diagrama"],"r":1,"exp":"Mapeia-se o AS-IS para enxergar gargalos e retrabalho, e desenha-se o TO-BE como o processo melhorado que o sistema vai apoiar."},{"tema":"Modelagem de Processos e BPMN","q":"No BPMN, qual gateway indica que TODOS os caminhos devem ser seguidos simultaneamente?","op":["Exclusivo (XOR), marcado com X","Paralelo (AND), marcado com +","Inclusivo (OR), marcado com O","Baseado em evento"],"r":1,"exp":"O gateway paralelo abre todos os fluxos ao mesmo tempo e, na junção, espera que todos concluam. O exclusivo escolhe apenas um caminho."},{"tema":"Modelagem de Processos e BPMN","q":"Como se diferencia visualmente um evento de fim de um evento de início no BPMN?","op":["Pela espessura da borda: início tem linha fina, fim tem linha grossa","Pela cor do círculo","Pelo tamanho do círculo","Pelo símbolo interno obrigatório"],"r":0,"exp":"Início tem borda fina, intermediário tem borda dupla e fim tem borda grossa. É uma das convenções mais cobradas da notação."},{"tema":"Modelagem de Processos e BPMN","q":"No BPMN, a comunicação entre dois pools distintos é representada por:","op":["Fluxo de mensagem (seta tracejada)","Fluxo de sequência (seta cheia)","Associação (linha pontilhada sem seta)","Gateway inclusivo"],"r":0,"exp":"O fluxo de sequência nunca cruza a fronteira de um pool. Entre participantes diferentes, a comunicação é sempre por fluxo de mensagem."},{"tema":"Modelagem de Processos e BPMN","q":"Qual a relação entre pool e lane no BPMN?","op":["Lane é um conjunto de pools","São sinônimos","Pool representa um participante e lane é uma subdivisão interna dele, indicando papel ou setor","Pool é usado em processos manuais e lane em automatizados"],"r":2,"exp":"Cada pool é uma entidade participante do processo; as lanes dentro dele repartem as atividades por responsável."},{"tema":"Modelagem de Processos e BPMN","q":"Por que se recomenda mapear o processo antes de especificar o sistema?","op":["Porque é exigência da notação BPMN","Porque automatizar um processo ruim apenas faz o erro acontecer mais rápido","Porque o mapeamento substitui o levantamento de requisitos","Porque reduz o custo de licenças de software"],"r":1,"exp":"O mapeamento expõe gargalos, retrabalho, esperas e atividades sem valor. Corrigi-los antes de automatizar é o que gera ganho real."},{"tema":"Validação, Verificação e Casos de Teste","q":"Qual afirmação distingue corretamente verificação de validação?","op":["Verificação é feita pelo cliente; validação, pela equipe técnica","Verificação ocorre no início do projeto; validação, apenas no encerramento","São sinônimos usados em contextos diferentes","Verificação confere o produto contra a especificação; validação confere se ele atende à necessidade real do cliente"],"r":3,"exp":"Verificação: 'construímos corretamente?'. Validação: 'construímos a coisa certa?'. É possível verificar com sucesso um produto que não valida — ele atende à especificação errada."},{"tema":"Validação, Verificação e Casos de Teste","q":"Se não é possível escrever um caso de teste para um requisito, isso indica que ele:","op":["Não é verificável e, portanto, está mal escrito","É um requisito não funcional","Deve ser implementado por último","É uma regra de negócio, não um requisito"],"r":0,"exp":"A testabilidade é uma das qualidades obrigatórias do requisito. Tentar escrever o teste é a forma mais rápida de descobrir ambiguidade na redação."},{"tema":"Validação, Verificação e Casos de Teste","q":"Qual nível de teste é executado pelo próprio cliente para validar o valor de negócio?","op":["Teste de unidade","Teste de integração","Teste de aceitação","Teste de sistema"],"r":2,"exp":"O teste de aceitação verifica se o produto atende às necessidades do negócio na perspectiva de quem vai usá-lo — é a validação propriamente dita."},{"tema":"Validação, Verificação e Casos de Teste","q":"O que é teste de regressão?","op":["O teste que verifica o desempenho sob carga","O teste realizado antes de qualquer implementação","A revisão do código por outro desenvolvedor","A reexecução de testes já aprovados para garantir que uma mudança não quebrou o que funcionava"],"r":3,"exp":"É o que protege o sistema do efeito colateral: cada correção ou nova funcionalidade pode quebrar algo que já estava certo."},{"tema":"Validação, Verificação e Casos de Teste","q":"No teste caixa-preta, o testador:","op":["Conhece a estrutura interna do código e busca cobertura de caminhos","Avalia apenas entradas e saídas, sem conhecer a implementação","Executa somente testes de unidade","Trabalha exclusivamente com requisitos não funcionais"],"r":1,"exp":"A caixa-preta usa técnicas como partição de equivalência e análise de valor-limite, derivadas dos requisitos. Quem conhece o código é o teste caixa-branca."},{"tema":"Fundamentos da Engenharia de Requisitos","q":"A equipe precisa ouvir cerca de 400 usuários espalhados por várias unidades, com prazo curto. Qual técnica de elicitação é mais adequada e qual é a sua limitação?","op":["Prototipagem, cujo limite é depender de uma versão executável do sistema","Questionário, cujo limite é não permitir aprofundar nem esclarecer as respostas","Observação no ambiente de trabalho, cujo limite é revelar apenas o processo oficial","Entrevista aberta, cujo limite é gerar respostas padronizadas demais"],"r":1,"exp":"O questionário é a técnica que alcança muita gente com baixo custo, mas não permite repergunta nem esclarecimento, o que empobrece a profundidade dos dados. A entrevista aprofunda, porém não escala para centenas de pessoas em prazo curto."}],"discursivas":[{"tema":"Requisitos Funcionais e Não Funcionais","q":"Diferencie requisito funcional, requisito não funcional e regra de negócio, dando um exemplo de cada em um sistema de gestão de sócios de um clube.","r":"O requisito funcional descreve o que o sistema deve fazer — as funções, serviços e comportamentos que ele oferece — e costuma ser redigido com verbo de ação. Exemplo: 'o sistema deve permitir o cadastro de novos sócios com nome, CPF, data de nascimento e categoria'. O requisito não funcional descreve como o sistema deve se comportar, expressando qualidades e restrições que atravessam as funções: desempenho, segurança, usabilidade, confiabilidade, manutenibilidade, portabilidade e conformidade legal. Exemplo: 'a consulta à situação financeira do sócio deve responder em até 2 segundos para 95% das requisições' ou 'os dados pessoais devem ser armazenados em conformidade com a LGPD'. A regra de negócio, por sua vez, é uma política, restrição ou condição do próprio negócio, que existe independentemente de haver software: ela seria verdadeira mesmo que o clube controlasse tudo em fichas de papel. Exemplo: 'sócios com mais de 60 anos têm 50% de desconto na mensalidade' ou 'um sócio com três mensalidades em atraso tem o acesso às dependências bloqueado'. A relação entre elas é de origem, não de equivalência: a regra de negócio motiva a existência de requisitos funcionais que a implementam — no caso, 'o sistema deve calcular automaticamente o desconto por idade ao gerar a mensalidade' — e a distinção importa porque regras de negócio mudam por decisão da diretoria, em ritmo diferente do software, e por isso devem ser documentadas separadamente e, sempre que possível, implementadas de forma parametrizável."},{"tema":"Casos de Uso e Especificação","q":"Explique a diferença entre os relacionamentos <<include>> e <<extend>> em um diagrama de casos de uso, indicando o sentido da seta em cada caso.","r":"Os dois relacionamentos servem para fatorar comportamento entre casos de uso, mas expressam situações opostas. O <<include>> indica um comportamento obrigatório: o caso de uso base sempre executa o caso de uso incluído, sem condição alguma. Sua função é evitar a repetição de um trecho comum a vários casos de uso — por exemplo, 'Emitir boleto', 'Consultar situação financeira' e 'Alterar cadastro' podem todos incluir 'Autenticar usuário'. A seta tracejada com o estereótipo <<include>> aponta do caso base para o caso incluído, ou seja, na direção da dependência: o base depende do incluído para funcionar. O <<extend>> indica um comportamento opcional ou condicional: o caso de uso base é completo e funciona sozinho, e o caso que o estende só é executado quando determinada condição se verifica em um ponto de extensão. Por exemplo, 'Aplicar desconto de idoso' estende 'Emitir boleto' — o boleto é emitido normalmente para qualquer sócio, e apenas quando o sócio tem mais de 60 anos o comportamento adicional entra em cena. Aqui a seta tracejada aponta do caso que estende para o caso base, sentido inverso ao do include, o que costuma ser exatamente o ponto que confunde em prova. Uma forma prática de decidir qual usar é perguntar se o comportamento acontece sempre: se sim, é include; se depende de uma condição, é extend. E vale a regra de moderação — diagramas sobrecarregados de include e extend perdem justamente a legibilidade que justifica a existência do diagrama de casos de uso."}],"colas":[{"titulo":"RF x RNF x Regra de negócio","mnemonico":"Mnemônico: RF é O QUE o sistema FAZ; RNF é COMO ele se comporta; regra de negócio existe mesmo SEM sistema.","pontos":["RF: verbo de ação. 'O sistema deve permitir o cadastro de sócios.'","RNF: qualidade ou restrição. 'A consulta deve responder em até 2 segundos.'","RNF categorias: desempenho, segurança, usabilidade, confiabilidade, manutenibilidade, portabilidade, legais.","Regra de negócio: 'idoso tem 50% de desconto' — vale mesmo se o processo for em papel.","PEGADINHA: RNF costuma ser MAIS crítico que RF — pode inviabilizar o produto inteiro."]},{"titulo":"Um bom requisito","mnemonico":"Mnemônico: se não dá para escrever um CASO DE TESTE para ele, o requisito está mal escrito.","pontos":["Completo, consistente, NÃO AMBÍGUO, VERIFICÁVEL, rastreável, viável e necessário.","Ruim: 'o sistema deve ser rápido' — não é verificável.","Bom: 'deve responder em até 2s em 95% das requisições'.","Erro de requisito custa 1 na análise e 50 a 100 vezes mais em produção."]},{"titulo":"MoSCoW","mnemonico":"Mnemônico: Must, Should, Could, Won't. Os 'M' sozinhos já têm que entregar valor.","pontos":["Must have: obrigatório — sem ele a entrega não tem valor.","Should have: importante, mas existe alternativa temporária.","Could have: desejável, entra se sobrar tempo.","Won't have: explicitamente fora DESTA entrega (não é 'nunca').","Kano: básicos (ausência frustra), desempenho (quanto mais melhor), encantamento (surpreende)."]},{"titulo":"include x extend — a pegadinha do diagrama","mnemonico":"Mnemônico: INCLUDE é OBRIGATÓRIO e a seta vai DO BASE PARA O INCLUÍDO. EXTEND é OPCIONAL e a seta vem DE VOLTA para o base.","pontos":["<<include>>: sempre executa. 'Emitir boleto' ──▷ 'Autenticar usuário'.","<<extend>>: só em certa condição. 'Aplicar desconto de idoso' ──▷ 'Emitir boleto'.","Ator é SEMPRE externo ao sistema e representa um PAPEL, não uma pessoa.","Caso de uso é nomeado com verbo no infinitivo + objeto.","Especificação: pré-condições, pós-condições, fluxo principal, alternativos e de exceção."]},{"titulo":"Gateways do BPMN","mnemonico":"Mnemônico: X = escolhe UM. + = vai por TODOS. O = vai por um OU MAIS.","pontos":["Exclusivo (XOR, X): apenas um caminho é seguido.","Paralelo (AND, +): todos os caminhos seguem simultaneamente.","Inclusivo (OR, O): um ou mais, conforme as condições.","Eventos: início = linha FINA, intermediário = linha DUPLA, fim = linha GROSSA.","Fluxo de sequência (seta cheia) NUNCA cruza pool — entre pools é fluxo de MENSAGEM (tracejada).","Pool = participante. Lane = papel/setor dentro do pool."]},{"titulo":"Verificação x Validação","mnemonico":"Mnemônico: VErificação = produto certo do jeito CERTO (contra a especificação). VAlidação = o produto CERTO (contra a necessidade do cliente).","pontos":["Verificação: confere o produto contra o DOCUMENTO. Interna.","Validação: confere se o documento e o produto atendem à NECESSIDADE REAL. Com o cliente.","Níveis de teste: unidade → integração → sistema → aceitação (feito pelo cliente).","Regressão: reexecuta o que já funcionava para ver se a mudança quebrou algo.","Caixa-preta: só entradas e saídas. Caixa-branca: conhece o código, busca cobertura."]}]},{"id":"inovacao-disruptiva","nome":"Inovação Disruptiva","sigla":"ID","cor":"#ec4899","corTexto":"#ec4899","corFundo":"#cc3e84","periodo":2,"pasta":"Inovação Disruptiva","arquivos":[{"nome":"078+CUADERNOS","ext":"pdf","tam":"739 KB","href":"../Inova%C3%A7%C3%A3o%20Disruptiva/078%2BCUADERNOS.pdf"},{"nome":"11GeSec+28-04+DOI+2082","ext":"pdf","tam":"481 KB","href":"../Inova%C3%A7%C3%A3o%20Disruptiva/11GeSec%2B28-04%2BDOI%2B2082.pdf"},{"nome":"A receita do Google para um bom brainstorming","ext":"pdf","tam":"170 KB","href":"../Inova%C3%A7%C3%A3o%20Disruptiva/A%20receita%20do%20Google%20para%20um%20bom%20brainstorming.pdf"},{"nome":"AULA 1 - INOVAÇÃO DISRUPTIVA","ext":"pdf","tam":"6.1 MB","href":"../Inova%C3%A7%C3%A3o%20Disruptiva/AULA%201%20-%20INOVA%C3%87%C3%83O%20DISRUPTIVA.pdf"},{"nome":"AULA 2 - INOVAÇÃO DISRUPTIVA","ext":"pdf","tam":"3.4 MB","href":"../Inova%C3%A7%C3%A3o%20Disruptiva/AULA%202%20-%20INOVA%C3%87%C3%83O%20DISRUPTIVA.pdf"},{"nome":"AULA 3 - INOVAÇÃO DISRUPTIVA ","ext":"pdf","tam":"895 KB","href":"../Inova%C3%A7%C3%A3o%20Disruptiva/AULA%203%20-%20INOVA%C3%87%C3%83O%20DISRUPTIVA%20.pdf"},{"nome":"AULA 5 - INOVAÇÃO DISRUPTIVA ","ext":"pdf","tam":"2.3 MB","href":"../Inova%C3%A7%C3%A3o%20Disruptiva/AULA%205%20-%20INOVA%C3%87%C3%83O%20DISRUPTIVA%20.pdf"},{"nome":"AVA","ext":"pdf","tam":"1.3 MB","href":"../Inova%C3%A7%C3%A3o%20Disruptiva/AVA.pdf"},{"nome":"CONTRIBUIÇÕES DO DESIGN THINKINGPARA O DESENVOLVIMENTO DO PENSAMENTO COMPUTACION -e-o-uso-das-plataformas-digitais.pdf"},{"nome":"Pequenas Empresas & Grandes Negócios - Realidade Virtual e Realidade Aumentada podem mudar nossa forma de interagir com smartphones","ext":"pdf","tam":"244 KB","href":"../Inova%C3%A7%C3%A3o%20Disruptiva/Pequenas%20Empresas%20%26%20Grandes%20Neg%C3%B3cios%20-%20Realidade%20Virtual%20e%20Realidade%20Aumentada%20podem%20mudar%20nossa%20forma%20de%20interagir%20com%20smartphones.pdf"},{"nome":"Realidade virtual e aumentada","ext":"pdf","tam":"3.1 MB","href":"../Inova%C3%A7%C3%A3o%20Disruptiva/Realidade%20virtual%20e%20aumentada.pdf"},{"nome":"Saib mais sobre as Placas Arduino - História até o Arduino UNO","ext":"pdf","tam":"5.2 MB","href":"../Inova%C3%A7%C3%A3o%20Disruptiva/Saib%20mais%20sobre%20as%20Placas%20Arduino%20-%20Hist%C3%B3ria%20at%C3%A9%20o%20Arduino%20UNO.pdf"},{"nome":"TN_STO_265_522_36488","ext":"pdf","tam":"1.5 MB","href":"../Inova%C3%A7%C3%A3o%20Disruptiva/TN_STO_265_522_36488.pdf"},{"nome":"[47]-GESTÃO+DE+PESSOAS+E+RECURSOS+HUMANOS-+TENDÊNCIAS+PÓS-PANDEMIA","ext":"pdf","tam":"291 KB","href":"../Inova%C3%A7%C3%A3o%20Disruptiva/%5B47%5D-GEST%C3%83O%2BDE%2BPESSOAS%2BE%2BRECURSOS%2BHUMANOS-%2BTEND%C3%8ANCIAS%2BP%C3%93S-PANDEMIA.pdf"},{"nome":"admingtp,+83373-174012-1-LE","ext":"pdf","tam":"921 KB","href":"../Inova%C3%A7%C3%A3o%20Disruptiva/admingtp%2C%2B83373-174012-1-LE.pdf"},{"nome":"arduino-estrutura","ext":"pdf","tam":"2.8 MB","href":"../Inova%C3%A7%C3%A3o%20Disruptiva/arduino-estrutura.pdf"},{"nome":"customer-experience","ext":"pdf","tam":"9.5 MB","href":"../Inova%C3%A7%C3%A3o%20Disruptiva/customer-experience.pdf"},{"nome":"foursquare","ext":"pdf","tam":"362 KB","href":"../Inova%C3%A7%C3%A3o%20Disruptiva/foursquare.pdf"},{"nome":"historia-arduino","ext":"pdf","tam":"10.8 MB","href":"../Inova%C3%A7%C3%A3o%20Disruptiva/historia-arduino.pdf"},{"nome":"impressao3d","ext":"pdf","tam":"3.2 MB","href":"../Inova%C3%A7%C3%A3o%20Disruptiva/impressao3d.pdf"},{"nome":"iot","ext":"pdf","tam":"11.1 MB","href":"../Inova%C3%A7%C3%A3o%20Disruptiva/iot.pdf"},{"nome":"jbalster,+77a104+katia","ext":"pdf","tam":"13.1 MB","href":"../Inova%C3%A7%C3%A3o%20Disruptiva/jbalster%2C%2B77a104%2Bkatia.pdf"},{"nome":"labeditorial,+6515-Texto+do+artigo-22620-1-10-20170622","ext":"pdf","tam":"366 KB","href":"../Inova%C3%A7%C3%A3o%20Disruptiva/labeditorial%2C%2B6515-Texto%2Bdo%2Bartigo-22620-1-10-20170622.pdf"},{"nome":"microprocessados-microcontroladores","ext":"pdf","tam":"9.9 MB","href":"../Inova%C3%A7%C3%A3o%20Disruptiva/microprocessados-microcontroladores.pdf"},{"nome":"organizacoes-virtuais","ext":"pdf","tam":"969 KB","href":"../Inova%C3%A7%C3%A3o%20Disruptiva/organizacoes-virtuais.pdf"},{"nome":"prototipagemdigital","ext":"pdf","tam":"2.4 MB","href":"../Inova%C3%A7%C3%A3o%20Disruptiva/prototipagemdigital.pdf"}],"links":[],"resumos":[{"tema":"Invenção, Inovação e Tipos","html":"<p><b>Invenção<\/b> é a criação de uma ideia nova. <b>Inovação<\/b> é a <b>aplicação<\/b> dessa ideia de modo que gere <b>valor social e econômico<\/b>. Nem toda invenção vira inovação — muitas nunca encontram aplicação prática, mercado ou aceitação. Exemplos clássicos: os carros voadores dos anos 50 e o Google Glass, lançado mas sem aceitação comercial ampla.<\/p><p><b>Fórmula de Barbieri (2003):<\/b> <b>Inovação = Invenção + Implementação + Valor econômico/social.<\/b> Falta qualquer um dos três e não há inovação.<\/p><p><b>Os 4 tipos de inovação (Manual de Oslo):<\/b><\/p><ul><li><b>Produto<\/b> — bem ou serviço novo ou significativamente melhorado. Ex.: iPhone, novos medicamentos.<\/li><li><b>Processo<\/b> — novo método de produção ou distribuição. Ex.: implantação de corte a laser na produção, automação fabril.<\/li><li><b>Marketing<\/b> — novo método de comercialização: design, embalagem, posicionamento, promoção ou preço. Ex.: garrafa retornável da Coca-Cola com design novo para atrair jovens.<\/li><li><b>Organizacional<\/b> — novo método nas práticas de negócio, na organização do trabalho ou nas relações externas. Ex.: equipes interdisciplinares, novo método de gestão do conhecimento.<\/li><\/ul><p><b>Classificação pelo grau de ruptura:<\/b><\/p><ul><li><b>Incremental<\/b> — pequenas melhorias contínuas. É o tipo <b>mais comum<\/b> no dia a dia das empresas. Ex.: atualização anual de celulares, aperfeiçoamento de softwares de georreferenciamento.<\/li><li><b>Radical<\/b> — quebra tecnológica <b>dentro do mesmo mercado<\/b>. Ex.: substituição do vinil pelo CD; o iPhone em 2007.<\/li><li><b>Disruptiva<\/b> — <b>muda o mercado<\/b>, substituindo empresas consolidadas. Ex.: Netflix, Uber, Nubank.<\/li><\/ul><p><b>Radical x disruptiva — a distinção que mais cai:<\/b> a radical é uma ruptura <b>tecnológica<\/b> que ocorre dentro do mercado existente; a disruptiva é uma ruptura de <b>mercado<\/b>, que derruba os incumbentes. Nem toda inovação radical é disruptiva.<\/p><p><b>Teóricos:<\/b> <b>Joseph Schumpeter<\/b> — a inovação como <b>destruição criativa<\/b>: novos produtos e processos substituem os antigos. <b>Clayton Christensen<\/b> — popularizou o termo <b>inovação disruptiva<\/b>, mostrando que ela costuma começar por um nicho desatendido ou de baixa margem, é ignorada pelos líderes e sobe até dominar o mercado.<\/p>"},{"tema":"Ecossistemas de Inovação","html":"<p><b>Ecossistema de inovação<\/b> é um ambiente que conecta empresas, governo, universidades e consumidores para fomentar a inovação. A característica essencial (Seed, 2016) é justamente essa <b>conexão<\/b> entre os atores — nenhum deles inova sozinho.<\/p><p><b>Tríplice hélice:<\/b> o modelo que articula <b>governo + empresas + universidades<\/b>. O governo dá políticas públicas e financiamento; as empresas dão o mercado e a escala; as universidades dão pesquisa e talento. Algumas versões acrescentam uma quarta hélice: a sociedade.<\/p><p><b>Vale do Silício<\/b> é o exemplo clássico porque integra universidades de ponta (Stanford, Berkeley), investidores de risco, um denso tecido de startups, apoio governamental e — talvez o mais difícil de replicar — uma <b>cultura empreendedora<\/b> que tolera o fracasso.<\/p><p><b>Elementos de um ecossistema:<\/b> universidades e institutos de pesquisa, empresas âncora, startups, investidores (anjo, venture capital), incubadoras e aceleradoras, parques tecnológicos, políticas públicas e marco legal, e capital humano qualificado.<\/p><p><b>Barreiras à inovação nas organizações:<\/b> <b>resistência cultural<\/b> (medo do novo e do erro), falta de investimento, <b>burocracia<\/b> e excesso de processos, foco excessivo no curto prazo, estrutura hierárquica rígida, ausência de tolerância ao erro e falta de tempo dedicado à exploração.<\/p><p><b>Habilidades do profissional inovador:<\/b> <b>curiosidade<\/b>, <b>resiliência<\/b>, <b>boa comunicação<\/b>, trabalho em equipe, pensamento crítico e capacidade de aprender continuamente.<\/p><p><b>Inovação aberta (open innovation)<\/b> — conceito de Henry Chesbrough: a empresa usa fluxos internos <b>e externos<\/b> de conhecimento, colaborando com startups, universidades, fornecedores e até concorrentes, em vez de tentar inovar apenas com P&D interno.<\/p><p><b>Por que a inovação é chave para a competitividade:<\/b> gera diferenciação, aumenta a produtividade, abre novos mercados e cria vantagem sobre os concorrentes.<\/p>"},{"tema":"Design Thinking","html":"<p><b>Design Thinking<\/b> é uma abordagem para a <b>solução criativa de problemas<\/b>, <b>centrada no ser humano<\/b>, que busca a formulação de questionamentos pela <b>compreensão profunda dos fenômenos<\/b> e das necessidades das pessoas, com <b>empatia<\/b> e <b>cocriação<\/b>.<\/p><p><b>O que ele NÃO é<\/b> — as pegadinhas mais comuns:<\/p><ul><li>Não é uma ferramenta <b>tradicional<\/b> de resolver problemas<\/li><li>Não segue processo <b>linear e rígido<\/b> — é iterativo, permite voltar etapas<\/li><li>Não investiga a experiência do cliente apenas por <b>dados estatísticos<\/b> — usa pesquisa qualitativa e observação<\/li><li>Não se restringe ao <b>design gráfico<\/b><\/li><li>Não <b>dispensa testes<\/b> e validações<\/li><\/ul><p><b>As etapas (modelo em três fases, comum no Brasil):<\/b><\/p><ol><li><b>Imersão / compreensão do problema<\/b> — pesquisa, observação, entrevistas em profundidade, mapa de empatia, jornada do usuário. Aqui se questiona até o próprio enunciado do problema.<\/li><li><b>Ideação<\/b> — geração ampla de alternativas, sem julgamento prévio: brainstorming, brainwriting, analogias, matriz de ideias.<\/li><li><b>Prototipagem e testagem<\/b> — materializar rápido e barato para aprender, testar com usuários reais e iterar.<\/li><\/ol><p>No modelo da d.school as cinco fases são: <b>empatizar, definir, idear, prototipar e testar<\/b>.<\/p><p><b>Divergir e convergir<\/b> (duplo diamante): abre-se o leque de possibilidades e depois afunila-se — duas vezes, uma sobre o problema e outra sobre a solução.<\/p><p><b>Confiança criativa<\/b> (David Kelley, fundador da IDEO): a crença de que se é capaz de criar. Kelley argumenta que a criatividade não é dom de poucos, mas capacidade que se desenvolve — e que o principal obstáculo é o <b>medo do julgamento<\/b>.<\/p><p><b>Brainstorming x brainwriting:<\/b> no brainstorming as ideias são ditas em voz alta, em grupo, sem julgamento. No brainwriting cada um <b>escreve<\/b> antes de compartilhar, o que reduz a influência dos mais falantes e a inibição dos mais tímidos, gerando mais ideias independentes.<\/p>"},{"tema":"Tecnologias Emergentes","html":"<p><b>Impressão 3D e manufatura aditiva<\/b> — construção de objetos <b>camada por camada<\/b> a partir de um modelo digital, o oposto da manufatura subtrativa (que remove material). Vantagens: prototipagem rápida e barata, geometrias impossíveis pelos métodos tradicionais, personalização em massa, produção sob demanda sem estoque e menos desperdício de material. Aplicações: protótipos, próteses e implantes personalizados, peças de reposição, construção civil, bioimpressão.<\/p><p><b>Internet das Coisas (IoT)<\/b> — objetos do cotidiano com sensores, processamento e conectividade, capazes de coletar e trocar dados. Camadas típicas: percepção (sensores e atuadores) → rede (conectividade) → processamento (nuvem/borda) → aplicação. Desafios: <b>segurança<\/b>, privacidade, padronização e consumo de energia.<\/p><p><b>Sistemas embarcados e microcontroladores<\/b> — um <b>microprocessador<\/b> é apenas a CPU e depende de componentes externos; um <b>microcontrolador<\/b> integra em um único chip CPU, memória e periféricos de entrada e saída, sendo feito para uma aplicação específica com baixo consumo. O <b>Arduino<\/b> nasceu em 2005 no Interaction Design Institute de Ivrea, na Itália, como plataforma aberta de prototipagem para não engenheiros: hardware e software livres, IDE simples, pinos digitais e analógicos, e uma enorme comunidade — o que o tornou a porta de entrada de quase todo projeto maker.<\/p><p><b>Realidade Virtual (RV) x Realidade Aumentada (RA)<\/b> — a RV <b>substitui<\/b> o ambiente real por um ambiente totalmente digital, exigindo headset e isolando o usuário. A RA <b>sobrepõe<\/b> elementos digitais ao ambiente real, sem isolá-lo, e funciona no próprio celular. A <b>Realidade Mista (RM)<\/b> vai além: os elementos digitais interagem com o ambiente físico e reconhecem suas superfícies. O termo guarda-chuva é <b>Realidade Estendida (XR)<\/b>.<\/p><p><b>Gamificação<\/b> — o uso de <b>elementos de jogos em contextos que não são jogos<\/b>, para aumentar engajamento e motivação. Elementos: pontos, medalhas, rankings (a tríade PBL), níveis, desafios, missões, feedback imediato, narrativa e recompensas. Aplicada em educação, saúde, treinamento corporativo e fidelização. O <b>Foursquare<\/b> é o exemplo histórico com seus check-ins, badges e o título de \"prefeito\". Risco: gamificação superficial, que apenas adiciona pontos sem tocar a motivação intrínseca.<\/p><p><b>Organizações virtuais<\/b> — estruturas em que pessoas e equipes colaboram por plataformas digitais, sem depender de um espaço físico comum. Exigem comunicação interna eficaz, confiança e gestão por resultados; a pandemia acelerou fortemente esse modelo.<\/p><p><b>Customer experience (CX)<\/b> — a soma de todas as percepções do cliente em todos os pontos de contato com a marca, ao longo de toda a jornada. Diferente da UX, que se concentra na interação com o produto.<\/p>"}],"flashcards":[{"tema":"Invenção, Inovação e Tipos","p":"Qual a diferença entre invenção e inovação?","r":"A invenção é a criação de uma ideia nova; a inovação é a aplicação dessa ideia de modo que gere valor social e econômico."},{"tema":"Invenção, Inovação e Tipos","p":"Por que nem toda invenção se transforma em inovação?","r":"Porque muitas invenções não encontram aplicação prática, mercado ou aceitação. Exemplos: os carros voadores dos anos 50 e o Google Glass, que foi lançado mas não teve aceitação comercial ampla."},{"tema":"Invenção, Inovação e Tipos","p":"Qual é a fórmula de Barbieri para a inovação?","r":"Inovação = Invenção + Implementação + Valor econômico/social. Faltando qualquer um dos três, não há inovação."},{"tema":"Invenção, Inovação e Tipos","p":"Quais são os quatro tipos de inovação segundo o Manual de Oslo?","r":"Produto, processo, marketing e organizacional."},{"tema":"Invenção, Inovação e Tipos","p":"A implementação de corte a laser na produção é exemplo de que tipo de inovação?","r":"Inovação de processo — um novo método de produção ou distribuição."},{"tema":"Invenção, Inovação e Tipos","p":"Um novo design de embalagem para atrair um público diferente é qual tipo de inovação?","r":"Inovação de marketing. Exemplo real: a garrafa retornável da Coca-Cola com novo design para atrair o público jovem."},{"tema":"Invenção, Inovação e Tipos","p":"Estabelecer equipes interdisciplinares é exemplo de qual tipo de inovação?","r":"Inovação organizacional — novo método nas práticas de negócio, na organização do trabalho ou nas relações externas. Um novo método de gestão do conhecimento também se enquadra aqui."},{"tema":"Invenção, Inovação e Tipos","p":"A melhoria contínua dos celulares a cada geração é exemplo de quê?","r":"Inovação incremental — pequenas melhorias sucessivas. É o tipo mais comum no dia a dia das empresas."},{"tema":"Invenção, Inovação e Tipos","p":"A substituição do vinil pelo CD é exemplo de quê?","r":"Inovação radical — uma quebra tecnológica dentro do mesmo mercado (o de música gravada)."},{"tema":"Invenção, Inovação e Tipos","p":"O surgimento do streaming com a Netflix é exemplo de quê?","r":"Inovação disruptiva — mudou o mercado e substituiu empresas consolidadas, como as locadoras de vídeo."},{"tema":"Invenção, Inovação e Tipos","p":"Qual a diferença entre inovação radical e disruptiva?","r":"Radical é uma quebra tecnológica dentro do mesmo mercado. Disruptiva muda o mercado, substituindo empresas consolidadas. Nem toda inovação radical é disruptiva."},{"tema":"Invenção, Inovação e Tipos","p":"O iPhone em 2007 foi exemplo de qual tipo de inovação?","r":"Inovação radical — uma quebra tecnológica que redefiniu o que era um telefone celular dentro do próprio mercado de telefonia."},{"tema":"Invenção, Inovação e Tipos","p":"Cite uma inovação disruptiva brasileira e seu impacto.","r":"O Nubank — simplificou os serviços bancários, eliminou tarifas e agências e forçou os bancos tradicionais a mudar suas práticas."},{"tema":"Invenção, Inovação e Tipos","p":"Quem popularizou o termo 'inovação disruptiva'?","r":"Clayton Christensen. Ele mostrou que a disrupção costuma começar em um nicho desatendido ou de baixa margem, é ignorada pelos líderes de mercado e sobe até dominá-lo."},{"tema":"Invenção, Inovação e Tipos","p":"Segundo Schumpeter, a inovação está ligada a qual conceito?","r":"À destruição criativa: novos produtos e processos substituem os antigos, e é justamente essa destruição que impulsiona o desenvolvimento econômico."},{"tema":"Invenção, Inovação e Tipos","p":"Qual é o papel da criatividade na inovação?","r":"Gerar ideias novas que possam ser aplicadas em soluções viáveis. A criatividade produz a ideia; a inovação exige que ela seja implementada e gere valor."},{"tema":"Ecossistemas de Inovação","p":"O que é um ecossistema de inovação?","r":"Um ambiente que conecta empresas, governo, universidades e consumidores para fomentar a inovação. A característica essencial é a conexão entre esses atores."},{"tema":"Ecossistemas de Inovação","p":"Quem compõe a tríplice hélice da inovação?","r":"Governo, empresas e universidades. Algumas versões acrescentam uma quarta hélice: a sociedade."},{"tema":"Ecossistemas de Inovação","p":"Por que o Vale do Silício é considerado um ecossistema de inovação?","r":"Porque integra universidades de ponta, investidores de risco, um denso tecido de startups, apoio governamental e uma cultura empreendedora que tolera o fracasso."},{"tema":"Ecossistemas de Inovação","p":"Cite barreiras comuns à inovação nas organizações.","r":"Resistência cultural (medo do novo e do erro), falta de investimento, burocracia e excesso de processos, foco no curto prazo e estrutura hierárquica rígida."},{"tema":"Ecossistemas de Inovação","p":"Quais habilidades são essenciais em profissionais inovadores?","r":"Curiosidade, resiliência, boa comunicação e trabalho em equipe — além de pensamento crítico e capacidade de aprender continuamente."},{"tema":"Ecossistemas de Inovação","p":"O que é inovação aberta (open innovation)?","r":"Conceito de Henry Chesbrough: a empresa combina fluxos internos e externos de conhecimento, colaborando com startups, universidades, fornecedores e até concorrentes, em vez de inovar apenas com P&D interno."},{"tema":"Ecossistemas de Inovação","p":"Por que a inovação é chave para a competitividade?","r":"Porque gera diferenciação, aumenta a produtividade, abre novos mercados e cria vantagem sobre os concorrentes."},{"tema":"Design Thinking","p":"O que é Design Thinking?","r":"Uma abordagem de solução criativa de problemas centrada no ser humano, que busca a formulação de questionamentos pela compreensão profunda dos fenômenos e das necessidades das pessoas, com empatia e cocriação."},{"tema":"Design Thinking","p":"O Design Thinking segue um processo linear e rígido?","r":"Não. Ele é iterativo: permite voltar a etapas anteriores conforme se aprende com os testes. Também não se restringe ao design gráfico nem dispensa testes e validações."},{"tema":"Design Thinking","p":"Quais são as cinco fases do Design Thinking no modelo da d.school?","r":"Empatizar, definir, idear, prototipar e testar. No Brasil também se usa o modelo em três etapas: imersão (compreensão do problema), ideação e prototipação/testagem."},{"tema":"Design Thinking","p":"O que se faz na fase de imersão ou empatia?","r":"Pesquisa e observação profundas do usuário: entrevistas, mapa de empatia, jornada. É a fase em que se questiona até o próprio enunciado do problema."},{"tema":"Design Thinking","p":"O que é o duplo diamante?","r":"O modelo de divergir e convergir duas vezes: primeiro explora-se amplamente o problema e afunila-se para defini-lo, depois geram-se muitas soluções e afunila-se para escolher uma."},{"tema":"Design Thinking","p":"O que David Kelley entende por confiança criativa?","r":"A crença de que se é capaz de criar. Kelley, fundador da IDEO, argumenta que a criatividade não é dom de poucos, mas capacidade que se desenvolve — e que o principal obstáculo a superar é o medo do julgamento."},{"tema":"Design Thinking","p":"Qual a diferença entre brainstorming e brainwriting?","r":"No brainstorming as ideias são ditas em voz alta, em grupo. No brainwriting cada um escreve individualmente antes de compartilhar, o que reduz a influência dos mais falantes e a inibição dos mais tímidos."},{"tema":"Tecnologias Emergentes","p":"O que é manufatura aditiva?","r":"A construção de objetos camada por camada a partir de um modelo digital — o oposto da manufatura subtrativa, que remove material de um bloco. A impressão 3D é sua expressão mais conhecida."},{"tema":"Tecnologias Emergentes","p":"Quais as vantagens da impressão 3D?","r":"Prototipagem rápida e barata, geometrias impossíveis pelos métodos tradicionais, personalização em massa, produção sob demanda sem estoque e menor desperdício de material."},{"tema":"Tecnologias Emergentes","p":"O que é Internet das Coisas (IoT)?","r":"Objetos do cotidiano equipados com sensores, processamento e conectividade, capazes de coletar e trocar dados. Seus principais desafios são segurança, privacidade, padronização e consumo de energia."},{"tema":"Tecnologias Emergentes","p":"Qual a diferença entre microprocessador e microcontrolador?","r":"O microprocessador é apenas a CPU e depende de componentes externos (memória, E/S). O microcontrolador integra CPU, memória e periféricos de entrada e saída em um único chip, voltado a uma aplicação específica com baixo consumo."},{"tema":"Tecnologias Emergentes","p":"Onde e quando surgiu o Arduino, e qual sua proposta?","r":"Surgiu em 2005 no Interaction Design Institute de Ivrea, na Itália, como plataforma aberta de prototipagem eletrônica voltada a não engenheiros — hardware e software livres, IDE simples e comunidade ampla."},{"tema":"Tecnologias Emergentes","p":"Qual a diferença entre realidade virtual e realidade aumentada?","r":"A RV substitui completamente o ambiente real por um ambiente digital, exigindo headset e isolando o usuário. A RA sobrepõe elementos digitais ao ambiente real, sem isolá-lo, e funciona no próprio celular."},{"tema":"Tecnologias Emergentes","p":"O que é realidade mista?","r":"Um estágio além da RA: os elementos digitais não apenas se sobrepõem, mas interagem com o ambiente físico e reconhecem suas superfícies. O termo guarda-chuva para todas essas tecnologias é Realidade Estendida (XR)."},{"tema":"Tecnologias Emergentes","p":"O que é gamificação?","r":"O uso de elementos de jogos em contextos que NÃO são jogos, para aumentar engajamento e motivação — pontos, medalhas, rankings, níveis, desafios, feedback imediato e narrativa."},{"tema":"Tecnologias Emergentes","p":"Qual é o exemplo histórico clássico de gamificação?","r":"O Foursquare, com seus check-ins, badges e o título de 'prefeito' do local — que transformou a simples marcação de presença em uma disputa social."},{"tema":"Tecnologias Emergentes","p":"Qual é o principal risco de uma implementação de gamificação?","r":"A gamificação superficial: apenas acrescentar pontos e medalhas sem tocar a motivação intrínseca das pessoas, o que gera engajamento momentâneo e depois abandono."},{"tema":"Tecnologias Emergentes","p":"O que são organizações virtuais?","r":"Estruturas em que pessoas e equipes colaboram por plataformas digitais, sem depender de um espaço físico comum. Exigem comunicação interna eficaz, confiança e gestão por resultados."}],"questoes":[{"tema":"Invenção, Inovação e Tipos","q":"Qual a diferença entre invenção e inovação?","op":["São sinônimos no contexto empresarial","A invenção é a criação de uma ideia nova; a inovação é a aplicação dessa ideia gerando valor social e econômico","A invenção exige patente; a inovação, não","A inovação vem sempre antes da invenção"],"r":1,"exp":"Pela fórmula de Barbieri: Inovação = Invenção + Implementação + Valor econômico/social. Sem aplicação e sem valor gerado, permanece apenas invenção."},{"tema":"Invenção, Inovação e Tipos","q":"Por que o Google Glass é citado como invenção que não se transformou em inovação?","op":["Porque nunca chegou a ser fabricado","Porque foi lançado, mas não teve aceitação comercial ampla","Porque a patente foi negada","Porque a tecnologia não funcionava"],"r":1,"exp":"Muitas invenções não encontram aplicação prática, mercado ou aceitação. Sem valor social e econômico efetivamente gerado, não há inovação."},{"tema":"Invenção, Inovação e Tipos","q":"Quais são os quatro tipos de inovação segundo o Manual de Oslo?","op":["Incremental, radical, disruptiva e aberta","Tecnológica, social, ambiental e econômica","Produto, processo, marketing e organizacional","Interna, externa, colaborativa e individual"],"r":2,"exp":"Produto, processo, marketing e organizacional. As classificações incremental, radical e disruptiva referem-se ao GRAU de ruptura, não ao tipo."},{"tema":"Invenção, Inovação e Tipos","q":"A implementação de corte a laser na linha de produção é exemplo de inovação de:","op":["Processo","Produto","Marketing","Organizacional"],"r":0,"exp":"Inovação de processo é a adoção de um novo método de produção ou distribuição — como a automação fabril."},{"tema":"Invenção, Inovação e Tipos","q":"A garrafa retornável da Coca-Cola com novo design para atrair jovens é exemplo de inovação de:","op":["Marketing","Produto","Processo","Organizacional"],"r":0,"exp":"Inovação de marketing envolve novo método de comercialização — design, embalagem, posicionamento, promoção ou preço."},{"tema":"Invenção, Inovação e Tipos","q":"Estabelecer equipes interdisciplinares e um novo método de gestão do conhecimento são exemplos de inovação:","op":["De produto","De processo","De marketing","Organizacional"],"r":3,"exp":"Inovação organizacional trata de novos métodos nas práticas de negócio, na organização do trabalho ou nas relações externas da empresa."},{"tema":"Invenção, Inovação e Tipos","q":"A melhoria contínua dos celulares a cada geração caracteriza inovação:","op":["Radical","Disruptiva","Incremental","Organizacional"],"r":2,"exp":"Pequenas melhorias sucessivas configuram inovação incremental — o tipo mais comum no cotidiano das empresas."},{"tema":"Invenção, Inovação e Tipos","q":"A substituição do vinil pelo CD é exemplo de inovação:","op":["Incremental","Disruptiva","Radical","De marketing"],"r":2,"exp":"Houve quebra tecnológica dentro do mesmo mercado — o da música gravada. A mudança de tecnologia não alterou quem eram os players dominantes."},{"tema":"Invenção, Inovação e Tipos","q":"O surgimento do streaming com a Netflix é exemplo de inovação:","op":["Incremental","Radical","Disruptiva","De processo"],"r":2,"exp":"A Netflix mudou o mercado e substituiu empresas consolidadas — as locadoras de vídeo. Disrupção é ruptura de MERCADO, não apenas de tecnologia."},{"tema":"Invenção, Inovação e Tipos","q":"Qual a diferença entre inovação radical e disruptiva?","op":["Radical é mais recente que disruptiva","Radical ocorre em produtos e disruptiva em serviços","Radical é quebra tecnológica dentro do mesmo mercado; disruptiva muda o mercado e substitui empresas consolidadas","São a mesma coisa com nomes diferentes"],"r":2,"exp":"Essa é a distinção mais cobrada. Nem toda inovação radical é disruptiva: pode haver ruptura tecnológica sem que os líderes de mercado sejam derrubados."},{"tema":"Invenção, Inovação e Tipos","q":"Quem popularizou o termo 'inovação disruptiva'?","op":["Clayton Christensen","Joseph Schumpeter","Henry Chesbrough","David Kelley"],"r":0,"exp":"Christensen popularizou o conceito. Schumpeter é o da destruição criativa; Chesbrough, o da inovação aberta; Kelley, o da confiança criativa."},{"tema":"Invenção, Inovação e Tipos","q":"Segundo Schumpeter, a inovação está associada ao conceito de:","op":["Vantagem comparativa","Vantagem competitiva sustentável","Destruição criativa","Curva de aprendizagem"],"r":2,"exp":"Destruição criativa: novos produtos e processos substituem os antigos, e é essa destruição que impulsiona o desenvolvimento econômico."},{"tema":"Invenção, Inovação e Tipos","q":"Qual das alternativas NÃO representa inovação?","op":["Adotar um novo método de gestão do conhecimento","Manter os processos antigos sem nenhuma alteração","Lançar uma embalagem com design inédito","Automatizar a linha de produção com corte a laser"],"r":1,"exp":"Inovação exige novidade aplicada que gere valor. Manter tudo como está é justamente a ausência de inovação."},{"tema":"Invenção, Inovação e Tipos","q":"O Nubank é frequentemente citado como exemplo de qual tipo de inovação, e por quê?","op":["Incremental, por melhorar aplicativos bancários existentes","De processo, por automatizar a análise de crédito","Organizacional, por adotar times ágeis","Disruptiva, por simplificar serviços bancários e forçar os bancos tradicionais a mudar"],"r":3,"exp":"Ao eliminar tarifas e agências e atender um público insatisfeito, deslocou a lógica do mercado e obrigou os incumbentes a reagir — o padrão descrito por Christensen."},{"tema":"Ecossistemas de Inovação","q":"O que caracteriza um ecossistema de inovação?","op":["A concentração de empresas de tecnologia em uma mesma cidade","O volume de investimento público em pesquisa","A existência de leis de incentivo fiscal","A conexão entre empresas, governo, universidades e consumidores"],"r":3,"exp":"A característica essencial (Seed, 2016) é a conexão entre os atores — nenhum deles inova sozinho, e é a articulação entre eles que gera o ambiente fértil."},{"tema":"Ecossistemas de Inovação","q":"A tríplice hélice da inovação envolve:","op":["Governo, empresas e universidades","Startups, investidores e aceleradoras","Pesquisa, desenvolvimento e produção","Produto, processo e mercado"],"r":0,"exp":"Governo (políticas e financiamento), empresas (mercado e escala) e universidades (pesquisa e talento). Algumas versões acrescentam a sociedade como quarta hélice."},{"tema":"Ecossistemas de Inovação","q":"Por que o Vale do Silício é o exemplo clássico de ecossistema de inovação?","op":["Porque concentra as maiores empresas de tecnologia do mundo","Porque possui a maior carga de incentivos fiscais dos EUA","Porque integra universidades, investidores, startups, governo e uma cultura empreendedora","Porque tem o maior número de patentes registradas"],"r":2,"exp":"Não é apenas a concentração de empresas: é a articulação entre os atores somada a uma cultura que tolera o fracasso — o elemento mais difícil de replicar."},{"tema":"Ecossistemas de Inovação","q":"Qual destas é uma barreira comum à inovação nas organizações?","op":["Excesso de tolerância ao erro","Resistência cultural, falta de investimento e burocracia","Estrutura organizacional horizontal","Investimento contínuo em pesquisa"],"r":1,"exp":"Medo do novo, escassez de recursos e excesso de processos travam a inovação. Tolerância ao erro e estruturas horizontais, ao contrário, a favorecem."},{"tema":"Ecossistemas de Inovação","q":"Quais habilidades são apontadas como essenciais no profissional inovador?","op":["Especialização técnica profunda e trabalho isolado","Curiosidade, resiliência e boa comunicação","Obediência a processos e aversão ao risco","Domínio exclusivo de ferramentas de gestão"],"r":1,"exp":"Curiosidade gera as perguntas, resiliência sustenta as tentativas frustradas e comunicação permite que a ideia sobreviva fora da cabeça de quem a teve."},{"tema":"Ecossistemas de Inovação","q":"O que é inovação aberta (open innovation)?","op":["Publicar todo o código-fonte da empresa","Combinar fluxos internos e externos de conhecimento, colaborando com startups, universidades e parceiros","Inovar apenas com a equipe interna de P&D","Permitir que qualquer funcionário proponha ideias"],"r":1,"exp":"Conceito de Henry Chesbrough: a empresa reconhece que nem todo o conhecimento útil está dentro dela e estrutura a colaboração com o ambiente externo."},{"tema":"Design Thinking","q":"Assinale a alternativa correta sobre o Design Thinking:","op":["Busca a formulação de questionamentos pela compreensão dos fenômenos","É uma ferramenta tradicional de resolver problemas","A investigação da experiência do cliente ocorre por meio de dados estatísticos","Não é possível a cocriação de soluções"],"r":0,"exp":"O Design Thinking se fundamenta na compreensão profunda das necessidades humanas, na formulação de questionamentos e na cocriação — não em levantamento estatístico."},{"tema":"Design Thinking","q":"Sobre a abordagem do Design Thinking, é correto afirmar que:","op":["Segue um processo linear e rígido","Coloca o ser humano no centro do processo, buscando soluções por meio da empatia e da cocriação","É restrito ao design gráfico","Dispensa testes e validações"],"r":1,"exp":"O Design Thinking é centrado no ser humano e iterativo, permitindo ajustes constantes a partir do que se aprende nos testes."},{"tema":"Design Thinking","q":"Quais são as cinco fases do Design Thinking no modelo da d.school?","op":["Planejar, executar, controlar, encerrar e revisar","Pesquisar, projetar, construir, lançar e medir","Observar, analisar, decidir, implantar e auditar","Empatizar, definir, idear, prototipar e testar"],"r":3,"exp":"Empatizar → Definir → Idear → Prototipar → Testar. No Brasil também se usa o modelo em três etapas: imersão, ideação e prototipação."},{"tema":"Design Thinking","q":"O que se busca na fase de imersão ou empatia?","op":["Selecionar a melhor solução entre as alternativas geradas","Construir o protótipo funcional","Validar o produto com métricas de mercado","Compreender profundamente o usuário e questionar até o próprio enunciado do problema"],"r":3,"exp":"É a fase de pesquisa qualitativa: entrevistas, observação, mapa de empatia e jornada. Frequentemente ela revela que o problema declarado não era o problema real."},{"tema":"Design Thinking","q":"O que representa o modelo do duplo diamante?","op":["Duas equipes trabalhando em paralelo sobre o mesmo problema","A comparação entre duas alternativas de solução","As duas fases obrigatórias: análise e implementação","Divergir e convergir duas vezes: uma sobre o problema e outra sobre a solução"],"r":3,"exp":"Primeiro se abre a exploração do problema e se afunila para defini-lo; depois se abre a geração de soluções e se afunila para escolher uma."},{"tema":"Design Thinking","q":"Segundo David Kelley, o principal obstáculo à criatividade é:","op":["A falta de talento inato","A ausência de recursos financeiros","O medo do julgamento","A falta de formação em design"],"r":2,"exp":"Kelley, fundador da IDEO, defende que a criatividade é capacidade que se desenvolve — o que a bloqueia é o receio de ser avaliado, não a ausência de dom."},{"tema":"Design Thinking","q":"Qual a principal vantagem do brainwriting sobre o brainstorming?","op":["Reduz a influência dos participantes mais falantes e a inibição dos mais tímidos","Produz menos ideias, facilitando a seleção","Elimina a necessidade de um facilitador","Só funciona com equipes pequenas"],"r":0,"exp":"Ao escrever antes de compartilhar, cada participante formula sua ideia sem ser ancorado pela primeira sugestão nem constrangido pela hierarquia do grupo."},{"tema":"Tecnologias Emergentes","q":"O que caracteriza a manufatura aditiva?","op":["A remoção de material de um bloco bruto","A moldagem por injeção em alta temperatura","A montagem automatizada de peças pré-fabricadas","A construção do objeto camada por camada a partir de um modelo digital"],"r":3,"exp":"É o oposto da manufatura subtrativa. Daí decorrem suas vantagens: geometrias impossíveis por outros métodos, personalização e menos desperdício."},{"tema":"Tecnologias Emergentes","q":"Qual a diferença entre microprocessador e microcontrolador?","op":["O microprocessador é sempre mais barato","O microcontrolador não pode ser programado","O microcontrolador integra CPU, memória e periféricos de E/S em um único chip","O microprocessador só existe em sistemas embarcados"],"r":2,"exp":"O microprocessador é apenas a CPU e depende de componentes externos. O microcontrolador é um sistema completo em um chip, voltado a aplicações específicas com baixo consumo."},{"tema":"Tecnologias Emergentes","q":"Onde e com que proposta surgiu o Arduino?","op":["Nos EUA, em 2010, como produto comercial fechado","No Japão, em 1998, para automação industrial","Na Alemanha, em 2012, como padrão para IoT","Na Itália, em 2005, como plataforma aberta de prototipagem voltada a não engenheiros"],"r":3,"exp":"Nasceu no Interaction Design Institute de Ivrea, na Itália. Hardware e software abertos, IDE simples e comunidade ampla o tornaram a porta de entrada do movimento maker."},{"tema":"Tecnologias Emergentes","q":"Qual a diferença entre realidade virtual e realidade aumentada?","op":["A RV sobrepõe elementos ao mundo real; a RA substitui o mundo real","A RV substitui o ambiente real por um digital; a RA sobrepõe elementos digitais ao ambiente real","A RV é usada apenas em jogos; a RA apenas na indústria","Não há diferença técnica entre elas"],"r":1,"exp":"A RV isola o usuário em um ambiente totalmente digital, exigindo headset. A RA mantém o mundo real visível e acrescenta camadas digitais, funcionando até no celular."},{"tema":"Tecnologias Emergentes","q":"O que é gamificação?","op":["O desenvolvimento de jogos digitais para entretenimento","A conversão de qualquer processo em um jogo completo","A aplicação de inteligência artificial em jogos","O uso de elementos de jogos em contextos que não são jogos, para aumentar engajamento"],"r":3,"exp":"Gamificação não é criar um jogo: é usar mecânicas de jogo — pontos, medalhas, rankings, desafios, feedback imediato — em educação, saúde, trabalho ou fidelização."},{"tema":"Tecnologias Emergentes","q":"Qual aplicativo é o exemplo histórico clássico de gamificação?","op":["Foursquare","Instagram","WhatsApp","Netflix"],"r":0,"exp":"O Foursquare transformou o simples check-in em disputa social com badges e o título de 'prefeito' do local — tornando-se o caso de estudo mais citado."},{"tema":"Tecnologias Emergentes","q":"Qual é o principal desafio da Internet das Coisas?","op":["Segurança e privacidade dos dados coletados","A falta de dispositivos disponíveis no mercado","A impossibilidade de conectar objetos à internet","O custo proibitivo dos sensores"],"r":0,"exp":"Dispositivos numerosos, baratos e raramente atualizados formam uma superfície de ataque enorme — e coletam dados sensíveis sobre a rotina das pessoas."}],"discursivas":[{"tema":"Invenção, Inovação e Tipos","q":"Diferencie inovação incremental, radical e disruptiva, apresentando um exemplo real de cada uma.","r":"A inovação incremental consiste em pequenas melhorias contínuas sobre algo que já existe, sem alterar a lógica do produto nem a estrutura do mercado. É o tipo mais comum no dia a dia das empresas, porque é de menor risco e aproveita a base instalada — o exemplo típico é a atualização anual dos celulares, com câmera um pouco melhor e bateria um pouco maior, ou o aperfeiçoamento sucessivo de softwares de georreferenciamento. A inovação radical envolve uma quebra tecnológica significativa, mas que ocorre dentro do mesmo mercado: muda-se profundamente como algo é feito, sem que necessariamente os líderes do setor sejam derrubados. A substituição do vinil pelo CD é o caso clássico, assim como o iPhone em 2007, que redefiniu o que era um telefone celular. Já a inovação disruptiva altera a própria lógica do mercado, criando um novo modelo de negócio que torna obsoletos os incumbentes e frequentemente os elimina. Segundo Clayton Christensen, que popularizou o conceito, a disrupção costuma começar em um nicho desatendido ou de baixa margem — por isso é inicialmente ignorada pelos líderes, que não a veem como ameaça — e vai subindo até dominar o mercado principal. A Netflix é o exemplo mais citado, tendo substituído as locadoras de vídeo; o Uber transformou o transporte urbano individual; e, no Brasil, o Nubank simplificou os serviços bancários e forçou os bancos tradicionais a mudar suas práticas de tarifas e atendimento. A distinção que mais se cobra é justamente entre radical e disruptiva: a primeira é ruptura tecnológica dentro do mercado existente, a segunda é ruptura do próprio mercado — e nem toda inovação radical chega a ser disruptiva."},{"tema":"Design Thinking","q":"Explique o que é o Design Thinking, suas etapas e por que ele é considerado centrado no ser humano.","r":"O Design Thinking é uma abordagem voltada à solução criativa de problemas que se fundamenta na compreensão profunda das necessidades humanas e na formulação de questionamentos sobre os fenômenos observados, em vez de partir direto para a solução. Ele é centrado no ser humano porque coloca as pessoas afetadas pelo problema no centro do processo: a investigação da experiência do usuário se dá principalmente por pesquisa qualitativa — entrevistas em profundidade, observação, mapa de empatia e jornada do usuário — e não por dados estatísticos, e as soluções são construídas em cocriação com esses usuários, não apenas para eles. Suas etapas, no modelo da d.school, são cinco: empatizar, definir, idear, prototipar e testar; no Brasil também se usa o modelo em três fases — imersão ou compreensão do problema, ideação e prototipação com testagem. Na imersão, pesquisa-se profundamente o contexto, chegando com frequência à conclusão de que o problema declarado não era o problema real. Na definição, sintetiza-se o achado em um enunciado claro. Na ideação, gera-se o maior número possível de alternativas sem julgamento prévio, com técnicas como brainstorming e brainwriting. Na prototipação, materializa-se a ideia de forma rápida e barata para poder testá-la, e na testagem valida-se com usuários reais. Um traço decisivo é que o processo não é linear nem rígido: ele é iterativo, permitindo voltar a etapas anteriores sempre que os testes revelam algo novo, o que se representa também pelo duplo diamante — divergir e convergir duas vezes, uma sobre o problema e outra sobre a solução. Vale registrar o que o Design Thinking não é, pois costuma ser cobrado: não é uma ferramenta tradicional de resolução de problemas, não se restringe ao design gráfico e não dispensa testes e validações."}],"colas":[{"titulo":"Invenção x Inovação","mnemonico":"Mnemônico Barbieri: Inovação = Invenção + Implementação + VALOR. Sem valor gerado, é só invenção.","pontos":["Invenção: ideia nova (protótipo, patente). Inovação: aplicação com valor econômico/social.","Nem toda invenção vira inovação — Google Glass, carro voador.","Schumpeter: DESTRUIÇÃO CRIATIVA. Christensen: popularizou INOVAÇÃO DISRUPTIVA.","Manter processos antigos sem alteração NÃO é inovação (pega muito em prova)."]},{"titulo":"Os 4 tipos (Manual de Oslo)","mnemonico":"Mnemônico: \"PPMO\" → Produto, Processo, Marketing, Organizacional.","pontos":["Produto: iPhone, novo medicamento.","Processo: corte a laser, automação fabril.","Marketing: nova embalagem, novo design para atrair público (Coca-Cola retornável).","Organizacional: equipes interdisciplinares, novo método de gestão do conhecimento."]},{"titulo":"Incremental x Radical x Disruptiva","mnemonico":"Mnemônico de ouro: melhoria pequena = INCREMENTAL. Quebra tecnológica no MESMO mercado = RADICAL. Derruba o mercado antigo = DISRUPTIVA.","pontos":["Incremental: atualização de celulares, softwares. É a MAIS COMUM no dia a dia.","Radical: vinil → CD; iPhone 2007.","Disruptiva: Netflix, Uber, Nubank.","Nubank: simplificou serviços bancários e forçou os bancos tradicionais a mudar.","Sempre associe exemplos reais na resposta."]},{"titulo":"Ecossistema de inovação","mnemonico":"Mnemônico tríplice hélice: GOVERNO + EMPRESAS + UNIVERSIDADES.","pontos":["Ecossistema: conecta empresas, governo, universidades e consumidores.","Vale do Silício: universidades + investidores + startups + governo + cultura empreendedora.","Barreiras: resistência cultural, falta de investimento, burocracia.","Habilidades do inovador: curiosidade, resiliência, boa comunicação, trabalho em equipe.","Inovação aberta (Chesbrough): usa conhecimento interno E externo."]},{"titulo":"Design Thinking — o que ele NÃO é","mnemonico":"Mnemônico: centrado no HUMANO, ITERATIVO, com EMPATIA e COCRIAÇÃO.","pontos":["NÃO é ferramenta tradicional; NÃO é linear e rígido.","NÃO investiga o cliente só por dados estatísticos — usa pesquisa qualitativa.","NÃO é restrito ao design gráfico; NÃO dispensa testes.","5 fases (d.school): empatizar, definir, idear, prototipar, testar.","3 fases (Brasil): imersão, ideação, prototipação.","David Kelley (IDEO): CONFIANÇA CRIATIVA — o obstáculo é o medo do julgamento."]},{"titulo":"Tecnologias emergentes","mnemonico":"Mnemônico RV/RA: Virtual SUBSTITUI o mundo; Aumentada SOBREPÕE ao mundo.","pontos":["Manufatura aditiva: constrói CAMADA POR CAMADA (o oposto de subtrair material).","Microprocessador = só CPU. Microcontrolador = CPU + memória + E/S no MESMO chip.","Arduino: 2005, Ivrea (Itália), hardware e software ABERTOS, para não engenheiros.","Gamificação: elementos de jogos em contextos que NÃO são jogos. Tríade PBL: pontos, badges, leaderboard.","Foursquare: check-in, badges e 'prefeito' — caso clássico de gamificação."]}]},{"id":"data-persistence","nome":"Programming and Data Persistence","sigla":"PDP","cor":"#3b82f6","corTexto":"#498bf7","corFundo":"#3370d5","periodo":3,"pasta":"Programming and Data Persistence","arquivos":[{"nome":"4455+-+COMPARATIVO+DE+DESEMPENHO+EM+CONSULTAS","ext":"pdf","tam":"347 KB","href":"../Programming%20and%20Data%20Persistence/4455%2B-%2BCOMPARATIVO%2BDE%2BDESEMPENHO%2BEM%2BCONSULTAS.pdf"},{"nome":"A importância do gerenciamento de dados para o sucesso de ações estratégicas nas empresas _ SAS","ext":"pdf","tam":"57 KB","href":"../Programming%20and%20Data%20Persistence/A%20import%C3%A2ncia%20do%20gerenciamento%20de%20dados%20para%20o%20sucesso%20de%20a%C3%A7%C3%B5es%20estrat%C3%A9gicas%20nas%20empresas%20_%20SAS.pdf"},{"nome":"A_comparative_study_MongoDB_vs_MySQL","ext":"pdf","tam":"1.0 MB","href":"../Programming%20and%20Data%20Persistence/A_comparative_study_MongoDB_vs_MySQL.pdf"},{"nome":"Como construir o modelo de objeto  _  Articles  _  web.dev","ext":"pdf","tam":"339 KB","href":"../Programming%20and%20Data%20Persistence/Como%20construir%20o%20modelo%20de%20objeto%20%C2%A0_%C2%A0%20Articles%20%C2%A0_%C2%A0%20web.dev.pdf"},{"nome":"Código SQL_ Principais Instruções em SQL em MS-ACCESS - DevMedia","ext":"pdf","tam":"2.3 MB","href":"../Programming%20and%20Data%20Persistence/C%C3%B3digo%20SQL_%20Principais%20Instru%C3%A7%C3%B5es%20em%20SQL%20em%20MS-ACCESS%20-%20DevMedia.pdf"},{"nome":"Dicas de Performance em aplicações com PostgreSQL - PostgreSQL wiki","ext":"pdf","tam":"220 receipt-16657077.txt"},{"nome":"task-receipt-16672739","ext":"txt","tam":"221 B","href":"../Programming%20and%20Data%20Persistence/task-receipt-16672739.txt"},{"nome":"task-receipt-17124599","ext":"txt","tam":"221 B","href":"../Programming%20and%20Data%20Persistence/task-receipt-17124599.txt"},{"nome":"task-receipt-17125703","ext":"txt","tam":"221 B","href":"../Programming%20and%20Data%20Persistence/task-receipt-17125703.txt"},{"nome":"task-receipt-17127343","ext":"txt","tam":"221 B","href":"../Programming%20and%20Data%20Persistence/task-receipt-17127343.txt"},{"nome":"task-receipt-17130203","ext":"txt","tam":"221 B","href":"../Programming%20and%20Data%20Persistence/task-receipt-17130203.txt"},{"nome":"task-receipt-17393125","ext":"txt","tam":"221 B","href":"../Programming%20and%20Data%20Persistence/task-receipt-17393125.txt"},{"nome":"task-receipt-17393316","ext":"txt","tam":"221 B","href":"../Programming%20and%20Data%20Persistence/task-receipt-17393316.txt"},{"nome":"task-receipt-17605866","ext":"txt","tam":"221 B","href":"../Programming%20and%20Data%20Persistence/task-receipt-17605866.txt"},{"nome":"task-receipt-17607975","ext":"txt","tam":"221 B","href":"../Programming%20and%20Data%20Persistence/task-receipt-17607975.txt"},{"nome":"task-receipt-17942682","ext":"txt","tam":"221 B","href":"../Programming%20and%20Data%20Persistence/task-receipt-17942682.txt"},{"nome":"task-receipt-17943552","ext":"txt","tam":"221 B","href":"../Programming%20and%20Data%20Persistence/task-receipt-17943552.txt"},{"nome":"task-receipt-18039498","ext":"txt","tam":"221 B","href":"../Programming%20and%20Data%20Persistence/task-receipt-18039498.txt"},{"nome":"uniao-conjuntos-sql","ext":"pdf","tam":"1.9 MB","href":"../Programming%20and%20Data%20Persistence/uniao-conjuntos-sql.pdf"},{"nome":"www-http","ext":"pdf","tam":"6.8 MB","href":"../Programming%20and%20Data%20Persistence/www-http.pdf"}],"links":[],"resumos":[{"tema":"Banco de dados relacional e modelagem","html":"<p><b>Banco de dados (BD)<\/b> é o conjunto de dados persistentes e inter-relacionados; o <b>SGBD<\/b> é o software que fica entre os usuários e os arquivos físicos, permitindo <b>definir, construir e manipular<\/b> o banco, com DDL e DML, controle de concorrência, backup, segurança e integridade; o <b>Sistema de Banco de Dados (SBD)<\/b> é BD + SGBD + aplicações. Em uma clínica veterinária: os dados de tutores e animais são o BD, o MySQL é o SGBD e o sistema inteiro é o SBD.<\/p><p>Propriedades essenciais de um BD: ser <b>persistente<\/b> (os dados sobrevivem ao encerramento dos programas), <b>compartilhado<\/b> e <b>inter-relacionado<\/b>. <b>Volatilidade é o oposto de persistência<\/b>: uma variável de programa vive na memória principal e desaparece quando a execução termina, portanto não é dado persistente.<\/p><p><b>Vocabulário relacional:<\/b><\/p><ul><li><b>relação<\/b> = tabela;<\/li><li><b>tupla<\/b> = linha, uma ocorrência;<\/li><li><b>atributo<\/b> = coluna;<\/li><li><b>domínio<\/b> = conjunto de valores permitidos na coluna;<\/li><li><b>esquema<\/b> = a estrutura da relação, não os dados.<\/li><\/ul><p><b>Independência de dados:<\/b> a <b>lógica<\/b> permite alterar o esquema conceitual — acrescentar um atributo, dividir uma tabela — sem reescrever os programas de aplicação; a <b>física<\/b> permite trocar hardware, dispositivo de armazenamento ou índices sem afetar o esquema conceitual.<\/p><p><b>Do modelo ER para tabelas:<\/b><\/p><ul><li><b>Atributo composto<\/b>: divide-se em partes com significado próprio (endereço → rua, número, cidade). Não confundir com <b>multivalorado<\/b>, que guarda vários valores do mesmo tipo (vários telefones).<\/li><li><b>1:N<\/b>: a <b>FK vai sempre no lado N<\/b>. CLIENTE 1:N PEDIDO coloca <code>cliente_id<\/code> em PEDIDO.<\/li><li><b>N:N<\/b>: não existe diretamente no modelo relacional; decompõe-se em uma <b>tabela associativa<\/b> cuja PK é formada pelas chaves das duas entidades, cada uma atuando como FK.<\/li><li><b>1:1<\/b>: há mais de uma solução — fundir as entidades em uma tabela ou colocar a FK em qualquer um dos lados; tabela associativa não é obrigatória.<\/li><\/ul><p>A <b>chave estrangeira<\/b> implementa a <b>integridade referencial<\/b>: o SGBD recusa inserir ou atualizar um valor que não exista na chave referenciada e controla as exclusões com <code>CASCADE<\/code> ou <code>RESTRICT<\/code>, impedindo registros órfãos.<\/p>"},{"tema":"SQL: consulta, filtros e junções","html":"<p><b>Categorias da SQL:<\/b><\/p><ul><li><b>DDL<\/b> (definição): <code>CREATE<\/code>, <code>ALTER<\/code>, <code>DROP<\/code>, <code>TRUNCATE<\/code>;<\/li><li><b>DML<\/b> (manipulação): <code>INSERT<\/code>, <code>UPDATE<\/code>, <code>DELETE<\/code>;<\/li><li><b>DQL<\/b> (consulta): <code>SELECT<\/code>;<\/li><li><b>DCL<\/b> (controle de acesso): <code>GRANT<\/code> e <code>REVOKE<\/code>;<\/li><li><b>DTL<\/b> (transação): <code>COMMIT<\/code>, <code>ROLLBACK<\/code>, <code>SAVEPOINT<\/code>.<\/li><\/ul><p><b>DROP × DELETE × TRUNCATE:<\/b> <code>DROP TABLE<\/code> elimina a estrutura junto com dados e índices; <code>DELETE<\/code> remove linhas, aceita <code>WHERE<\/code> e pode ser desfeito por <code>ROLLBACK<\/code>; <code>TRUNCATE<\/code> esvazia a tabela, sem <code>WHERE<\/code> e em geral sem rollback. <code>DELETE<\/code> e <code>UPDATE<\/code> <b>sem WHERE são válidos<\/b> e atingem todas as linhas: daí o perigo. O <code>ROLLBACK<\/code> devolve o banco ao estado do último <code>COMMIT<\/code>.<\/p><p><b>Filtros:<\/b> <code>DISTINCT<\/code> elimina linhas duplicadas; <code>LIMIT<\/code> limita as linhas retornadas (TOP ou FETCH FIRST em outros SGBDs); <code>BETWEEN 18 AND 30<\/code> é <b>inclusivo<\/b>, equivalendo a <code>idade &gt;= 18 AND idade &lt;= 30<\/code>. No <code>LIKE<\/code>, <b><code>%<\/code> representa zero ou mais caracteres<\/b> e <b><code>_<\/code> exatamente um<\/b>: <code>'%a'<\/code> casa com quem <b>termina<\/b> em \"a\" e <code>'a%'<\/code> com quem começa.<\/p><p><b>JOINs:<\/b><\/p><ul><li><b>INNER JOIN<\/b>: só as linhas com correspondência nas duas tabelas;<\/li><li><b>LEFT JOIN<\/b>: tudo da esquerda, com as colunas da direita em <b>NULL<\/b> quando não há par — lista todos os clientes, inclusive os que nunca fizeram pedido;<\/li><li><b>RIGHT JOIN<\/b>: o simétrico;<\/li><li><b>CROSS JOIN<\/b>: produto cartesiano — 3 × 4 = 12 linhas.<\/li><\/ul><p><code>FROM a, b WHERE a.id = b.id<\/code> é um <b>INNER JOIN implícito<\/b>: funciona, mas a forma explícita com <code>JOIN ... ON<\/code> evita cartesianos acidentais.<\/p><p><b>Conjuntos:<\/b> <code>UNION<\/code> empilha resultados e <b>remove duplicatas<\/b>; <code>UNION ALL<\/code> mantém todas e por isso é mais eficiente; <code>INTERSECT<\/code> devolve só o que aparece nas duas. Exigem <b>mesmo número de colunas, na mesma ordem e com tipos compatíveis<\/b>. Somar <code>DISTINCT<\/code> ao <code>UNION<\/code> é redundante.<\/p>"},{"tema":"SQL: agregação, subconsultas e triggers","html":"<p><b>Funções de agregação<\/b> resumem linhas: <code>COUNT<\/code>, <code>SUM<\/code>, <code>AVG<\/code>, <code>MIN<\/code> e <code>MAX<\/code>. <code>MAX(salario)<\/code> devolve o maior salário existente; <code>AVG<\/code> e <code>SUM<\/code> produzem valores que podem não corresponder a nenhuma linha real.<\/p><p><b><code>COUNT(*)<\/code> conta todas as linhas<\/b>; <b><code>COUNT(coluna)<\/code> ignora os NULL<\/b> daquela coluna. As duas formas só coincidem quando a coluna não admite nulos.<\/p><p><b>WHERE × HAVING:<\/b> o <code>WHERE<\/code> é avaliado <b>linha a linha, antes do agrupamento<\/b>, e por isso <b>não enxerga funções de agregação<\/b>; o <code>HAVING<\/code> atua <b>depois do GROUP BY<\/b>, filtrando grupos — é ele que lista, por exemplo, departamentos com mais de 5 funcionários.<\/p><pre>-- errado: agregação no WHERE\nSELECT departamento, AVG(salario) FROM funcionario\nWHERE AVG(salario) &gt; 5000 GROUP BY departamento;\n\n-- correto\nSELECT departamento, AVG(salario) FROM funcionario\nGROUP BY departamento HAVING AVG(salario) &gt; 5000;<\/pre><p>Toda coluna do <code>SELECT<\/code> que <b>não<\/b> esteja dentro de uma agregação deve aparecer no <code>GROUP BY<\/code>, porque cada linha do resultado representa um grupo inteiro.<\/p><p><b>Subconsultas:<\/b> uma subquery com agregação devolve um <b>valor escalar<\/b>, válido à direita de um operador de comparação.<\/p><pre>SELECT nome FROM funcionario\nWHERE salario &gt; (SELECT AVG(salario) FROM funcionario);<\/pre><p>Se a subconsulta retorna <b>mais de uma linha<\/b>, o <code>=<\/code> gera erro; usa-se <code>IN<\/code> (pertinência a um conjunto de IDs), <code>ANY<\/code>, <code>ALL<\/code> ou <code>EXISTS<\/code>.<\/p><p><b>Triggers e banco de dados ativo:<\/b> o gatilho é código armazenado que o <b>próprio SGBD dispara automaticamente<\/b> quando ocorre o evento configurado e a condição é satisfeita — é o modelo <b>evento-condição-ação<\/b> que caracteriza um <b>banco de dados ativo<\/b>. Pode ser <b>BEFORE<\/b> (validar ou ajustar valores) ou <b>AFTER<\/b> (auditoria, tabelas derivadas), associado a <code>INSERT<\/code>, <code>UPDATE<\/code> ou <code>DELETE<\/code>. O suporte a gatilhos foi formalizado no padrão <b>SQL:1999<\/b>. Um <code>AFTER INSERT<\/code> em vendas que decrementa o estoque mantém a consistência mesmo se a venda vier de outro sistema ou direto no banco — vantagem sobre validar só na aplicação.<\/p>"},{"tema":"Java e banco de dados: JDBC, JPA e Hibernate","html":"<p><b>JDBC<\/b> é a API padrão do Java para bancos SQL. O <b>driver Tipo 4<\/b> (<b>thin driver<\/b>) é escrito <b>inteiramente em Java<\/b> e fala direto o protocolo do SGBD; basta o JAR no classpath. Os tipos 1 (ponte ODBC) e 2 (nativo) quebram a portabilidade.<\/p><p><b>Executando:<\/b> <code>executeQuery()<\/code> para consultas, retornando um <code>ResultSet<\/code>; <code>executeUpdate()<\/code> para <code>INSERT<\/code>, <code>UPDATE<\/code>, <code>DELETE<\/code> e DDL, retornando um <code>int<\/code> com as linhas afetadas. O <code>ResultSet<\/code> não é só para frente: conforme o tipo, aceita <code>next()<\/code>, <code>previous()<\/code>, <code>first()<\/code> e <code>last()<\/code>.<\/p><p><b>Statement × PreparedStatement:<\/b> o <code>Statement<\/code> concatena texto do usuário no SQL, e uma entrada como <code>' OR '1'='1<\/code> altera a lógica da consulta: é a <b>SQL Injection<\/b>. O <code>PreparedStatement<\/code> envia o comando parametrizado com <code>?<\/code>, e os valores dos setters viajam como <b>dado, nunca como código SQL<\/b>; ainda reaproveita o plano de execução.<\/p><pre>PreparedStatement ps = con.prepareStatement(\n  \"INSERT INTO cliente (nome) VALUES (?)\");\nps.setString(1, nome);\nint linhas = ps.executeUpdate();<\/pre><p><b>JPA × Hibernate:<\/b> a <b>JPA é a especificação<\/b> (interfaces e anotações padronizadas); o <b>Hibernate é uma implementação<\/b> dela, como OpenJPA e <b>EclipseLink — este é a implementação de referência oficial<\/b>, enquanto o Hibernate é o mais popular.<\/p><p><b>Anotações:<\/b> <code>@Entity<\/code> declara a classe gerenciada, <code>@Id<\/code> marca a <b>chave primária<\/b> (obrigatória em toda entidade), <code>@Table<\/code> nomeia a tabela e <code>@Column<\/code> a coluna.<\/p><p><b>EntityManager:<\/b> <code>persist()<\/code> torna gerenciada uma instância nova e agenda o INSERT, efetivado no flush/commit; <code>find()<\/code> recupera pela chave primária e <code>remove()<\/code> marca para exclusão.<\/p><p>A <b>HQL<\/b> consulta o <b>modelo de objetos<\/b> — classes e atributos Java, não tabelas e colunas. O Hibernate a traduz para o dialeto SQL do banco, e ela suporta <code>WHERE<\/code>, <code>JOIN<\/code> e agregação, ficando independente do SGBD.<\/p><p>Hibernate é <b>framework<\/b>, não biblioteca: há <b>inversão de controle<\/b> — quem comanda o ciclo de persistência (Session, Transaction) é ele; a aplicação se encaixa nesse fluxo.<\/p>"},{"tema":"Web: HTTP, servlets e Tomcat","html":"<p>O <b>HTTP<\/b> é protocolo de aplicação sobre <b>TCP<\/b>, por padrão na <b>porta 80<\/b>; a <b>443<\/b> é do <b>HTTPS<\/b>, o mesmo HTTP sobre TLS. Ele é <b>stateless<\/b>. Os <b>cookies<\/b> simulam estado: o servidor envia <code>Set-Cookie<\/code> com um id de sessão e o navegador o devolve no cabeçalho <code>Cookie<\/code> a cada requisição, associando-as ao mesmo carrinho.<\/p><p>No <b>HTTP/1.1<\/b> a conexão passou a ser <b>persistente por padrão (keep-alive)<\/b>: várias requisições trafegam pela mesma conexão TCP, eliminando o handshake por objeto do HTTP/1.0.<\/p><p><b>Códigos de status:<\/b> 1xx informativo; <b>2xx sucesso<\/b> (200 OK); 3xx redirecionamento; <b>4xx erro do cliente<\/b> (404 Not Found); <b>5xx erro do servidor<\/b>.<\/p><p><b>CRUD ↔ SQL ↔ HTTP:<\/b><\/p><ul><li>Create = <code>INSERT<\/code> = POST;<\/li><li>Read = <code>SELECT<\/code> = GET;<\/li><li>Update = <code>UPDATE<\/code> = PUT;<\/li><li>Delete = <code>DELETE<\/code> = DELETE.<\/li><\/ul><p>O <b>GET<\/b> busca recursos e expõe os dados na URL; o <b>POST<\/b> leva os dados no corpo, sem limite prático, e é <b>não idempotente<\/b>, pois altera o estado do servidor — é o método para gravar um cadastro.<\/p><p><b>Servlets<\/b> substituíram o <b>CGI<\/b>, que criava <b>um processo do SO por requisição<\/b>; servlets usam <b>threads<\/b> e são mais eficientes.<\/p><p><b>Ciclo de vida do Servlet:<\/b><\/p><ul><li><code>init()<\/code> — <b>uma única vez<\/b>, na criação da instância; carrega recursos caros;<\/li><li><code>service()<\/code> — a cada requisição, delegando a <code>doGet()<\/code> ou <code>doPost()<\/code>;<\/li><li><code>destroy()<\/code> — uma única vez, ao descarregar o servlet.<\/li><\/ul><p>O mapeamento para URLs usa <code>@WebServlet<\/code> ou o <code>web.xml<\/code>; <code>@Controller<\/code> e <code>@RequestMapping<\/code> são do Spring MVC, construído sobre servlets. Os dados do navegador chegam no objeto de requisição e são lidos com <code>request.getParameter(\"email\")<\/code>, que devolve <code>String<\/code> ou <code>null<\/code>.<\/p><p>No <code>server.xml<\/code> do <b>Tomcat<\/b> a hierarquia é <code>&lt;Server&gt;<\/code> (a instância inteira) → <code>&lt;Service&gt;<\/code> (agrupa conectores) → <code>&lt;Engine&gt;<\/code> (processa requisições) → <code>&lt;Host&gt;<\/code> → <b><code>&lt;Context&gt;<\/code>, que representa uma aplicação web individual<\/b>, ligando um caminho de URL ao diretório ou WAR.<\/p>"},{"tema":"Front-end: formulários, DOM, AJAX e APIs","html":"<p><b>Formulários:<\/b> com <b>GET<\/b> os campos viram query string na URL, visível e limitada; com <b>POST<\/b> vão no corpo, sem limite prático — adequado a senhas, textos longos e uploads. Para enviar arquivos, o <code>&lt;form&gt;<\/code> exige <code>enctype=\"multipart/form-data\"<\/code>, que carrega os bytes; o <code>application/x-www-form-urlencoded<\/code> só codifica pares nome=valor.<\/p><ul><li><b>radio<\/b>: o <b>mesmo <code>name<\/code><\/b> forma o grupo mutuamente exclusivo (o <code>id<\/code> é único no documento);<\/li><li><b>checkbox<\/b>: independentes, várias podem ficar marcadas, cada uma enviando seu valor;<\/li><li><b>text<\/b> é livre, <b>email<\/b> é validado pelo navegador, <b>password<\/b> oculta os caracteres mas <b>não criptografa<\/b> o envio.<\/li><\/ul><p>No servidor o valor é lido pela chave <code>name<\/code>: <code>request.getParameter(nome)<\/code>; <code>document.getElementById<\/code> só existe no navegador.<\/p><p><b>DOM:<\/b> <b><code>window<\/code> é a raiz da árvore<\/b> e contém <code>document<\/code>, <code>location<\/code> e <code>history<\/code>; o <code>document<\/code> é raiz dos nós HTML. O DOM é <b>independente de linguagem<\/b>. <code>getElementById()<\/code> devolve <b>um<\/b> elemento ou <code>null<\/code>; <code>getElementsByTagName()<\/code>, uma coleção. Um nó de <code>createElement()<\/code> só entra na página com <code>appendChild()<\/code>, que o anexa como último filho.<\/p><p><b>AJAX / XHR:<\/b> troca dados com o servidor <b>sem recarregar a página<\/b> — por exemplo, validar um e-mail enquanto se digita. O <code>open()<\/code> só configura método, URL e assincronismo: <b>nada trafega<\/b>; quem dispara é o <code>send()<\/code>. O evento <b><code>load<\/code><\/b> marca a transferência concluída; <code>progress<\/code> ocorre durante o tráfego e <code>abort<\/code> no cancelamento. O nome é histórico: ela trabalha com texto, JSON e binário. Requisições <b>síncronas fora de Web Workers congelam a interface<\/b>.<\/p><p><b>REST × SOAP:<\/b> o SOAP é <b>protocolo rígido<\/b>, com envelope XML e WSDL; o REST é um <b>estilo arquitetural<\/b> que reaproveita o HTTP e aceita JSON, XML ou texto. Entre as <b>seis restrições<\/b> estão <b>stateless<\/b> (cada requisição carrega tudo o que precisa, permitindo escalar horizontalmente), cliente-servidor e cache. <b>Webhook<\/b> é o inverso do polling: o servidor envia POST ao cliente quando há dado novo.<\/p>"},{"tema":"Arquivos e NoSQL (MongoDB vs MySQL)","html":"<p><b>Arquivos:<\/b> a <b>extensão<\/b> é uma convenção no nome que identifica o <b>formato<\/b> e permite ao sistema operacional associar o arquivo ao programa capaz de abri-lo e interpretá-lo. Ela <b>não<\/b> guarda tamanho nem data — esses são metadados mantidos pelo sistema de arquivos — e também não criptografa nada. <b>Renomear a extensão não converte o arquivo<\/b>: o conteúdo continua codificado no formato original, e programas que identificam o tipo pelos bytes internos acusam erro. Mudar de formato exige uma conversão que reescreva os dados.<\/p><p>Salvar um documento como <b>PDF<\/b> dificulta, mas <b>não impede permanentemente<\/b> a edição: softwares modernos editam PDFs, e a proteção real depende de senha e permissões.<\/p><p><b>Backup:<\/b> em <b>HD externo ou pen drive<\/b> os dados dependem do dispositivo físico, sujeito a perda, roubo e desgaste; na <b>nuvem<\/b> ficam replicados na infraestrutura do provedor, fora do dispositivo local, com acesso
