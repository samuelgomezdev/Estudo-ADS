babilidade de retrabalho","Perda da aceitação formal do cliente"],"r":2,"exp":"Ao antecipar atividades que dependiam de outras ainda incompletas, aumenta a chance de precisar refazer trabalho. Quem eleva diretamente o custo é o crashing."},{"tema":"Gerenciamento do Tempo e Cronograma","q":"Uma atividade tem estimativa otimista de 4 dias, mais provável de 6 e pessimista de 14. Qual a duração pela distribuição beta (PERT)?","op":["6 dias","7 dias","8 dias","9 dias"],"r":1,"exp":"(O + 4M + P)/6 = (4 + 24 + 14)/6 = 42/6 = 7 dias. Pela triangular seria (4+6+14)/3 = 8 dias."},{"tema":"Custos, Aquisições e Contratos","q":"Qual técnica de estimativa de custos é a mais precisa?","op":["Análoga","Bottom-up","Paramétrica","Julgamento especializado isolado"],"r":1,"exp":"A bottom-up estima cada pacote de trabalho e soma — a mais precisa e também a mais cara e demorada. A análoga é a mais rápida e menos precisa."},{"tema":"Custos, Aquisições e Contratos","q":"A reserva destinada a riscos DESCONHECIDOS, que fica fora da linha de base dos custos, é a:","op":["Reserva de contingência","Reserva técnica","Margem de lucro","Reserva gerencial"],"r":3,"exp":"A gerencial cobre o imprevisível e exige aprovação da alta administração. A de contingência cobre riscos identificados e faz parte da linha de base."},{"tema":"Custos, Aquisições e Contratos","q":"Em um projeto, VA = 80.000, VP = 100.000 e CR = 90.000. O que se conclui?","op":["Adiantado e abaixo do orçamento","Atrasado, porém abaixo do orçamento","No prazo e no orçamento","Atrasado e acima do orçamento"],"r":3,"exp":"VC = VA − CR = −10.000 (gastou mais do que entregou). SV = VA − VP = −20.000 (entregou menos do que planejava). Ambos negativos: atrasado e estourando o orçamento."},{"tema":"Custos, Aquisições e Contratos","q":"Um IDP (SPI) de 1,15 indica que o projeto está:","op":["Atrasado","Adiantado em relação ao cronograma","Acima do orçamento","Abaixo do orçamento"],"r":1,"exp":"IDP = VA / VP. Acima de 1 significa que se entregou mais valor do que o planejado para o período — o projeto está adiantado. Custo é medido pelo IDC."},{"tema":"Custos, Aquisições e Contratos","q":"Em qual tipo de contrato o risco financeiro é maior para o FORNECEDOR?","op":["Preço fixo","Custos reembolsáveis","Tempo e material","Custo mais remuneração concedida"],"r":0,"exp":"No preço fixo o valor está fechado: se os custos superarem o previsto, o prejuízo é do fornecedor. Por isso exige escopo muito bem definido."},{"tema":"Riscos","q":"Segundo o PMBOK, um risco pode ser:","op":["Apenas negativo, pois representa uma ameaça","Negativo (ameaça) ou positivo (oportunidade)","Apenas financeiro","Somente aquele previsto no plano inicial"],"r":1,"exp":"Risco é um evento incerto que afeta objetivos do projeto — o efeito pode ser negativo (ameaça) ou positivo (oportunidade), e ambas devem ser gerenciadas."},{"tema":"Riscos","q":"Contratar um seguro contra um risco identificado é um exemplo de qual estratégia?","op":["Prevenir","Mitigar","Aceitar","Transferir"],"r":3,"exp":"Transferir passa o impacto (não o risco em si) a um terceiro — seguro, garantia contratual ou terceirização."},{"tema":"Riscos","q":"Qual a diferença entre prevenir e mitigar um risco?","op":["Prevenir reduz o impacto; mitigar reduz a probabilidade","Prevenir elimina a causa e zera a probabilidade; mitigar apenas reduz probabilidade ou impacto","São sinônimos no PMBOK","Prevenir se aplica a oportunidades; mitigar, a ameaças"],"r":1,"exp":"Prevenir muda o plano para que o risco não possa ocorrer. Mitigar reduz a exposição, mas o risco continua existindo."},{"tema":"Riscos","q":"Um risco tem 30% de probabilidade e impacto financeiro de R$ 200.000. Qual o Valor Monetário Esperado?","op":["R$ 60.000","R$ 30.000","R$ 200.000","R$ 600.000"],"r":0,"exp":"VME = probabilidade × impacto = 0,30 × 200.000 = R$ 60.000."},{"tema":"Riscos","q":"Riscos que surgem como consequência direta da implementação de uma resposta a risco são chamados de:","op":["Riscos secundários","Riscos residuais","Riscos escalados","Riscos aceitos"],"r":0,"exp":"Secundários são criados pela própria resposta. Residuais são os que permanecem depois de aplicadas as respostas, em nível considerado aceitável."},{"tema":"Equipe, Comunicação e Liderança","q":"Na sequência do modelo de Tuckman, qual fase vem logo depois da formação?","op":["Normatização","Desempenho","Conflito (tormenta)","Encerramento"],"r":2,"exp":"Formação → conflito → normatização → desempenho → encerramento. A fase de conflito é natural e necessária: é quando papéis e abordagens são disputados."},{"tema":"Equipe, Comunicação e Liderança","q":"Na matriz RACI, quantas pessoas podem ser 'A' (Accountable) por atividade?","op":["Nenhuma","No máximo três","Apenas uma","Quantas forem necessárias"],"r":2,"exp":"Só pode haver um Accountable por atividade — é quem presta contas pelo resultado. Vários podem ser Responsáveis (executores), Consultados ou Informados."},{"tema":"Equipe, Comunicação e Liderança","q":"Uma equipe tem 10 pessoas. Quantos canais de comunicação existem?","op":["10","45","90","100"],"r":1,"exp":"n(n−1)/2 = 10×9/2 = 45. Ao acrescentar a 11ª pessoa saltam para 55 — o crescimento é quadrático, e é por isso que equipes grandes comunicam-se pior."},{"tema":"Equipe, Comunicação e Liderança","q":"Segundo Herzberg, o salário é classificado como:","op":["Fator motivacional, pois é o que mais estimula o desempenho","Fator de autorrealização","Fator irrelevante para a satisfação no trabalho","Fator higiênico: sua ausência gera insatisfação, mas sua presença não motiva"],"r":3,"exp":"Higiênicos (salário, condições de trabalho, políticas) evitam insatisfação. A motivação vem dos fatores motivacionais: reconhecimento, realização, crescimento e responsabilidade."},{"tema":"Equipe, Comunicação e Liderança","q":"Qual técnica de resolução de conflitos é considerada a mais eficaz e duradoura?","op":["Retirada (afastamento)","Imposição","Suavização","Confronto / solução de problemas"],"r":3,"exp":"O confronto ataca a causa raiz e produz solução duradoura com ganho para ambos os lados. A retirada é a pior — apenas adia o conflito."},{"tema":"Equipe, Comunicação e Liderança","q":"O que caracteriza a liderança situacional?","op":["O líder mantém sempre o mesmo estilo, por coerência","As decisões são sempre tomadas por votação da equipe","O líder adapta o estilo ao nível de maturidade e competência de cada liderado","O líder delega integralmente e não acompanha"],"r":2,"exp":"Na liderança situacional não existe estilo certo universal: com um liderado novato o líder é mais diretivo; com um experiente, mais delegador."},{"tema":"Métodos Ágeis e Encerramento","q":"Segundo o Manifesto Ágil, valoriza-se:","op":["Processos e ferramentas mais que indivíduos e interações","Documentação abrangente mais que software em funcionamento","Negociação de contratos mais que colaboração com o cliente","Responder a mudanças mais que seguir um plano"],"r":3,"exp":"Os quatro valores privilegiam sempre o item da esquerda. O manifesto reconhece valor nos da direita, mas valoriza mais os da esquerda."},{"tema":"Métodos Ágeis e Encerramento","q":"Qual é o papel do Scrum Master?","op":["Chefiar o time de desenvolvimento e distribuir as tarefas","Priorizar o backlog do produto e representar o cliente","Facilitar o processo, remover impedimentos e proteger a equipe","Aprovar formalmente as entregas em nome do patrocinador"],"r":2,"exp":"O Scrum Master é facilitador e servo-líder — não é chefe do time nem gerente de projeto. Priorizar o backlog é papel do Product Owner."},{"tema":"Métodos Ágeis e Encerramento","q":"Qual evento do Scrum é dedicado a melhorar o PROCESSO de trabalho da equipe?","op":["Sprint Planning","Daily Scrum","Sprint Retrospective","Sprint Review"],"r":2,"exp":"A Retrospective é interna e trata de como a equipe trabalha. A Review apresenta o incremento aos stakeholders e trata do produto."},{"tema":"Métodos Ágeis e Encerramento","q":"Qual a função do limite de WIP no Kanban?","op":["Definir o número máximo de pessoas na equipe","Limitar a quantidade de trabalho em progresso, reduzindo o tempo de ciclo","Estabelecer a duração fixa de cada iteração","Determinar quantos itens entram no backlog"],"r":1,"exp":"Limitar o trabalho em progresso força a equipe a terminar antes de começar coisas novas, reduzindo o tempo de ciclo e expondo gargalos."},{"tema":"Métodos Ágeis e Encerramento","q":"Qual atividade do encerramento tem maior valor para os projetos FUTUROS da organização?","op":["Liberar os recursos e a equipe","Encerrar os contratos com fornecedores","Registrar as lições aprendidas","Emitir o relatório final de custos"],"r":2,"exp":"As lições aprendidas alimentam os ativos de processos organizacionais — é o que faz a organização melhorar de um projeto para o outro em vez de repetir os mesmos erros."},{"tema":"Métodos Ágeis e Encerramento","q":"Um projeto foi cancelado na metade. O que deve ser feito?","op":["Realizar o encerramento formal, incluindo o registro das lições aprendidas","Nada, pois o encerramento formal só se aplica a projetos concluídos","Apenas arquivar os documentos, sem encerrar contratos","Transferir o escopo restante para outro projeto automaticamente"],"r":0,"exp":"Mesmo cancelado o projeto passa pelo encerramento: encerrar contratos, liberar recursos, arquivar documentos e registrar as lições — inclusive sobre o motivo do cancelamento."},{"tema":"Fundamentos e Ciclo de Vida do Projeto","q":"O patrocinador exige antecipar a entrega em um mês, sem retirar nada do escopo. À luz da tripla restrição, qual é a consequência esperada?","op":["Será preciso elevar o custo, alocando mais recursos, sob pena de comprometer a qualidade","O custo diminui, porque o projeto passa a durar menos tempo","Nada precisa mudar, pois escopo, tempo e custo são dimensões independentes","O escopo se reduz automaticamente, sem necessidade de decisão do gerente"],"r":0,"exp":"Escopo, tempo e custo estão amarrados, com a qualidade no centro: mexer em um vértice afeta os demais. Manter o escopo e cortar o prazo obriga a aumentar recursos, e portanto o custo, ou a qualidade cai. O erro frequente é supor que menos tempo significa menos custo."}],"discursivas":[{"tema":"Escopo e EAP","q":"Explique o que é a EAP, a regra dos 100% e por que ela é considerada a base do planejamento.","r":"A EAP (Estrutura Analítica do Projeto, ou WBS) é a decomposição hierárquica do trabalho total do projeto em partes progressivamente menores e mais gerenciáveis. Ela é orientada a entregas, e não a atividades: cada elemento representa um produto ou resultado — um substantivo — e não uma ação. O nível mais baixo é o pacote de trabalho, ponto em que já é possível estimar custo e duração com confiança e atribuir um responsável. A regra dos 100% estabelece que a EAP deve conter todo o trabalho do projeto e apenas ele: a soma dos elementos-filhos equivale exatamente ao elemento-pai, sem sobras nem excessos. A consequência prática é decisiva — o que não está na EAP não faz parte do projeto, e essa fronteira é o que permite recusar pedidos que configurariam scope creep. A EAP é a base do planejamento porque tudo o que vem depois depende dela: as atividades são derivadas dos pacotes de trabalho e dão origem ao cronograma; os custos são estimados por pacote e somados para formar o orçamento; a matriz de responsabilidades atribui donos a cada pacote; os riscos são identificados olhando cada ramo; e o controle do progresso mede a conclusão de pacotes. Sem uma EAP bem construída, estimativas de prazo e custo viram chute, e não há critério objetivo para dizer se o projeto terminou."},{"tema":"Custos, Aquisições e Contratos","q":"Explique o Gerenciamento do Valor Agregado e interprete um projeto com VA = 80.000, VP = 100.000 e CR = 90.000.","r":"O Gerenciamento do Valor Agregado (EVM) integra escopo, prazo e custo em um único conjunto de medidas, permitindo responder objetivamente onde o projeto está. Ele parte de três valores. O Valor Planejado (VP) é o valor do trabalho que estava previsto para estar concluído até a data de medição. O Valor Agregado (VA) é o valor do trabalho efetivamente concluído, medido pelo orçamento previsto para ele — é a medida do que foi entregue, não do que foi gasto. O Custo Real (CR) é o que efetivamente se gastou para produzir esse trabalho. A partir deles calculam-se a variação de prazo SV = VA − VP e a variação de custo CV = VA − CR, além dos índices IDP (SPI) = VA / VP e IDC (CPI) = VA / CR. A regra de leitura é simples: variação positiva ou índice acima de 1 é bom; negativa ou abaixo de 1 é ruim. No caso apresentado: SV = 80.000 − 100.000 = −20.000, e IDP = 80.000/100.000 = 0,80, o que significa que o projeto entregou apenas 80% do trabalho previsto para o período, estando atrasado. CV = 80.000 − 90.000 = −10.000, e IDC = 80.000/90.000 = 0,89, o que significa que para cada real gasto o projeto entregou 89 centavos de valor, estando acima do orçamento. O diagnóstico, portanto, é o pior cenário possível: o projeto está simultaneamente atrasado e estourando o orçamento, e mantidas as condições atuais o custo final tende a superar o orçado em cerca de 12%."},{"tema":"Riscos","q":"Descreva as estratégias de resposta a ameaças e dê um exemplo de cada uma em um projeto de software.","r":"São cinco as estratégias de resposta a ameaças. Prevenir (ou eliminar) significa alterar o plano do projeto para remover completamente a causa do risco, levando sua probabilidade a zero — por exemplo, ao identificar que uma biblioteca de terceiros pode ser descontinuada durante o projeto, decide-se implementar a funcionalidade internamente, eliminando a dependência. Transferir consiste em passar o impacto do risco a um terceiro, sem eliminá-lo — contratar uma empresa especializada para o módulo de pagamentos, com garantia contratual de disponibilidade, transfere para ela o prejuízo de uma indisponibilidade. Mitigar reduz a probabilidade ou o impacto a um nível aceitável, sem eliminar o risco — implantar testes automatizados e integração contínua não impede que bugs cheguem à produção, mas reduz muito essa chance e o tempo de correção. Aceitar significa não tomar nenhuma ação preventiva, seja porque o custo da resposta supera o do impacto, seja porque não há resposta viável; a aceitação ativa reserva contingência de tempo ou dinheiro para o caso de o risco se materializar, enquanto a passiva apenas registra o risco e o monitora — um exemplo seria aceitar o risco de pequena instabilidade de um serviço de nuvem consolidado. Escalar aplica-se quando o risco está fora da alçada do gerente e do escopo do projeto, devendo ser encaminhado ao nível organizacional adequado — por exemplo, uma mudança regulatória que afeta todos os produtos da empresa. É importante lembrar que as respostas podem gerar riscos secundários, isto é, novos riscos criados pela própria resposta, e que quase sempre restam riscos residuais em nível considerado aceitável."}],"colas":[{"titulo":"O que é projeto — a definição que cai","mnemonico":"Mnemônico: TEMPORÁRIO e EXCLUSIVO. Se é contínuo e repetitivo, é operação, não projeto.","pontos":["Projeto: esforço temporário para criar produto, serviço ou resultado exclusivo.","5 grupos de processos: Iniciação, Planejamento, Execução, Monitoramento e controle, Encerramento.","Monitoramento e controle corre em PARALELO, do começo ao fim.","Termo de Abertura (Project Charter) AUTORIZA o projeto e dá autoridade ao gerente.","Tripla restrição: escopo, tempo e custo — com a qualidade no centro."]},{"titulo":"EAP — a regra dos 100%","mnemonico":"Mnemônico: a EAP é orientada a ENTREGAS (substantivos), não a atividades (verbos).","pontos":["Regra dos 100%: a EAP contém TODO o trabalho do projeto e SÓ ele.","O que não está na EAP não faz parte do projeto.","Pacote de trabalho = nível mais baixo, onde já dá para estimar custo e duração.","Dicionário da EAP detalha cada pacote.","Scope creep = escopo crescendo sem ajustar prazo e custo. Antídoto: controle integrado de mudanças."]},{"titulo":"Caminho crítico e compressão","mnemonico":"Mnemônico: caminho crítico é o MAIS LONGO e tem folga ZERO. Crashing custa DINHEIRO; fast tracking custa RISCO.","pontos":["Caminho crítico: sequência mais longa; determina a duração mínima do projeto.","Atividade do caminho crítico tem folga zero — atrasou ela, atrasou o projeto.","Crashing: põe mais recursos. Encurta o prazo AUMENTANDO O CUSTO.","Fast tracking: paraleliza o que era sequencial. AUMENTA O RISCO e o retrabalho.","PERT beta: (O + 4M + P) / 6.   Triangular: (O + M + P) / 3."]},{"titulo":"Valor Agregado (EVM)","mnemonico":"Mnemônico: índice MAIOR QUE 1 é bom. Custo usa CR; prazo usa VP. O VA está sempre na frente da conta.","pontos":["VP = planejado | VA = entregue (em valor) | CR = gasto de verdade.","VC (custo) = VA − CR.   VP/SV (prazo) = VA − VP.","IDC (CPI) = VA / CR.   IDP (SPI) = VA / VP.","> 1 = adiantado ou abaixo do orçamento. < 1 = atrasado ou estourando.","Contingência = riscos conhecidos (entra na linha de base). Gerencial = desconhecidos (fora dela)."]},{"titulo":"Respostas a riscos","mnemonico":"Mnemônico ameaças: \"PTMA\" → Prevenir, Transferir, Mitigar, Aceitar (+ Escalar).","pontos":["Prevenir: elimina a causa, probabilidade vai a ZERO.","Transferir: passa o impacto a terceiro — seguro, garantia, terceirização.","Mitigar: REDUZ probabilidade ou impacto (não elimina).","Aceitar: não age; ativa (com reserva) ou passiva.","Oportunidades: explorar, compartilhar, melhorar, aceitar, escalar.","VME = probabilidade × impacto financeiro."]},{"titulo":"Equipe e comunicação","mnemonico":"Mnemônico Tuckman: \"Formar, Tormentar, Normatizar, Desempenhar, Encerrar\".","pontos":["Canais de comunicação = n(n−1)/2. Com 10 pessoas, 45 canais.","RACI: só pode haver UM 'A' (Accountable) por atividade.","Herzberg: higiênicos (salário, condições) evitam insatisfação mas NÃO motivam.","Herzberg: motivacionais (reconhecimento, realização, crescimento) é que motivam.","Conflito: confronto/solução de problemas é a MELHOR técnica; retirada é a pior."]},{"titulo":"Scrum em uma cola","mnemonico":"Mnemônico: 3 papéis, 3 artefatos, 5 eventos.","pontos":["Papéis: Product Owner (prioriza), Scrum Master (facilita e remove impedimentos), Time.","Scrum Master NÃO é chefe do time nem gerente do projeto.","Artefatos: Product Backlog, Sprint Backlog, Incremento.","Eventos: Sprint (1-4 semanas), Planning, Daily (15 min), Review, Retrospective.","Review mostra o incremento ao cliente; Retrospective melhora o PROCESSO da equipe."]}]},{"id":"ui-e-ux","nome":"UI e UX","sigla":"UU","cor":"#0ea5e9","corTexto":"#0ea5e9","corFundo":"#0a7bae","periodo":1,"pasta":"UI e UX","arquivos":[{"nome":"A importância dos protótipos no desenvolvimento de sistemas _ ThiagoNasc.com","ext":"pdf","tam":"1.0 MB","href":"../UI%20e%20UX/A%20import%C3%A2ncia%20dos%20prot%C3%B3tipos%20no%20desenvolvimento%20de%20sistemas%20_%20ThiagoNasc.com.pdf"},{"nome":"ANÁLISE E PROPOSTA DE MELHORIAS na empresa","ext":"pdf","tam":"466 KB","href":"../UI%20e%20UX/AN%C3%81LISE%20E%20PROPOSTA%20DE%20MELHORIAS%20na%20empresa.pdf"},{"nome":"Artigo_ControleRegrasEfeitos","ext":"pdf","tam":"400 KB","href":"../UI%20e%20UX/Artigo_ControleRegrasEfeitos.pdf"},{"nome":"Avaliação e testes de usabilidade","ext":"pdf","tam":"11.7 MB","href":"../UI%20e%20UX/Avalia%C3%A7%C3%A3o%20e%20testes%20de%20usabilidade.pdf"},{"nome":"Avaliação em IHC","ext":"pdf","tam":"11.7 MB","href":"../UI%20e%20UX/Avalia%C3%A7%C3%A3o%20em%20IHC.pdf"},{"nome":"Cognição e frameworks","ext":"pdf","tam":"12.5 MB","href":"../UI%20e%20UX/Cogni%C3%A7%C3%A3o%20e%20frameworks.pdf"},{"nome":"Como a tecnologia muda o comportamento do consumidor - Época Negócios _ Marketing","ext":"pdf","tam":"656 KB","href":"../UI%20e%20UX/Como%20a%20tecnologia%20muda%20o%20comportamento%20do%20consumidor%20-%20%C3%89poca%20Neg%C3%B3cios%20_%20Marketing.pdf"},{"nome":"Definindo o comportamento do consumidor","ext":"pdf","tam":"12.4 MB","href":"../UI%20e%20UX/Definindo%20o%20comportamento%20do%20consumidor.pdf"},{"nome":"Fórum Temático - UX Design[1]","ext":"pdf","tam":"777 KB","href":"../UI%20e%20UX/F%C3%B3rum%20Tem%C3%A1tico%20-%20UX%20Design%5B1%5D.pdf"},{"nome":"Home _ Web Accessibility Initiative (WAI) _ W3C","ext":"pdf","tam":"561 KB","href":"../UI%20e%20UX/Home%20_%20Web%20Accessibility%20Initiative%20%28WAI%29%20_%20W3C.pdf"},{"nome":"IHC em Automóveis","ext":"pdf","tam":"305 KB","href":"../UI%20e%20UX/IHC%20em%20Autom%C3%B3veis.pdf"},{"nome":"Interação social e emocional","ext":"pdf","tam":"1.5 MB","href":"../UI%20e%20UX/Intera%C3%A7%C3%A3o%20social%20e%20emocional.pdf"},{"nome":"Interfaces, tipos e funções","ext":"pdf","tam":"6.8 MB","href":"../UI%20e%20UX/Interfaces%2C%20tipos%20e%20fun%C3%A7%C3%B5es.pdf"},{"nome":"O PERFIL DO CONSUMIDOR NO VAREJO SUPERMERCADISTA","ext":"pdf","tam":"156 KB","href":"../UI%20e%20UX/O%20PERFIL%20DO%20CONSUMIDOR%20NO%20VAREJO%20SUPERMERCADISTA.pdf"},{"nome":"O significado do comportamento","ext":"pdf","tam":"11.2 MB","href":"../UI%20e%20UX/O%20significado%20do%20comportamento.pdf"},{"nome":"Origami Studio — Origami Studio 3","ext":"pdf","tam":"11.9 MB","href":"../UI%20e%20UX/Origami%20Studio%20%E2%80%94%20Origami%20Studio%203.pdf"},{"nome":"PMKB _ Tipos de interfaces conhecidas e gerenciadas em projetos - PMKB Project Management _ Gestão de Projetos","ext":"pdf","tam":"1.1 MB","href":"../UI%20e%20UX/PMKB%20_%20Tipos%20de%20interfaces%20conhecidas%20e%20gerenciadas%20em%20projetos%20-%20PMKB%20Project%20Management%20_%20Gest%C3%A3o%20de%20Projetos.pdf"},{"nome":"Pesquisadores criam interface que faz cérebro 'sentir' a presença de próteses - Olhar Digital","ext":"pdf","tam":"11.2 MB","href":"../UI%20e%20UX/Pesquisadores%20criam%20interface%20que%20faz%20c%C3%A9rebro%20%27sentir%27%20a%20presen%C3%A7a%20de%20pr%C3%B3teses%20-%20Olhar%20Digital.pdf"},{"nome":"Processos de design de IHC I","ext":"pdf","tam":"11.5 MB","href":"../UI%20e%20UX/Processos%20de%20design%20de%20IHC%20I.pdf"},{"nome":"Processos de design de IHC II","ext":"pdf","tam":"11.4 MB","href":"../UI%20e%20UX/Processos%20de%20design%20de%20IHC%20II.pdf"},{"nome":"Projeto de interface com o usuario","ext":"pdf","tam":"1.9 MB","href":"../UI%20e%20UX/Projeto%20de%20interface%20com%20o%20usuario.pdf"},{"nome":"Prototipação de soluções","ext":"pdf","tam":"1.3 MB","href":"../UI%20e%20UX/Prototipa%C3%A7%C3%A3o%20de%20solu%C3%A7%C3%B5es.pdf"},{"nome":"Psicologia das cores","ext":"pdf","tam":"13.0 MB","href":"../UI%20e%20UX/Psicologia%20das%20cores.pdf"},{"nome":"Quais são as melhores ferramentas de prototipagem de interface_ UI UX _ by Felipe Melo Guimarães _ Aela _ Medium","ext":"pdf","tam":"6.9 MB","href":"../UI%20e%20UX/Quais%20s%C3%A3o%20as%20melhores%20ferramentas%20de%20prototipagem%20de%20interface_%20UI%20UX%20_%20by%20Felipe%20Melo%20Guimar%C3%A3es%20_%20Aela%20_%20Medium.pdf"},{"nome":"Quanto Ganha um Desenvolvedor Web_ Médias Salariais em 2025","ext":"pdf","tam":"1.1 MB","href":"../UI%20e%20UX/Quanto%20Ganha%20um%20Desenvolvedor%20Web_%20M%C3%A9dias%20Salariais%20em%202025.pdf"},{"nome":"Samsung desenvolve alternativa à barra de navegação do Android - Olhar Digital","ext":"pdf","tam":"10.7 MB","href":"../UI%20e%20UX/Samsung%20desenvolve%20alternativa%20%C3%A0%20barra%20de%20navega%C3%A7%C3%A3o%20do%20Android%20-%20Olhar%20Digital.pdf"},{"nome":"SciELO Brasil - Planejamento da assistência de enfermagem_ proposta de um software-protótipo Planejamento da assistência de enfermagem_ proposta de um software-protótipo","ext":"pdf","tam":"2.2 MB","href":"../UI%20e%20UX/SciELO%20Brasil%20-%20Planejamento%20da%20assist%C3%AAncia%20de%20enfermagem_%20proposta%20de%20um%20software-prot%C3%B3tipo%20Planejamento%20da%20assist%C3%AAncia%20de%20enfermagem_%20proposta%20de%20um%20software-prot%C3%B3tipo.pdf"},{"nome":"Seleção do Comportamento","ext":"pdf","tam":"435 KB","href":"../UI%20e%20UX/Sele%C3%A7%C3%A3o%20do%20Comportamento.pdf"},{"nome":"UI Design - O que é User Interface Design (UI DESIGN)_","ext":"pdf","tam":"621 KB","href":"../UI%20e%20UX/UI%20Design%20-%20O%20que%20%C3%A9%20User%20Interface%20Design%20%28UI%20DESIGN%29_.pdf"},{"nome":"UMA PROPOSTA DIFERENCIADA DE UM JOGO DIGITAL PARA EDUCAÇÃO AMBIENTAL DE CRIANÇAS","ext":"pdf","tam":"1.1 MB","href":"../UI%20e%20UX/UMA%20PROPOSTA%20DIFERENCIADA%20DE%20UM%20JOGO%20DIGITAL%20PARA%20EDUCA%C3%87%C3%83O%20AMBIENTAL%20DE%20CRIAN%C3%87AS.pdf"},{"nome":"Webflow_ Create a custom website _ Visual website builder","ext":"pdf","tam":"4.1 MB","href":"../UI%20e%20UX/Webflow_%20Create%20a%20custom%20website%20_%20Visual%20website%20builder.pdf"},{"nome":"afetividademundos3d","ext":"pdf","tam":"627 KB","href":"../UI%20e%20UX/afetividademundos3d.pdf"},{"nome":"frameworkinterfaceeducativa","ext":"pdf","tam":"3.1 MB","href":"../UI%20e%20UX/frameworkinterfaceeducativa.pdf"},{"nome":"graficoatividade","ext":"pdf","tam":"1.1 MB","href":"../UI%20e%20UX/graficoatividade.pdf"}],"links":[],"resumos":[{"tema":"IHC, Interface, Usabilidade e Experiência","html":"<p><b>IHC (Interação Humano-Computador)<\/b> é a área que estuda o projeto, a avaliação e a implementação de sistemas computacionais interativos para uso humano. É <b>multidisciplinar<\/b>: computação, design, psicologia cognitiva, ergonomia, antropologia e linguística.<\/p><p><b>Três conceitos que costumam ser confundidos:<\/b><\/p><ul><li><b>Interface<\/b> — a parte do sistema com a qual o usuário tem contato: telas, botões, comandos. É o meio.<\/li><li><b>Usabilidade<\/b> — a <b>qualidade de uso<\/b> dessa interface: quão fácil é aprender, usar e obter o resultado desejado. É objetiva e mensurável.<\/li><li><b>Experiência do usuário (UX)<\/b> — tudo o que a pessoa sente e percebe antes, durante e depois do uso: emoção, confiança, satisfação, valor percebido. É mais ampla e inclui a usabilidade.<\/li><\/ul><p><b>UI x UX:<\/b> <b>UI<\/b> (User Interface) é o desenho da interface — layout, cor, tipografia, componentes, estados. <b>UX<\/b> é a experiência inteira — pesquisa, arquitetura de informação, fluxos, conteúdo, testes. Uma interface bonita com fluxo confuso é boa UI e má UX.<\/p><p><b>Os 5 atributos de usabilidade de Nielsen:<\/b> <b>facilidade de aprendizado<\/b>, <b>eficiência<\/b> de uso, <b>facilidade de memorização<\/b> (voltar depois e lembrar), <b>baixa taxa de erros<\/b> (e boa recuperação) e <b>satisfação<\/b> subjetiva.<\/p><p><b>Tipos de interface:<\/b> linha de comando (CLI), gráfica (GUI — janelas, ícones, menus, apontador), por toque, por voz, gestual, realidade virtual e aumentada, e interfaces cérebro-computador.<\/p><p><b>Acessibilidade<\/b> é garantir que pessoas com diferentes capacidades consigam usar o sistema. O <b>W3C/WAI<\/b> mantém as diretrizes <b>WCAG<\/b>, apoiadas em quatro princípios — <b>POUR<\/b>: <b>P<\/b>erceptível, <b>O<\/b>perável, <b>C<\/b>ompreensível e <b>R<\/b>obusto. Na prática: texto alternativo em imagens, contraste suficiente, navegação por teclado, legendas em vídeo, sem depender só de cor para transmitir informação. Acessibilidade beneficia todo mundo — o efeito meio-fio.<\/p>"},{"tema":"Heurísticas e Avaliação em IHC","html":"<p><b>As 10 heurísticas de Nielsen<\/b> — o instrumento mais cobrado da disciplina:<\/p><ol><li><b>Visibilidade do status do sistema<\/b> — o sistema informa o que está acontecendo, em tempo razoável<\/li><li><b>Correspondência entre o sistema e o mundo real<\/b> — usa a linguagem e os conceitos do usuário, não os do sistema<\/li><li><b>Controle e liberdade do usuário<\/b> — saída de emergência clara: desfazer e refazer<\/li><li><b>Consistência e padrões<\/b> — a mesma coisa se chama e se comporta do mesmo jeito em todo lugar<\/li><li><b>Prevenção de erros<\/b> — melhor evitar o erro do que avisar depois<\/li><li><b>Reconhecer em vez de lembrar<\/b> — deixar as opções visíveis, sem exigir memorização<\/li><li><b>Flexibilidade e eficiência de uso<\/b> — atalhos para o experiente, sem atrapalhar o novato<\/li><li><b>Design estético e minimalista<\/b> — sem informação irrelevante competindo com a relevante<\/li><li><b>Ajudar a reconhecer, diagnosticar e recuperar-se de erros<\/b> — mensagem em linguagem clara, indicando a solução<\/li><li><b>Ajuda e documentação<\/b> — disponível, buscável e focada na tarefa<\/li><\/ol><p><b>Métodos de avaliação — a distinção central:<\/b><\/p><ul><li><b>Avaliação por inspeção<\/b> — feita por <b>especialistas, sem usuários<\/b>. Mais rápida e barata. Ex.: avaliação heurística, percurso cognitivo (o avaliador simula o raciocínio do usuário passo a passo), inspeção semiótica.<\/li><li><b>Avaliação por observação<\/b> — feita <b>com usuários reais<\/b>. Mais cara, revela problemas que o especialista não prevê. Ex.: teste de usabilidade, observação de campo, <b>think aloud<\/b> (o usuário verbaliza o que pensa enquanto usa).<\/li><li><b>Avaliação por questionamento<\/b> — entrevistas, questionários, grupos focais. Capta opinião e percepção, não comportamento.<\/li><\/ul><p><b>Regra prática de Nielsen:<\/b> <b>5 usuários<\/b> em um teste de usabilidade já revelam cerca de <b>85%<\/b> dos problemas — vale mais fazer vários testes pequenos e iterativos do que um único teste grande.<\/p><p><b>Métricas:<\/b> taxa de sucesso na tarefa, tempo de execução, número de erros, satisfação (escala SUS).<\/p>"},{"tema":"Processo de Design de IHC e Design Thinking","html":"<p><b>Design centrado no usuário (DCU):<\/b> o usuário participa do processo do início ao fim, e o ciclo é <b>iterativo<\/b>. As quatro etapas da ISO 9241-210: <b>compreender o contexto de uso<\/b> → <b>especificar requisitos<\/b> → <b>produzir soluções de design<\/b> → <b>avaliar<\/b> — e voltar ao início quantas vezes for preciso.<\/p><p><b>Etapas do processo de design de um site ou produto:<\/b> pesquisa e briefing (com <b>personas<\/b>) → arquitetura de informação (sitemap, fluxos) → <b>wireframe<\/b> (esboço de baixa fidelidade) → identidade visual (cores, tipografia) → <b>mockup/protótipo<\/b> → implementação → avaliação.<\/p><p><b>Ferramentas de pesquisa:<\/b> <b>persona<\/b> (personagem fictício representando um grupo real de usuários, construído a partir de pesquisa — não de suposição), <b>mapa de empatia<\/b> (o que a pessoa pensa e sente, vê, ouve, fala e faz, mais dores e ganhos), <b>jornada do usuário<\/b> (etapas, pontos de contato, emoções e pontos de atrito).<\/p><p><b>Design Thinking<\/b> — abordagem de solução criativa de problemas <b>centrada no ser humano<\/b>, iterativa e baseada em empatia e cocriação. Não é linear nem rígida, não se restringe ao design gráfico e não dispensa testes. Fundamenta-se na compreensão profunda das necessidades humanas e na formulação de questionamentos.<\/p><p><b>As 5 fases (modelo d.school):<\/b> <b>Empatizar<\/b> (entender profundamente o usuário) → <b>Definir<\/b> (sintetizar em um problema claro) → <b>Idear<\/b> (gerar o máximo de ideias, sem julgar) → <b>Prototipar<\/b> (materializar rápido e barato) → <b>Testar<\/b> (validar com usuários reais). No Brasil também se usa o modelo em três etapas: imersão, ideação e prototipação.<\/p><p><b>Divergir e convergir<\/b> (duplo diamante): primeiro abre-se o leque de possibilidades, depois se afunila para uma escolha — duas vezes, uma no problema e outra na solução.<\/p><p><b>Técnicas de ideação:<\/b> brainstorming (verbal, em grupo, sem julgamento) e <b>brainwriting<\/b> (cada um escreve suas ideias antes de compartilhar, o que reduz a influência dos mais falantes e a timidez).<\/p>"},{"tema":"Prototipação","html":"<p><b>Protótipo<\/b> é uma representação preliminar do produto usada para explorar ideias, comunicar conceitos e validar decisões <b>antes<\/b> de investir na construção — o que é incomparavelmente mais barato do que descobrir o erro depois de pronto.<\/p><p><b>Fidelidade:<\/b><\/p><ul><li><b>Baixa<\/b> — papel, post-its, rascunhos. Sem semelhança visual com o produto; serve para validar <b>fluxos e estrutura<\/b>. Barato, rápido e, justamente por ser tosco, convida à crítica sincera.<\/li><li><b>Média<\/b> — computadorizado, com visual parcial; wireframes clicáveis.<\/li><li><b>Alta<\/b> — usa os mesmos materiais do produto final, com banco de homologação; visualmente idêntico ao produto real.<\/li><\/ul><p><b>Abrangência:<\/b><\/p><ul><li><b>Horizontal<\/b> — grande <b>variedade de funções<\/b> com poucos detalhes em cada. Dá a visão ampla do sistema.<\/li><li><b>Vertical<\/b> — <b>poucas funções<\/b>, cada uma detalhada ao máximo. Aprofunda um módulo crítico.<\/li><\/ul><p><b>Destino:<\/b><\/p><ul><li><b>Descartável (throwaway)<\/b> — criado para explorar ideias e descartado depois do aprendizado; não vira o sistema final.<\/li><li><b>Evolutivo<\/b> — refinado iterativamente até se tornar o produto de produção.<\/li><\/ul><p><b>Design conceitual x físico:<\/b> o <b>conceitual<\/b> define <b>o que<\/b> o sistema faz do ponto de vista do usuário, sem falar de tecnologia. O <b>físico<\/b> define <b>como<\/b> será implementado — tecnologias, estrutura de telas, acessibilidade.<\/p><p><b>Wireframe x mockup x protótipo:<\/b> o wireframe é o esqueleto (estrutura e hierarquia, sem visual); o mockup é o visual estático completo; o protótipo é navegável e simula a interação.<\/p><p><b>Ferramentas:<\/b> Figma, Adobe XD, Sketch, InVision, Marvel, Balsamiq, Axure, Origami Studio (Meta) e Webflow.<\/p>"},{"tema":"Psicologia, Cognição e Percepção Visual","html":"<p><b>Modelo mental<\/b> é a representação que o usuário tem na cabeça de como o sistema funciona. Quanto mais o <b>modelo de projeto<\/b> (como o sistema realmente funciona) se aproximar do modelo mental do usuário, mais intuitivo o produto parece.<\/p><p><b>Affordance<\/b> — a propriedade do objeto que sugere como ele deve ser usado (um botão elevado pede clique; uma alça pede que se puxe). <b>Signifier<\/b> é o sinal que comunica essa affordance. <b>Feedback<\/b> é a resposta que confirma que a ação foi registrada. Conceitos de <b>Donald Norman<\/b>, autor de <i>O Design do Dia a Dia<\/i>.<\/p><p><b>Carga cognitiva:<\/b> o esforço mental exigido pela interface. A memória de trabalho humana é limitada (a regra clássica de Miller fala em 7 ± 2 itens), então interfaces devem <b>reconhecer em vez de exigir lembrar<\/b>.<\/p><p><b>Lei de Fitts:<\/b> o tempo para atingir um alvo depende da <b>distância<\/b> e do <b>tamanho<\/b> dele — alvos importantes devem ser grandes e próximos. <b>Lei de Hick:<\/b> o tempo de decisão cresce com o número de opções — menus enormes travam o usuário.<\/p><p><b>Princípios da Gestalt<\/b> (como o cérebro agrupa o que vê): <b>proximidade<\/b> (o que está perto parece do mesmo grupo), <b>similaridade<\/b> (o que se parece parece relacionado), <b>continuidade<\/b>, <b>fechamento<\/b> (o cérebro completa figuras incompletas), <b>figura e fundo<\/b> e <b>destino comum<\/b>. Segundo Dondis, na linguagem visual a percepção ocorre <b>primeiro globalmente e depois nas partes<\/b>.<\/p><p><b>Psicologia das cores<\/b> — associações culturais mais comuns no Ocidente: vermelho (urgência, erro, paixão), azul (confiança, calma, tecnologia — a cor mais usada por bancos e redes sociais), verde (sucesso, natureza, permissão), amarelo (atenção, otimismo), preto (sofisticação, luxo), branco (limpeza, espaço). Cuidado: essas associações <b>variam entre culturas<\/b>, e cor nunca deve ser o único canal de informação — cerca de 8% dos homens têm alguma deficiência na percepção de cores.<\/p><p><b>Comportamento do consumidor:<\/b> o processo de decisão passa por reconhecimento da necessidade → busca de informação → avaliação de alternativas → decisão de compra → comportamento pós-compra. A tecnologia mudou esse comportamento ao dar ao consumidor acesso imediato a informação, comparação e avaliações de outros compradores, deslocando o poder do vendedor para o comprador.<\/p>"}],"flashcards":[{"tema":"IHC, Interface, Usabilidade e Experiência","p":"O que é IHC?","r":"Interação Humano-Computador: a área que estuda o projeto, a avaliação e a implementação de sistemas computacionais interativos para uso humano. É multidisciplinar — computação, design, psicologia, ergonomia, antropologia e linguística."},{"tema":"IHC, Interface, Usabilidade e Experiência","p":"Qual a diferença entre interface, usabilidade e experiência do usuário?","r":"Interface é o meio de contato (telas, botões). Usabilidade é a qualidade de uso dessa interface — objetiva e mensurável. UX é tudo o que a pessoa sente antes, durante e depois do uso, e inclui a usabilidade."},{"tema":"IHC, Interface, Usabilidade e Experiência","p":"Qual a diferença entre UI e UX?","r":"UI é o desenho da interface — layout, cor, tipografia, componentes. UX é a experiência inteira — pesquisa, arquitetura de informação, fluxos, conteúdo e testes. Uma tela bonita com fluxo confuso é boa UI e má UX."},{"tema":"IHC, Interface, Usabilidade e Experiência","p":"Quais são os 5 atributos de usabilidade de Nielsen?","r":"Facilidade de aprendizado, eficiência de uso, facilidade de memorização, baixa taxa de erros (com boa recuperação) e satisfação subjetiva."},{"tema":"IHC, Interface, Usabilidade e Experiência","p":"Quais são os 4 princípios da WCAG (POUR)?","r":"Perceptível, Operável, Compreensível e Robusto. São as diretrizes de acessibilidade mantidas pelo W3C/WAI."},{"tema":"IHC, Interface, Usabilidade e Experiência","p":"Por que a cor não deve ser o único canal de informação?","r":"Porque cerca de 8% dos homens têm alguma deficiência na percepção de cores. Além disso, as associações de cor variam entre culturas. Sempre combine cor com texto, ícone ou forma."},{"tema":"Heurísticas e Avaliação em IHC","p":"O que diz a heurística 'visibilidade do status do sistema'?","r":"O sistema deve sempre manter o usuário informado sobre o que está acontecendo, com feedback apropriado em tempo razoável — barra de progresso, confirmação de salvamento, indicador de carregamento."},{"tema":"Heurísticas e Avaliação em IHC","p":"O que significa 'correspondência entre o sistema e o mundo real'?","r":"O sistema deve falar a linguagem do usuário — palavras, frases e conceitos familiares a ele — em vez de termos internos do sistema, seguindo convenções do mundo real."},{"tema":"Heurísticas e Avaliação em IHC","p":"O que a heurística 'controle e liberdade do usuário' exige?","r":"Uma saída de emergência claramente marcada para quando o usuário escolhe uma função por engano — desfazer e refazer, cancelar, voltar."},{"tema":"Heurísticas e Avaliação em IHC","p":"Qual a diferença entre as heurísticas 5 e 9 de Nielsen?","r":"A 5 é prevenção de erros: projetar para que o erro não aconteça (desabilitar opções inválidas, confirmar ações destrutivas). A 9 é ajudar a reconhecer, diagnosticar e recuperar-se do erro quando ele ocorre. Prevenir é melhor que remediar."},{"tema":"Heurísticas e Avaliação em IHC","p":"O que significa 'reconhecer em vez de lembrar'?","r":"Minimizar a carga de memória do usuário deixando objetos, ações e opções visíveis, em vez de exigir que ele memorize informação de uma tela para outra."},{"tema":"Heurísticas e Avaliação em IHC","p":"Qual a diferença entre avaliação por inspeção e por observação?","r":"A inspeção é feita por especialistas, SEM usuários — mais rápida e barata (avaliação heurística, percurso cognitivo). A observação é feita COM usuários reais — mais cara, mas revela problemas que o especialista não prevê."},{"tema":"Heurísticas e Avaliação em IHC","p":"O que é o percurso cognitivo?","r":"Um método de inspeção em que o avaliador simula passo a passo o raciocínio de um usuário novato executando uma tarefa, perguntando a cada passo se ele saberia o que fazer e se perceberia que progrediu."},{"tema":"Heurísticas e Avaliação em IHC","p":"O que é o método think aloud?","r":"Pensar em voz alta: o usuário verbaliza o que está pensando enquanto executa as tarefas, revelando dúvidas, expectativas e modelos mentais que a observação silenciosa não capta."},{"tema":"Heurísticas e Avaliação em IHC","p":"Quantos usuários Nielsen recomenda em um teste de usabilidade e por quê?","r":"Cinco — eles já revelam cerca de 85% dos problemas. É mais produtivo fazer vários testes pequenos e iterativos do que um único teste grande."},{"tema":"Processo de Design de IHC e Design Thinking","p":"Quais são as quatro etapas do design centrado no usuário (ISO 9241-210)?","r":"Compreender o contexto de uso → especificar os requisitos → produzir soluções de design → avaliar. E voltar ao início — o ciclo é iterativo."},{"tema":"Processo de Design de IHC e Design Thinking","p":"O que é uma persona?","r":"Um personagem fictício que representa um grupo real de usuários, construído a partir de pesquisa — nunca de suposição. Dá rosto e contexto aos dados, ajudando o time a decidir para quem está projetando."},{"tema":"Processo de Design de IHC e Design Thinking","p":"O que é um mapa de empatia?","r":"Uma ferramenta que organiza o que a pessoa pensa e sente, o que vê, o que ouve, o que fala e faz, além de suas dores e ganhos — para aprofundar a compreensão do usuário além dos dados demográficos."},{"tema":"Processo de Design de IHC e Design Thinking","p":"O que caracteriza o Design Thinking?","r":"É uma abordagem de solução criativa de problemas centrada no ser humano, iterativa, baseada em empatia e cocriação. Não é um processo linear e rígido, não se restringe ao design gráfico e não dispensa testes."},{"tema":"Processo de Design de IHC e Design Thinking","p":"Quais são as 5 fases do Design Thinking (modelo d.school)?","r":"Empatizar, Definir, Idear, Prototipar e Testar. No Brasil também se usa o modelo de três etapas: imersão, ideação e prototipação."},{"tema":"Processo de Design de IHC e Design Thinking","p":"O que é o duplo diamante?","r":"O modelo de divergir e convergir duas vezes: primeiro abre-se a exploração do problema e afunila-se para defini-lo, depois abre-se a geração de soluções e afunila-se para escolher uma."},{"tema":"Processo de Design de IHC e Design Thinking","p":"Qual a diferença entre brainstorming e brainwriting?","r":"No brainstorming as ideias são ditas em voz alta, em grupo. No brainwriting cada participante escreve suas ideias individualmente antes de compartilhar — o que reduz a influência dos mais falantes e a inibição dos mais tímidos."},{"tema":"Prototipação","p":"Para que serve um protótipo?","r":"Para explorar ideias, comunicar conceitos e validar decisões antes de investir na construção — corrigir no protótipo é incomparavelmente mais barato do que corrigir no produto pronto."},{"tema":"Prototipação","p":"Qual a diferença entre protótipo horizontal e vertical?","r":"Horizontal: grande variedade de funções com poucos detalhes em cada — dá a visão ampla do sistema. Vertical: poucas funções, cada uma detalhada ao máximo — aprofunda um módulo crítico."},{"tema":"Prototipação","p":"Qual a diferença entre protótipo descartável e evolutivo?","r":"O descartável é criado para explorar ideias e é jogado fora após o aprendizado — não vira o sistema final. O evolutivo é refinado iterativamente até se tornar o produto de produção."},{"tema":"Prototipação","p":"O que caracteriza um protótipo de alta fidelidade?","r":"Usa os mesmos materiais do produto final, com banco de dados de homologação, ficando visualmente e funcionalmente idêntico ao produto real. O de baixa fidelidade é papel e post-it, e valida fluxos."},{"tema":"Prototipação","p":"Qual a vantagem do protótipo de baixa fidelidade?","r":"É rápido e barato, e justamente por parecer inacabado convida à crítica sincera — as pessoas hesitam menos em sugerir mudanças em um rascunho do que em uma tela que parece pronta."},{"tema":"Prototipação","p":"Qual a diferença entre design conceitual e design físico?","r":"O conceitual define O QUE o sistema faz do ponto de vista do usuário, sem falar de tecnologia. O físico define COMO será implementado — tecnologias, estrutura de telas, acessibilidade."},{"tema":"Prototipação","p":"Qual a diferença entre wireframe, mockup e protótipo?","r":"Wireframe é o esqueleto: estrutura e hierarquia, sem visual final. Mockup é o visual estático completo. Protótipo é navegável e simula a interação real."},{"tema":"Psicologia, Cognição e Percepção Visual","p":"O que é modelo mental?","r":"A representação que o usuário tem na cabeça de como o sistema funciona. Quanto mais o funcionamento real se aproxima desse modelo, mais intuitivo o produto parece."},{"tema":"Psicologia, Cognição e Percepção Visual","p":"O que é affordance?","r":"A propriedade de um objeto que sugere como ele deve ser usado — um botão elevado pede clique, uma alça pede que se puxe. Conceito de Donald Norman; o sinal que comunica essa affordance é o signifier."},{"tema":"Psicologia, Cognição e Percepção Visual","p":"O que diz a Lei de Fitts?","r":"O tempo para atingir um alvo depende da distância até ele e do seu tamanho. Consequência de projeto: alvos importantes devem ser grandes e próximos do ponto de partida do cursor ou do polegar."},{"tema":"Psicologia, Cognição e Percepção Visual","p":"O que diz a Lei de Hick?","r":"O tempo de decisão aumenta com o número e a complexidade das opções. Menus enormes travam o usuário — daí a importância de agrupar, priorizar e revelar progressivamente."},{"tema":"Psicologia, Cognição e Percepção Visual","p":"Cite os principais princípios da Gestalt aplicados a interfaces.","r":"Proximidade (o que está perto parece do mesmo grupo), similaridade (o que se parece parece relacionado), continuidade, fechamento (o cérebro completa figuras incompletas), figura e fundo, e destino comum."},{"tema":"Psicologia, Cognição e Percepção Visual","p":"Segundo Dondis, como ocorre a percepção da linguagem visual?","r":"Primeiro globalmente e depois nas partes — o olhar capta o todo antes de decompor nos detalhes. Por isso a hierarquia visual de uma tela importa mais que o refinamento de cada elemento isolado."},{"tema":"Psicologia, Cognição e Percepção Visual","p":"Quais são as etapas do processo de decisão do consumidor?","r":"Reconhecimento da necessidade → busca de informação → avaliação de alternativas → decisão de compra → comportamento pós-compra."},{"tema":"Psicologia, Cognição e Percepção Visual","p":"Como a tecnologia mudou o comportamento do consumidor?","r":"Deu acesso imediato a informação, comparação de preços e avaliações de outros compradores, deslocando o poder da negociação do vendedor para o comprador."}],"questoes":[{"tema":"IHC, Interface, Usabilidade e Experiência","q":"O que caracteriza a área de Interação Humano-Computador?","op":["É um ramo exclusivo da engenharia de software voltado a testes","É multidisciplinar, reunindo computação, design, psicologia, ergonomia e linguística","Trata apenas da programação de interfaces gráficas","Estuda somente hardware de entrada e saída"],"r":1,"exp":"A IHC estuda o projeto, a avaliação e a implementação de sistemas interativos, e para isso reúne várias disciplinas — computação não dá conta sozinha do comportamento humano."},{"tema":"IHC, Interface, Usabilidade e Experiência","q":"Qual a relação correta entre usabilidade e experiência do usuário?","op":["A UX é mais ampla e engloba a usabilidade","São sinônimos","A usabilidade é mais ampla e engloba a UX","Não têm relação entre si"],"r":0,"exp":"A usabilidade trata da qualidade de uso da interface. A UX é mais ampla: inclui a usabilidade, mas também emoção, confiança, valor percebido e tudo o que ocorre antes e depois do uso."},{"tema":"IHC, Interface, Usabilidade e Experiência","q":"Um aplicativo tem visual impecável, mas os usuários não conseguem concluir a compra. O diagnóstico correto é:","op":["Boa UI e má UX","Má UI e boa UX","Boa UI e boa UX","O problema é apenas de acessibilidade"],"r":0,"exp":"O desenho da interface (UI) está bom, mas a experiência — o fluxo que leva a pessoa ao objetivo — falhou. É o caso clássico de separação entre UI e UX."},{"tema":"IHC, Interface, Usabilidade e Experiência","q":"Qual destes NÃO é um dos cinco atributos de usabilidade de Nielsen?","op":["Rentabilidade do produto","Facilidade de aprendizado","Eficiência de uso","Satisfação subjetiva"],"r":0,"exp":"Os cinco são: aprendizado, eficiência, memorização, baixa taxa de erros e satisfação. Rentabilidade é métrica de negócio, não atributo de usabilidade."},{"tema":"IHC, Interface, Usabilidade e Experiência","q":"Os quatro princípios da WCAG, conhecidos pela sigla POUR, são:","op":["Portável, Objetivo, Único e Rápido","Prático, Otimizado, Usável e Responsivo","Público, Online, Universal e Restrito","Perceptível, Operável, Compreensível e Robusto"],"r":3,"exp":"POUR: Perceptible, Operable, Understandable, Robust — as diretrizes de acessibilidade do W3C/WAI."},{"tema":"IHC, Interface, Usabilidade e Experiência","q":"Por que a informação não deve ser transmitida apenas por cor?","op":["Porque cores encarecem a produção da interface","Porque monitores não reproduzem cores com fidelidade","Porque a WCAG proíbe o uso de cores","Porque parte significativa da população tem deficiência na percepção de cores e as associações variam entre culturas"],"r":3,"exp":"Cerca de 8% dos homens têm alguma deficiência na percepção de cores. A cor deve sempre vir acompanhada de texto, ícone ou forma."},{"tema":"Heurísticas e Avaliação em IHC","q":"Uma barra de progresso durante o envio de um arquivo atende a qual heurística de Nielsen?","op":["Prevenção de erros","Consistência e padrões","Design estético e minimalista","Visibilidade do status do sistema"],"r":3,"exp":"A primeira heurística exige que o sistema mantenha o usuário informado sobre o que está acontecendo, com feedback em tempo razoável."},{"tema":"Heurísticas e Avaliação em IHC","q":"Um sistema exibe a mensagem 'Erro 0x8007005F'. Qual heurística é violada?","op":["Flexibilidade e eficiência de uso","Controle e liberdade do usuário","Correspondência entre o sistema e o mundo real","Ajuda e documentação"],"r":2,"exp":"A mensagem usa a linguagem interna do sistema, não a do usuário. Também viola a heurística 9, que pede mensagens em linguagem clara indicando a solução."},{"tema":"Heurísticas e Avaliação em IHC","q":"Oferecer as funções desfazer e refazer atende principalmente a qual heurística?","op":["Controle e liberdade do usuário","Consistência e padrões","Reconhecer em vez de lembrar","Ajuda e documentação"],"r":0,"exp":"Controle e liberdade do usuário pede uma 'saída de emergência' claramente marcada para quando a pessoa escolhe uma função por engano."},{"tema":"Heurísticas e Avaliação em IHC","q":"Desabilitar datas inválidas em um calendário, em vez de aceitar e depois acusar erro, corresponde a:","op":["Ajudar a reconhecer e recuperar-se de erros","Design estético e minimalista","Prevenção de erros","Flexibilidade de uso"],"r":2,"exp":"A heurística 5 diz que evitar que o erro aconteça é melhor do que exibir boas mensagens depois — que seria a heurística 9."},{"tema":"Heurísticas e Avaliação em IHC","q":"Qual é a característica que define a avaliação por inspeção?","op":["É realizada com usuários reais em laboratório","É realizada por especialistas, sem a participação de usuários","Depende de questionários aplicados em larga escala","Só pode ser feita depois do produto lançado"],"r":1,"exp":"Na inspeção o especialista examina a interface aplicando critérios (heurísticas, percurso cognitivo). É mais rápida e barata, mas não substitui o teste com usuários."},{"tema":"Heurísticas e Avaliação em IHC","q":"No método think aloud, o que se pede ao participante?","op":["Que responda a um questionário ao final da sessão","Que avalie a interface em uma escala de 1 a 10","Que verbalize o que está pensando enquanto executa as tarefas","Que descreva a interface de memória, sem vê-la"],"r":2,"exp":"Pensar em voz alta revela dúvidas, expectativas e modelos mentais durante o uso — informação que a observação silenciosa ou o questionário posterior não capturam."},{"tema":"Heurísticas e Avaliação em IHC","q":"Segundo Nielsen, quantos usuários bastam para revelar cerca de 85% dos problemas de usabilidade?","op":["3","5","12","30"],"r":1,"exp":"Cinco usuários. A recomendação é fazer vários testes pequenos e iterativos, em vez de um único teste grande — corrigindo entre uma rodada e outra."},{"tema":"Processo de Design de IHC e Design Thinking","q":"Qual é a característica essencial do design centrado no usuário?","op":["O usuário só é consultado na entrega final","O designer decide sozinho com base em boas práticas","O foco está na tecnologia disponível","O processo é iterativo e o usuário participa do início ao fim"],"r":3,"exp":"A ISO 9241-210 estabelece o ciclo: compreender o contexto → especificar requisitos → produzir soluções → avaliar — repetindo quantas vezes for necessário, com o usuário envolvido."},{"tema":"Processo de Design de IHC e Design Thinking","q":"O que é uma persona no processo de design?","op":["Um personagem fictício que representa um grupo real de usuários, construído a partir de pesquisa","Um usuário real escolhido para testar o sistema","O perfil de acesso de um usuário no sistema","Um avatar que o usuário escolhe no aplicativo"],"r":0,"exp":"A persona sintetiza dados de pesquisa em um personagem com nome, contexto, objetivos e frustrações. O erro comum é criá-la a partir de suposições em vez de pesquisa."},{"tema":"Processo de Design de IHC e Design Thinking","q":"Sobre o Design Thinking, assinale a alternativa correta:","op":["É uma ferramenta tradicional e linear de resolver problemas","A investigação da experiência do cliente ocorre apenas por dados estatísticos","Busca a formulação de questionamentos pela compreensão dos fenômenos, com empatia e cocriação","Não permite a cocriação de soluções"],"r":2,"exp":"O Design Thinking se fundamenta na compreensão profunda das necessidades humanas, na formulação de questionamentos e na cocriação — sendo iterativo, não linear."},{"tema":"Processo de Design de IHC e Design Thinking","q":"Quais são as cinco fases do Design Thinking no modelo da d.school?","op":["Planejar, executar, medir, corrigir e entregar","Empatizar, definir, idear, prototipar e testar","Pesquisar, desenhar, programar, testar e lançar","Imersão, análise, síntese, decisão e implantação"],"r":1,"exp":"Empatizar → Definir → Idear → Prototipar → Testar. No Brasil também se usa o modelo de três etapas: imersão, ideação e prototipação."},{"tema":"Processo de Design de IHC e Design Thinking","q":"Qual a principal vantagem do brainwriting sobre o brainstorming?","op":["Gera menos ideias, o que facilita a escolha","Dispensa a presença de um facilitador","Reduz a influência dos participantes mais falantes e a inibição dos mais tímidos","Só pode ser feito remotamente"],"r":2,"exp":"Ao escrever antes de compartilhar, cada participante formula sua ideia sem ser ancorado pela primeira sugestão dita em voz alta nem constrangido pela hierarquia do grupo."},{"tema":"Processo de Design de IHC e Design Thinking","q":"No processo de design de um site, qual entregável representa o esboço de BAIXA fidelidade da estrutura?","op":["Mockup","Wireframe","Sitemap","Protótipo navegável"],"r":1,"exp":"O wireframe mostra estrutura e hierarquia sem o visual final. Mockup é o visual estático completo; sitemap é o mapa de páginas."},{"tema":"Prototipação","q":"Qual a diferença entre protótipo horizontal e vertical?","op":["Horizontal é em papel; vertical é digital","Horizontal tem muitas funções com poucos detalhes; vertical tem poucas funções detalhadas ao máximo","Horizontal é descartável; vertical é evolutivo","Horizontal serve para web; vertical para mobile"],"r":1,"exp":"Horizontal dá amplitude — a visão geral do sistema. Vertical dá profundidade — o aprofundamento de um módulo crítico."},{"tema":"Prototipação","q":"Qual nível de prototipação utiliza os mesmos materiais do produto final e banco de homologação?","op":["Baixa fidelidade","Média fidelidade","Fidelidade conceitual","Alta fidelidade"],"r":3,"exp":"O protótipo de alta fidelidade é praticamente indistinguível do produto real. Baixa fidelidade é papel e post-it; média é computadorizado com visual parcial."},{"tema":"Prototipação","q":"Um protótipo criado para explorar ideias e que NÃO se torna o sistema final é chamado de:","op":["Descartável (throwaway)","Evolutivo","Vertical","De alta fidelidade"],"r":0,"exp":"O descartável existe para gerar aprendizado e é jogado fora. O evolutivo é refinado iterativamente até virar o produto de produção."},{"tema":"Prototipação","q":"Por que protótipos de baixa fidelidade costumam gerar críticas mais sinceras?","op":["Porque são apresentados de forma anônima","Porque só podem ser avaliados por especialistas","Porque não permitem interação","Porque, por parecerem inacabados, as pessoas hesitam menos em sugerir mudanças"],"r":3,"exp":"Diante de uma tela que parece pronta, as pessoas presumem que já houve investimento e suavizam a crítica. O rascunho convida à intervenção."},{"tema":"Prototipação","q":"Qual a diferença entre design conceitual e design físico?","op":["O conceitual define o que o sistema faz para o usuário; o físico define como será implementado","O conceitual é feito em papel; o físico, no computador","O conceitual vem depois da implementação","São nomes diferentes para a mesma etapa"],"r":0,"exp":"O design conceitual trata do ponto de vista do usuário sem falar de tecnologia. O físico define tecnologias, estrutura de telas e acessibilidade."},{"tema":"Psicologia, Cognição e Percepção Visual","q":"O que é affordance em design de interação?","op":["A velocidade de resposta da interface","A propriedade do objeto que sugere como ele deve ser usado","A quantidade de informação exibida na tela","O conjunto de cores da identidade visual"],"r":1,"exp":"Conceito de Donald Norman: um botão elevado pede clique, uma alça pede que se puxe. O sinal que comunica essa possibilidade é o signifier."},{"tema":"Psicologia, Cognição e Percepção Visual","q":"O que é o modelo mental do usuário?","op":["O diagrama técnico da arquitetura do sistema","O manual de instruções do produto","O fluxograma de telas desenhado pelo designer","A representação que o usuário tem na cabeça de como o sistema funciona"],"r":3,"exp":"Quanto mais o funcionamento real do sistema se aproximar do modelo mental do usuário, mais 'intuitivo' o produto parecerá — intuitivo é sinônimo de familiar."},{"tema":"Psicologia, Cognição e Percepção Visual","q":"Segundo a Lei de Fitts, o tempo para atingir um alvo depende de:","op":["Da cor e do contraste do alvo","Da quantidade de opções disponíveis na tela","Da distância até o alvo e do tamanho dele","Do nível de experiência do usuário apenas"],"r":2,"exp":"Por isso alvos importantes devem ser grandes e próximos — e por isso o botão principal de um app mobile fica na área alcançável pelo polegar."},{"tema":"Psicologia, Cognição e Percepção Visual","q":"A Lei de Hick afirma que:","op":["O tempo de decisão aumenta conforme o número de opções","O erro do usuário diminui com o tempo de uso","A memória de trabalho retém 7 ± 2 itens","O olhar percorre a tela em formato de F"],"r":0,"exp":"Mais opções significam decisão mais lenta — daí a importância de agrupar, priorizar e revelar informação progressivamente."},{"tema":"Psicologia, Cognição e Percepção Visual","q":"Elementos posicionados próximos uns dos outros são percebidos como um grupo. Esse é o princípio da Gestalt chamado:","op":["Similaridade","Fechamento","Proximidade","Figura e fundo"],"r":2,"exp":"Proximidade é o princípio mais poderoso na organização de interfaces: agrupar espacialmente comunica relação sem precisar de bordas ou títulos."},{"tema":"Psicologia, Cognição e Percepção Visual","q":"Segundo Dondis, o princípio básico da linguagem visual é que:","op":["A percepção sempre segue uma sequência linear","As palavras são necessárias para dar sentido à imagem","A percepção ocorre primeiro globalmente e depois nas partes","A linguagem visual não tem função comunicativa"],"r":2,"exp":"O olhar capta o todo antes de decompor nos detalhes — por isso a hierarquia visual de uma tela pesa mais que o refinamento de cada elemento isolado."},{"tema":"Psicologia, Cognição e Percepção Visual","q":"Qual é a primeira etapa do processo de decisão do consumidor?","op":["Avaliação de alternativas","Decisão de compra","Comportamento pós-compra","Reconhecimento da necessidade"],"r":3,"exp":"O processo começa quando a pessoa percebe uma lacuna entre a situação atual e a desejada. Depois vêm busca de informação, avaliação, decisão e pós-compra."},{"tema":"Psicologia, Cognição e Percepção Visual","q":"Como a tecnologia alterou a relação entre consumidor e vendedor?","op":["Aumentou o poder do vendedor, que controla a informação","Deslocou poder para o consumidor, que compara preços e lê avaliações antes de decidir","Tornou irrelevante a etapa de busca de informação","Eliminou o comportamento pós-compra"],"r":1,"exp":"Com acesso imediato a informação, comparação e opinião de outros compradores, o consumidor chega ao ponto de venda mais informado do que o vendedor esperava."}],"discursivas":[{"tema":"Heurísticas e Avaliação em IHC","q":"Explique a diferença entre avaliação por inspeção e avaliação por observação, indicando quando usar cada uma.","r":"A avaliação por inspeção é conduzida por especialistas em usabilidade que examinam a interface aplicando critérios estabelecidos, sem a participação de usuários finais. Os métodos mais comuns são a avaliação heurística, em que três a cinco avaliadores percorrem a interface confrontando-a com as dez heurísticas de Nielsen, o percurso cognitivo, em que o avaliador simula passo a passo o raciocínio de um usuário novato executando uma tarefa, e a inspeção semiótica, que analisa a mensagem que o designer emite através da interface. Suas vantagens são o custo baixo, a rapidez e a possibilidade de aplicação em qualquer fase, inclusive sobre protótipos de papel; sua limitação é depender da experiência do avaliador e não capturar comportamentos inesperados. A avaliação por observação envolve usuários reais executando tarefas reais enquanto são observados, por meio de testes de usabilidade em laboratório, observação de campo no ambiente natural de uso ou a técnica think aloud, em que o participante verbaliza o que pensa durante o uso. É mais cara e demorada, mas revela problemas que nenhum especialista anteciparia, porque expõe o descompasso entre o modelo mental do usuário e o modelo de projeto. Na prática as duas se complementam e a ordem importa: usa-se primeiro a inspeção, mais barata, para eliminar os problemas óbvios, e só então se leva a interface a usuários reais — assim o teste, que é caro, não é gasto descobrindo erros que um especialista teria apontado em uma hora. Nielsen ainda observa que cinco usuários já revelam cerca de 85% dos problemas, o que favorece vários ciclos pequenos de teste e correção em vez de um único teste grande."},{"tema":"Prototipação","q":"Compare os tipos de protótipo quanto à fidelidade, à abrangência e ao destino, explicando quando cada combinação é apropriada.","r":"Quanto à fidelidade, o protótipo de baixa fidelidade é feito em papel, post-its ou rascunhos, sem semelhança visual com o produto, e serve para validar fluxos e estrutura; é barato, rápido e, por parecer inacabado, convida à crítica sincera. O de média fidelidade é computadorizado, com visual parcial — tipicamente wireframes clicáveis. O de alta fidelidade utiliza os mesmos materiais do produto final e banco de dados de homologação, ficando praticamente idêntico ao produto real, o que permite testes realistas e apresentação a investidores, mas custa caro e engessa mudanças. Quanto à abrangência, o protótipo horizontal apresenta grande variedade de funções com poucos detalhes em cada, oferecendo a visão ampla do sistema, útil para validar a arquitetura de informação e a navegação geral; o vertical concentra-se em poucas funções detalhadas ao máximo, aprofundando um módulo crítico ou tecnicamente arriscado. Quanto ao destino, o descartável é criado apenas para gerar aprendizado e é abandonado depois, enquanto o evolutivo é refinado iterativamente até se tornar o produto de produção. As combinações adequadas seguem o momento do projeto: no início, quando a incerteza é máxima e o custo de mudar deve ser mínimo, usa-se baixa fidelidade, horizontal e descartável, para validar rapidamente se o fluxo faz sentido; à medida que o conceito se estabiliza e o risco se concentra em pontos específicos, migra-se para média ou alta fidelidade, vertical, aprofundando o módulo crítico; e a opção evolutiva só é apropriada quando os requisitos já estão razoavelmente estáveis, sob risco de carregar para a produção decisões improvisadas feitas na fase exploratória."}],"colas":[{"titulo":"UI x UX x Usabilidade","mnemonico":"Mnemônico: UI é a CARA; usabilidade é o FUNCIONA BEM; UX é o SENTIMENTO INTEIRO.","pontos":["Interface: o meio de contato — telas, botões, comandos.","Usabilidade: a QUALIDADE DE USO da interface. Objetiva e mensurável.","UX: tudo que a pessoa sente antes, durante e depois. Inclui a usabilidade.","Interface bonita + fluxo confuso = boa UI, má UX.","5 atributos de Nielsen: aprendizado, eficiência, memorização, poucos erros, satisfação."]},{"titulo":"As 10 heurísticas de Nielsen","mnemonico":"Mnemônico: as 3 primeiras são VISIBILIDADE, MUNDO REAL e CONTROLE — as mais cobradas.","pontos":["1 Visibilidade do status | 2 Correspondência com o mundo real | 3 Controle e liberdade","4 Consistência e padrões | 5 Prevenção de erros | 6 Reconhecer em vez de lembrar","7 Flexibilidade e eficiência | 8 Design estético e minimalista","9 Ajudar a reconhecer, diagnosticar e recuperar-se de erros | 10 Ajuda e documentação","Prevenir erro (5) é melhor que avisar do erro (9)."]},{"titulo":"Métodos de avaliação","mnemonico":"Mnemônico: INSPEÇÃO = especialista SEM usuário. OBSERVAÇÃO = COM usuário real.","pontos":["Inspeção: avaliação heurística, percurso cognitivo, inspeção semiótica. Barata e rápida.","Observação: teste de usabilidade, observação de campo, think aloud. Cara, mas revela o imprevisto.","Questionamento: entrevista, questionário, grupo focal — capta OPINIÃO, não comportamento.","Regra de Nielsen: 5 usuários já revelam ~85% dos problemas."]},{"titulo":"Fidelidade e tipo de protótipo","mnemonico":"Mnemônico: HORIZONTAL é LARGO (muitas funções rasas); VERTICAL é FUNDO (poucas funções detalhadas).","pontos":["Baixa fidelidade: papel/post-it, valida FLUXO. Alta: materiais reais + banco de homologação.","Horizontal: variedade de funções, poucos detalhes. Vertical: poucas funções, máximo detalhe.","Descartável: explora e joga fora. Evolutivo: vira o produto final.","Conceitual = O QUE o sistema faz (sem tecnologia). Físico = COMO será implementado.","Wireframe (esqueleto) → mockup (visual estático) → protótipo (navegável)."]},{"titulo":"Design Thinking","mnemonico":"Mnemônico: \"EDIPT\" → Empatizar, Definir, Idear, Prototipar, Testar. Centrado no HUMANO e ITERATIVO.","pontos":["É centrado no ser humano, iterativo, com empatia e COCRIAÇÃO.","NÃO é linear nem rígido; NÃO é só design gráfico; NÃO dispensa testes.","Duplo diamante: diverge e converge duas vezes — no problema e na solução.","Brainstorming: verbal e em grupo. Brainwriting: escreve antes de falar (reduz influência dos mais falantes)."]},{"titulo":"Psicologia da interface","mnemonico":"Mnemônico: Fitts = TAMANHO e DISTÂNCIA do alvo. Hick = QUANTIDADE de opções.","pontos":["Affordance: o objeto sugere como usar. Signifier: o sinal que comunica isso. (Donald Norman)","Modelo mental: como o usuário ACHA que funciona. Quanto mais perto do real, mais intuitivo.","Lei de Fitts: alvo importante = grande e perto.","Lei de Hick: mais opções = decisão mais lenta.","Gestalt: proximidade, similaridade, continuidade, fechamento, figura/fundo.","WCAG/POUR: Perceptível, Operável, Compreensível, Robusto."]}]},{"id":"empreendedorismo","nome":"Empreendedorismo","sigla":"EMP","cor":"#06b6d4","corTexto":"#06b6d4","corFundo":"#047f93","periodo":1,"pasta":"Empreendedorismo","arquivos":[{"nome":"2016MattareMeirellesMudanasnoModelod
