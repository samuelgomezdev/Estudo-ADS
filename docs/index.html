a com ela por <b>registradores<\/b> e <b>buffers<\/b>.<\/p><p><b>Técnicas:<\/b> E/S programada (polling — a CPU consulta em laço e desperdiça tempo), <b>por interrupção<\/b> (o dispositivo avisa quando está pronto) e <b>DMA<\/b> (transferência direta dispositivo↔memória, sem passar pela CPU).<\/p><p><b>Software de E/S em camadas<\/b>, de cima para baixo: software de nível de usuário → software independente de dispositivo (nomes, buffering, proteção) → <b>drivers<\/b> (dependentes do dispositivo) → tratadores de interrupção → hardware.<\/p><p><b>Deadlock (impasse):<\/b> dois ou mais processos ficam bloqueados para sempre, cada um esperando um recurso que o outro segura.<\/p><p><b>As 4 condições de Coffman<\/b> — todas precisam ocorrer simultaneamente:<\/p><ol><li><b>Exclusão mútua<\/b> — o recurso só pode ser usado por um processo por vez<\/li><li><b>Posse e espera<\/b> — o processo segura um recurso enquanto espera outro<\/li><li><b>Não preempção<\/b> — o recurso não pode ser tomado à força; só é liberado voluntariamente<\/li><li><b>Espera circular<\/b> — existe um ciclo de processos, cada um esperando o próximo<\/li><\/ol><p><b>Como tratar:<\/b> <b>prevenção<\/b> (quebrar uma das quatro condições por projeto — por exemplo, ordenar globalmente os recursos para impedir o ciclo), <b>impedimento/anulação<\/b> (decidir em tempo de execução se conceder o recurso é seguro — algoritmo do banqueiro), <b>detecção e recuperação<\/b> (deixar acontecer, detectar por grafo de alocação e matar ou reverter processos) e <b>ignorar<\/b> (o algoritmo do avestruz — o que Windows e Linux fazem na prática para recursos comuns).<\/p>"},{"tema":"Memória de Massa, Discos e RAID","html":"<p><b>HD (disco rígido):<\/b> gravação magnética em pratos que giram, com cabeças de leitura/gravação em um braço. Organização: <b>trilhas<\/b> (círculos concêntricos), <b>setores<\/b> (fatias da trilha, tradicionalmente de 512 bytes) e <b>cilindros<\/b> (mesma trilha em todos os pratos). O <b>tempo de acesso<\/b> é a soma do <b>tempo de busca<\/b> (mover o braço), da <b>latência rotacional<\/b> (esperar o setor passar) e do tempo de transferência.<\/p><p><b>SSD:<\/b> memória flash, sem partes móveis — muito mais rápido, silencioso e resistente a impacto, com acesso praticamente uniforme. Tem número limitado de ciclos de escrita, mitigado pelo <b>wear leveling<\/b> e pelo comando <b>TRIM<\/b>.<\/p><p><b>Interfaces:<\/b> IDE/PATA (antiga, cabo flat paralelo), <b>SATA<\/b> (serial, dominante em HDs), <b>SAS<\/b> (servidores), <b>NVMe<\/b> sobre PCIe (SSDs modernos, muito mais rápido que SATA).<\/p><p><b>Escalonamento de disco:<\/b> FCFS, SSTF (menor tempo de busca primeiro), <b>SCAN/elevador<\/b> (o braço varre em um sentido e volta) e C-SCAN.<\/p><p><b>RAID<\/b> (Redundant Array of Independent Disks) — combina vários discos:<\/p><ul><li><b>RAID 0 (striping)<\/b> — divide os dados entre os discos. Máximo desempenho e capacidade total, <b>sem nenhuma redundância<\/b>: se um disco falha, perde-se tudo. Mínimo 2 discos.<\/li><li><b>RAID 1 (espelhamento)<\/b> — cópia idêntica em dois discos. Tolera a falha de um; aproveita <b>50%<\/b> da capacidade. Mínimo 2 discos.<\/li><li><b>RAID 5<\/b> — striping com <b>paridade distribuída<\/b> entre todos os discos. Tolera a falha de <b>1<\/b> disco; perde a capacidade de 1 disco. Mínimo 3 discos.<\/li><li><b>RAID 6<\/b> — dupla paridade. Tolera a falha de <b>2<\/b> discos. Mínimo 4 discos.<\/li><li><b>RAID 10 (1+0)<\/b> — espelha e depois divide. Junta desempenho e segurança; aproveita 50%. Mínimo 4 discos.<\/li><\/ul><p><b>Paridade:<\/b> um bit calculado por <b>XOR<\/b> entre os bits correspondentes dos demais discos. Se um disco falha, o dado perdido é reconstruído fazendo XOR entre os que sobraram. RAID não substitui backup — ele protege contra falha de disco, não contra exclusão acidental, corrupção ou ransomware.<\/p>"},{"tema":"Sistemas de Arquivos","html":"<p>O <b>sistema de arquivos<\/b> organiza como os dados são guardados e recuperados na memória de massa. Ele define a estrutura de diretórios, os metadados (nome, tamanho, datas, permissões) e como os blocos do disco são alocados.<\/p><p><b>Métodos de alocação:<\/b> <b>contígua<\/b> (blocos em sequência — leitura rápida, mas sofre fragmentação externa e dificulta o crescimento do arquivo), <b>encadeada<\/b> (cada bloco aponta para o próximo — sem fragmentação externa, mas o acesso direto é ruim) e <b>indexada<\/b> (um bloco de índice guarda os endereços — é o que o Unix faz com o <b>inode<\/b>).<\/p><p><b>Controle de espaço livre:<\/b> mapa de bits ou lista encadeada de blocos livres.<\/p><p><b>Principais sistemas:<\/b> <b>FAT32<\/b> (universal, mas limitado a arquivos de 4 GB), <b>NTFS<\/b> (Windows — journaling, permissões, compressão, criptografia), <b>exFAT<\/b> (pen drives e cartões, sem o limite de 4 GB), <b>ext4<\/b> (Linux, com journaling), <b>Btrfs<\/b> e <b>ZFS<\/b> (snapshots e checksums), <b>APFS<\/b> (macOS).<\/p><p><b>Journaling<\/b> é o registro prévio das operações em um diário: se faltar energia no meio de uma gravação, o sistema consulta o diário e recupera a consistência sem varrer o disco inteiro.<\/p><p><b>Permissões no Linux:<\/b> três classes (dono, grupo, outros) e três direitos (r=4, w=2, x=1). <code>chmod 755<\/code> = dono rwx, grupo r-x, outros r-x.<\/p>"},{"tema":"Windows, Linux e Aplicações","html":"<p><b>Windows<\/b> — desenvolvido e distribuído pela <b>Microsoft<\/b>, com custo de licença. Código fechado, kernel híbrido, instalável em uma enorme variedade de hardware: de celulares e tablets a consoles, mainframes e supercomputadores. Interface gráfica desde o início, ampla compatibilidade com softwares comerciais e jogos, sistema de arquivos NTFS, e é o alvo preferencial de malware por causa da base de usuários.<\/p><p><b>Linux<\/b> — o <b>kernel é desenvolvido pela comunidade<\/b>, com <b>Linus Torvalds<\/b> supervisionando o desenvolvimento. Código aberto (licença GPL), pode ser <b>distribuído gratuitamente<\/b> em revistas, livros ou download. Existem versões pagas, normalmente mais baratas que o Windows. Distribuições: Ubuntu, Debian, Fedora, Red Hat, Arch. Domina servidores, nuvem, supercomputadores e sistemas embarcados; o Android usa kernel Linux.<\/p><p><b>Comparando:<\/b> o Linux costuma exigir menos hardware, dá mais controle e é mais fácil de auditar por ser aberto; o Windows tem instalação e uso mais simples para o público geral e melhor suporte a software comercial. Ambos rodam em grande variedade de hardware.<\/p><p><b>Funcionalidades que todo SO oferece:<\/b> gerência de processos, gerência de memória, gerência de arquivos, gerência de dispositivos de E/S, segurança e controle de acesso, e interface com o usuário (linha de comando ou gráfica).<\/p><p><b>Virtualização:<\/b> um <b>hipervisor<\/b> permite executar vários sistemas operacionais convidados sobre a mesma máquina física — tipo 1 roda direto no hardware (ESXi, Hyper-V), tipo 2 roda sobre um SO hospedeiro (VirtualBox, VMware Workstation). <b>Contêineres<\/b> (Docker) são mais leves: compartilham o kernel do hospedeiro e isolam apenas o espaço de usuário.<\/p>"}],"flashcards":[{"tema":"Conceitos de Sistema Operacional","p":"O que faz um programa em execução, em essência?","r":"Executa instruções: o processador busca uma instrução da memória, decodifica e executa — milhões ou bilhões de vezes por segundo — até que o programa termine."},{"tema":"Conceitos de Sistema Operacional","p":"Quais são as duas funções centrais de um sistema operacional?","r":"Ser uma máquina estendida (esconder a complexidade do hardware por trás de abstrações como arquivos e processos) e ser um gerenciador de recursos (decidir quem usa CPU, memória, disco e dispositivos, e quando)."},{"tema":"Conceitos de Sistema Operacional","p":"Qual a diferença entre modo usuário e modo kernel?","r":"O kernel roda em modo protegido/supervisor, com acesso total ao hardware. Os programas do usuário rodam em modo restrito e precisam pedir serviços ao kernel por chamadas de sistema. É essa separação que impede um programa de derrubar os outros."},{"tema":"Conceitos de Sistema Operacional","p":"Qual a diferença entre kernel monolítico e microkernel?","r":"No monolítico todos os serviços ficam dentro do núcleo — rápido, porém grande (Linux). No microkernel só o essencial fica no núcleo e o resto roda como processos de usuário — mais seguro e modular, com o custo da troca de mensagens (Minix, QNX)."},{"tema":"Conceitos de Sistema Operacional","p":"O que é multiprogramação?","r":"Manter vários programas na memória ao mesmo tempo, de modo que quando um bloqueia esperando E/S a CPU passa a executar outro — aumentando o aproveitamento do processador."},{"tema":"Gerência de Processos e Escalonamento","p":"O que é um processo?","r":"Um programa em execução — a unidade básica de trabalho do sistema. O programa é passivo (um arquivo no disco); o processo é ativo, com contador de programa, registradores, pilha, heap e dados."},{"tema":"Gerência de Processos e Escalonamento","p":"O que é o PCB?","r":"Process Control Block: a estrutura onde o SO guarda tudo sobre o processo — PID, estado, contador de programa, registradores, prioridade e arquivos abertos. É o que torna possível a troca de contexto."},{"tema":"Gerência de Processos e Escalonamento","p":"Quais são os estados de um processo?","r":"Novo → pronto (na fila esperando CPU) → executando (na CPU) → bloqueado (esperando E/S ou evento) → volta a pronto → terminado. De bloqueado nunca se vai direto para executando."},{"tema":"Gerência de Processos e Escalonamento","p":"O que é o efeito comboio no FCFS?","r":"Quando um processo longo chega primeiro, todos os curtos atrás dele ficam esperando — o tempo médio de espera dispara. É a principal fraqueza do FCFS."},{"tema":"Gerência de Processos e Escalonamento","p":"Qual algoritmo minimiza o tempo médio de espera e qual seu problema?","r":"SJF (Shortest Job First). Problemas: exige prever a duração dos processos e pode causar inanição (starvation) dos processos longos, que nunca chegam a executar."},{"tema":"Gerência de Processos e Escalonamento","p":"Como funciona o Round Robin?","r":"Cada processo recebe um quantum fixo de tempo de CPU; ao esgotá-lo, volta ao fim da fila. É o algoritmo dos sistemas de tempo compartilhado — a escolha do quantum equilibra tempo de resposta e sobrecarga de troca de contexto."},{"tema":"Gerência de Processos e Escalonamento","p":"O que é aging no escalonamento por prioridade?","r":"O envelhecimento: aumentar gradualmente a prioridade dos processos que esperam há muito tempo, para evitar que fiquem em inanição."},{"tema":"Gerência de Processos e Escalonamento","p":"Qual a diferença entre escalonamento preemptivo e não preemptivo?","r":"No preemptivo o SO pode retirar a CPU de um processo antes que ele termine (como no Round Robin). No não preemptivo, o processo só perde a CPU quando a libera voluntariamente ou termina."},{"tema":"Gerência de Processos e Escalonamento","p":"O que uma thread compartilha e o que ela tem de próprio?","r":"Compartilha com as threads irmãs o código, os dados e os arquivos abertos do processo. Tem de próprio: pilha, registradores e contador de programa."},{"tema":"Gerência de Processos e Escalonamento","p":"Quais as vantagens de usar threads em vez de processos?","r":"Criação e troca de contexto muito mais baratas, comunicação direta pela memória compartilhada e paralelismo real em máquinas multicore. Em troca, exigem sincronização (mutex, semáforos)."},{"tema":"Gerência de Memória e Memória Virtual","p":"Qual é a hierarquia de armazenamento, do mais rápido ao mais lento?","r":"Registradores → cache (L1, L2, L3) → memória principal (RAM) → memória secundária (SSD/HD) → memória terciária (fita, nuvem). Quanto mais rápido, mais caro e menor."},{"tema":"Gerência de Memória e Memória Virtual","p":"Qual a diferença entre fragmentação interna e externa?","r":"Interna: sobra de espaço DENTRO de um bloco alocado (partições fixas). Externa: buracos livres ESPALHADOS entre os processos, que somados dariam memória, mas não são contíguos (partições variáveis)."},{"tema":"Gerência de Memória e Memória Virtual","p":"Como funciona a paginação?","r":"A memória física é dividida em quadros (frames) e o espaço lógico do processo em páginas do mesmo tamanho. A tabela de páginas faz o mapeamento e a MMU traduz os endereços em hardware. Elimina a fragmentação externa."},{"tema":"Gerência de Memória e Memória Virtual","p":"O que é memória virtual?","r":"A combinação de RAM e espaço em disco que dá aos processos mais memória do que existe fisicamente. O programa é dividido em páginas e só as necessárias ficam na RAM."},{"tema":"Gerência de Memória e Memória Virtual","p":"O que é um page fault?","r":"A falta de página: o processo acessa uma página que não está na memória física, e o SO precisa buscá-la no disco — possivelmente removendo outra página para abrir espaço."},{"tema":"Gerência de Memória e Memória Virtual","p":"O que é a anomalia de Belady?","r":"O fenômeno em que aumentar o número de quadros de memória AUMENTA o número de faltas de página. Ocorre no algoritmo FIFO; o LRU não sofre desse problema."},{"tema":"Gerência de Memória e Memória Virtual","p":"O que é thrashing?","r":"Quando o sistema passa mais tempo trocando páginas entre RAM e disco do que executando processos. É sinal de que há processos demais para a memória disponível."},{"tema":"Entrada, Saída e Deadlocks","p":"O que é um deadlock?","r":"Um impasse: dois ou mais processos ficam bloqueados para sempre, cada um esperando um recurso que outro do grupo mantém em sua posse."},{"tema":"Entrada, Saída e Deadlocks","p":"Quais são as quatro condições de Coffman para o deadlock?","r":"Exclusão mútua, posse e espera, não preempção e espera circular. As quatro precisam ocorrer simultaneamente — quebrar qualquer uma impede o deadlock."},{"tema":"Entrada, Saída e Deadlocks","p":"Quais são as estratégias para tratar deadlocks?","r":"Prevenção (quebrar uma das 4 condições por projeto), impedimento (decidir em execução se a alocação é segura — algoritmo do banqueiro), detecção e recuperação (grafo de alocação, matar ou reverter processos) e ignorar (algoritmo do avestruz, o que Windows e Linux fazem na prática)."},{"tema":"Entrada, Saída e Deadlocks","p":"Quais são as camadas do software de E/S?","r":"De cima para baixo: software de nível de usuário → software independente de dispositivo (nomes, buffering, proteção) → drivers (dependentes do dispositivo) → tratadores de interrupção → hardware."},{"tema":"Memória de Massa, Discos e RAID","p":"Do que se compõe o tempo de acesso a um HD?","r":"Tempo de busca (mover o braço até a trilha) + latência rotacional (esperar o setor girar até a cabeça) + tempo de transferência dos dados."},{"tema":"Memória de Massa, Discos e RAID","p":"O que são trilhas, setores e cilindros?","r":"Trilhas: círculos concêntricos em cada prato. Setores: fatias da trilha, a menor unidade endereçável (tradicionalmente 512 bytes). Cilindro: o conjunto da mesma trilha em todos os pratos empilhados."},{"tema":"Memória de Massa, Discos e RAID","p":"Quais as vantagens do SSD sobre o HD?","r":"Sem partes móveis: muito mais rápido, silencioso, resistente a impacto e com tempo de acesso praticamente uniforme. Em troca, tem número limitado de ciclos de escrita, mitigado por wear leveling e pelo comando TRIM."},{"tema":"Memória de Massa, Discos e RAID","p":"O que é RAID 0 e qual seu risco?","r":"Striping: divide os dados entre os discos, dando máximo desempenho e 100% da capacidade. Não tem nenhuma redundância — se um único disco falhar, perde-se todo o conjunto."},{"tema":"Memória de Massa, Discos e RAID","p":"Quantos discos no mínimo o RAID 5 exige e quantas falhas ele tolera?","r":"Mínimo de 3 discos e tolera a falha de 1 disco. A paridade fica distribuída entre todos, e a capacidade útil equivale ao total menos um disco."},{"tema":"Memória de Massa, Discos e RAID","p":"Como funciona a paridade no RAID?","r":"Um bit de paridade é calculado por XOR entre os bits correspondentes dos demais discos. Se um disco falha, o dado perdido é reconstruído fazendo XOR entre os discos que restaram."},{"tema":"Memória de Massa, Discos e RAID","p":"RAID substitui backup?","r":"Não. O RAID protege contra falha física de disco, mas não contra exclusão acidental, corrupção de dados, ransomware, incêndio ou roubo — para isso é preciso backup."},{"tema":"Sistemas de Arquivos","p":"Quais são os métodos de alocação de arquivos?","r":"Contígua (blocos em sequência — leitura rápida, mas com fragmentação externa), encadeada (cada bloco aponta para o próximo — acesso direto ruim) e indexada (um bloco de índice guarda os endereços; é o inode do Unix)."},{"tema":"Sistemas de Arquivos","p":"O que é journaling?","r":"O registro prévio das operações em um diário. Se faltar energia no meio de uma gravação, o sistema consulta o diário e recupera a consistência sem precisar varrer o disco inteiro. NTFS e ext4 usam journaling."},{"tema":"Sistemas de Arquivos","p":"Qual a principal limitação do FAT32?","r":"Não armazena arquivos maiores que 4 GB. O exFAT foi criado justamente para remover esse limite em pen drives e cartões de memória."},{"tema":"Sistemas de Arquivos","p":"O que significa chmod 755 no Linux?","r":"Dono com rwx (4+2+1=7), grupo com r-x (4+0+1=5) e outros com r-x (5). Os direitos valem r=4, w=2, x=1, somados por classe."},{"tema":"Windows, Linux e Aplicações","p":"Quem desenvolve o kernel do Linux?","r":"A comunidade, com Linus Torvalds — criador do Linux — supervisionando o desenvolvimento. O código é aberto sob licença GPL."},{"tema":"Windows, Linux e Aplicações","p":"O Linux é sempre gratuito?","r":"Não. Ele pode ser distribuído e baixado gratuitamente, mas existem versões pagas (com suporte comercial, como Red Hat) — normalmente mais baratas que o Windows."},{"tema":"Windows, Linux e Aplicações","p":"Quais funcionalidades todo sistema operacional oferece?","r":"Gerência de processos, de memória, de arquivos e de dispositivos de E/S, além de segurança/controle de acesso e interface com o usuário (linha de comando ou gráfica)."},{"tema":"Windows, Linux e Aplicações","p":"Qual a diferença entre hipervisor tipo 1 e tipo 2?","r":"O tipo 1 (bare metal) roda direto sobre o hardware — ESXi, Hyper-V. O tipo 2 roda sobre um sistema operacional hospedeiro — VirtualBox, VMware Workstation."},{"tema":"Windows, Linux e Aplicações","p":"Qual a diferença entre máquina virtual e contêiner?","r":"A máquina virtual carrega um sistema operacional convidado completo sobre um hipervisor. O contêiner (Docker) compartilha o kernel do hospedeiro e isola apenas o espaço de usuário — muito mais leve e rápido de subir."}],"questoes":[{"tema":"Conceitos de Sistema Operacional","q":"Qual é o papel do sistema operacional em relação aos programas?","op":["Compilar o código-fonte dos programas antes de executá-los","Substituir o processador na execução das instruções","Facilitar a execução dos programas, permitindo que compartilhem memória e dispositivos","Armazenar permanentemente o código dos programas"],"r":2,"exp":"O SO é o conjunto de softwares responsável por facilitar a execução de programas, permitindo que compartilhem memória e dispositivos com segurança."},{"tema":"Conceitos de Sistema Operacional","q":"Quando o SO é descrito como 'máquina estendida', isso significa que ele:","op":["Aumenta fisicamente a capacidade do hardware","Estende a vida útil dos componentes","Esconde a complexidade do hardware por trás de abstrações como arquivos e processos","Permite acoplar mais dispositivos ao computador"],"r":2,"exp":"A máquina estendida (ou virtual) oferece ao programador uma interface limpa — arquivos, processos, sockets — em vez dos registradores das controladoras de hardware."},{"tema":"Conceitos de Sistema Operacional","q":"O que separa o modo usuário do modo kernel?","op":["A velocidade de execução das instruções","A linguagem de programação usada","O nível de privilégio de acesso ao hardware","A quantidade de memória disponível"],"r":2,"exp":"O kernel roda em modo protegido, com acesso total ao hardware; os programas rodam em modo restrito e pedem serviços por chamadas de sistema. É isso que impede um programa de derrubar os outros."},{"tema":"Conceitos de Sistema Operacional","q":"Qual a característica do microkernel?","op":["Todos os serviços do sistema ficam dentro do núcleo","Apenas o essencial fica no núcleo; o resto roda como processos de usuário","Não possui chamadas de sistema","É exclusivo de sistemas de tempo real"],"r":1,"exp":"O microkernel mantém no núcleo apenas o essencial, ganhando modularidade e segurança ao custo da troca de mensagens. O Linux, ao contrário, tem kernel monolítico."},{"tema":"Conceitos de Sistema Operacional","q":"Qual foi o ganho trazido pela multiprogramação?","op":["Permitir que um único programa use toda a memória","Eliminar a necessidade de sistema de arquivos","Aproveitar a CPU executando outro programa quando um bloqueia esperando E/S","Reduzir o número de instruções de cada programa"],"r":2,"exp":"Com vários programas na memória, quando um bloqueia esperando entrada/saída a CPU passa a executar outro, elevando muito o aproveitamento do processador."},{"tema":"Gerência de Processos e Escalonamento","q":"O que é um processo?","op":["Um arquivo executável armazenado no disco","Um programa em execução, a unidade básica de trabalho do sistema","Um trecho de código dentro de uma função","Um dispositivo de entrada e saída virtual"],"r":1,"exp":"O programa é passivo, um arquivo no disco. O processo é ativo: o programa em execução, com contador de programa, registradores, pilha e dados próprios."},{"tema":"Gerência de Processos e Escalonamento","q":"Para que serve o PCB (Process Control Block)?","op":["Armazenar o código-fonte do programa","Controlar o acesso ao disco rígido","Definir a prioridade de todos os processos do sistema","Guardar as informações do processo — PID, estado, registradores, prioridade — permitindo a troca de contexto"],"r":3,"exp":"O PCB é a ficha do processo. Sem ele o SO não teria como salvar e restaurar a situação de um processo ao alternar entre eles."},{"tema":"Gerência de Processos e Escalonamento","q":"Um processo que está esperando a conclusão de uma operação de leitura em disco encontra-se em qual estado?","op":["Pronto","Executando","Terminado","Bloqueado (em espera)"],"r":3,"exp":"Bloqueado é o estado de quem espera E/S ou um evento. Pronto é quem já poderia executar e só aguarda a CPU ficar livre."},{"tema":"Gerência de Processos e Escalonamento","q":"Qual transição de estado NÃO existe?","op":["Executando → Pronto","Bloqueado → Pronto","Bloqueado → Executando","Pronto → Executando"],"r":2,"exp":"Ao ser desbloqueado, o processo volta para a fila de PRONTO — só entra em execução quando o escalonador o escolher. Não há salto direto de bloqueado para executando."},{"tema":"Gerência de Processos e Escalonamento","q":"O efeito comboio é uma desvantagem de qual algoritmo de escalonamento?","op":["FCFS (primeiro a chegar, primeiro a ser servido)","Round Robin","SJF","Filas multinível"],"r":0,"exp":"No FCFS, se um processo longo chega primeiro todos os curtos ficam presos atrás dele, elevando muito o tempo médio de espera."},{"tema":"Gerência de Processos e Escalonamento","q":"Qual algoritmo de escalonamento minimiza o tempo médio de espera, mas pode causar inanição?","op":["FCFS","SJF (Shortest Job First)","Round Robin","Filas multinível com realimentação"],"r":1,"exp":"O SJF é ótimo para o tempo médio de espera, mas processos longos podem nunca ser escolhidos se sempre chegarem processos curtos — é a inanição (starvation)."},{"tema":"Gerência de Processos e Escalonamento","q":"O que é o quantum no Round Robin?","op":["A prioridade atribuída a cada processo","O número máximo de processos na memória","O tempo total de execução previsto para o processo","A fatia de tempo de CPU concedida a cada processo antes de ele voltar ao fim da fila"],"r":3,"exp":"Cada processo recebe um quantum; ao esgotá-lo é preemptado e vai para o fim da fila. Quantum muito pequeno gera excesso de troca de contexto; muito grande, o Round Robin degenera em FCFS."},{"tema":"Gerência de Processos e Escalonamento","q":"O que é aging (envelhecimento) no escalonamento?","op":["Remover processos antigos da memória","Aumentar gradualmente a prioridade de processos que esperam há muito tempo","Reduzir o quantum conforme o processo executa","Encerrar processos que excedem o tempo limite"],"r":1,"exp":"O aging combate a inanição no escalonamento por prioridade: quem espera muito vai subindo de prioridade até ser atendido."},{"tema":"Gerência de Processos e Escalonamento","q":"O que threads do mesmo processo compartilham entre si?","op":["O código, os dados e os arquivos abertos","A pilha e os registradores","O contador de programa","Nada — são totalmente isoladas"],"r":0,"exp":"Threads irmãs compartilham código, dados e arquivos abertos do processo. Cada uma tem sua própria pilha, registradores e contador de programa."},{"tema":"Gerência de Processos e Escalonamento","q":"Qual é uma vantagem das threads sobre os processos?","op":["Isolamento total de memória entre elas","Criação e troca de contexto mais baratas, com comunicação direta pela memória compartilhada","Dispensam qualquer mecanismo de sincronização","Executam sempre em um único núcleo"],"r":1,"exp":"Justamente por compartilharem o espaço de endereçamento, as threads são mais leves de criar e trocar. Em compensação, exigem sincronização (mutex, semáforos)."},{"tema":"Gerência de Memória e Memória Virtual","q":"Qual é a ordem correta da hierarquia de armazenamento, do mais rápido ao mais lento?","op":["RAM → cache → registradores → disco","Registradores → cache → RAM → disco","Cache → registradores → disco → RAM","Disco → RAM → cache → registradores"],"r":1,"exp":"Registradores → cache (L1, L2, L3) → memória principal (RAM) → memória secundária (SSD/HD). Quanto mais rápido, mais caro e menor a capacidade."},{"tema":"Gerência de Memória e Memória Virtual","q":"A sobra de espaço não utilizado DENTRO de uma partição alocada é chamada de:","op":["Fragmentação externa","Thrashing","Page fault","Fragmentação interna"],"r":3,"exp":"Fragmentação interna é a sobra dentro do bloco alocado, típica de partições fixas. A externa são buracos livres espalhados ENTRE os processos."},{"tema":"Gerência de Memória e Memória Virtual","q":"Qual problema a paginação resolve?","op":["A fragmentação interna","O thrashing","A fragmentação externa","Os deadlocks"],"r":2,"exp":"Como páginas e quadros têm tamanho igual, qualquer quadro livre serve para qualquer página — não sobram buracos inutilizáveis. Pode restar uma pequena fragmentação interna na última página."},{"tema":"Gerência de Memória e Memória Virtual","q":"O que ocorre em uma falta de página (page fault)?","op":["O SO precisa trazer do disco a página que não está na memória física","O processo é encerrado por erro de memória","A memória virtual é desativada","A tabela de páginas é reconstruída do zero"],"r":0,"exp":"É um evento normal do funcionamento da memória virtual: o SO busca a página no disco, possivelmente removendo outra para abrir espaço."},{"tema":"Gerência de Memória e Memória Virtual","q":"Qual algoritmo de substituição de página sofre a anomalia de Belady?","op":["LRU","Ótimo (OPT)","Segunda chance","FIFO"],"r":3,"exp":"Na anomalia de Belady, aumentar o número de quadros AUMENTA as faltas de página. Ocorre no FIFO; o LRU não sofre desse problema."},{"tema":"Gerência de Memória e Memória Virtual","q":"O que caracteriza o thrashing?","op":["A perda de dados na memória por falta de energia","O sistema passar mais tempo trocando páginas do que executando processos","A fragmentação excessiva do disco rígido","A execução simultânea de threads em vários núcleos"],"r":1,"exp":"É o colapso de desempenho por excesso de paginação — sinal de que há processos demais para a memória física disponível."},{"tema":"Entrada, Saída e Deadlocks","q":"O que é um deadlock?","op":["A falha de um dispositivo de entrada e saída","A perda de dados por falta de memória","O bloqueio permanente de processos, cada um esperando um recurso que outro mantém","A execução de um processo com prioridade máxima"],"r":2,"exp":"É o impasse: um ciclo de espera em que nenhum processo consegue prosseguir porque o recurso de que precisa está com outro do grupo."},{"tema":"Entrada, Saída e Deadlocks","q":"Quais são as quatro condições necessárias para ocorrer um deadlock?","op":["Exclusão mútua, posse e espera, não preempção e espera circular","Paginação, segmentação, fragmentação e realocação","Inanição, envelhecimento, preempção e prioridade","Leitura, escrita, execução e exclusão"],"r":0,"exp":"São as condições de Coffman. Todas precisam ocorrer ao mesmo tempo — quebrar qualquer uma delas impede o deadlock."},{"tema":"Entrada, Saída e Deadlocks","q":"Qual condição de deadlock é quebrada ao se estabelecer uma ordem global de solicitação de recursos?","op":["Exclusão mútua","Posse e espera","Espera circular","Não preempção"],"r":2,"exp":"Se todo processo precisa pedir os recursos em uma ordem numérica crescente, torna-se impossível formar o ciclo — a espera circular deixa de existir."},{"tema":"Entrada, Saída e Deadlocks","q":"A estratégia de simplesmente ignorar a possibilidade de deadlock, adotada na prática por Windows e Linux, é conhecida como:","op":["Algoritmo do banqueiro","Detecção por grafo de alocação","Prevenção estática","Algoritmo do avestruz"],"r":3,"exp":"O algoritmo do avestruz consiste em enfiar a cabeça na areia: como deadlocks em recursos comuns são raros e o custo de preveni-los é alto, os sistemas de propósito geral simplesmente ignoram."},{"tema":"Entrada, Saída e Deadlocks","q":"Qual técnica de E/S transfere dados diretamente entre o dispositivo e a memória, sem passar pela CPU?","op":["DMA","Polling","Interrupção","Buffering"],"r":0,"exp":"O DMA (Direct Memory Access) libera a CPU durante a transferência, avisando-a apenas ao final. É essencial em disco, rede e vídeo."},{"tema":"Memória de Massa, Discos e RAID","q":"O tempo de acesso a um disco rígido é composto por:","op":["Apenas o tempo de leitura do setor","Tempo de compilação e tempo de execução","Latência de rede e tempo de resposta","Tempo de busca, latência rotacional e tempo de transferência"],"r":3,"exp":"Tempo de busca é mover o braço até a trilha; latência rotacional é esperar o setor girar até a cabeça; e então ocorre a transferência dos dados."},{"tema":"Memória de Massa, Discos e RAID","q":"O que é um cilindro em um disco rígido?","op":["Uma fatia da trilha, a menor unidade endereçável","O conjunto formado pela mesma trilha em todos os pratos empilhados","O motor que gira os pratos","A área reservada para o sistema de arquivos"],"r":1,"exp":"O cilindro é o conjunto das trilhas de mesma posição em todos os pratos — todas acessíveis sem mover o braço. A fatia da trilha é o setor."},{"tema":"Memória de Massa, Discos e RAID","q":"Qual nível de RAID oferece máximo desempenho, mas NENHUMA redundância?","op":["RAID 1","RAID 5","RAID 6","RAID 0"],"r":3,"exp":"RAID 0 faz apenas striping: divide os dados entre os discos, aproveitando 100% da capacidade. Se um disco falha, todo o conjunto é perdido."},{"tema":"Memória de Massa, Discos e RAID","q":"Qual o número mínimo de discos e a tolerância a falhas do RAID 5?","op":["2 discos, tolera 1 falha","3 discos, tolera 1 falha","3 discos, tolera 2 falhas","4 discos, tolera 2 falhas"],"r":1,"exp":"RAID 5 exige no mínimo 3 discos e tolera a falha de 1, com paridade distribuída entre todos. Quem tolera 2 falhas é o RAID 6, com no mínimo 4 discos."},{"tema":"Memória de Massa, Discos e RAID","q":"Qual percentual da capacidade total é aproveitado no RAID 1?","op":["100%","75%","50%","25%"],"r":2,"exp":"No espelhamento, metade dos discos guarda a cópia idêntica da outra metade — logo, apenas 50% da capacidade fica disponível. O RAID 10 tem o mesmo aproveitamento."},{"tema":"Memória de Massa, Discos e RAID","q":"Como o dado de um disco que falhou é reconstruído em um RAID com paridade?","op":["Copiando de um backup automático interno","Fazendo XOR entre os bits dos discos restantes","Somando os valores dos demais discos","Recuperando de um disco reserva pré-gravado"],"r":1,"exp":"A paridade é calculada por XOR. Como o XOR é reversível, basta aplicá-lo entre os discos sobreviventes para recuperar o conteúdo do disco perdido."},{"tema":"Memória de Massa, Discos e RAID","q":"É correto afirmar que um sistema RAID dispensa a realização de backups?","op":["Sim, o RAID já é um backup automático","Sim, desde que seja RAID 6 ou superior","Não — o RAID protege contra falha de disco, mas não contra exclusão acidental, corrupção ou ransomware","Não, porque o RAID só funciona com HDs, não com SSDs"],"r":2,"exp":"RAID garante disponibilidade diante de falha física. Se um arquivo é apagado ou criptografado por ransomware, a alteração é replicada em todos os discos imediatamente."},{"tema":"Sistemas de Arquivos","q":"Qual método de alocação de arquivos é usado pelo inode do Unix?","op":["Contígua","Encadeada","Aleatória","Indexada"],"r":3,"exp":"A alocação indexada guarda em um bloco de índice os endereços de todos os blocos do arquivo — permitindo acesso direto sem fragmentação externa. É o modelo do inode."},{"tema":"Sistemas de Arquivos","q":"Para que serve o journaling em um sistema de arquivos?","op":["Registrar previamente as operações para recuperar a consistência após uma queda de energia","Compactar os arquivos para economizar espaço","Criptografar o conteúdo dos arquivos","Indexar os arquivos para acelerar a busca"],"r":0,"exp":"O diário permite ao sistema, após uma falha, consultar o que estava em andamento e restaurar a consistência sem varrer todo o disco. NTFS e ext4 usam journaling."},{"tema":"Sistemas de Arquivos","q":"Qual a principal limitação do sistema de arquivos FAT32?","op":["Não suporta nomes longos de arquivo","Só funciona em discos de até 1 GB","Não é reconhecido pelo Windows","Não armazena arquivos maiores que 4 GB"],"r":3,"exp":"O limite de 4 GB por arquivo é a restrição mais conhecida do FAT32 — e a razão pela qual o exFAT foi criado para pen drives e cartões."},{"tema":"Sistemas de Arquivos","q":"No Linux, o comando chmod 755 concede quais permissões?","op":["Dono rw-, grupo rw-, outros r--","Dono rwx, grupo rwx, outros rwx","Dono rwx, grupo r-x, outros r-x","Dono r--, grupo r--, outros r--"],"r":2,"exp":"Os direitos valem r=4, w=2, x=1. Assim 7 = 4+2+1 = rwx para o dono, e 5 = 4+1 = r-x para grupo e outros."},{"tema":"Windows, Linux e Aplicações","q":"Quem supervisiona o desenvolvimento do kernel do Linux?","op":["A Microsoft","Linus Torvalds","A Free Software Foundation","A Canonical"],"r":1,"exp":"O kernel do Linux é desenvolvido pela comunidade, e Linus Torvalds — seu criador — supervisiona esse desenvolvimento."},{"tema":"Windows, Linux e Aplicações","q":"Sobre a distribuição do Linux, é correto afirmar que:","op":["É sempre gratuito, sem exceção","Só pode ser adquirido comercialmente","Não pode ser distribuído em revistas e livros","Pode ser obtido gratuitamente, mas também existem versões pagas, normalmente mais baratas que o Windows"],"r":3,"exp":"O Linux pode ser distribuído por revistas, livros e download gratuitamente; existem também versões pagas com suporte comercial, em geral mais baratas que as do Windows."},{"tema":"Windows, Linux e Aplicações","q":"Qual destas NÃO é uma funcionalidade típica de um sistema operacional?","op":["Compilação do código-fonte dos aplicativos do usuário","Gerência de processos e de memória","Gerência de arquivos e de dispositivos de E/S","Segurança e controle de acesso"],"r":0,"exp":"Compilar é tarefa do compilador, uma ferramenta de desenvolvimento — não do sistema operacional, que gerencia recursos e oferece serviços aos programas já compilados."},{"tema":"Windows, Linux e Aplicações","q":"Qual a diferença entre um hipervisor tipo 1 e um tipo 2?","op":["O tipo 1 roda diretamente sobre o hardware; o tipo 2 roda sobre um sistema operacional hospedeiro","O tipo 1 é gratuito e o tipo 2 é pago","O tipo 1 só virtualiza Linux e o tipo 2 só Windows","Não há diferença técnica, apenas comercial"],"r":0,"exp":"Tipo 1 (bare metal): ESXi, Hyper-V — roda direto no hardware, com melhor desempenho. Tipo 2: VirtualBox, VMware Workstation — roda como aplicativo sobre um SO hospedeiro."},{"tema":"Windows, Linux e Aplicações","q":"Por que contêineres são mais leves que máquinas virtuais?","op":["Porque compartilham o kernel do sistema hospedeiro, isolando apenas o espaço de usuário","Porque usam menos espaço em disco para os arquivos de log","Porque não permitem executar aplicações completas","Porque rodam apenas em processadores ARM"],"r":0,"exp":"A máquina virtual carrega um sistema operacional convidado inteiro; o contêiner reaproveita o kernel do hospedeiro e isola só o espaço de usuário — sobe em segundos e ocupa muito menos."},{"tema":"Sistemas de Arquivos","q":"Qual é a principal desvantagem da alocação contígua de arquivos?","op":["Sofre fragmentação externa e dificulta o crescimento do arquivo já gravado","Torna o acesso direto praticamente inviável, pois é preciso percorrer bloco a bloco","Consome um bloco extra por arquivo apenas para guardar endereços","Impede o armazenamento de metadados como datas e permissões"],"r":0,"exp":"Na alocação contígua os blocos ficam em sequência, o que dá leitura rápida, mas sobram lacunas pequenas entre os arquivos (fragmentação externa) e não há espaço adjacente para o arquivo crescer. Percorrer bloco a bloco é o problema da alocação encadeada, e o bloco extra de endereços é o custo da indexada."}],"discursivas":[{"tema":"Gerência de Processos e Escalonamento","q":"Explique a diferença entre processo e thread e aponte as vantagens do uso de threads.","r":"Processo é um programa em execução — a unidade básica de trabalho do sistema — com seu próprio espaço de endereçamento, contendo código, dados, pilha e heap, além do PCB onde o SO guarda seu estado. Thread é um fluxo de execução dentro de um processo: as threads de um mesmo processo compartilham o código, os dados e os arquivos abertos, mas cada uma mantém sua própria pilha, seus registradores e seu contador de programa. As vantagens de usar threads são: criação e troca de contexto muito mais baratas do que entre processos, já que não é preciso trocar o espaço de endereçamento; comunicação direta e rápida entre elas, pois a memória é compartilhada e dispensa mecanismos de comunicação entre processos; melhor tempo de resposta, porque enquanto uma thread bloqueia esperando E/S outra continua trabalhando; e paralelismo real em máquinas multicore, com threads diferentes executando em núcleos diferentes. O custo é a necessidade de sincronização — mutexes, semáforos e monitores — já que o acesso concorrente à memória compartilhada pode gerar condições de corrida, e um erro grave em uma thread pode derrubar o processo inteiro."},{"tema":"Gerência de Memória e Memória Virtual","q":"Explique o funcionamento da memória virtual e o que é o thrashing.","r":"A memória virtual é uma combinação de espaço em disco rígido e RAM que funciona como a memória disponível aos processos, permitindo que eles usem mais memória do que existe fisicamente instalada. O espaço lógico do processo é dividido em blocos de tamanho fixo chamados páginas, e a memória física é dividida em quadros do mesmo tamanho. Apenas as páginas efetivamente necessárias são carregadas na RAM; as demais permanecem no disco. A tabela de páginas mantém o mapeamento entre páginas e quadros, e a MMU faz a tradução dos endereços em hardware. Quando o processo acessa uma página que não está na memória física, ocorre uma falta de página (page fault): o SO interrompe o processo, busca a página no disco, escolhe — se necessário — uma página vítima para remover, usando algoritmos como FIFO, LRU ou segunda chance, e retoma a execução. O thrashing ocorre quando há processos demais competindo por memória insuficiente: cada um precisa constantemente de páginas que acabaram de ser retiradas, e o sistema entra num ciclo em que gasta mais tempo movendo páginas entre disco e RAM do que executando instruções úteis. O desempenho despenca, e a solução é reduzir o grau de multiprogramação ou aumentar a memória física."},{"tema":"Entrada, Saída e Deadlocks","q":"Descreva as quatro condições necessárias para a ocorrência de um deadlock e explique as estratégias de tratamento.","r":"Um deadlock ocorre quando dois ou mais processos ficam bloqueados indefinidamente, cada um esperando um recurso que outro do grupo mantém. As quatro condições de Coffman precisam ocorrer simultaneamente: (1) exclusão mútua — o recurso só pode ser usado por um processo por vez; (2) posse e espera — o processo mantém a posse de um recurso enquanto solicita outro; (3) não preempção — o recurso não pode ser retirado à força, só liberado voluntariamente por quem o detém; (4) espera circular — existe uma cadeia fechada de processos, cada um esperando um recurso que o próximo da cadeia possui. As estratégias de tratamento são quatro. A prevenção ataca o projeto do sistema para que ao menos uma das condições nunca se verifique — por exemplo, exigir que todo processo solicite os recursos em uma ordem global crescente elimina a espera circular, ou exigir que peça todos de uma vez elimina a posse e espera. O impedimento (ou anulação) avalia em tempo de execução, a cada solicitação, se conceder o recurso deixa o sistema em estado seguro, sendo o algoritmo do banqueiro o exemplo clássico. A detecção e recuperação permite que o deadlock aconteça, identifica-o periodicamente por meio de um grafo de alocação de recursos e o resolve encerrando processos ou revertendo-os a um ponto anterior. Por fim, ignorar — o chamado algoritmo do avestruz — é o que Windows e Linux fazem na prática para recursos comuns, por considerarem que a raridade do problema não justifica o custo de tratá-lo."}],"colas":[{"titulo":"Estados do processo","mnemonico":"Mnemônico: Novo → Pronto → Executando → Bloqueado → volta a Pronto → Terminado.","pontos":["Pronto: está na fila esperando a CPU. Bloqueado: está esperando E/S ou um evento.","De Bloqueado NUNCA se vai direto para Executando — passa por Pronto.","Processo é o programa em EXECUÇÃO; o programa em si é passivo, no disco.","PCB guarda tudo do processo e é o que permite a troca de contexto."]},{"titulo":"Escalonamento — quem é quem","mnemonico":"Mnemônico: FCFS é fila de banco; SJF é 'quem tem menos itens'; RR é rodízio com cronômetro.","pontos":["FCFS: primeiro a chegar. Sofre EFEITO COMBOIO — um longo segura todos.","SJF: menor primeiro. Ótimo tempo médio de espera, mas causa INANIÇÃO dos longos.","Prioridade: risco de inanição, resolvido com AGING (quem espera vai subindo).","Round Robin: cada um ganha um QUANTUM e volta pro fim da fila. É o do tempo compartilhado.","Preemptivo = o SO pode tirar a CPU antes de terminar. Não preemptivo = só quando o processo libera."]},{"titulo":"Processo x Thread","mnemonico":"Mnemônico: threads do mesmo processo COMPARTILHAM memória; processos são isolados.","pontos":["Thread tem a própria pilha, registradores e contador de programa.","Thread compartilha código, dados e arquivos abertos com as irmãs.","Criar e trocar thread é mais barato que processo.","Como compartilham memória, precisam de sincronização (mutex, semáforo)."]},{"titulo":"Fragmentação e memória virtual","mnemonico":"Mnemônico: interna sobra DENTRO do bloco; externa são buracos ENTRE os blocos.","pontos":["Partição fixa → fragmentação INTERNA. Partição variável → fragmentação EXTERNA.","Paginação elimina a fragmentação externa: páginas (lógico) ↔ quadros/frames (físico).","Page fault = a página pedida não está na RAM; o SO busca no disco.","FIFO sofre a ANOMALIA DE BELADY (mais quadros, mais faltas). LRU não sofre.","Thrashing: o sistema passa mais tempo trocando página do que executando."]},{"titulo":"As 4 condições de deadlock (Coffman)","mnemonico":"Mnemônico: \"EPNE\" → Exclusão mútua, Posse e espera, Não preempção, Espera circular. Quebrou uma, não tem deadlock.","pontos":["Exclusão mútua: um recurso, um processo por vez.","Posse e espera: segura um e pede outro.","Não preempção: não dá para tomar o recurso à força.","Espera circular: P1 espera P2, P2 espera P1.","Tratamentos: prevenir, impedir (banqueiro), detectar e recuperar, ou ignorar (algoritmo do avestruz)."]},{"titulo":"Níveis de RAID","mnemonico":"Mnemônico: 0 = velocidade e ZERO segurança; 1 = espelho; 5 = paridade (perde 1 disco); 10 = os dois.","pontos":["RAID 0: striping, mín. 2 discos, 100% da capacidade, tolera 0 falhas.","RAID 1: espelhamento, mín. 2 discos, 50% da capacidade, tolera 1 falha.","RAID 5: paridade distribuída, mín. 3 discos, perde 1 disco de capacidade, tolera 1 falha.","RAID 6: dupla paridade, mín. 4 discos, tolera 2 falhas.","RAID 10: espelha e divide, mín. 4 discos, 50%, desempenho + segurança.","Paridade é calculada por XOR — e RAID NÃO substitui backup."]}]},{"id":"gerenciamento-de-projetos","nome":"Gerenciamento de Projetos","sigla":"GP","cor":"#22c55e","corTexto":"#22c55e","corFundo":"#167f3d","periodo":1,"pasta":"Gerenciamento de Projetos","arquivos":[{"nome":"5 coisas difíceis de aceitar, mas que farão você um líder melhor - Economia SC","ext":"pdf","tam":"570 KB","href":"../Gerenciamento%20de%20Projetos/5%20coisas%20dif%C3%ADceis%20de%20aceitar%2C%20mas%20que%20far%C3%A3o%20voc%C3%AA%20um%20l%C3%ADder%20melhor%20-%20Economia%20SC.pdf"},{"nome":"A Definição do Escopo com apoio da Estrutura Analítica do Projeto (EAP) - Beware","ext":"pdf","tam":"823 KB","href":"../Gerenciamento%20de%20Projetos/A%20Defini%C3%A7%C3%A3o%20do%20Escopo%20com%20apoio%20da%20Estrutura%20Anal%C3%ADtica%20do%20Projeto%20%28EAP%29%20-%20Beware.pdf"},{"nome":"Análise do desempenho dos projetos de software com base nas melhores práticas do guia PMBOK - estudo de casos múltiplos","ext":"pdf","tam":"567 KB","href":"../Gerenciamento%20de%20Projetos/An%C3%A1lise%20do%20desempenho%20dos%20projetos%20de%20software%20com%20base%20nas%20melhores%20pr%C3%A1ticas%20do%20guia%20PMBOK%20-%20estudo%20de%20casos%20m%C3%BAltiplos.pdf"},{"nome":"Compreendendo o Impacto de Diferentes Moedas em seu Projeto – Ricardo Viana Vargas","ext":"pdf","tam":"265 KB","href":"../Gerenciamento%20de%20Projetos/Compreendendo%20o%20Impacto%20de%20Diferentes%20Moedas%20em%20seu%20Projeto%20%E2%80%93%20Ricardo%20Viana%20Vargas.pdf"},{"nome":"Conheça a evolução das memórias RAM","ext":"pdf","tam":"20.2 MB","href":"../Gerenciamento%20de%20Projetos/Conhe%C3%A7a%20a%20evolu%C3%A7%C3%A3o%20das%20mem%C3%B3rias%20RAM.pdf"},{"nome":"Cronograma Gestão de Projetos 25034 2025-1","ext":"pdf","tam":"100 KB","href":"../Gerenciamento%20de%20Projetos/Cronograma%20Gest%C3%A3o%20de%20Projetos%2025034%202025-1.pdf"},{"nome":"Destaque em gerenciamento de projetos em papel e celulose - Revista _ O Empreiteiro","ext":"pdf","tam":"2.7 MB","href":"../Gerenciamento%20de%20Projetos/Destaque%20em%20gerenciamento%20de%20projetos%20em%20papel%20e%20celulose%20-%20Revista%20_%20O%20Empreiteiro.pdf"},{"nome":"Estrutura analítica de projeto (EAP)_ o que é e como usá-la [2024] • Asana","ext":"pdf","tam":"2.0 MB","href":"../Gerenciamento%20de%20Projetos/Estrutura%20anal%C3%ADtica%20de%20projeto%20%28EAP%29_%20o%20que%20%C3%A9%20e%20como%20us%C3%A1-la%20%5B2024%5D%20%E2%80%A2%20Asana.pdf"},{"nome":"Fundamento-de-Gestão-de-Projetos-Gerenciamento-de-Risco","ext":"pdf","tam":"1.2 MB","href":"../Gerenciamento%20de%20Projetos/Fundamento-de-Gest%C3%A3o-de-Projetos-Gerenciamento-de-Risco.pdf"},{"nome":"Fundamento-de-Gestão-de-Projetos-Gerenciamento-de-Tempo","ext":"pdf","tam":"2.4 MB","href":"../Gerenciamento%20de%20Projetos/Fundamento-de-Gest%C3%A3o-de-Projetos-Gerenciamento-de-Tempo.pdf"},{"nome":"Fundamento-de-Gestão-de-Projetos","ext":"pdf","tam":"1.4 MB","href":"../Gerenciamento%20de%20Projetos/Fundamento-de-Gest%C3%A3o-de-Projetos.pdf"},{"nome":"Gerenciamento_de_Projetos_Desenvolvimento_de_Projeto","ext":"pdf","tam":"5.3 MB","href":"../Gerenciamento%20de%20Projetos/Gerenciamento_de_Projetos_Desenvolvimento_de_Projeto.pdf"},{"nome":"Gerenciamento_de_Projetos_Elaboração_de_Projeto","ext":"pdf","tam":"5.5 MB","href":"../Gerenciamento%20de%20Projetos/Gerenciamento_de_Projetos_Elabora%C3%A7%C3%A3o_de_Projeto.pdf"},{"nome":"Gerenciamento_de_Projetos_Erik","ext":"pdf","tam":"5.4 MB","href":"../Gerenciamento%20de%20Projetos/Gerenciamento_de_Projetos_Erik.pdf"},{"nome":"Gerenciamento_de_Projetos_Gerenciando_Equipe","ext":"pdf","tam":"5.6 MB","href":"../Gerenciamento%20de%20Projetos/Gerenciamento_de_Projetos_Gerenciando_Equipe.pdf"},{"nome":"Gestao-de-Contratos-Orçamentos-TI-Gerenciamento-Aquisição","ext":"pdf","tam":"9.5 MB","href":"../Gerenciamento%20de%20Projetos/Gestao-de-Contratos-Or%C3%A7amentos-TI-Gerenciamento-Aquisi%C3%A7%C3%A3o.pdf"},{"nome":"Gestao-de-Contratos-Orçamentos-TI-Gerenciamento-Custos","ext":"pdf","tam":"1.9 MB","href":"../Gerenciamento%20de%20Projetos/Gestao-de-Contratos-Or%C3%A7amentos-TI-Gerenciamento-Custos.pdf"},{"nome":"Gestão de contratos de TI - Módulos 1 a 3atual","ext":"pdf","tam":"2.9 MB","href":"../Gerenciamento%20de%20Projetos/Gest%C3%A3o%20de%20contratos%20de%20TI%20-%20M%C3%B3dulos%201%20a%203atual.pdf"},{"nome":"desafio-de-integrar-diferentes-culturas-organizacionais","ext":"pdf","tam":"566 KB","href":"../Gerenciamento%20de%20Projetos/desafio-de-integrar-diferentes-culturas-organizacionais.pdf"},{"nome":"documento-registro-de-licoes-aprendidas-do-projeto","ext":"docx","tam":"778 KB","href":"../Gerenciamento%20de%20Projetos/documento-registro-de-licoes-aprendidas-do-projeto.docx"},{"nome":"fechamento-projeto","ext":"pdf","tam":"1.5 MB","href":"../Gerenciamento%20de%20Projetos/fechamento-projeto.pdf"},{"nome":"gestao-de-projeto-gerenciamento-agil","ext":"pdf","tam":"1.3 MB","href":"../Gerenciamento%20de%20Projetos/gestao-de-projeto-gerenciamento-agil.pdf"},{"nome":"licoes-aprendidas-projetos","ext":"pdf","tam":"1.9 MB","href":"../Gerenciamento%20de%20Projetos/licoes-aprendidas-projetos.pdf"},{"nome":"metodologia-agil","ext":"pdf","tam":"88 KB","href":"../Gerenciamento%20de%20Projetos/metodologia-agil.pdf"}],"links":[],"resumos":[{"tema":"Fundamentos e Ciclo de Vida do Projeto","html":"<p><b>Projeto<\/b> (PMBOK) é um <b>esforço temporário<\/b> empreendido para criar um produto, serviço ou resultado <b>exclusivo<\/b>. As duas palavras-chave são justamente essas: temporário (tem início e fim definidos) e exclusivo (o resultado é singular). O oposto é a <b>operação<\/b>: contínua e repetitiva.<\/p><p><b>Gerenciamento de projetos<\/b> é a aplicação de conhecimentos, habilidades, ferramentas e técnicas às atividades do projeto para atender aos seus requisitos.<\/p><p><b>Os 5 grupos de processos:<\/b> <b>Iniciação<\/b> (autorizar o projeto — termo de abertura) → <b>Planejamento<\/b> (definir escopo, prazo, custo e como tudo será feito) → <b>Execução<\/b> (realizar o trabalho) → <b>Monitoramento e controle<\/b> (acompanha em paralelo, do começo ao fim) → <b>Encerramento<\/b> (formalizar a aceitação e registrar lições aprendidas).<\/p><p><b>As 10 áreas de conhecimento:<\/b> Integração, Escopo, Cronograma (Tempo), Custos, Qualidade, Recursos, Comunicações, Riscos, Aquisições e Partes Interessadas.<\/p><p><b>Termo de Abertura (Project Charter):<\/b> o documento que <b>autoriza formalmente<\/b> o projeto e dá ao gerente autoridade para aplicar recursos. É a saída da iniciação.<\/p><p><b>A tripla restrição:<\/b> <b>escopo, tempo e custo<\/b>, com a <b>qualidade<\/b> no centro. Mexer em um vértice afeta os outros — cortar prazo sem mexer em escopo exige mais custo, e assim por diante.<\/p><p><b>Stakeholders (partes interessadas):<\/b> todos os que afetam ou são afetados pelo projeto — patrocinador, cliente, equipe, usuários, fornecedores, órgãos reguladores. Devem ser identificados no início e classificados por <b>poder x interesse<\/b>.<\/p><p><b>PMO<\/b> (Project Management Office): estrutura que padroniza a governança de projetos, podendo ser de suporte, de controle ou diretivo.<\/p>"},{"tema":"Escopo e EAP","html":"<p><b>Escopo do produto:<\/b> as características e funções do que será entregue. <b>Escopo do projeto:<\/b> o trabalho que precisa ser feito para entregar isso.<\/p><p><b>Processos do escopo:<\/b> planejar o gerenciamento → coletar requisitos → definir o escopo → criar a EAP → validar o escopo → controlar o escopo.<\/p><p><b>EAP / WBS<\/b> (Estrutura Analítica do Projeto / Work Breakdown Structure): a decomposição hierárquica do trabalho total em partes menores e mais gerenciáveis. É <b>orientada a entregas<\/b>, não a atividades — cada nó é um substantivo, um produto, e não um verbo.<\/p><ul><li><b>Pacote de trabalho<\/b> — o nível mais baixo da EAP, aquele que já permite estimar custo e duração com confiança<\/li><li><b>Regra dos 100%<\/b> — a EAP deve conter <b>todo<\/b> o trabalho do projeto, e apenas ele. A soma dos filhos é exatamente o pai; o que não está na EAP não faz parte do projeto<\/li><li><b>Dicionário da EAP<\/b> — detalha cada pacote: descrição, critérios de aceitação, responsável, recursos<\/li><\/ul><p>A EAP permite estimar tempo e alocar pessoas a cada tarefa, e é a base para o cronograma, o orçamento e o controle.<\/p><p><b>Declaração de escopo:<\/b> descreve o que está incluído e — igualmente importante — <b>o que está excluído<\/b>, com premissas e restrições.<\/p><p><b>Scope creep<\/b> (aumento não controlado do escopo): a adição gradual de funcionalidades sem ajuste de prazo, custo ou recursos. É uma das principais causas de fracasso, e o antídoto é o <b>controle integrado de mudanças<\/b>: toda mudança passa por solicitação formal, análise de impacto e aprovação.<\/p><p><b>Validar o escopo<\/b> é obter a aceitação formal das entregas pelo cliente — diferente de <b>controlar a qualidade<\/b>, que é verificar se a entrega atende às especificações técnicas.<\/p>"},{"tema":"Gerenciamento do Tempo e Cronograma","html":"<p><b>Processos:<\/b> definir as atividades → sequenciá-las → estimar durações → desenvolver o cronograma → controlar o cronograma.<\/p><p><b>Diagrama de rede<\/b> — mostra as dependências entre atividades. Tipos: <b>Término-Início (TI)<\/b>, a mais comum (a próxima só começa quando a anterior termina); Início-Início; Término-Término; Início-Término.<\/p><p><b>Caminho crítico (CPM):<\/b> a <b>sequência mais longa<\/b> de atividades dependentes do projeto — e portanto a que determina a <b>duração mínima<\/b>. As atividades do caminho crítico têm <b>folga zero<\/b>: qualquer atraso nelas atrasa o projeto inteiro. Pode haver mais de um caminho crítico.<\/p><p><b>Folga (float):<\/b> quanto uma atividade pode atrasar sem afetar o projeto. <b>Folga total<\/b> = sem atrasar o término do projeto; <b>folga livre<\/b> = sem atrasar a atividade seguinte.<\/p><p><b>Estimativa de três pontos (PERT):<\/b> combina o otimista (O), o mais provável (M) e o pessimista (P).<\/p><pre>Distribuição Beta:      (O + 4M + P) / 6\nDistribuição Triangular: (O + M + P) / 3<\/pre><p><b>Técnicas de compressão do cronograma:<\/b><\/p><ul><li><b>Crashing<\/b> (compressão) — acrescentar recursos às atividades do caminho crítico. Encurta o prazo <b>aumentando o custo<\/b>.<\/li><li><b>Fast tracking<\/b> (paralelismo) — executar em paralelo atividades que seriam sequenciais. Não aumenta o custo diretamente, mas <b>aumenta o risco<\/b> e o retrabalho.<\/li><\/ul><p><b>Gráfico de Gantt:<\/b> barras horizontais em uma linha do tempo — o formato mais usado para comunicar o cronograma. <b>Marcos (milestones)<\/b> são eventos de duração zero que sinalizam pontos importantes.<\/p>"},{"tema":"Custos, Aquisições e Contratos","html":"<p><b>Processos de custo:<\/b> planejar o gerenciamento → estimar os custos → determinar o orçamento → controlar os custos.<\/p><p><b>Tipos de estimativa<\/b>, da menos para a mais precisa: <b>análoga<\/b> (por analogia com projetos passados — rápida e barata, menos precisa), <b>paramétrica<\/b> (relação estatística: R$/m², horas/ponto de função), <b>bottom-up<\/b> (soma as estimativas de cada pacote de trabalho — a mais precisa e a mais cara de fazer) e <b>três pontos<\/b>.<\/p><p><b>Linha de base dos custos<\/b> = orçamento aprovado distribuído no tempo, incluindo a <b>reserva de contingência<\/b> (para riscos conhecidos). O <b>orçamento total<\/b> soma ainda a <b>reserva gerencial<\/b> (para riscos desconhecidos, fora do controle do gerente).<\/p><p><b>Gerenciamento do Valor Agregado (EVM)<\/b> — as três medidas base:<\/p><ul><li><b>VP / PV<\/b> — Valor Planejado: quanto de trabalho estava previsto até agora<\/li><li><b>VA / EV<\/b> — Valor Agregado: quanto de trabalho foi realmente entregue, medido em valor<\/li><li><b>CR / AC<\/b> — Custo Real: quanto foi efetivamente gasto<\/li><\/ul><pre>Variação de prazo   VP(SV) = VA − VP\nVariação de custo   VC(CV) = VA − CR\nÍndice de prazo    IDP(SPI) = VA / VP\nÍndice de custo    IDC(CPI) = VA / CR<\/pre><p><b>Regra de leitura:<\/b> índice &gt; 1 ou variação positiva = bom (adiantado / abaixo do orçamento); &lt; 1 ou negativa = ruim.<\/p><p><b>Tipos de contrato:<\/b><\/p><ul><li><b>Preço fixo<\/b> — valor fechado. <b>Risco maior para o fornecedor<\/b>; exige escopo bem definido.<\/li><li><b>Custos reembolsáveis<\/b> — o comprador paga os custos mais uma remuneração. <b>Risco maior para o comprador<\/b>; usado quando o escopo é incerto.<\/li><li><b>Por tempo e material (T&M)<\/b> — híbrido, cobrado por hora ou unidade. Bom para contratações pequenas ou de duração indefinida.<\/li><\/ul><p><b>Processos de aquisição:<\/b> planejar → conduzir (selecionar fornecedores) → controlar as aquisições.<\/p>"},{"tema":"Riscos","html":"<p><b>Risco<\/b> é um evento ou condição <b>incerta<\/b> que, se ocorrer, tem efeito em ao menos um objetivo do projeto. Note: risco pode ser <b>negativo (ameaça)<\/b> ou <b>positivo (oportunidade)<\/b>.<\/p><p><b>Processos:<\/b> planejar o gerenciamento → identificar os riscos → análise qualitativa → análise quantitativa → planejar as respostas → implementar as respostas → monitorar os riscos.<\/p><p><b>Análise qualitativa:<\/b> classifica os riscos por <b>probabilidade × impacto<\/b>, priorizando com uma matriz. É rápida e subjetiva. <b>Análise quantitativa:<\/b> atribui valores numéricos ao efeito — simulação de Monte Carlo, árvore de decisão, valor monetário esperado (<b>VME = probabilidade × impacto financeiro<\/b>).<\/p><p><b>Respostas a ameaças:<\/b><\/p><ul><li><b>Prevenir/eliminar<\/b> — mudar o plano para eliminar a causa (a probabilidade vai a zero)<\/li><li><b>Transferir<\/b> — passar o impacto a terceiros: seguro, garantia, terceirização<\/li><li><b>Mitigar<\/b> — reduzir a probabilidade ou o impacto a um nível aceitável<\/li><li><b>Aceitar<\/b> — não agir; ativa (com reserva de contingência) ou passiva<\/li><li><b>Escalar<\/b> — o risco está fora da alçada do projeto e sobe para a organização<\/li><\/ul><p><b>Respostas a oportunidades:<\/b> explorar (garantir que ocorra), compartilhar (parceria com quem melhor a aproveita), melhorar (aumentar probabilidade/impacto), aceitar e escalar.<\/p><p><b>Registro de riscos:<\/b> o documento vivo com cada risco identificado, sua análise, o responsável (<b>dono do risco<\/b>) e a resposta planejada. <b>Riscos residuais<\/b> permanecem após as respostas; <b>riscos secundários<\/b> surgem como consequência de uma resposta.<\/p>"},{"tema":"Equipe, Comunicação e Liderança","html":"<p><b>Modelo de Tuckman<\/b> — as fases de desenvolvimento de uma equipe: <b>formação<\/b> (as pessoas se conhecem, são educadas e dependentes do líder) → <b>conflito/tormenta<\/b> (surgem divergências sobre papéis e abordagens) → <b>normatização<\/b> (o grupo estabelece normas e passa a colaborar) → <b>desempenho<\/b> (a equipe é interdependente e produtiva) → <b>encerramento<\/b> (dispersão ao fim do projeto).<\/p><p><b>Matriz RACI<\/b> — define papéis por atividade: <b>R<\/b>esponsável (executa), <b>A<\/b>provador/<i>Accountable<\/i> (presta contas — <b>só um por atividade<\/b>), <b>C<\/b>onsultado (dá opinião, comunicação de mão dupla) e <b>I<\/b>nformado (é avisado, mão única).<\/p><p><b>Canais de comunicação:<\/b> <code>n(n−1)/2<\/code>, onde n é o número de pessoas. Com 10 pessoas são 45 canais; com 11, saltam para 55 — é o custo real de aumentar a equipe.<\/p><p><b>Tipos de comunicação:<\/b> interativa (reunião, telefone — mais eficaz para assuntos complexos), ativa/push (e-mail, relatório — enviada, sem garantia de leitura) e passiva/pull (portal, repositório — o interessado busca).<\/p><p><b>Estilos de liderança:<\/b> autocrático (o líder decide sozinho), democrático/participativo (decide com a equipe), liberal/laissez-faire (delega amplamente) e <b>situacional<\/b> (adapta o estilo ao nível de maturidade e competência de cada liderado).<\/p><p><b>Motivação:<\/b> a <b>pirâmide de Maslow<\/b> (fisiológicas, segurança, sociais, estima, autorrealização — as de baixo antes das de cima); a <b>teoria dos dois fatores de Herzberg<\/b>, que separa os <b>higiênicos<\/b> (salário, condições de trabalho, políticas — sua ausência desmotiva, mas sua presença não motiva) dos <b>motivacionais<\/b> (reconhecimento, realização, crescimento, responsabilidade); e a <b>Teoria X e Y de McGregor<\/b> (X: as pessoas evitam o trabalho e precisam de controle; Y: buscam responsabilidade e se automotivam).<\/p><p><b>Conflitos:<\/b> as técnicas de resolução são confronto/solução de problemas (a melhor — ataca a causa raiz), colaboração, compromisso (cada lado cede um pouco), suavização (enfatiza o que há em comum), retirada (adia — a pior, pois só posterga) e imposição.<\/p>"},{"tema":"Métodos Ágeis e Encerramento","html":"<p><b>Preditivo (cascata)<\/b> — escopo definido no início, entrega no fim, mudanças caras e controladas. Adequado quando os requisitos são estáveis e bem conhecidos.<\/p><p><b>Ágil<\/b> — escopo evolui, entregas incrementais em ciclos curtos, mudanças bem-vindas. Adequado quando há alta incerteza.<\/p><p><b>Manifesto Ágil (2001) — os 4 valores:<\/b> indivíduos e interações <b>mais que<\/b> processos e ferramentas; software em funcionamento <b>mais que<\/b> documentação abrangente; colaboração com o cliente <b>mais que<\/b> negociação de contratos; responder a mudanças <b>mais que<\/b> seguir um plano. O manifesto reconhece valor nos itens da direita, mas valoriza mais os da esquerda.<\/p><p><b>Scrum<\/b> — papéis: <b>Product Owner<\/b> (dono do produto, prioriza o backlog e representa o negócio), <b>Scrum Master<\/b> (facilitador, remove impedimentos, protege o processo — não é chefe) e <b>Time de Desenvolvimento<\/b> (auto-organizável e multifuncional). Artefatos: <b>Product Backlog<\/b>, <b>Sprint Backlog<\/b> e <b>Incremento<\/b>. Eventos: <b>Sprint<\/b> (o ciclo, de 1 a 4 semanas), Planning, <b>Daily<\/b> (15 min), Review (mostra o incremento aos stakeholders) e <b>Retrospective<\/b> (melhora o processo da equipe).<\/p><p><b>Kanban<\/b> — fluxo contínuo, quadro visual com colunas e <b>limite de WIP<\/b> (trabalho em progresso) para reduzir o tempo de ciclo. Não tem papéis nem iterações obrigatórias.<\/p><p><b>Encerramento do projeto:<\/b> obter a aceitação formal das entregas, encerrar contratos e aquisições, liberar recursos e a equipe, arquivar os documentos e — o mais negligenciado — registrar as <b>lições aprendidas<\/b>. Elas alimentam os <b>ativos de processos organizacionais<\/b>, e é isso que faz a organização melhorar de um projeto para o outro. O projeto deve ser formalmente encerrado mesmo quando é cancelado.<\/p>"}],"flashcards":[{"tema":"Fundamentos e Ciclo de Vida do Projeto","p":"Qual a definição de projeto segundo o PMBOK?","r":"Um esforço temporário empreendido para criar um produto, serviço ou resultado exclusivo. As duas palavras-chave são temporário (início e fim definidos) e exclusivo (resultado singular)."},{"tema":"Fundamentos e Ciclo de Vida do Projeto","p":"Qual a diferença entre projeto e operação?","r":"O projeto é temporário e gera algo exclusivo; a operação é contínua e repetitiva, mantendo o negócio funcionando."},{"tema":"Fundamentos e Ciclo de Vida do Projeto","p":"Quais são os 5 grupos de processos do gerenciamento de projetos?","r":"Iniciação, Planejamento, Execução, Monitoramento e Controle, e Encerramento. Monitoramento e controle acontece em paralelo aos demais, do começo ao fim."},{"tema":"Fundamentos e Ciclo de Vida do Projeto","p":"Qual documento autoriza formalmente o início de um projeto?","r":"O Termo de Abertura (Project Charter). Ele autoriza o projeto e confere ao gerente autoridade para aplicar recursos organizacionais."},{"tema":"Fundamentos e Ciclo de Vida do Projeto","p":"O que é a tripla restrição?","r":"Escopo, tempo e custo, com a qualidade no centro. Alterar um vértice inevitavelmente afeta os outros."},{"tema":"Fundamentos e Ciclo de Vida do Projeto","p":"Quem são os stakeholders de um projeto?","r":"Todos os que afetam ou são afetados pelo projeto: patrocinador, cliente, equipe, usuários, fornecedores e órgãos reguladores. São identificados no início e classificados por poder x interesse."},{"tema":"Escopo e EAP","p":"Qual a diferença entre escopo do produto e escopo do projeto?","r":"Escopo do produto são as características e funções do que será entregue. Escopo do projeto é o trabalho necessário para entregar esse produto."},{"tema":"Escopo e EAP","p":"O que é a EAP e a que ela é orientada?","r":"A Estrutura Analítica do Projeto é a decomposição hierárquica do trabalho total em partes menores e gerenciáveis. É orientada a ENTREGAS (substantivos), não a atividades (verbos)."},{"tema":"Escopo e EAP","p":"O que diz a regra dos 100% da EAP?","r":"A EAP deve conter todo o trabalho do projeto e apenas ele: a soma dos elementos-filhos é exatamente o elemento-pai. O que não está na EAP não faz parte do projeto."},{"tema":"Escopo e EAP","p":"O que é um pacote de trabalho?","r":"O nível mais baixo da EAP — aquele em que já é possível estimar custo e duração com confiança e atribuir um responsável."},{"tema":"Escopo e EAP","p":"O que é scope creep e como combatê-lo?","r":"O aumento não controlado do escopo: funcionalidades vão sendo acrescentadas sem ajuste de prazo, custo ou recursos. O antídoto é o controle integrado de mudanças — toda mudança passa por solicitação formal, análise de impacto e aprovação."},{"tema":"Escopo e EAP","p":"Qual a diferença entre validar o escopo e controlar a qualidade?","r":"Validar o escopo é obter a aceitação formal das entregas pelo cliente. Controlar a qualidade é verificar internamente se a entrega atende às especificações técnicas — vem antes."},{"tema":"Gerenciamento do Tempo e Cronograma","p":"O que é o caminho crítico?","r":"A sequência mais longa de atividades dependentes do projeto — e portanto a que determina sua duração mínima. Suas atividades têm folga zero."},{"tema":"Gerenciamento do Tempo e Cronograma","p":"O que acontece se uma atividade do caminho crítico atrasar?","r":"O projeto inteiro atrasa na mesma medida, porque essas atividades têm folga zero — não há margem para absorver o atraso."},{"tema":"Gerenciamento do Tempo e Cronograma","p":"Qual a diferença entre crashing e fast tracking?","r":"Crashing acrescenta recursos às atividades do caminho crítico: encurta o prazo aumentando o CUSTO. Fast tracking paraleliza atividades antes sequenciais: não eleva o custo diretamente, mas aumenta o RISCO e o retrabalho."},{"tema":"Gerenciamento do Tempo e Cronograma","p":"Qual a fórmula PERT da distribuição beta?","r":"(O + 4M + P) / 6, onde O é o otimista, M o mais provável e P o pessimista. A distribuição triangular é a média simples: (O + M + P) / 3."},{"tema":"Gerenciamento do Tempo e Cronograma","p":"O que é folga total e folga livre?","r":"Folga total: quanto a atividade pode atrasar sem atrasar o término do projeto. Folga livre: quanto pode atrasar sem atrasar a atividade imediatamente seguinte."},{"tema":"Gerenciamento do Tempo e Cronograma","p":"O que é um marco (milestone)?","r":"Um evento significativo do projeto com duração zero — não consome tempo nem recursos, apenas sinaliza que um ponto importante foi atingido."},{"tema":"Custos, Aquisições e Contratos","p":"Qual tipo de estimativa de custo é o mais preciso e por quê?","r":"A bottom-up: estima cada pacote de trabalho individualmente e soma. É a mais precisa justamente por ser detalhada — e por isso a mais cara e demorada de elaborar."},{"tema":"Custos, Aquisições e Contratos","p":"Qual a diferença entre reserva de contingência e reserva gerencial?","r":"A contingência cobre riscos conhecidos e entra na linha de base dos custos, sob controle do gerente. A gerencial cobre riscos desconhecidos, fica fora da linha de base e exige aprovação da alta administração."},{"tema":"Custos, Aquisições e Contratos","p":"O que significam VP, VA e CR no EVM?","r":"VP (Valor Planejado): quanto de trabalho estava previsto até agora. VA (Valor Agregado): quanto de trabalho foi realmente entregue, medido em valor. CR (Custo Real): quanto foi efetivamente gasto."},{"tema":"Custos, Aquisições e Contratos","p":"Como se calculam as variações de custo e de prazo?","r":"Variação de custo VC = VA − CR. Variação de prazo VP(SV) = VA − VP. Positivo é bom; negativo indica estouro de custo ou atraso."},{"tema":"Custos, Aquisições e Contratos","p":"Como se interpreta um IDC (CPI) de 0,85?","r":"IDC = VA / CR. Sendo menor que 1, o projeto está gastando mais do que o valor que entrega — está acima do orçamento. Acima de 1 seria economia."},{"tema":"Custos, Aquisições e Contratos","p":"Em qual tipo de contrato o risco é maior para o fornecedor?","r":"No de preço fixo: o valor está fechado, então qualquer custo acima do previsto sai do bolso do fornecedor. Exige escopo bem definido. Nos contratos de custos reembolsáveis o risco maior é do comprador."},{"tema":"Riscos","p":"O que é risco em gerenciamento de projetos?","r":"Um evento ou condição incerta que, se ocorrer, tem efeito em ao menos um objetivo do projeto. Pode ser negativo (ameaça) ou positivo (oportunidade)."},{"tema":"Riscos","p":"Qual a diferença entre análise qualitativa e quantitativa de riscos?","r":"A qualitativa prioriza os riscos por probabilidade x impacto usando uma matriz — rápida e subjetiva. A quantitativa atribui valores numéricos ao efeito, com Monte Carlo, árvore de decisão e valor monetário esperado."},{"tema":"Riscos","p":"Quais são as respostas possíveis a uma ameaça?","r":"Prevenir/eliminar (a probabilidade vai a zero), transferir (passar o impacto a terceiros — seguro, terceirização), mitigar (reduzir probabilidade ou impacto), aceitar (ativa com reserva, ou passiva) e escalar."},{"tema":"Riscos","p":"Qual a diferença entre mitigar e prevenir um risco?","r":"Prevenir elimina a causa: a probabilidade vai a zero. Mitigar apenas reduz a probabilidade ou o impacto a um nível aceitável — o risco continua existindo."},{"tema":"Riscos","p":"Como se calcula o Valor Monetário Esperado (VME)?","r":"VME = probabilidade × impacto financeiro. Um risco de 20% de chance com impacto de R$ 50.000 tem VME de R$ 10.000."},{"tema":"Riscos","p":"O que são riscos residuais e riscos secundários?","r":"Residuais permanecem depois de aplicadas as respostas planejadas. Secundários são novos riscos que surgem justamente como consequência da implementação de uma resposta."},{"tema":"Equipe, Comunicação e Liderança","p":"Quais são as fases do modelo de Tuckman?","r":"Formação, conflito (tormenta), normatização, desempenho e encerramento. A fase de conflito é natural e necessária — não é sinal de fracasso."},{"tema":"Equipe, Comunicação e Liderança","p":"O que significa cada letra da matriz RACI?","r":"Responsável (executa), Accountable/Aprovador (presta contas — só um por atividade), Consultado (dá opinião, comunicação de mão dupla) e Informado (é avisado, mão única)."},{"tema":"Equipe, Comunicação e Liderança","p":"Como se calcula o número de canais de comunicação?","r":"n(n−1)/2, onde n é o número de pessoas. Com 10 pessoas são 45 canais; acrescentar uma pessoa leva a 55 — o crescimento é quadrático."},{"tema":"Equipe, Comunicação e Liderança","p":"O que diz a teoria dos dois fatores de Herzberg?","r":"Os fatores higiênicos (salário, condições de trabalho, políticas) evitam a insatisfação, mas não motivam. Os fatores motivacionais (reconhecimento, realização, crescimento, responsabilidade) é que geram motivação real."},{"tema":"Equipe, Comunicação e Liderança","p":"Qual é a melhor técnica de resolução de conflitos e qual é a pior?","r":"A melhor é o confronto / solução de problemas, que ataca a causa raiz e produz solução duradoura. A pior é a retirada (afastamento), que apenas adia o problema."},{"tema":"Equipe, Comunicação e Liderança","p":"O que caracteriza a liderança situacional?","r":"O líder adapta seu estilo — de mais diretivo a mais delegador — conforme o nível de maturidade e competência de cada liderado para aquela tarefa específica."},{"tema":"Métodos Ágeis e Encerramento","p":"Quais são os quatro valores do Manifesto Ágil?","r":"Indivíduos e interações mais que processos e ferramentas; software em funcionamento mais que documentação abrangente; colaboração com o cliente mais que negociação de contratos; responder a mudanças mais que seguir um plano."},{"tema":"Métodos Ágeis e Encerramento","p":"Quais são os três papéis do Scrum?","r":"Product Owner (prioriza o backlog e representa o negócio), Scrum Master (facilita, remove impedimentos e protege o processo — não é chefe) e o Time de Desenvolvimento (auto-organizável e multifuncional)."},{"tema":"Métodos Ágeis e Encerramento","p":"Qual a diferença entre Sprint Review e Sprint Retrospective?","r":"A Review mostra o incremento pronto aos stakeholders e discute o PRODUTO. A Retrospective é interna à equipe e discute o PROCESSO — o que melhorar na forma de trabalhar."},{"tema":"Métodos Ágeis e Encerramento","p":"O que é o limite de WIP no Kanban?","r":"O limite de trabalho em progresso: a quantidade máxima de itens permitida em cada coluna. Serve para evitar que a equipe comece muitas coisas e termine poucas, reduzindo o tempo de ciclo."},{"tema":"Métodos Ágeis e Encerramento","p":"Por que registrar lições aprendidas é importante?","r":"Porque elas alimentam os ativos de processos organizacionais e permitem que a organização melhore de um projeto para o outro — é o que impede repetir os mesmos erros."},{"tema":"Métodos Ágeis e Encerramento","p":"Um projeto cancelado precisa passar pelo encerramento formal?","r":"Sim. Mesmo cancelado, é preciso encerrar contratos, liberar recursos, arquivar documentos e registrar as lições aprendidas — inclusive sobre o motivo do cancelamento."}],"questoes":[{"tema":"Fundamentos e Ciclo de Vida do Projeto","q":"Segundo o PMBOK, projeto é:","op":["Um conjunto de tarefas repetitivas executadas continuamente","Um esforço temporário empreendido para criar um produto, serviço ou resultado exclusivo","Qualquer atividade realizada por uma equipe multidisciplinar","O processo de manutenção de um sistema em produção"],"r":1,"exp":"As duas palavras-chave são temporário (início e fim definidos) e exclusivo (resultado singular). O que é contínuo e repetitivo é operação."},{"tema":"Fundamentos e Ciclo de Vida do Projeto","q":"Qual grupo de processos ocorre em PARALELO a todos os demais?","op":["Iniciação","Planejamento","Encerramento","Monitoramento e controle"],"r":3,"exp":"Monitoramento e controle acompanha o projeto do começo ao fim, comparando o realizado com o planejado e disparando ações corretivas."},{"tema":"Fundamentos e Ciclo de Vida do Projeto","q":"Qual documento autoriza formalmente o projeto e dá autoridade ao gerente?","op":["O termo de abertura (Project Charter)","A EAP","A declaração de escopo","O plano de gerenciamento do projeto"],"r":0,"exp":"O termo de abertura é a saída da iniciação: autoriza formalmente a existência do projeto e confere ao gerente autoridade para aplicar recursos organizacionais."},{"tema":"Fundamentos e Ciclo de Vida do Projeto","q":"Quantas são as áreas de conhecimento do PMBOK?","op":["5","7","10","12"],"r":2,"exp":"São 10: Integração, Escopo, Cronograma, Custos, Qualidade, Recursos, Comunicações, Riscos, Aquisições e Partes Interessadas. Os grupos de PROCESSOS é que são 5."},{"tema":"Escopo e EAP","q":"A EAP é orientada a:","op":["Atividades, descritas por verbos no infinitivo","Recursos humanos alocados","Entregas, descritas por substantivos","Marcos do cronograma"],"r":2,"exp":"A EAP decompõe ENTREGAS — cada nó é um produto ou resultado, não uma ação. O detalhamento em atividades vem depois, no gerenciamento do cronograma."},{"tema":"Escopo e EAP","q":"O que estabelece a regra dos 100% na construção da EAP?","op":["Que 100% da equipe deve participar da elaboração","Que cada pacote deve ter 100% de seu custo estimado","Que o projeto deve estar 100% planejado antes de começar","Que a EAP deve conter todo o trabalho do projeto e apenas ele"],"r":3,"exp":"A soma dos elementos-filhos equivale exatamente ao elemento-pai. Consequência prática: o que não está na EAP não faz parte do projeto."},{"tema":"Escopo e EAP","q":"O nível mais baixo da EAP, no qual já é possível estimar custo e duração com confiança, chama-se:","op":["Pacote de trabalho","Marco","Atividade","Entrega principal"],"r":0,"exp":"O pacote de trabalho é a menor unidade da EAP; a partir dele se estimam custos e durações e se atribuem responsáveis."},{"tema":"Escopo e EAP","q":"Durante um projeto, o cliente vai pedindo pequenas funcionalidades extras que são aceitas sem revisão de prazo ou orçamento. Isso é:","op":["Elaboração progressiva","Scope creep","Fast tracking","Validação de escopo"],"r":1,"exp":"Scope creep é o aumento não controlado do escopo. A elaboração progressiva é o detalhamento legítimo e planejado; a diferença está no controle formal de mudanças."},{"tema":"Escopo e EAP","q":"Qual a diferença entre validar o escopo e controlar a qualidade?","op":["Validar é a aceitação formal pelo cliente; controlar a qualidade é a verificação técnica interna","São o mesmo processo com nomes diferentes","Validar é feito pela equipe técnica; controlar a qualidade, pelo patrocinador","Validar ocorre na iniciação; controlar a qualidade, no encerramento"],"r":0,"exp":"Controlar a qualidade verifica se a entrega atende às especificações — e vem antes. Validar o escopo é obter a aceitação formal do cliente sobre as entregas concluídas."},{"tema":"Gerenciamento do Tempo e Cronograma","q":"O caminho crítico de um projeto é:","op":["A sequência mais longa de atividades dependentes, que determina a duração mínima","A sequência de atividades mais caras","O conjunto de atividades com maior risco associado","A ordem em que as entregas são aprovadas pelo cliente"],"r":0,"exp":"Sendo o caminho mais longo, ele define quanto tempo o projeto leva no mínimo. Suas atividades têm folga zero."},{"tema":"Gerenciamento do Tempo e Cronograma","q":"Qual é a folga das atividades do caminho crítico?","op":["Igual à duração da atividade","Sempre 10% do prazo total","Varia conforme os recursos alocados","Zero"],"r":3,"exp":"Folga zero é justamente o que define o caminho crítico: qualquer atraso nessas atividades atrasa o projeto inteiro."},{"tema":"Gerenciamento do Tempo e Cronograma","q":"O gerente decide alocar mais desenvolvedores às atividades do caminho crítico para entregar antes. Essa técnica é:","op":["Fast tracking","Nivelamento de recursos","Crashing","Análise de reservas"],"r":2,"exp":"Crashing é acrescentar recursos para encurtar a duração — quase sempre aumentando o custo. Fast tracking seria executar em paralelo atividades antes sequenciais."},{"tema":"Gerenciamento do Tempo e Cronograma","q":"Qual é o principal efeito colateral do fast tracking?","op":["Aumento direto do custo do projeto","Redução da qualidade das entregas por contrato","Aumento do risco e da pro
