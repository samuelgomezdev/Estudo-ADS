funções de primeira classe, closures, arrow functions, map/filter/reduce) e orientada a objetos baseada em protótipos, sendo a sintaxe class do ES6 apenas açúcar sintático; tem tipagem dinâmica e fraca. Python, criada por Guido van Rossum em 1991, é imperativa/estruturada, orientada a objetos (tudo é objeto e permite herança múltipla) e funcional (lambda, map, filter, functools.reduce e compreensões de lista); tem tipagem dinâmica e forte, é interpretada e delimita blocos por indentação."}],"colas":[{"titulo":"Os 4 paradigmas em uma linha","mnemonico":"Mnemônico: \"I Enche o Objeto Declarado\" → Imperativo, Estruturado, Orientado a objetos, Declarativo.","pontos":["Imperativo: COMO fazer, passo a passo, com estado mutável e atribuição.","Estruturado: o imperativo disciplinado — sequência, seleção e iteração, sem GOTO.","Orientado a objetos: o mundo modelado em objetos que juntam dados e comportamento.","Declarativo: O QUE quero, não como — subdivide em lógico (Prolog) e funcional (LISP/Haskell)."]},{"titulo":"Böhm-Jacopini — as 3 estruturas","mnemonico":"Mnemônico: \"SSI\" → Sequência, Seleção, Iteração. Basta isso para qualquer algoritmo.","pontos":["Sequência: um comando depois do outro.","Seleção: if / if-else / switch.","Iteração: for / while / do-while.","Consequência histórica: o GOTO se torna dispensável (Dijkstra, 1968)."]},{"titulo":"Domínios do declarativo","mnemonico":"Mnemônico: \"IA e BD\" — Prolog para IA, SQL para banco de dados.","pontos":["Inteligência Artificial: regras e lógica → Prolog.","Acesso a informação em banco de dados: consulta e manipulação → SQL.","As duas áreas que impulsionaram novos paradigmas: IA e WWW."]},{"titulo":"Agregação x Composição","mnemonico":"Mnemônico: losango VAZIO = a parte VIVE sem o todo; losango CHEIO = a parte MORRE com o todo.","pontos":["Agregação ◇: Departamento ◇ Funcionário — existência independente.","Composição ◆: Pedido ◆ ItemPedido — existência dependente.","Generalização: de baixo para cima (extrai o comum).","Especialização: de cima para baixo (refina em subclasses)."]},{"titulo":"Sobrecarga x Sobreposição","mnemonico":"Mnemônico: sobreCARGA = CARREGA parâmetros diferentes; sobrePOSIÇÃO = POSICIONA por cima, na herança.","pontos":["Sobrecarga (overload): MESMA classe, mesmo nome, assinaturas DIFERENTES. Estático, em compilação.","Sobreposição (override): exige HERANÇA, MESMA assinatura, comportamento diferente. Dinâmico, em execução.","Java não tem herança múltipla de classes; C++ e Python têm."]},{"titulo":"Classe abstrata x Interface","mnemonico":"Mnemônico: abstrata = \"É UM\" com código pronto; interface = \"É CAPAZ DE\", só contrato.","pontos":["Abstrata: não instancia, pode ter métodos concretos E abstratos, PODE ter construtor e atributos.","Abstrata: herança simples em Java — só uma por classe.","Interface: só o contrato, sem estado nem construtor; a classe implementa QUANTAS quiser.","Interface tradicional exige implementar TODOS os métodos."]},{"titulo":"Os pilares do funcional","mnemonico":"Mnemônico: \"PITI\" → função Pura, Imutabilidade, Transparência referencial, funções de primeira classe (Instrumento).","pontos":["Função pura: mesma entrada → mesma saída, sem efeito colateral, sem estado (stateless).","Transparência referencial: posso trocar a chamada pelo resultado sem mudar o programa.","Imutabilidade: valor atribuído não muda mais. Custo: mais memória.","Sem estado → sem laços: a repetição vira RECURSÃO."]},{"titulo":"Primeira classe x Ordem superior","mnemonico":"Mnemônico: primeira classe é o que a LINGUAGEM permite; ordem superior é o que a FUNÇÃO faz.","pontos":["Primeira classe: função pode ser atribuída, passada, retornada e guardada em estrutura de dados.","Ordem superior: função que RECEBE função e/ou RETORNA função.","map: transforma (mesmo tamanho) | filter: seleciona (menor ou igual) | reduce: acumula em um valor."]},{"titulo":"Cálculo lambda — o essencial","mnemonico":"Mnemônico: Church : funcional :: Turing : imperativo — modelos equivalentes.","pontos":["Alonzo Church, década de 1930. Só 3 construções: variável, abstração (λx.E) e aplicação (F A).","Redução β: substitui o parâmetro pelo argumento — é a execução. α renomeia, η equivale funções.","Expressão totalmente reduzida = forma normal.","LISP (1959, John McCarthy, MIT): primeira linguagem funcional pura."]},{"titulo":"Currying","mnemonico":"Mnemônico: homenagem a Haskell CURRY — quebra n parâmetros em n funções de 1 parâmetro.","pontos":["int,int -> int  vira  int -> int -> int.","add(1,2) vira add(1)(2). Permite aplicação parcial: const mais5 = add(5).","Depende de CLOSURE — a função interna lembra o ambiente onde nasceu.","Suporte nativo: Haskell, ML e JavaScript."]},{"titulo":"Functor → Applicative → Monad","mnemonico":"Mnemônico: Functor mapeia, Applicative aplica função embrulhada, Monad encadeia e ACHATA.","pontos":["Functor: map/fmap — aplica função normal ao valor dentro do contexto.","Applicative: ap — a função também está dentro do contexto.","Monad: bind/flatMap — encadeia funções que já devolvem contexto, sem aninhar.","Hierarquia: todo Monad é Applicative; todo Applicative é Functor."]},{"titulo":"Multiparadigma — quem é quem","mnemonico":"Mnemônico: F# = .NET funcional; JS = protótipos; Python = indentação e herança múltipla.","pontos":["F#: Don Syme, 2005, Microsoft Research, .NET. Funcional + imperativo + OO. let imutável, mutable para alterar.","JavaScript: Brendan Eich, 1995, ECMAScript. OO por PROTÓTIPOS; class do ES6 é açúcar sintático.","Python: Guido van Rossum, 1991. Tipagem dinâmica e FORTE, permite herança múltipla, blocos por indentação.","Fortran (1954): primeira linguagem de alto nível. C influenciou Java e C#."]}]},{"id":"producao-de-jogos","nome":"Produção de Jogos","sigla":"PJ","cor":"#f97316","corTexto":"#f97316","corFundo":"#ba5610","periodo":0,"pasta":"Produção de Jogos","arquivos":[{"nome":"CONCEITOSBSICOSSOBREPROGRAMAOProgramaoOrientadaaObjetosPOO","ext":"pdf","tam":"100 KB","href":"../Produ%C3%A7%C3%A3o%20de%20Jogos/CONCEITOSBSICOSSOBREPROGRAMAOProgramaoOrientadaaObjetosPOO.pdf"},{"nome":"Experiência-criativa-produção-de-jogos-com-GameMaker-HackInPlan","ext":"pdf","tam":"12.8 MB","href":"../Produ%C3%A7%C3%A3o%20de%20Jogos/Experi%C3%AAncia-criativa-produ%C3%A7%C3%A3o-de-jogos-com-GameMaker-HackInPlan.pdf"},{"nome":"Experiência-criativa-produção-de-jogos-com-GameMaker","ext":"pdf","tam":"3.9 MB","href":"../Produ%C3%A7%C3%A3o%20de%20Jogos/Experi%C3%AAncia-criativa-produ%C3%A7%C3%A3o-de-jogos-com-GameMaker.pdf"},{"nome":"Gamemaker-trello","ext":"pdf","tam":"13.2 MB","href":"../Produ%C3%A7%C3%A3o%20de%20Jogos/Gamemaker-trello.pdf"}],"links":[],"resumos":[{"tema":"Fundamentos de Game Design","html":"<p><b>Jogo<\/b> é um sistema em que os jogadores enfrentam um <b>conflito artificial<\/b>, definido por <b>regras<\/b>, que resulta em um <b>desfecho quantificável<\/b> (Salen e Zimmerman). Os elementos essenciais são: objetivo, regras, desafio, interação e feedback.<\/p><p><b>Tétrade elementar<\/b> (Jesse Schell) — todo jogo se compõe de quatro elementos igualmente importantes:<\/p><ul><li><b>Mecânica<\/b> — as regras e procedimentos: o que o jogador pode fazer e o que acontece em resposta<\/li><li><b>História<\/b> — a narrativa e a sequência de eventos<\/li><li><b>Estética<\/b> — como o jogo se vê, se ouve e se sente; é o que o jogador percebe primeiro<\/li><li><b>Tecnologia<\/b> — os meios que tornam tudo possível; é o que o jogador percebe por último<\/li><\/ul><p><b>MDA<\/b> (Mecânica, Dinâmica, Estética): a <b>mecânica<\/b> é o que o designer escreve; a <b>dinâmica<\/b> é o comportamento que emerge quando o jogador interage com a mecânica; a <b>estética<\/b> é a resposta emocional resultante. O designer projeta da esquerda para a direita; o jogador experimenta da direita para a esquerda.<\/p><p><b>Loop de jogo (gameplay loop)<\/b> — o ciclo de ações que o jogador repete: perceber → decidir → agir → receber feedback. Um loop central satisfatório é o que sustenta o jogo.<\/p><p><b>Curva de dificuldade e Flow<\/b> (Csikszentmihalyi): o estado de imersão ocorre quando o <b>desafio<\/b> está equilibrado com a <b>habilidade<\/b> do jogador. Desafio muito acima da habilidade gera <b>ansiedade<\/b>; muito abaixo gera <b>tédio<\/b>. Como a habilidade cresce com o tempo, a dificuldade precisa crescer junto.<\/p><p><b>Balanceamento:<\/b> ajustar valores e regras para que nenhuma estratégia seja dominante e o jogo permaneça justo e interessante.<\/p><p><b>Gêneros:<\/b> ação, aventura, RPG, estratégia, simulação, puzzle, plataforma, esportes, corrida, roguelike, sandbox, MOBA, battle royale e jogos sérios (educacionais e de treinamento).<\/p>"},{"tema":"Programação Orientada a Objetos em Jogos","html":"<p>A POO é o paradigma dominante no desenvolvimento de jogos porque o próprio domínio é naturalmente povoado de <b>objetos<\/b>: personagens, inimigos, projéteis, itens, cenários.<\/p><p><b>Conceitos aplicados:<\/b><\/p><ul><li><b>Classe e objeto<\/b> — a classe <code>Inimigo<\/code> define atributos (vida, velocidade, dano) e métodos (mover, atacar, morrer); cada inimigo na tela é uma <b>instância<\/b><\/li><li><b>Encapsulamento<\/b> — a vida do personagem é privada e só muda por <code>receberDano()<\/code>, que aplica as regras (armadura, invulnerabilidade temporária)<\/li><li><b>Herança<\/b> — <code>Personagem<\/code> → <code>Jogador<\/code> e <code>Inimigo<\/code> → <code>Chefe<\/code>, reaproveitando comportamento comum<\/li><li><b>Polimorfismo<\/b> — todos os inimigos têm <code>atacar()<\/code>, mas cada tipo implementa à sua maneira; o motor chama o método sem saber o tipo concreto<\/li><li><b>Abstração<\/b> — modelar só o que importa para o jogo: o inimigo tem vida e dano, não tem sistema circulatório<\/li><\/ul><p><b>Composição sobre herança:<\/b> em jogos, hierarquias profundas de herança se tornam rígidas rapidamente (o que fazer com um inimigo que voa e nada?). Por isso os motores modernos adotam o padrão <b>Entidade-Componente-Sistema (ECS)<\/b>: a entidade é apenas um identificador, os componentes são dados (Posição, Sprite, Vida, Física) e os sistemas são a lógica que opera sobre quem tem determinados componentes.<\/p><p><b>Padrões de projeto comuns em jogos:<\/b> <b>Singleton<\/b> (gerenciador de áudio, de cena), <b>Observer<\/b> (eventos: o placar escuta o evento \"inimigo morreu\"), <b>State<\/b> (máquina de estados do personagem: parado, correndo, pulando, atacando), <b>Object Pool<\/b> (reaproveitar projéteis em vez de criar e destruir o tempo todo, evitando pausas do coletor de lixo) e <b>Factory<\/b> (criação de inimigos).<\/p><p><b>Game loop<\/b> — o laço principal que roda continuamente: <b>processar entrada<\/b> → <b>atualizar<\/b> (update: física, IA, colisões, regras) → <b>renderizar<\/b> (draw). O <b>delta time<\/b> (tempo decorrido desde o último quadro) é usado nos cálculos de movimento para que o jogo se comporte igual em máquinas de FPS diferentes.<\/p>"},{"tema":"GameMaker e Ferramentas","html":"<p><b>GameMaker<\/b> (YoYo Games) é uma engine 2D voltada à criação rápida de jogos, muito usada no ensino por reduzir a barreira de entrada sem esconder a lógica de programação.<\/p><p><b>Conceitos centrais do GameMaker:<\/b><\/p><ul><li><b>Sprite<\/b> — a imagem ou animação do objeto<\/li><li><b>Object<\/b> — a entidade programável, com seus eventos e comportamentos (equivale à classe)<\/li><li><b>Instance<\/b> — a cópia do object colocada na sala (equivale ao objeto/instância)<\/li><li><b>Room<\/b> — a cena, fase ou tela do jogo<\/li><li><b>Events<\/b> — os gatilhos: <b>Create<\/b> (ao criar a instância), <b>Step<\/b> (a cada quadro), <b>Draw<\/b> (ao desenhar), <b>Collision<\/b>, <b>Alarm<\/b> (temporizador), <b>Keyboard/Mouse<\/b>, <b>Destroy<\/b><\/li><li><b>Actions<\/b> / <b>GML<\/b> — as ações em blocos visuais (drag and drop) ou o código na linguagem <b>GameMaker Language<\/b><\/li><\/ul><p><b>Variáveis importantes:<\/b> <code>x<\/code> e <code>y<\/code> (posição), <code>hspeed<\/code> e <code>vspeed<\/code>, <code>sprite_index<\/code>, <code>image_index<\/code>, <code>depth<\/code> (ordem de desenho — menor valor fica na frente), <code>room_speed<\/code>.<\/p><p><b>Outras engines:<\/b> <b>Unity<\/b> (C#, 2D e 3D, multiplataforma, maior ecossistema), <b>Unreal Engine<\/b> (C++ e Blueprints visuais, referência em gráficos 3D), <b>Godot<\/b> (aberta e gratuita, GDScript), <b>Construct<\/b> e <b>Scratch<\/b> (introdutórias, sem código), <b>Greenfoot<\/b> (Java educacional, usada para ensinar POO com objetos visuais) e <b>RPG Maker<\/b>.<\/p><p><b>Greenfoot<\/b> merece nota: é um ambiente em Java criado para ensinar programação orientada a objetos de forma visual — o aluno enxerga classes, objetos, herança e métodos operando em um mundo bidimensional, o que torna concretos conceitos habitualmente abstratos.<\/p><p><b>Trello e organização:<\/b> um quadro Kanban simples — Backlog, A fazer, Fazendo, Teste, Concluído — cobre bem a produção de um jogo pequeno, com cartões por funcionalidade, arte ou correção, checklists de critérios de aceitação e etiquetas por área (arte, código, som, design).<\/p>"},{"tema":"Processo de Produção de Jogos","html":"<p><b>Fases da produção:<\/b><\/p><ol><li><b>Conceito<\/b> — a ideia central, o gênero, o público-alvo e o <b>pitch<\/b> (a descrição do jogo em uma frase)<\/li><li><b>Pré-produção<\/b> — <b>GDD<\/b> (Game Design Document), protótipo jogável, definição de escopo e de tecnologia<\/li><li><b>Produção<\/b> — construção de fato: código, arte, som, níveis, com iterações constantes<\/li><li><b>Testes<\/b> — QA (busca de defeitos) e <b>playtesting<\/b> (observar jogadores reais para avaliar diversão, clareza e dificuldade)<\/li><li><b>Lançamento<\/b> — publicação, marketing e distribuição (Steam, itch.io, lojas de aplicativos, consoles)<\/li><li><b>Pós-lançamento<\/b> — correções, atualizações, conteúdo adicional e comunidade<\/li><\/ol><p><b>GDD<\/b> — o documento vivo do jogo: conceito e pitch, público-alvo, gênero, mecânicas centrais, personagens, narrativa, níveis, arte e som, interface, controles, monetização e cronograma. Deve ser atualizado, não engavetado.<\/p><p><b>Vertical slice<\/b> — uma fatia pequena do jogo, mas completa e com qualidade final, que demonstra a experiência real. É o que se apresenta a publishers e investidores.<\/p><p><b>Papéis na equipe:<\/b> game designer (regras e experiência), programador, artista (conceito, 2D, 3D, animação), sound designer e compositor, level designer, produtor (prazo, escopo, equipe), QA tester e roteirista.<\/p><p><b>Playtesting<\/b> é distinto do teste de QA: o QA procura <b>defeitos<\/b>; o playtesting avalia se o jogo é <b>divertido, claro e bem dosado<\/b>. O erro clássico é o designer explicar o jogo ao testador — deve-se observar em silêncio, porque no lançamento não haverá ninguém para explicar.<\/p><p><b>Escopo<\/b> é o maior inimigo do jogo independente: a ambição costuma superar em muito o tempo e a equipe disponíveis. <b>Game jams<\/b> (produzir um jogo em 48 ou 72 horas) ensinam disciplina de escopo e a fechar o ciclo completo de produção.<\/p><p><b>Monetização:<\/b> venda direta (preço fixo), free-to-play com microtransações, assinatura, publicidade, DLC e expansões, e financiamento coletivo. <b>Pay-to-win<\/b> — vender vantagem competitiva — é amplamente criticado por quebrar o equilíbrio e a percepção de justiça do jogo.<\/p>"}],"flashcards":[{"tema":"Fundamentos de Game Design","p":"Como Salen e Zimmerman definem jogo?","r":"Um sistema em que os jogadores enfrentam um conflito artificial, definido por regras, que resulta em um desfecho quantificável."},{"tema":"Fundamentos de Game Design","p":"Quais são os quatro elementos da tétrade elementar de Jesse Schell?","r":"Mecânica (regras e procedimentos), História (narrativa), Estética (como se vê, ouve e sente) e Tecnologia (os meios que viabilizam tudo). Os quatro são igualmente importantes."},{"tema":"Fundamentos de Game Design","p":"Na tétrade elementar, qual elemento o jogador percebe primeiro e qual percebe por último?","r":"Primeiro a estética, que é imediatamente visível e audível; por último a tecnologia, que idealmente permanece invisível para ele."},{"tema":"Fundamentos de Game Design","p":"O que significa MDA?","r":"Mecânica (o que o designer escreve), Dinâmica (o comportamento que emerge da interação do jogador com a mecânica) e Estética (a resposta emocional resultante). O designer projeta nessa ordem; o jogador experimenta na ordem inversa."},{"tema":"Fundamentos de Game Design","p":"O que é o gameplay loop?","r":"O ciclo de ações que o jogador repete continuamente: perceber a situação → decidir → agir → receber feedback. Um loop central satisfatório é o que sustenta o jogo inteiro."},{"tema":"Fundamentos de Game Design","p":"O que é o estado de flow em jogos?","r":"A imersão que ocorre quando o desafio está equilibrado com a habilidade do jogador. Desafio muito acima da habilidade gera ansiedade; muito abaixo gera tédio."},{"tema":"Fundamentos de Game Design","p":"Por que a curva de dificuldade precisa ser crescente?","r":"Porque a habilidade do jogador aumenta ao longo da partida. Se a dificuldade permanecer constante, o desafio cai relativamente à habilidade e o jogo entra na zona do tédio."},{"tema":"Fundamentos de Game Design","p":"O que é balanceamento em um jogo?","r":"O ajuste de valores e regras para que nenhuma estratégia seja dominante e o jogo permaneça justo e interessante — nem trivial, nem impossível."},{"tema":"Programação Orientada a Objetos em Jogos","p":"Por que a POO é natural no desenvolvimento de jogos?","r":"Porque o domínio já é povoado de objetos com estado e comportamento — personagens, inimigos, projéteis, itens e cenários mapeiam diretamente em classes e instâncias."},{"tema":"Programação Orientada a Objetos em Jogos","p":"Como o polimorfismo aparece em um jogo?","r":"Todos os inimigos possuem o método atacar(), mas cada tipo o implementa à sua maneira. O motor chama atacar() sem precisar saber qual é o tipo concreto do inimigo."},{"tema":"Programação Orientada a Objetos em Jogos","p":"Por que se prefere composição a herança em jogos?","r":"Porque hierarquias profundas engessam rapidamente: um inimigo que voa e nada não cabe bem em uma árvore de herança. Compondo comportamentos, qualquer combinação se torna possível."},{"tema":"Programação Orientada a Objetos em Jogos","p":"O que é o padrão ECS (Entidade-Componente-Sistema)?","r":"A entidade é apenas um identificador; os componentes são dados puros (Posição, Sprite, Vida, Física); e os sistemas contêm a lógica que opera sobre todas as entidades que possuem determinados componentes."},{"tema":"Programação Orientada a Objetos em Jogos","p":"Para que serve o padrão Object Pool em jogos?","r":"Para reaproveitar objetos frequentes como projéteis e partículas, em vez de criá-los e destruí-los constantemente — evitando pausas causadas pelo coletor de lixo e quedas de desempenho."},{"tema":"Programação Orientada a Objetos em Jogos","p":"Como o padrão Observer é usado em jogos?","r":"Para desacoplar sistemas por meio de eventos: quando um inimigo morre, ele emite um evento e o placar, as conquistas e o sistema de missões reagem sem que o inimigo precise conhecê-los."},{"tema":"Programação Orientada a Objetos em Jogos","p":"Onde se aplica o padrão State em um jogo?","r":"Na máquina de estados do personagem — parado, correndo, pulando, atacando, atingido — em que cada estado sabe como se comportar e para quais outros estados pode transitar."},{"tema":"Programação Orientada a Objetos em Jogos","p":"Quais são as três etapas do game loop?","r":"Processar a entrada do jogador → atualizar (update: física, IA, colisões, regras) → renderizar (draw). Esse ciclo se repete a cada quadro."},{"tema":"Programação Orientada a Objetos em Jogos","p":"Para que serve o delta time?","r":"É o tempo decorrido desde o quadro anterior. Multiplicando a velocidade pelo delta time, o movimento fica idêntico em máquinas com taxas de quadros diferentes."},{"tema":"GameMaker e Ferramentas","p":"No GameMaker, qual a diferença entre object e instance?","r":"O object é a entidade programável com seus eventos e comportamentos — equivale à classe. A instance é a cópia dele colocada na room — equivale ao objeto instanciado."},{"tema":"GameMaker e Ferramentas","p":"O que é uma room no GameMaker?","r":"A cena, fase ou tela do jogo — o espaço onde as instâncias são posicionadas e onde a ação acontece."},{"tema":"GameMaker e Ferramentas","p":"Quando o evento Step é executado no GameMaker?","r":"A cada quadro do jogo, continuamente — é onde vai a lógica que precisa ser verificada o tempo todo, como movimento e checagem de condições. O Create roda uma única vez, ao criar a instância."},{"tema":"GameMaker e Ferramentas","p":"Para que serve o evento Alarm no GameMaker?","r":"Funciona como temporizador: define-se um número de passos e, quando a contagem chega a zero, o evento dispara — útil para cooldowns, respawn e sequências temporizadas."},{"tema":"GameMaker e Ferramentas","p":"O que controla a variável depth no GameMaker?","r":"A ordem de desenho das instâncias. Quanto MENOR o valor de depth, mais à frente o objeto é desenhado."},{"tema":"GameMaker e Ferramentas","p":"O que é o GML?","r":"GameMaker Language, a linguagem de script da engine — alternativa ao sistema visual de arrastar e soltar, que dá controle completo sobre a lógica do jogo."},{"tema":"GameMaker e Ferramentas","p":"O que é o Greenfoot e para que serve?","r":"Um ambiente educacional em Java criado para ensinar programação orientada a objetos de forma visual: o aluno vê classes, objetos, herança e métodos operando em um mundo bidimensional."},{"tema":"GameMaker e Ferramentas","p":"Cite as principais engines de jogos e suas linguagens.","r":"Unity (C#, 2D e 3D), Unreal Engine (C++ e Blueprints), Godot (GDScript, aberta e gratuita), GameMaker (GML, 2D), Construct e Scratch (sem código, introdutórias)."},{"tema":"Processo de Produção de Jogos","p":"Quais são as fases da produção de um jogo?","r":"Conceito, pré-produção, produção, testes, lançamento e pós-lançamento."},{"tema":"Processo de Produção de Jogos","p":"O que é o GDD?","r":"Game Design Document: o documento vivo que reúne conceito, público-alvo, gênero, mecânicas, personagens, narrativa, níveis, arte, som, interface, controles, monetização e cronograma. Deve ser atualizado, não engavetado."},{"tema":"Processo de Produção de Jogos","p":"O que é uma vertical slice?","r":"Uma fatia pequena do jogo, mas completa e com qualidade final, que demonstra a experiência real pretendida. É o que se apresenta a publishers e investidores."},{"tema":"Processo de Produção de Jogos","p":"Qual a diferença entre QA e playtesting?","r":"O QA procura defeitos — bugs, travamentos, falhas de comportamento. O playtesting avalia se o jogo é divertido, claro e bem dosado, observando jogadores reais."},{"tema":"Processo de Produção de Jogos","p":"Qual é o erro clássico ao conduzir um playtest?","r":"Explicar o jogo ao testador. No lançamento não haverá ninguém para explicar — se o jogador não entende sozinho, o problema é do jogo, e o designer precisa observar em silêncio para descobri-lo."},{"tema":"Processo de Produção de Jogos","p":"Por que o escopo é o maior inimigo do jogo independente?","r":"Porque a ambição do projeto quase sempre supera o tempo, o orçamento e a equipe disponíveis — e jogos ambiciosos demais simplesmente não são terminados."},{"tema":"Processo de Produção de Jogos","p":"O que se aprende em uma game jam?","r":"Disciplina de escopo e a experiência de fechar o ciclo completo de produção: em 48 ou 72 horas é preciso conceber, produzir e entregar algo jogável."},{"tema":"Processo de Produção de Jogos","p":"Por que o modelo pay-to-win é criticado?","r":"Porque vender vantagem competitiva quebra o equilíbrio do jogo e a percepção de justiça, esvaziando o sentido da habilidade e afastando os jogadores que não pagam."}],"questoes":[{"tema":"Fundamentos de Game Design","q":"Segundo Salen e Zimmerman, jogo é:","op":["Qualquer atividade recreativa com regras","Um sistema em que os jogadores enfrentam um conflito artificial, definido por regras, com desfecho quantificável","Um software interativo com gráficos em tempo real","Uma narrativa interativa com múltiplos finais"],"r":1,"exp":"A definição destaca três elementos: conflito artificial, regras que o delimitam e um resultado mensurável ao final."},{"tema":"Fundamentos de Game Design","q":"Quais são os quatro elementos da tétrade elementar de Jesse Schell?","op":["Mecânica, história, estética e tecnologia","Gráficos, som, controles e narrativa","Personagem, cenário, enredo e desafio","Design, arte, programação e produção"],"r":0,"exp":"Os quatro são igualmente importantes e se sustentam mutuamente — nenhum é acessório dos demais."},{"tema":"Fundamentos de Game Design","q":"Na tétrade elementar, qual elemento é o MENOS visível para o jogador?","op":["Estética","História","Tecnologia","Mecânica"],"r":2,"exp":"A tecnologia idealmente permanece invisível; a estética é o que o jogador percebe primeiro, já na primeira imagem e no primeiro som."},{"tema":"Fundamentos de Game Design","q":"No modelo MDA, o que é a dinâmica?","op":["As regras escritas pelo designer","O comportamento que emerge quando o jogador interage com as mecânicas","A resposta emocional do jogador","A tecnologia usada na renderização"],"r":1,"exp":"As mecânicas são escritas; as dinâmicas emergem do uso; as estéticas são a emoção resultante. O designer projeta nessa ordem, o jogador vivencia na ordem inversa."},{"tema":"Fundamentos de Game Design","q":"Segundo a teoria do flow, o que acontece quando o desafio está muito acima da habilidade do jogador?","op":["Ansiedade","Tédio","Imersão","Curiosidade"],"r":0,"exp":"Desafio acima da habilidade gera ansiedade e frustração; abaixo dela gera tédio. O flow ocorre no equilíbrio entre os dois."},{"tema":"Fundamentos de Game Design","q":"Por que a curva de dificuldade de um jogo precisa ser crescente?","op":["Porque a habilidade do jogador cresce, e uma dificuldade constante passaria a gerar tédio","Para aumentar o tempo total de jogo","Para justificar a venda de conteúdo adicional","Porque as engines exigem esse comportamento"],"r":0,"exp":"Como a habilidade sobe com a prática, manter a dificuldade fixa faz o desafio cair em termos relativos, tirando o jogador do estado de flow."},{"tema":"Fundamentos de Game Design","q":"O que é o gameplay loop?","op":["O laço de repetição do código que desenha a tela","O ciclo de ações que o jogador repete: perceber, decidir, agir e receber feedback","A sequência de fases do jogo","O tempo de carregamento entre cenas"],"r":1,"exp":"É o ciclo de experiência do jogador, não o laço de código — este é o game loop técnico (entrada, update, render)."},{"tema":"Programação Orientada a Objetos em Jogos","q":"Um jogo tem vários tipos de inimigo, cada um com sua forma de atacar, e o motor chama atacar() sem saber o tipo concreto. Esse é um exemplo de:","op":["Polimorfismo","Encapsulamento","Herança múltipla","Composição"],"r":0,"exp":"Polimorfismo: o mesmo método assume comportamentos diferentes conforme o tipo real do objeto, permitindo tratar todos os inimigos de forma uniforme."},{"tema":"Programação Orientada a Objetos em Jogos","q":"Por que os motores modernos preferem composição a herança profunda?","op":["Porque a herança é mais lenta em tempo de execução","Porque as linguagens de jogos não suportam herança","Porque a composição usa menos memória","Porque hierarquias profundas engessam o design — um inimigo que voa e nada não cabe bem em uma árvore única"],"r":3,"exp":"A combinação de comportamentos independentes é muito mais flexível que uma árvore rígida, e por isso o padrão ECS se tornou dominante."},{"tema":"Programação Orientada a Objetos em Jogos","q":"No padrão ECS, o que são os componentes?","op":["A lógica que processa as entidades","Os identificadores únicos de cada entidade","Dados puros associados a uma entidade, como Posição, Sprite e Vida","As cenas do jogo"],"r":2,"exp":"Entidade é apenas um identificador; componentes são dados; sistemas contêm a lógica que opera sobre quem tem determinados componentes."},{"tema":"Programação Orientada a Objetos em Jogos","q":"Qual problema o padrão Object Pool resolve em jogos?","op":["A dificuldade de criar inimigos com comportamentos diferentes","A sincronização entre cliente e servidor","As pausas causadas pela criação e destruição constante de objetos como projéteis","O balanceamento da dificuldade"],"r":2,"exp":"Reaproveitando objetos de um conjunto pré-alocado, evita-se o custo de alocação e as pausas do coletor de lixo em momentos de ação intensa."},{"tema":"Programação Orientada a Objetos em Jogos","q":"O placar é atualizado quando um inimigo morre, sem que a classe Inimigo conheça o placar. Que padrão está em uso?","op":["Singleton","Observer","Factory","State"],"r":1,"exp":"O Observer desacopla emissor e ouvintes: o inimigo emite um evento e quem se interessar reage, sem dependência direta entre eles."},{"tema":"Programação Orientada a Objetos em Jogos","q":"Qual é a sequência correta do game loop?","op":["Renderizar → processar entrada → atualizar","Atualizar → renderizar → processar entrada","Processar entrada → renderizar → atualizar","Processar entrada → atualizar → renderizar"],"r":3,"exp":"Lê-se o que o jogador fez, atualiza-se o estado do mundo (física, IA, colisões, regras) e só então se desenha o resultado."},{"tema":"Programação Orientada a Objetos em Jogos","q":"Para que serve o delta time nos cálculos de movimento?","op":["Para limitar a taxa de quadros do jogo","Para medir o tempo total de jogo","Para sincronizar a trilha sonora","Para que o movimento seja igual em máquinas com taxas de quadros diferentes"],"r":3,"exp":"Multiplicando a velocidade pelo tempo decorrido desde o último quadro, a distância percorrida por segundo fica constante independentemente do FPS."},{"tema":"GameMaker e Ferramentas","q":"No GameMaker, qual a relação entre object e instance?","op":["Object é a cópia na sala; instance é o molde","São sinônimos","Object é a imagem e instance é o comportamento","Object é a entidade programável (a classe) e instance é a cópia dela na room (o objeto)"],"r":3,"exp":"A analogia com POO é direta: object está para classe assim como instance está para objeto instanciado. A imagem é o sprite."},{"tema":"GameMaker e Ferramentas","q":"Qual evento do GameMaker é executado a cada quadro do jogo?","op":["Create","Draw","Step","Alarm"],"r":2,"exp":"O Step roda continuamente e abriga a lógica que precisa ser verificada o tempo todo. O Create roda uma única vez, ao instanciar."},{"tema":"GameMaker e Ferramentas","q":"Para que serve o evento Alarm no GameMaker?","op":["Funcionar como temporizador, disparando quando a contagem chega a zero","Detectar colisões entre instâncias","Emitir sons de alerta","Encerrar a room atual"],"r":0,"exp":"É a ferramenta padrão para cooldowns de ataque, respawn de inimigos e sequências temporizadas."},{"tema":"GameMaker e Ferramentas","q":"No GameMaker, o que acontece com uma instância cujo depth tem valor MENOR?","op":["É desenhada atrás das demais","É desenhada à frente das demais","Move-se mais rapidamente","É destruída primeiro"],"r":1,"exp":"Quanto menor o depth, mais à frente o objeto é desenhado — detalhe que costuma confundir por parecer contraintuitivo."},{"tema":"GameMaker e Ferramentas","q":"O que é o Greenfoot?","op":["Uma engine comercial para jogos 3D","Um sistema de controle de versão para jogos","Uma linguagem de script para o GameMaker","Um ambiente educacional em Java para ensinar programação orientada a objetos de forma visual"],"r":3,"exp":"No Greenfoot o aluno vê classes, objetos, herança e chamadas de método operando concretamente em um mundo bidimensional."},{"tema":"GameMaker e Ferramentas","q":"Qual linguagem é usada na engine Unity?","op":["C++","C#","GML","GDScript"],"r":1,"exp":"Unity usa C#. C++ e Blueprints são do Unreal; GML é do GameMaker; GDScript é do Godot."},{"tema":"Processo de Produção de Jogos","q":"Qual é a ordem correta das fases de produção de um jogo?","op":["Produção, conceito, testes, pré-produção e lançamento","Pré-produção, conceito, lançamento, produção e testes","Conceito, produção, lançamento, testes e pré-produção","Conceito, pré-produção, produção, testes, lançamento e pós-lançamento"],"r":3,"exp":"A pré-produção é onde nascem o GDD e o protótipo jogável, definindo escopo e tecnologia antes da produção pesada começar."},{"tema":"Processo de Produção de Jogos","q":"O que é o GDD?","op":["Um relatório final de defeitos encontrados","O contrato com a distribuidora","O Game Design Document, documento vivo que reúne conceito, mecânicas, narrativa, arte, som e cronograma","O diagrama de classes do jogo"],"r":2,"exp":"É documento vivo: precisa ser atualizado conforme o jogo evolui, e não escrito uma vez e engavetado."},{"tema":"Processo de Produção de Jogos","q":"O que é uma vertical slice?","op":["A divisão do trabalho entre as equipes de arte e programação","O corte de funcionalidades para caber no prazo","A primeira fase jogável do jogo, ainda sem arte","Uma fatia pequena do jogo, completa e com qualidade final, que demonstra a experiência real"],"r":3,"exp":"Diferentemente de um protótipo, a vertical slice tem qualidade de produto acabado — é o que convence publishers e investidores."},{"tema":"Processo de Produção de Jogos","q":"Qual a diferença entre QA e playtesting?","op":["QA é feito pelos jogadores; playtesting, pela equipe","QA busca defeitos; playtesting avalia se o jogo é divertido, claro e bem dosado","São nomes diferentes para a mesma atividade","QA ocorre após o lançamento; playtesting, antes"],"r":1,"exp":"Um jogo pode passar no QA sem nenhum bug e ainda assim ser chato ou confuso — o playtesting existe para descobrir exatamente isso."},{"tema":"Processo de Produção de Jogos","q":"Durante um playtest, o designer percebe que o jogador não entende o objetivo. O que ele deve fazer?","op":["Observar em silêncio e registrar o problema, pois no lançamento não haverá ninguém para explicar","Explicar o objetivo para que o teste possa prosseguir","Encerrar o teste e recomeçar com outro jogador","Alterar o jogo imediatamente durante a sessão"],"r":0,"exp":"Explicar contamina o teste e esconde exatamente o defeito que ele revelou. A confusão do jogador é o dado mais valioso da sessão."},{"tema":"Processo de Produção de Jogos","q":"Por que o escopo é considerado o maior inimigo do jogo independente?","op":["Porque aumenta o custo das ferramentas","Porque dificulta a escolha da engine","Porque a ambição costuma superar o tempo, o orçamento e a equipe disponíveis, e o jogo não é terminado","Porque impede a publicação em várias plataformas"],"r":2,"exp":"Jogos independentes morrem muito mais por excesso de ambição do que por falta de talento — daí o valor das game jams, que ensinam a fechar o ciclo em prazo curto."},{"tema":"Processo de Produção de Jogos","q":"Por que o modelo pay-to-win é amplamente criticado?","op":["Porque gera menos receita que a venda direta","Porque é proibido nas principais lojas de aplicativos","Porque vender vantagem competitiva quebra o equilíbrio e a percepção de justiça do jogo","Porque exige conexão constante com a internet"],"r":2,"exp":"Quando o dinheiro substitui a habilidade, o resultado da partida deixa de refletir o desempenho — e o jogo perde sentido para quem não paga."}],"discursivas":[{"tema":"Programação Orientada a Objetos em Jogos","q":"Explique como os pilares da orientação a objetos se aplicam ao desenvolvimento de um jogo e por que a composição costuma ser preferida à herança profunda.","r":"A orientação a objetos é o paradigma dominante em jogos porque o domínio já é naturalmente povoado de objetos com estado e comportamento. A abstração aparece na decisão sobre o que modelar: um inimigo precisa ter vida, velocidade e dano, mas não precisa de sistema circulatório — modela-se apenas o que importa para as regras do jogo. O encapsulamento protege a integridade do estado: a vida do personagem é um atributo privado e só muda através de um método como receberDano(), que aplica as regras de armadura, invulnerabilidade temporária e morte, impedindo que qualquer parte do código altere o valor diretamente e quebre a lógica. A herança permite reaproveitar comportamento comum, com Personagem servindo de base para Jogador e Inimigo, e Inimigo servindo de base para Chefe. E o polimorfismo é o que torna o motor genérico: todos os inimigos implementam atacar() à sua maneira, e o laço principal chama esse método sem precisar conhecer o tipo concreto de cada um. Apesar disso, hierarquias profundas de herança se revelam problemáticas em jogos. O motivo é que os comportamentos dos personagens são combinações independentes, e não uma taxonomia: se existe InimigoTerrestre e InimigoVoador, onde entra o inimigo que voa e também nada? Duplicar código ou recorrer a herança múltipla torna o design frágil, e cada nova combinação exige reescrever a árvore. A composição resolve isso ao tratar comportamentos como peças acopláveis, e sua expressão mais consolidada é o padrão Entidade-Componente-Sistema: a entidade é apenas um identificador, os componentes são dados puros como Posição, Sprite, Vida e Física, e os sistemas contêm a lógica que opera sobre todas as entidades que possuem determinados componentes. Assim, criar um inimigo que voa e nada é apenas uma questão de anexar os componentes correspondentes, sem tocar em nenhuma hierarquia."},{"tema":"Processo de Produção de Jogos","q":"Descreva as fases de produção de um jogo e explique a diferença entre QA e playtesting.","r":"A produção de um jogo percorre seis fases. No conceito, define-se a ideia central, o gênero, o público-alvo e o pitch — a descrição do jogo em uma frase capaz de comunicar sua essência. Na pré-produção, elabora-se o Game Design Document, constrói-se um protótipo jogável para validar se a mecânica central é divertida e definem-se escopo e tecnologia; é a fase mais barata para descobrir que a ideia não funciona. Na produção acontece a construção efetiva: código, arte, som e níveis, em iterações constantes. Na fase de testes, o jogo é submetido a QA e a playtesting. No lançamento, ocorrem publicação, marketing e distribuição em plataformas como Steam, itch.io, lojas de aplicativos e consoles. E no pós-lançamento vêm correções, atualizações, conteúdo adicional e a gestão da comunidade. A distinção entre QA e playtesting é frequentemente cobrada e costuma ser mal compreendida. O QA, ou garantia de qualidade, procura defeitos: bugs, travamentos, comportamentos incorretos, problemas de desempenho e falhas de compatibilidade. Sua pergunta é se o jogo funciona como especificado. O playtesting tem outro objetivo: avaliar se o jogo é divertido, se as regras são compreensíveis sem explicação e se a dificuldade está bem dosada. Sua pergunta é se o jogo é bom. Um jogo pode passar impecavelmente no QA, sem um único bug, e ainda assim ser tedioso ou incompreensível. O erro mais comum no playtesting é o designer explicar o jogo ao testador quando percebe que ele está perdido — atitude que contamina o teste e esconde justamente o problema que ele acabou de revelar, porque no lançamento não haverá ninguém ao lado do jogador para explicar. A postura correta é observar em silêncio, anotar onde a confusão surge e corrigir o jogo, não o jogador."}],"colas":[{"titulo":"Tétrade elementar (Jesse Schell)","mnemonico":"Mnemônico: MHET → Mecânica, História, Estética, Tecnologia. A ESTÉTICA é a mais visível; a TECNOLOGIA, a menos.","pontos":["Mecânica: as regras e procedimentos — o que o jogador pode fazer.","História: a narrativa e a sequência de eventos.","Estética: como o jogo se vê, se ouve e se sente. O jogador percebe PRIMEIRO.","Tecnologia: os meios que viabilizam tudo. O jogador percebe POR ÚLTIMO.","Os quatro são igualmente importantes e se sustentam mutuamente."]},{"titulo":"MDA e Flow","mnemonico":"Mnemônico: o DESIGNER projeta da mecânica para a estética; o JOGADOR experimenta no sentido inverso.","pontos":["Mecânica: o que o designer escreve. Dinâmica: o comportamento que emerge. Estética: a emoção resultante.","Flow (Csikszentmihalyi): desafio EQUILIBRADO com a habilidade.","Desafio > habilidade = ANSIEDADE. Desafio < habilidade = TÉDIO.","Como a habilidade cresce, a dificuldade precisa crescer junto.","Gameplay loop: perceber → decidir → agir → feedback."]},{"titulo":"POO aplicada a jogos","mnemonico":"Mnemônico: prefira COMPOSIÇÃO a herança — hierarquia profunda engessa (e o inimigo que voa E nada?).","pontos":["ECS: Entidade (só um id) + Componentes (dados) + Sistemas (lógica).","Object Pool: reaproveita projéteis em vez de criar/destruir — evita pausas do coletor de lixo.","Observer: o placar 'escuta' o evento 'inimigo morreu'.","State: máquina de estados do personagem (parado, correndo, pulando, atacando).","Game loop: processar entrada → UPDATE (física, IA, colisão) → RENDER.","DELTA TIME nos cálculos de movimento: o jogo fica igual em FPS diferentes."]},{"titulo":"GameMaker — o vocabulário","mnemonico":"Mnemônico: OBJECT é a classe; INSTANCE é o objeto; ROOM é a fase.","pontos":["Sprite: a imagem/animação. Object: a entidade programável. Instance: a cópia na sala.","Room: a cena/fase. GML: a linguagem do GameMaker.","Eventos: Create (ao nascer), Step (a cada quadro), Draw, Collision, Alarm (timer), Destroy.","depth: ordem de desenho — MENOR valor fica NA FRENTE.","Greenfoot: ambiente Java para ensinar POO visualmente."]},{"titulo":"Produção e playtesting","mnemonico":"Mnemônico: QA procura BUG; playtesting procura DIVERSÃO. E no playtest você fica CALADO.","pontos":["Fases: conceito → pré-produção → produção → testes → lançamento → pós-lançamento.","GDD é documento VIVO, não engavetado.","Vertical slice: fatia pequena do jogo, mas com qualidade FINAL. É o que se mostra a publisher.","Erro clássico: explicar o jogo ao testador — no lançamento não haverá ninguém para explicar.","ESCOPO é o maior inimigo do jogo independente. Game jam ensina a fechar o ciclo.","Pay-to-win: vender vantagem competitiva — quebra o equilíbrio e a percepção de justiça."]}]}],"local":false,"raiz":"Univali","gerado":"12/09/2026 21:06"};
</script>
<script>
/* Estudo ADS — UNIVALI
   Dados injetados pelo gerar.py na constante DADOS.
   Navegação por rotas em hash: #/  |  #/m/<id>  |  #/m/<id>/<aba> */
(function () {
  "use strict";

  var M = DADOS.materias;
  var byId = {};
  M.forEach(function (m) { byId[m.id] = m; });

  var ABAS = [
    ["resumo", "Resumo", function (m) { return m.resumos.length; }],
    ["cards", "Flashcards", function (m) { return m.flashcards.length; }],
    ["quiz", "Quiz", function (m) { return m.questoes.length; }],
    ["simulado", "Simulado", function (m) { return m.questoes.length >= 5 ? m.questoes.length : 0; }],
    ["disc", "Discursivas", function (m) { return m.discursivas.length; }],
    ["colas", "Colas", function (m) { return m.colas.length; }],
    ["material", "Material", function (m) { return m.arquivos.length + (m.links || []).length; }]
  ];

  // ------------------------------------------------------------ util
  function $(s, r) { return (r || document).querySelector(s); }
  function el(tag, cls, txt) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt != null) e.textContent = txt;
    return e;
  }
  // CORREÇÃO NC-13: --c continua sendo a cor da matéria para barras e bordas;
  // --ct é a versão clareada, para texto sobre o card; --cf é a escurecida, para
  // fundo de botão com texto branco. As duas saem calculadas do gerador.
  function pintaCores(alvo, m) {
    alvo.style.setProperty("--c", m.cor);
    alvo.style.setProperty("--ct", m.corTexto || m.cor);
    alvo.style.setProperty("--cf", m.corFundo || m.cor);
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function plural(n, s, p) { return n + " " + (n === 1 ? s : p); }
  function semAcento(s) {
    return String(s).normalize ? s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase()
                               : String(s).toLowerCase();
  }

  // ------------------------------------------------------------ armazenamento
  // O site roda em file:// e em https://; nos dois o localStorage pode falhar
  // (janela anônima, dados do site bloqueados). Nada aqui pode derrubar a página.
  function lerLS(chave, padrao) {
    try {
      var v = localStorage.getItem(chave);
      return v == null ? padrao : JSON.parse(v);
    } catch (e) { return padrao; }
  }
  function gravarLS(chave, valor) {
    try { localStorage.setItem(chave, JSON.stringify(valor)); return true; }
    catch (e) { return false; }
  }
  function apagarLS(chave) {
    try { localStorage.removeItem(chave); } catch (e) { /* ignora */ }
  }

  // ------------------------------------------------------------ progresso
  var PROG = {};
  PROG = lerLS("estudo-ads", {}) || {};
  function salvar() { gravarLS("estudo-ads", PROG); }
  function prog(mid) {
    if (!PROG[mid]) PROG[mid] = { certas: 0, total: 0, erradas: [], temas: {} };
    if (!PROG[mid].temas) PROG[mid].temas = {};
    if (!PROG[mid].erradas) PROG[mid].erradas = [];
    return PROG[mid];
  }
  function registrar(mid, questao, acertou) {
    var p = prog(mid);
    p.total++; if (acertou) p.certas++;
    p.visto = Date.now();
    var t = p.temas[questao.tema] || (p.temas[questao.tema] = { c: 0, t: 0 });
    t.t++; if (acertou) t.c++;
    var chave = questao.q.slice(0, 90);
    var i = p.erradas.indexOf(chave);
    if (acertou) { if (i >= 0) p.erradas.splice(i, 1); }
    else if (i < 0) { p.erradas.push(chave); }
    salvar();
  }
  function pct(mid) {
    var p = prog(mid);
    return p.total ? Math.round((p.certas / p.total) * 100) : 0;
  }

  // ============================================================ ROTEADOR
  // Toda troca de tela passa por aqui, então o voltar do navegador funciona.
  var rota = { vista: "home", mid: null, aba: null };
  var scrollHome = 0;
  var navegando = false;

  function lerHash() {
    var h = (location.hash || "#/").replace(/^#\/?/, "");
    var p = h.split("/").filter(Boolean).map(function (x) {
      try { return decodeURIComponent(x); } catch (e) { return x; }
    });
    if (p[0] === "m" && p[1] && byId[p[1]]) {
      return { vista: "materia", mid: p[1], aba: p[2] || null };
    }
    // CORREÇÃO NC-19: antes um endereço com matéria inexistente carregava a home
    // em silêncio e ainda deixava o hash inválido na barra do navegador.
    return { vista: "home", mid: null, aba: null, perdido: p[0] === "m" ? (p[1] || "") : null };
  }

  function irPara(hash, substituir) {
    navegando = true;
    if (substituir) location.replace(location.pathname + location.search + hash);
    else location.hash = hash;
    navegando = false;
    aplicarRota();
  }

  function rotaHome() { irPara("#/"); }
  function rotaMateria(mid, aba) {
    irPara("#/m/" + encodeURIComponent(mid) + (aba ? "/" + aba : ""));
  }

  function aplicarRota() {
    var nova = lerHash();
    var eraHome = rota.vista === "home";
    if (eraHome && nova.vista !== "home") scrollHome = window.pageYOffset;

    // CORREÇÃO NC-10/11/12 — antes, sair da matéria por qualquer caminho jogava
    // o quiz fora em silêncio, e trocar de aba deixava o cronômetro correndo.
    // Agora: trocar de aba dentro da matéria apenas PAUSA; sair da matéria
    // pergunta — inclusive pelo voltar do navegador, que antes não perguntava.
    if (quiz && !quiz.fim) {
      var segueNaMateria = nova.vista === "materia" && nova.mid === quiz.m.id;
      if (segueNaMateria) {
        if (nova.aba === (quiz.simulado ? "simulado" : "quiz")) retomarQuiz();
        else pausarQuiz();
      } else if (temResposta() && !confirm(textoDeSaida())) {
        // cancelou: devolve o endereço para onde o quiz está, sem criar histórico
        rota = { vista: "materia", mid: quiz.m.id, aba: quiz.simulado ? "simulado" : "quiz" };
        irPara("#/m/" + encodeURIComponent(rota.mid) + "/" + rota.aba, true);
        return;
      } else {
        pararQuiz();
      }
    }

    rota = nova;

    if (rota.vista === "materia") {
      renderMateria(byId[rota.mid], rota.aba);
      mostrar("materia");
      window.scrollTo(0, 0);
    } else {
      renderHome();
      mostrar("home");
      if (rota.perdido != null) {
        avisoRotaPerdida(rota.perdido);
        irPara("#/", true);
        rota.perdido = null;
        window.scrollTo(0, 0);
      } else {
        window.scrollTo(0, scrollHome);
      }
    }
    atualizaTopo();
  }

  // ============================================================ HOME

      tot.r += m.resumos.length; tot.f += m.flashcards.length;

    var s = $("#stats"); s.innerHTML = "";
    [[M.length, "matérias"], [tot.mat, "com banco"], [tot.q, "questões"],
     [tot.f, "flashcards"], [tot.r, "resumos"], [tot.arq, "arquivos"]]

  function montaContinuar() {
    var host = $("#continuar"); host.innerHTML = "";
    var recentes = M.filter(function (m) { return (PROG[m.id] || {}).visto; })
      .sort(function (a, b) { return PROG[b.id].visto - PROG[a.id].visto; })

  function pintaGrade() {
    var host = $("#periodos"); host.innerHTML = "";

  // ---------------------------------------------------------- flashcards
  var fcTema = null;

    var temas = temasDe(m.flashcards);

    h.appendChild(barraChips(temas, m.flashcards, fcTema, function (t) { fcTema = t; renderCards(m); }));

    bEmb.onclick = function () { pinta(shuffle(lista)); };

      virados = !virados;
      Array.prototype.forEach.call(g.children, function (c) { c.classList.toggle("flip", virados); });
      bVirar.textContent = virados ? "Desvirar todos" : "Virar todos";

  // ---------------------------------------------------------- helpers UI
  function vazio(host, titulo, texto) {
    var d = el("div", "empty");
    d.appendChild(el("b", null, titulo));
    d.appendChild(el("p", null, texto));
    host.appendChild(d);
  }
  function temasDe(lista) {
    var s = [];
    lista.forEach(function (x) { if (s.indexOf(x.tema) < 0) s.push(x.tema); });
    return s;
  }
  function barraChips(temas, lista, sel, onPick) {
    var c = el("div", "chips");
    function chip(label, valor, n) {
      var b = el("button", "chip" + (valor === sel ? " on" : ""));
      b.appendChild(document.createTextNode(label));
      if (n != null) b.appendChild(el("b", null, String(n)));
      b.onclick = function () { onPick(valor); };
      c.appendChild(b);
    }
    chip("Todos", null, lista.length);
    temas.forEach(function (t) {
      chip(t, t, lista.filter(function (x) { return x.tema === t; }).length);
    });
    return c;
  }

  // ---------------------------------------------------------- QUIZ
  var quiz = null;

  function pararQuiz() {
    if (quiz && quiz.timer) clearInterval(quiz.timer);
    if (quiz && quiz.simulado) apagarLS(CHAVE_SIM + quiz.m.id);
    quiz = null;
  }

  // CORREÇÃO NC-11: o relógio parava de ser desenhado mas continuava descontando
  // quando o aluno trocava de aba. Pausar e retomar resolve os dois lados.
  function pausarQuiz() {
    if (quiz && quiz.timer) { clearInterval(quiz.timer); quiz.timer = null; }
  }
  function retomarQuiz() {
    if (quiz && quiz.simulado && !quiz.timer && !quiz.fim) quiz.timer = setInterval(tick, 1000);
  }
  function temResposta() {
    return !!quiz && quiz.respostas.some(function (r) { return r != null; });
  }
  function textoDeSaida() {
    return quiz.simulado
      ? "Sair do simulado? O tempo e as respostas ficam guardados — você pode retomar de onde parou."
      : "Sair do quiz? O que já foi respondido fica salvo no seu progresso.";
  }

  // CORREÇÃO NC-10: simulado em andamento agora sobrevive a fechar a aba do
  // navegador. Guardado por matéria, com validade de um dia.
  var CHAVE_SIM = "estudo-ads-sim:";
  var VALIDADE_SIM = 24 * 60 * 60 * 1000;

  function guardarSimulado() {
    if (!quiz || !quiz.simulado || quiz.fim) return;
    gravarLS(CHAVE_SIM + quiz.m.id, {
      idx: quiz.idx, i: quiz.i, respostas: quiz.respostas,
      segundos: quiz.segundos, ts: Date.now()
    });
  }

  function simuladoGuardado(m) {
    var d = lerLS(CHAVE_SIM + m.id, null);
    if (!d || !d.idx || !d.idx.length) return null;
    if (Date.now() - (d.ts || 0) > VALIDADE_SIM) { apagarLS(CHAVE_SIM + m.id); return null; }
    if (d.idx.some(function (i) { return !m.questoes[i]; })) {
      apagarLS(CHAVE_SIM + m.id); return null;   // o banco mudou desde então
    }
    return d;
  }

  function telaQuiz(m) {
    if (quiz && !quiz.simulado && quiz.m.id === m.id) { pintaQuestao(); return; }
    if (quiz && quiz.m.id !== m.id) pararQuiz();
    var h = $("#pane-quiz"); h.innerHTML = "";
    var temas = temasDe(m.questoes);
    var p = prog(m.id);
    var cfgTema = null, cfgQtd = 5;

    var box = el("div", "box");
    box.appendChild(el("h2", null, "Montar um quiz"));
    box.appendChild(el("p", "sub", "Regra do tutor: 4 de 5 (80%) para liberar o próximo tema. O que você errar volta na revisão."));

    box.appendChild(el("h3", null, "Tema"));
    var chipsT = el("div", "chips");
    function pintaTemas() {
      chipsT.innerHTML = "";
      var todos = el("button", "chip" + (cfgTema === null ? " on" : ""));
      todos.appendChild(document.createTextNode("Todos"));
      todos.appendChild(el("b", null, String(m.questoes.length)));
      todos.onclick = function () { cfgTema = null; pintaTemas(); pintaQtd(); };
      chipsT.appendChild(todos);
      temas.forEach(function (t) {
        var n = m.questoes.filter(function (q) { return q.tema === t; }).length;
        var b = el("button", "chip" + (cfgTema === t ? " on" : ""));
        b.appendChild(document.createTextNode(t));
        b.appendChild(el("b", null, String(n)));
        // CORREÇÃO NC-09: a régua do tutor é 4 em 5; abaixo disso não dá para
        // aplicar o critério, e o aluno precisa saber disso antes de escolher.
        if (n < 5) {
          b.title = "Só " + plural(n, "questão", "questões") + " neste tema — " +
            "não dá para fechar o quiz de 5 do critério de 80%";
          b.appendChild(el("em", "chip-pc meio", "curto"));
        }
        var st = p.temas[t];
        if (st && st.t) {
          var pc = Math.round((st.c / st.t) * 100);
          b.appendChild(el("em", "chip-pc " + (pc >= 80 ? "ok" : pc >= 50 ? "meio" : "ruim"), pc + "%"));
        }
        b.onclick = function () { cfgTema = t; pintaTemas(); pintaQtd(); };
        chipsT.appendChild(b);
      });
    }
    box.appendChild(chipsT);

    box.appendChild(el("h3", null, "Quantidade"));
    var chipsQ = el("div", "chips");
    box.appendChild(chipsQ);

    function disponiveis() {
      return cfgTema ? m.questoes.filter(function (q) { return q.tema === cfgTema; }) : m.questoes;
    }
    function pintaQtd() {
      var n = disponiveis().length;
      if (cfgQtd > n) cfgQtd = n;
      chipsQ.innerHTML = "";
      [5, 10, 20, n].filter(function (v, i, a) { return v <= n && a.indexOf(v) === i; })
        .forEach(function (v) {
          var b = el("button", "chip" + (v === cfgQtd ? " on" : ""), v === n ? "Todas (" + n + ")" : String(v));
          b.onclick = function () { cfgQtd = v; pintaQtd(); };
          chipsQ.appendChild(b);
        });
    }
    pintaTemas(); pintaQtd();

    var acoes = el("div", "row acoes-fim");
    var bStart = el("button", "btn pri", "Começar quiz");
    bStart.onclick = function () { iniciaQuiz(m, shuffle(disponiveis()).slice(0, cfgQtd), false); };
    acoes.appendChild(bStart);

    var erradas = m.questoes.filter(function (q) { return p.erradas.indexOf(q.q.slice(0, 90)) >= 0; });
    if (erradas.length) {
      var bRev = el("button", "btn", "Revisar meus erros (" + erradas.length + ")");
      bRev.onclick = function () { iniciaQuiz(m, shuffle(erradas), false); };
      acoes.appendChild(bRev);
    }
    box.appendChild(acoes);
    h.appendChild(box);

    if (p.total) {
      var d = el("div", "box");
      d.appendChild(el("h2", null, "Desempenho por tema"));
      var algum = false;
      temas.forEach(function (t) {
        var st = p.temas[t];
        if (!st || !st.t) return;
        algum = true;
        var pc = Math.round((st.c / st.t) * 100);
        var linha = el("div", "desemp");
        var top = el("div", "desemp-t");
        top.appendChild(el("span", null, t));
        top.appendChild(el("span", "desemp-n", pc + "% (" + st.c + "/" + st.t + ")"));
        var bar = el("div", "bar");
        var i2 = el("i");
        i2.style.width = pc + "%";
        i2.style.background = pc >= 80 ? "var(--ok)" : pc >= 50 ? "var(--warn)" : "var(--err)";
        bar.appendChild(i2);
        linha.appendChild(top); linha.appendChild(bar);
        d.appendChild(linha);
      });
      if (algum) {
        var bz = el("button", "btn sm", "Zerar progresso desta matéria");
        bz.style.marginTop = "16px";
        bz.onclick = function () {
          if (confirm("Zerar todo o progresso de " + m.nome + "?")) {
            delete PROG[m.id]; salvar(); renderMateria(m, "quiz"); atualizaTopo();
          }
        };
        d.appendChild(bz);
        h.appendChild(d);
      }
    }
  }

  function iniciaQuiz(m, questoes, simulado, retomando) {
    pararQuiz();
    quiz = {
      m: m, qs: questoes, i: 0, acertos: 0, fim: false,
      respostas: new Array(questoes.length).fill(null),
      // CORREÇÃO NC-05: guarda quais já foram corrigidas, para o "← Anterior"
      // reabrir a questão em leitura em vez de deixar responder de novo
      corrigidas: new Array(questoes.length).fill(false),
      idx: questoes.map(function (q) { return m.questoes.indexOf(q); }),
      simulado: simulado
    };
    if (simulado) {
      quiz.segundos = questoes.length * 90;
      if (retomando) {
        quiz.i = Math.min(retomando.i || 0, questoes.length - 1);
        quiz.respostas = retomando.respostas.slice(0, questoes.length);
        quiz.segundos = retomando.segundos;
      }
      quiz.timer = setInterval(tick, 1000);
      guardarSimulado();
    }
    pintaQuestao();
  }

  function tick() {
    if (!quiz || !quiz.simulado || quiz.fim) return;
    quiz.segundos--;
    var t = $("#sim-timer");
    if (t) {
      var s = Math.max(quiz.segundos, 0);
      var mm = Math.floor(s / 60), ss = s % 60;
      t.textContent = (mm < 10 ? "0" : "") + mm + ":" + (ss < 10 ? "0" : "") + ss;
      t.classList.toggle("urgente", quiz.segundos <= 60);
    }
    if (quiz.segundos % 5 === 0) guardarSimulado();
    if (quiz.segundos <= 0) { clearInterval(quiz.timer); finalizar(); }
  }

  function pintaQuestao() {
    var host = $("#pane-" + (quiz.simulado ? "simulado" : "quiz"));
    host.innerHTML = "";
    var q = quiz.qs[quiz.i];

    var top = el("div", "q-top");
    top.appendChild(el("span", "q-tema", q.tema));
    var dir = el("div", "row");
    dir.appendChild(el("span", "q-meta", (quiz.i + 1) + " / " + quiz.qs.length));
    if (quiz.simulado) {
      var t = el("span", "timer"); t.id = "sim-timer"; t.textContent = "--:--";
      dir.appendChild(t);
    }
    top.appendChild(dir);
    host.appendChild(top);

    var pr = el("div", "prog");
    var pi = el("i"); pi.style.width = (quiz.i / quiz.qs.length * 100) + "%";
    pr.appendChild(pi); host.appendChild(pr);

    host.appendChild(el("div", "q-txt", q.q));

    var opts = el("div", "opts");
    // CORREÇÃO NC-18: o leitor de tela precisa saber que são alternativas de uma
    // mesma questão — sem isso ele não anuncia "opção 2 de 4".
    opts.setAttribute("role", "radiogroup");
    opts.setAttribute("aria-label", "Alternativas da questão " + (quiz.i + 1));
    var letras = ["A", "B", "C", "D", "E", "F"];
    var jaCorrigida = !quiz.simulado && quiz.corrigidas[quiz.i];
    q.op.forEach(function (texto, idx) {
      var b = el("button", "opt");
      b.setAttribute("role", "radio");
      b.setAttribute("aria-checked", quiz.respostas[quiz.i] === idx ? "true" : "false");
      b.appendChild(el("span", "opt-l", letras[idx]));
      b.appendChild(el("span", null, texto));
      if (quiz.simulado) {
        if (quiz.respostas[quiz.i] === idx) b.classList.add("sel");
        b.onclick = function () { marcar(idx, opts); };
      } else if (jaCorrigida) {
        b.classList.add("lock");
        if (idx === q.r) b.classList.add("ok");
        else if (idx === quiz.respostas[quiz.i]) b.classList.add("no");
        b.disabled = true;
      } else {
        b.onclick = function () { responder(idx, opts, q); };
      }
      opts.appendChild(b);
    });
    host.appendChild(opts);
    quiz.opts = opts;

    if (jaCorrigida) {
      opts.parentNode.insertBefore(
        explicacao(q, quiz.respostas[quiz.i] === q.r, true), opts.nextSibling);
    }

    var nav = el("div", "q-nav");
    var bVoltar = el("button", "btn sm", "← Anterior");
    bVoltar.disabled = quiz.i === 0;
    bVoltar.onclick = anterior;
    nav.appendChild(bVoltar);

    var dirNav = el("div", "row");
    var bSair = el("button", "btn sm", "Sair");
    bSair.onclick = sairDoQuiz;
    dirNav.appendChild(bSair);

    if (quiz.simulado) {
      var bFim = el("button", "btn", "Finalizar");
      bFim.onclick = function () {
        if (confirm("Finalizar e corrigir agora?")) { clearInterval(quiz.timer); finalizar(); }
      };
      dirNav.appendChild(bFim);
      var bProx = el("button", "btn pri", quiz.i === quiz.qs.length - 1 ? "Última questão" : "Próxima →");
      bProx.id = "btn-prox";
      bProx.disabled = quiz.i === quiz.qs.length - 1;
      bProx.onclick = proxima;
      dirNav.appendChild(bProx);
    } else {
      var bN = el("button", "btn pri",
        jaCorrigida && quiz.i === quiz.qs.length - 1 ? "Ver resultado" : "Próxima →");
      bN.id = "btn-prox"; bN.disabled = !jaCorrigida;
      bN.onclick = proxima;
      dirNav.appendChild(bN);
    }
    nav.appendChild(dirNav);
    host.appendChild(nav);

    var dica = el("div", "kbd");
    dica.innerHTML = "<kbd>A</kbd><kbd>B</kbd><kbd>C</kbd><kbd>D</kbd> responder · " +
      "<kbd>Enter</kbd> avançar · <kbd>Esc</kbd> sair";
    host.appendChild(dica);

    if (quiz.simulado) { host.appendChild(el("div", "qnav")); pintaNav(); tick(); }
  }

  function pintaNav() {
    var g = $(".qnav");
    if (!g) return;
    g.innerHTML = "";
    quiz.qs.forEach(function (_, i) {
      var b = el("button", (i === quiz.i ? "atual" : quiz.respostas[i] != null ? "feito" : ""), String(i + 1));
      b.setAttribute("aria-label", "Ir para a questão " + (i + 1));
      b.onclick = function () { quiz.i = i; pintaQuestao(); };
      g.appendChild(b);
    });
  }

  function marcar(idx, opts) {
    quiz.respostas[quiz.i] = idx;
    Array.prototype.forEach.call(opts.children, function (o, k) {
      o.classList.toggle("sel", k === idx);
      o.setAttribute("aria-checked", k === idx ? "true" : "false");
    });
    pintaNav();
    guardarSimulado();
  }

  // CORREÇÃO NC-14: sem aria-live o leitor de tela não anunciava nada depois de
  // responder — o aluno cego ficava sem saber se acertou.
  function explicacao(q, ok, silencioso) {
    var e = el("div", "exp");
    if (!silencioso) { e.setAttribute("role", "status"); e.setAttribute("aria-live", "polite"); }
    e.innerHTML = "<b>" + (ok ? "Correto." : "Resposta certa: " +
      ["A", "B", "C", "D", "E", "F"][q.r] + ". " + esc(q.op[q.r])) + "</b> " + esc(q.exp || "");
    return e;
  }

  function responder(idx, opts, q) {
    // CORREÇÃO NC-05: antes o "← Anterior" reabria a questão e responder de novo
    // contava outra vez no progresso — dava para inflar a estatística voltando.
    if (quiz.corrigidas[quiz.i]) return;
    quiz.corrigidas[quiz.i] = true;
    quiz.respostas[quiz.i] = idx;
    var ok = idx === q.r;
    if (ok) quiz.acertos++;
    registrar(quiz.m.id, q, ok);

    Array.prototype.forEach.call(opts.children, function (o, k) {
      o.classList.add("lock");
      o.disabled = true;
      o.setAttribute("aria-checked", k === idx ? "true" : "false");
      if (k === q.r) o.classList.add("ok");
      else if (k === idx) o.classList.add("no");
    });

    opts.parentNode.insertBefore(explicacao(q, ok), opts.nextSibling);

    var bN = $("#btn-prox");
    bN.disabled = false;
    bN.textContent = quiz.i === quiz.qs.length - 1 ? "Ver resultado" : "Próxima →";
    bN.focus();
  }

  function proxima() {
    if (!quiz) return;
    if (quiz.simulado) {
      if (quiz.i < quiz.qs.length - 1) { quiz.i++; pintaQuestao(); guardarSimulado(); }
      return;
    }
    if (!quiz.corrigidas[quiz.i]) return;
    if (quiz.i === quiz.qs.length - 1) finalizar();
    else { quiz.i++; pintaQuestao(); }
  }
  function anterior() {
    if (!quiz || quiz.i === 0) return;
    quiz.i--; pintaQuestao();
  }
  function sairDoQuiz() {
    if (!quiz) return;
    if (temResposta() && !quiz.fim && !confirm(textoDeSaida())) return;
    var m = quiz.m, era = quiz.simulado;
    pararQuiz();
    renderMateria(m, era ? "simulado" : "quiz");
    atualizaTopo();
  }

  function finalizar() {
    quiz.fim = true;
    var host = $("#pane-" + (quiz.simulado ? "simulado" : "quiz"));
    host.innerHTML = "";
    var total = quiz.qs.length;
    var acertos = quiz.simulado
      ? quiz.qs.reduce(function (a, q, i) { return a + (quiz.respostas[i] === q.r ? 1 : 0); }, 0)
      : quiz.acertos;
    if (quiz.simulado) {
      quiz.qs.forEach(function (q, i) { registrar(quiz.m.id, q, quiz.respostas[i] === q.r); });
    }
    var p = Math.round((acertos / total) * 100);
    var m = quiz.m, era = quiz.simulado;

    var box = el("div", "box");
    var sc = el("div", "res-score");
    sc.appendChild(el("div", "res-pct " + (p >= 80 ? "pass" : "fail"), p + "%"));
    sc.appendChild(el("div", "res-msg", acertos + " de " + total + " — " + mensagem(p)));
    box.appendChild(sc);

    var acoes = el("div", "row acoes-centro");
    var bRef = el("button", "btn pri", era ? "Novo simulado" : (p >= 80 ? "Novo quiz" : "Tentar de novo"));
    bRef.onclick = function () { pararQuiz(); renderMateria(m, era ? "simulado" : "quiz"); atualizaTopo(); };
    var bResumo = el("button", "btn", "Ver o resumo do conteúdo");
    bResumo.onclick = function () { pararQuiz(); rotaMateria(m.id, m.resumos.length ? "resumo" : "cards"); };
    var bHome = el("button", "btn", "Voltar às matérias");
    bHome.onclick = function () { pararQuiz(); rotaHome(); };
    acoes.appendChild(bRef);
    if (m.resumos.length || m.flashcards.length) acoes.appendChild(bResumo);
    acoes.appendChild(bHome);
    box.appendChild(acoes);
    host.appendChild(box);

    var rev = el("div", "box");
    rev.appendChild(el("h2", null, "Revisão das " + total + " questões"));
    quiz.qs.forEach(function (q, i) {
      var r = quiz.respostas[i];
      var ok = r === q.r;
      var d = el("div", "rev");
      var linha = el("div", "rev-q");
      linha.appendChild(el("i", "rev-i " + (r == null ? "vazio" : ok ? "ok" : "no"),
        r == null ? "○" : ok ? "✓" : "✕"));
      linha.appendChild(el("span", null, q.q));
      d.appendChild(linha);
      var det = el("div", "rev-d");
      var html = "";
      if (!ok) {
        html += r == null ? "<s>Ficou em branco.</s><br>" : "<s>Você marcou: " + esc(q.op[r]) + "</s><br>";
        html += "<em>Certa: " + esc(q.op[q.r]) + "</em>";
      } else {
        html += "<em>" + esc(q.op[q.r]) + "</em>";
      }
      if (q.exp) html += "<br>" + esc(q.exp);
      det.innerHTML = html;
      d.appendChild(det);
      rev.appendChild(d);
    });
    host.appendChild(rev);
    window.scrollTo(0, 0);
  }

  function mensagem(p) {
    if (p === 100) return "Gabaritou. Pode avançar de tema com tranquilidade.";
    if (p >= 80) return "Aprovado no critério de 80%. Tema liberado.";
    if (p >= 60) return "Perto. Releia o resumo do tema e refaça — a meta é 4 de 5.";
    if (p >= 40) return "Metade do caminho. Vale voltar ao resumo antes de tentar de novo.";
    return "Estude o resumo e os flashcards deste tema antes de repetir o quiz.";
  }

  // ---------------------------------------------------------- SIMULADO
  function telaSimulado(m) {
    if (quiz && quiz.simulado && quiz.m.id === m.id) { pintaQuestao(); return; }
    if (quiz && quiz.m.id !== m.id) pararQuiz();
    var h = $("#pane-simulado"); h.innerHTML = "";
    var box = el("div", "box");
    box.appendChild(el("h2", null, "Simulado de prova"));
    box.appendChild(el("p", "sub",
      "Questões embaralhadas de todos os temas, sem correção na hora e com tempo contado (1min30 por questão). A correção sai no final, com a revisão completa."));

    var n = Math.min(20, m.questoes.length);
    var chips = el("div", "chips");
    [10, 20, 30, m.questoes.length]
      .filter(function (v, i, a) { return v <= m.questoes.length && a.indexOf(v) === i; })
      .forEach(function (v) {
        var b = el("button", "chip" + (v === n ? " on" : ""), v + " questões");
        b.onclick = function () {
          n = v;
          Array.prototype.forEach.call(chips.children, function (c) { c.classList.remove("on"); });
          b.classList.add("on");
        };
        chips.appendChild(b);
      });
    box.appendChild(chips);

    var acoes = el("div", "row acoes-fim");
    var b = el("button", "btn pri", "Iniciar simulado");
    b.onclick = function () { iniciaQuiz(m, shuffle(m.questoes).slice(0, n), true); };
    acoes.appendChild(b);
    box.appendChild(acoes);
    h.appendChild(box);

    // CORREÇÃO NC-10: simulado interrompido não se perde mais
    var guardado = simuladoGuardado(m);
    if (guardado) {
      var feitas = guardado.respostas.filter(function (r) { return r != null; }).length;
      var mm = Math.floor(Math.max(guardado.segundos, 0) / 60);
      var cx = el("div", "box");
      cx.appendChild(el("h2", null, "Você tem um simulado pela metade"));
      cx.appendChild(el("p", "sub", guardado.idx.length + " questões · " + feitas +
        " respondidas · " + mm + " min restantes · começado " + quando(guardado.ts)));
      var linha = el("div", "row acoes-fim");
      var bR = el("button", "btn pri", "Retomar de onde parei");
      bR.onclick = function () {
        iniciaQuiz(m, guardado.idx.map(function (i) { return m.questoes[i]; }), true, guardado);
      };
      var bD = el("button", "btn sm", "Descartar");
      bD.onclick = function () {
        if (confirm("Descartar o simulado em andamento?")) { apagarLS(CHAVE_SIM + m.id); telaSimulado(m); }
      };
      linha.appendChild(bR); linha.appendChild(bD);
      cx.appendChild(linha);
      h.insertBefore(cx, h.firstChild);
    }
  }

  function quando(ts) {
    var min = Math.round((Date.now() - ts) / 60000);
    if (min < 1) return "agora há pouco";
    if (min < 60) return "há " + min + " min";
    var hr = Math.round(min / 60);
    return "há " + plural(hr, "hora", "horas");
  }

  // ---------------------------------------------------------- discursivas
  // CORREÇÃO NC-06: o texto da discursiva sumia ao trocar de aba. Agora fica
  // guardado por matéria e questão, e volta sozinho quando você reabre.
  var CHAVE_DISC = "estudo-ads-disc:";
  var rascunhos = null;

  function carregaRascunhos() {
    if (!rascunhos) rascunhos = lerLS(CHAVE_DISC, {}) || {};
    return rascunhos;
  }
  function salvaRascunho(mid, i, texto) {
    var r = carregaRascunhos();
    var chave = mid + "#" + i;
    if (texto && texto.trim()) r[chave] = { t: texto, ts: Date.now() };
    else delete r[chave];
    return gravarLS(CHAVE_DISC, r);
  }
  function leRascunho(mid, i) {
    var d = carregaRascunhos()[mid + "#" + i];
    return d ? d.t : "";
  }

  function renderDisc(m) {
    var h = $("#pane-disc"); h.innerHTML = "";
    h.appendChild(el("p", "sub", "Escreva sua resposta antes de abrir o gabarito — é assim que a memória fixa. O que você digitar fica salvo neste navegador."));
    m.discursivas.forEach(function (d, i) {
      var c = el("div", "disc");
      c.appendChild(el("div", "fc-t", d.tema));
      c.appendChild(el("div", "disc-q", d.q));
      var ta = el("textarea");
      ta.placeholder = "Sua resposta...";
      ta.value = leRascunho(m.id, i);
      ta.setAttribute("aria-label", "Sua resposta para: " + d.q);
      c.appendChild(ta);

      var estado = el("span", "dica");
      if (ta.value) estado.textContent = "rascunho salvo";
      var espera = null;
      ta.addEventListener("input", function () {
        clearTimeout(espera);
        estado.textContent = "digitando…";
        espera = setTimeout(function () {
          var ok = salvaRascunho(m.id, i, ta.value);
          estado.textContent = !ta.value.trim() ? ""
            : ok ? "rascunho salvo" : "não consegui salvar neste navegador";
        }, 600);
      });

      var linha = el("div", "row");
      linha.style.marginTop = "10px";
      var b = el("button", "btn sm", "Mostrar gabarito");
      b.onclick = function () {
        c.classList.toggle("abre");
        b.textContent = c.classList.contains("abre") ? "Ocultar gabarito" : "Mostrar gabarito";
      };
      linha.appendChild(b);
      var bL = el("button", "btn sm", "Limpar");
      bL.onclick = function () {
        if (!ta.value || confirm("Apagar o que você escreveu nesta questão?")) {
          ta.value = ""; salvaRascunho(m.id, i, ""); estado.textContent = ""; ta.focus();
        }
      };
      linha.appendChild(bL);
      linha.appendChild(estado);
      c.appendChild(linha);
      c.appendChild(el("div", "disc-r", d.r));
      h.appendChild(c);
    });
  }

  // ---------------------------------------------------------- colas
  function renderColas(m) {
    var h = $("#pane-colas"); h.innerHTML = "";
    h.appendChild(el("p", "sub", "Para a última meia hora antes da prova."));
    m.colas.forEach(function (c) {
      var d = el("div", "cola");
      d.appendChild(el("h4", null, c.titulo));
      if (c.mnemonico) d.appendChild(el("div", "cola-m", c.mnemonico));
      var ul = el("ul");
      (c.pontos || []).forEach(function (p) {
        var li = el("li");
        li.innerHTML = esc(p).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
        ul.appendChild(li);
      });
      d.appendChild(ul);
      h.appendChild(d);
    });
  }

  // ---------------------------------------------------------- material
  function renderMaterial(m) {
    var h = $("#pane-material"); h.innerHTML = "";
    var links = m.links || [];

    if (!m.arquivos.length && !links.length) {
      return vazio(h, "Nenhum arquivo encontrado",
        "A pasta desta matéria está vazia ou ainda não foi criada em " + DADOS.raiz + ".");
    }

    if (links.length) {
      h.appendChild(el("h3", null, "Na web"));
      links.forEach(function (l) {
        var a = el("a", "arq");
        a.href = l.url; a.target = "_blank"; a.rel = "noopener";
        a.appendChild(el("span", "arq-x", /github\.io/.test(l.url) ? "web" : "repo"));
        var mid = el("span", "arq-n solto");
        mid.appendChild(el("b", null, l.nome));
        if (l.desc) {
          mid.appendChild(document.createElement("br"));
          mid.appendChild(el("small", null, l.desc));
        }
        a.appendChild(mid);
        a.appendChild(el("span", "arq-s", "↗"));
        h.appendChild(a);
      });
    }

    if (!m.arquivos.length) return;
    if (links.length) h.appendChild(el("h3", null, "Na pasta"));
    if (!DADOS.local) {
      h.appendChild(el("div", "aviso",
        "Esta é a versão publicada — estes arquivos ficam no seu computador, então abaixo é só a listagem. Abra o index.html da pasta Estudo-ADS para clicar e abrir cada PDF."));
    }
    h.appendChild(el("p", "sub", plural(m.arquivos.length, "arquivo", "arquivos") + " em " + m.pasta));
    m.arquivos.forEach(function (a) {
      var node = DADOS.local ? el("a", "arq") : el("div", "arq");
      if (DADOS.local) { node.href = a.href; node.target = "_blank"; }
      node.appendChild(el("span", "arq-x", a.ext));
      node.appendChild(el("span", "arq-n", a.nome));
      node.appendChild(el("span", "arq-s", a.tam));
      h.appendChild(node);
    });
  }

  // ============================================================ teclado
  document.addEventListener("keydown", function (e) {
    var alvo = e.target || {};
    var digitando = /^(INPUT|TEXTAREA|SELECT)$/.test(alvo.tagName || "");

    if (rota.vista === "home") {
      if (!digitando && e.key === "/") { e.preventDefault(); $("#busca").focus(); }
      if (digitando && e.key === "Escape") { alvo.blur(); }
      return;
    }
    if (digitando) return;

    if (!quiz) {
      if (e.key === "Escape" || e.key === "Backspace") { e.preventDefault(); rotaHome(); }
      return;
    }

    if (e.key === "Escape") { e.preventDefault(); sairDoQuiz(); return; }
    if (quiz.fim) return;

    if (e.key === "Enter" || e.key === "ArrowRight") { e.preventDefault(); proxima(); return; }
    if (e.key === "ArrowLeft") { e.preventDefault(); anterior(); return; }

    var i = -1;
    var k = String(e.key).toUpperCase();
    if (/^[A-F]$/.test(k)) i = k.charCodeAt(0) - 65;
    else if (/^[1-6]$/.test(k)) i = Number(k) - 1;
    if (i >= 0 && quiz.opts && quiz.opts.children[i]) {
      e.preventDefault();
      quiz.opts.children[i].click();
    }
  });

  // ============================================================ boot
  $("#brand").onclick = rotaHome;
  $("#btn-voltar").onclick = function () {
    // a matéria sem aba não é uma tela de verdade (redireciona para a primeira),
    // então o voltar leva direto às matérias. Se houver quiz em andamento, quem
    // pergunta é o roteador — mesma confirmação do voltar do navegador.
    rotaHome();
  };
  $("#busca").addEventListener("input", function (e) {
    busca = e.target.value;
    pintaGrade();
  });
  $("#ano").textContent = DADOS.gerado;

  aplicarRota();
})();

</script>
